    strength: medium

  - id: r172
    term1Id: qra
    term2Id: interest-rate
    type: correlation
    description: "QRA 발표가 시장 기대와 다를 경우 국채 공급 전망 변화로 금리 전반에 영향을 미침. 특히 장기 국채 발행 계획이 예상보다 크면 장기금리 상승 압력이 증가"
