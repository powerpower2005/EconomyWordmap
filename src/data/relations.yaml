    strength: medium

  - id: r144
    term1Id: silver
    term2Id: inflation
    type: correlation
    description: "은은 귀금속이면서 산업용 금속으로 인플레이션 헤지와 산업 수요 증가로 가격이 상승할 수 있는 경향"
    strength: medium

  - id: r145
    term1Id: copper
    term2Id: investment
    type: correlation
