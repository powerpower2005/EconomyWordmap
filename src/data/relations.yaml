    description: "연준은 Core PCE를 기준으로 통화정책을 결정하며, Core PCE가 목표치(2%)를 상회하면 기준금리 인상 압력이 증가하고, 하회하면 기준금리 인하 여지가 생김"
    strength: strong

  - id: r157
    term1Id: pce
    term2Id: cpi
    type: correlation
    bidirectional: true
    description: "PCE와 CPI는 모두 물가를 측정하나 연준은 PCE를 더 선호함. 그 이유는 1) PCE는 가중치가 소비 패턴 변화에 따라 자동으로 조정되는 체인 방식(chain-weighted)을 사용하여 더 현실적인 소비 구조를 반영, 2) PCE는 의료비 등 CPI에 포함되지 않는 항목도 포함하여 더 넓은 범위를 커버, 3) PCE는 소비자 직접 구매뿐만 아니라 기업이 소비자를 대신 구매하는 항목(예: 의료보험)도 포함하여 더 포괄적임. 연준은 이러한 이유로 PCE를 인플레이션 목표 설정의 기준으로 사용"
    reverseDescription: "CPI는 고정 바스켓 방식으로 소비자 관점에서 물가 상승을 더 직접적으로 느끼게 하지만, 연준은 정책 결정 시 PCE를 우선시함. CPI가 PCE보다 높게 나오는 경우가 많은데, 이는 CPI가 주거비(소유주 동등 임대료)를 더 높게 반영하고, PCE는 대체 효과(substitution effect)를 더 잘 반영하기 때문"
    strength: strong

  - id: r158
    term1Id: sofr
    term2Id: interest-rate
