relations:
  - id: r1
    term1Id: inflation
    term2Id: interest-rate
    type: correlation
    description: "인플레이션이 상승(또는 상승 압력 확대)하면 중앙은행이 물가 안정을 위해 기준금리/정책금리를 인상하는 경향(정책 반응)"
    strength: strong

  - id: r2
    term1Id: interest-rate
    term2Id: investment
    type: inverse
    description: "금리가 상승하면 자본비용(할인율·차입비용)이 높아져 투자 유인이 약화되는 경향. 금리는 미래 현금흐름의 할인율로 작용하여 투자 프로젝트의 현재가치를 결정하는 핵심 요소"
    strength: strong

  - id: r3
    term1Id: gdp
    term2Id: consumption
    type: correlation
    description: "소비는 GDP의 핵심 구성요소로 경기(소득) 개선 시 소비가 함께 증가하는 경향"
    strength: strong

  - id: r4
    term1Id: unemployment
    term2Id: gdp
    type: inverse
    description: "GDP(특히 실질 GDP) 성장률이 높아지면 실업률이 낮아지는 경향(오쿤의 법칙, 단 완전한 1:1은 아님)"
    strength: medium

  - id: r5
    term1Id: money-supply
    term2Id: inflation
    type: correlation
    description: "통화량 증가가 수요를 자극하면 물가 상승 압력으로 이어질 수 있으나, 경제 여건·속도·공급충격에 따라 관계가 달라짐"
    strength: medium

  - id: r6
    term1Id: exchange-rate
    term2Id: interest-rate
    type: correlation
    description: "금리 차이(국내외 금리 스프레드)와 기대가 자본흐름을 통해 환율에 영향을 주는 경향(금리평가/자금흐름)"
    strength: medium

  - id: r7
    term1Id: consumption
    term2Id: investment
    type: correlation
    description: "소비와 투자는 경기 국면·금융여건·기대에 따라 함께 움직이거나(확장기) 엇갈릴 수도 있는 상호 연관 변수"
    strength: medium

  - id: r8
    term1Id: base-money
    term2Id: money-multiplier
    type: inverse
    description: "본원통화가 빠르게 늘 때(예: QE) 통화승수(=통화량/본원통화)는 오히려 낮아질 수 있으며, 승수는 대출·예금 선호·규제·금리 등에 의해 변동"
    strength: medium

  - id: r9
    term1Id: required-reserve-ratio
    term2Id: money-multiplier
    type: inverse
    description: "단순 모형에서는 지급준비율이 낮을수록 통화승수가 커지지만, 현실에서는 현금보유성향·대출수요·규제 등으로 승수가 크게 달라짐"
    strength: medium

  - id: r10
    term1Id: base-money
    term2Id: money-supply
    type: correlation
    description: "본원통화(현금+지급준비금)가 증가해도 광의통화(M2 등)는 대출·예금 수요와 금융여건에 따라 달라져 기계적으로 1:1 증가하지는 않음"
    strength: medium

  - id: r11
    term1Id: money-multiplier
    term2Id: money-supply
    type: correlation
    description: "통화승수는 통화량과 본원통화의 비율로 정의되며, 승수 변화는 통화량 변화와 함께 관측됨(원인·결과로 단정하기보다는 구조적 관계)"
    strength: medium

  - id: r12
    term1Id: quantitative-easing
    term2Id: base-money
    type: proportional
    description: "양적완화는 자산 매입을 통해 중앙은행 부채(지급준비금 등)를 늘려 본원통화를 확대시키는 경향"
    strength: strong

  - id: r13
    term1Id: quantitative-easing
    term2Id: money-supply
    type: correlation
    description: "QE는 본원통화와 금융여건을 완화해 광의통화 증가로 이어질 수 있으나, 대출수요·은행 규제·위험선호에 따라 효과가 달라짐"
    strength: medium

  - id: r14
    term1Id: quantitative-easing
    term2Id: interest-rate
    type: inverse
    description: "QE는 채권 매입을 통해 장기금리(기간프리미엄)를 낮추는 방향으로 작동하는 경향"
    strength: strong

  - id: r15
    term1Id: quantitative-tightening
    term2Id: base-money
    type: inverse
    description: "QT(보유자산 축소)는 만기상환(런오프) 또는 매각을 통해 지급준비금 등을 줄여 본원통화를 감소시키는 경향"
    strength: strong

  - id: r16
    term1Id: quantitative-tightening
    term2Id: money-supply
    type: correlation
    description: "QT는 유동성·금융여건을 긴축적으로 만들어 광의통화 증가세를 둔화시킬 수 있으나, 관계는 상황 의존적"
    strength: medium

  - id: r17
    term1Id: money-supply
    term2Id: velocity-of-money
    type: correlation
    description: "화폐수량식(MV=PY) 관점에서 통화량과 유통속도는 함께 명목지출(물가·산출)에 영향을 주는 요인"
    strength: medium

  - id: r18
    term1Id: velocity-of-money
    term2Id: inflation
    type: correlation
    description: "유통속도가 상승하면 동일 통화량에서 명목지출이 늘어 물가 상승 압력으로 이어질 수 있으나, 산출(Y) 변화와 동반될 수 있음. 금융위기나 경기 불확실성 증가 시 유통속도가 하락하여 통화정책 전달력이 약화될 수 있음"
    strength: medium

  - id: r19
    term1Id: credit-creation
    term2Id: money-supply
    type: proportional
    description: "은행 대출 확대는 예금(계좌잔고) 창출을 동반해 광의통화 증가로 이어지는 경향"
    strength: strong

  - id: r20
    term1Id: required-reserve-ratio
    term2Id: credit-creation
    type: correlation
    description: "전통적 체계에서는 지급준비율이 대출 여력을 제약할 수 있으나, 현대(특히 지급준비율 0% 또는 풍부한 준비금)에서는 자본·유동성 규제가 더 핵심 제약이 되는 경우가 많음"
    strength: medium

  - id: r21
    term1Id: base-money
    term2Id: credit-creation
    type: correlation
    description: "준비금이 매우 부족하면 신용창조에 제약이 될 수 있으나, 일반적으로는 대출이 먼저 발생하고 준비금은 사후적으로 조달되는 구조(조건부 관계)"
    strength: medium

  - id: r22
    term1Id: iorb
    term2Id: interest-rate
    type: correlation
    bidirectional: true
    description: "IORB는 준비금에 대한 지급이자로 단기금리 하단(바닥)을 형성하는 핵심 정책도구"
    reverseDescription: 중앙은행은 IORB 조정을 통해 단기 시장금리(정책금리 범위)를 유도
    strength: strong

  - id: r23
    term1Id: reserves
    term2Id: lclor
    type: correlation
    bidirectional: true
    description: "지급준비금(Reserves)이 LCLoR 이하로 내려가면 단기자금시장 변동성·유동성 스트레스가 커질 위험이 증가"
    reverseDescription: LCLoR는 금융시스템이 편안하게 작동하기 위한 준비금의 최소 수준 가이드
    strength: strong

  - id: r24
    term1Id: quantitative-tightening
    term2Id: lclor
    type: correlation
    description: "QT로 준비금이 감소해 LCLoR에 근접하면 단기금리 변동·유동성 경색 위험 때문에 속도/방식 조정이 필요할 수 있음"
    strength: medium

  - id: r25
    term1Id: bank
    term2Id: credit-creation
    type: proportional
    description: "은행은 대출을 실행하면서 예금(부채)을 함께 만들어 신용을 창조함"
    strength: strong

  - id: r26
    term1Id: bank
    term2Id: reserves
    type: correlation
    description: 은행은 결제와 유동성 관리를 위해 중앙은행에 지급준비금을 보유
    strength: strong

  - id: r27
    term1Id: reserves
    term2Id: base-money
    type: correlation
    description: "지급준비금은 본원통화(M0)의 핵심 구성 요소(현금 + 지급준비금)"
    strength: strong

  - id: r28
    term1Id: reserves
    term2Id: required-reserve-ratio
    type: correlation
    description: "의무지준 제도가 있을 경우 ‘필요 지급준비금’은 지급준비율과 예금 규모로 결정되며, 실제 지급준비금은 그 이상(초과지준 포함)일 수 있음"
    strength: strong

  - id: r29
    term1Id: excess-reserves
    term2Id: reserves
    type: correlation
    description: "초과지준은 지급준비금 중 의무 보유액(필요지준)을 초과하는 부분"
    strength: strong

  - id: r30
    term1Id: capital-adequacy-ratio
    term2Id: bank
    type: correlation
    description: "자기자본비율은 은행의 손실흡수능력과 건전성을 나타내는 핵심 규제·감독 지표"
    strength: strong

  - id: r31
    term1Id: leverage-ratio
    term2Id: bank
    type: correlation
    description: "레버리지비율(자기자본/총자산)은 비위험가중(backstop) 규제로 과도한 자산 확대를 제한"
    strength: strong

  - id: r32
    term1Id: prudential-regulation
    term2Id: capital-adequacy-ratio
    type: correlation
    description: "건전성 규제는 위험가중자산 대비 자기자본 규제(자기자본비율)로 은행 리스크를 관리"
    strength: strong

  - id: r33
    term1Id: prudential-regulation
    term2Id: leverage-ratio
    type: correlation
    description: 건전성 규제는 레버리지비율을 통해 위험가중치 왜곡 가능성을 보완하고 과도한 레버리지를 제한
    strength: strong

  - id: r34
    term1Id: federal-reserve
    term2Id: central-bank
    type: correlation
    description: 연준은 미국의 중앙은행으로 통화정책과 금융안정 기능을 수행
    strength: strong

  - id: r35
    term1Id: central-bank
    term2Id: base-money
    type: proportional
    description: 중앙은행은 현금 발행 및 지급준비금 공급을 통해 본원통화를 창출/공급
    strength: strong

  - id: r36
    term1Id: central-bank
    term2Id: quantitative-easing
    type: correlation
    description: 중앙은행은 필요 시 QE와 같은 비전통적 통화정책을 시행할 수 있음
    strength: strong

  - id: r37
    term1Id: central-bank
    term2Id: quantitative-tightening
    type: correlation
    description: 중앙은행은 필요 시 QT를 통해 대차대조표를 축소할 수 있음
    strength: strong

  - id: r38
    term1Id: quantitative-easing
    term2Id: government-bond
    type: proportional
    description: QE는 일반적으로 국채 매입을 포함하여 수행됨
    strength: strong

  - id: r39
    term1Id: quantitative-easing
    term2Id: mbs
    type: correlation
    description: "일부 국가(예: 미국)에서는 QE가 MBS 매입을 포함할 수 있음"
    strength: medium

  - id: r41
    term1Id: government-bond
    term2Id: bond-price
    type: correlation
    description: "국채는 채권시장 수요·공급과 금리 수준에 따라 가격이 변동"
    strength: medium

  - id: r42
    term1Id: bond-price
    term2Id: long-term-interest-rate
    type: inverse
    description: "채권가격이 상승하면 수익률(장기금리)이 하락하고, 가격이 하락하면 수익률이 상승"
    strength: strong

  - id: r43
    term1Id: long-term-interest-rate
    term2Id: interest-rate
    type: correlation
    description: 장기금리는 금리 전반의 중요한 부분이며, 단기금리 기대와 기간프리미엄의 영향을 받음
    strength: strong

  - id: r44
    term1Id: market-interest-rate
    term2Id: interest-rate
    type: correlation
    description: 시중금리는 정책금리, 기대, 신용스프레드 등 시장 여건이 반영된 실제 적용 금리
    strength: strong

  - id: r45
    term1Id: low-interest-policy
    term2Id: interest-rate
    type: inverse
    description: "저금리 정책은 기준금리 및 금융여건을 낮게 유지하여 차입·투자·소비를 유도"
    strength: strong

  - id: r46
    term1Id: quantitative-easing
    term2Id: long-term-interest-rate
    type: inverse
    description: QE는 장기국채 등 매입을 통해 장기금리를 낮추는 경향
    strength: strong

  - id: r47
    term1Id: fed-balance-sheet
    term2Id: quantitative-easing
    type: correlation
    description: "QE로 연준이 자산을 매입하면 연준 대차대조표(총자산)가 확대되는 경향"
    strength: strong

  - id: r48
    term1Id: fed-balance-sheet
    term2Id: quantitative-tightening
    type: correlation
    description: "QT(보유자산 축소)로 연준 대차대조표(총자산)가 축소되는 경향"
    strength: strong

  - id: r49
    term1Id: government-bond
    term2Id: maturity-redemption
    type: correlation
    description: "국채는 만기 도래 시 원금(및 이자)을 상환하며, 중앙은행 보유분은 만기상환(런오프)이 QT 수단이 될 수 있음"
    strength: medium

  - id: r50
    term1Id: m2
    term2Id: money-supply
    type: correlation
    description: "M2는 통화량(광의통화)의 대표 지표 중 하나"
    strength: strong

  - id: r51
    term1Id: m2
    term2Id: base-money
    type: correlation
    description: "본원통화 변화가 금융여건·대출·예금 행동을 통해 M2에 영향을 줄 수 있으나, 기계적으로 비례하지는 않음"
    strength: medium

  - id: r53
    term1Id: quantitative-easing
    term2Id: fed-assets
    type: proportional
    description: "QE로 중앙은행이 자산(국채·MBS 등)을 매입하면 연준 보유자산이 증가"
    strength: strong

  - id: r54
    term1Id: quantitative-tightening
    term2Id: fed-assets
    type: inverse
    description: QT로 자산이 만기상환되거나 매각되면 연준 보유자산이 감소
    strength: strong

  - id: r55
    term1Id: fed-balance-sheet
    term2Id: fed-assets
    type: proportional
    description: 연준 보유자산은 연준 대차대조표의 자산 측 핵심 구성
    strength: strong

  - id: r56
    term1Id: tariff
    term2Id: trade-deficit
    type: correlation
    description: "관세는 수입 가격을 올려 수입을 줄일 수 있으나, 환율·보복관세·내수·공급망 대체에 따라 무역수지 효과는 불확실"
    strength: weak

  - id: r57
    term1Id: tariff
    term2Id: trade-surplus
    type: correlation
    description: "관세로 수입이 줄면 무역흑자가 확대될 수도 있으나, 수출 감소·비용 상승이 동반될 수 있어 결과는 상황 의존적"
    strength: weak

  - id: r58
    term1Id: trade-deficit
    term2Id: gdp
    type: correlation
    description: "GDP 항목에서 순수출(NX)은 (수출-수입)이며 적자는 NX를 낮추지만, 강한 내수로 수입이 늘며 적자와 성장 동행도 가능"
    strength: weak

  - id: r59
    term1Id: trade-surplus
    term2Id: gdp
    type: correlation
    description: "무역흑자는 NX를 높여 GDP에 기여할 수 있으나, 경기·환율·글로벌 수요에 따라 상관관계는 달라짐"
    strength: weak

  - id: r60
    term1Id: trade-deficit
    term2Id: trade-surplus
    type: inverse
    bidirectional: true
    description: "무역적자와 무역흑자는 순수출(수출-수입)의 부호가 반대인 상태"
    reverseDescription: 무역흑자와 무역적자는 순수출(수출-수입)의 부호가 반대인 상태
    strength: strong

  - id: r61
    term1Id: strong-dollar
    term2Id: weak-dollar
    type: inverse
    bidirectional: true
    description: 강달러와 약달러는 달러 가치가 서로 반대 방향으로 움직이는 상태
    reverseDescription: 약달러와 강달러는 달러 가치가 서로 반대 방향으로 움직이는 상태
    strength: strong

  - id: r62
    term1Id: strong-dollar
    term2Id: exchange-rate
    type: correlation
    description: "강달러는 달러가 다른 통화 대비 강세(해당 통화 기준 환율 상승)를 의미"
    strength: strong

  - id: r63
