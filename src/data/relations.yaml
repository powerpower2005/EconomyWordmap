  - id: r153
    term1Id: sofr
    term2Id: iorb
    type: correlation
    bidirectional: true
    description: "SOFR은 시장에서 실제 거래되는 무위험 담보 대출 금리로 IORB(연준이 지급하는 준비금 이자율)와 밀접한 관계를 가짐. 일반적으로 SOFR은 IORB보다 약간 낮거나 비슷한 수준에서 형성되며, 이는 은행들이 연준에 준비금을 예치하는 것보다 시장에서 담보 대출을 하는 것이 약간 더 유리할 수 있기 때문"
    reverseDescription: "IORB는 SOFR의 하한선 역할을 하며, IORB가 상승하면 SOFR도 함께 상승하는 경향. 그러나 SOFR과 IORB 사이에 이격(spread)이 발생할 때는 시장 유동성 부족, 특정 시장 참여자의 자금 조달 어려움 등을 시사하며, 이격이 지속적으로 확대되면 금융시장 스트레스의 조기 경고 신호가 될 수 있음"
