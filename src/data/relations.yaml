  - id: r154
    term1Id: core-pce
    term2Id: pce
    type: correlation
    description: "Core PCE는 PCE에서 변동성이 큰 식품과 에너지를 제외한 지표로, 연준이 인플레이션의 근본 추세를 파악하기 위해 PCE보다 더 중시함"
    strength: strong

  - id: r155
    term1Id: core-pce
    term2Id: inflation
    type: correlation
    description: "Core PCE는 연준이 인플레이션 목표(2%)를 설정할 때 사용하는 핵심 지표로, 일시적인 공급 충격(식품·에너지)을 제외하고 근본적인 인플레이션 압력을 측정"
