    strength: medium

  - id: r166
    term1Id: qra
    term2Id: treasury
    type: proportional
    description: "QRA는 재무부가 분기별로 발행하는 국채 발행 계획을 발표하는 정책 도구"
    strength: strong

  - id: r167
    term1Id: core-pce
    term2Id: cpi
    type: correlation
    bidirectional: true
    description: "Core PCE와 CPI는 모두 물가를 측정하나 Core PCE는 식품·에너지를 제외하고 연준이 더 중시함. Core PCE는 연준의 인플레이션 목표 기준이며, CPI는 소비자가 직접 느끼는 물가 상승을 더 잘 반영"
