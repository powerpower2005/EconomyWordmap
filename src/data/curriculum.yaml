        - id: part-checks
          title: "5. 견제 — 재정이 통화를 흔들 때"
          subtitle: "재무부 · TGA · 재정 우위"
          bodyDialogue: |
            **Alice:** 연준만 보면 되는 거 아니었어?

            **Bob:** 아니야. **재무부의 지출·국채 발행·TGA(일반계좌)** 도 시중 유동성을 빼거나 더해. 재정이 과열되면 연준이 물가를 잡기 **어려워지는(재정 우위)** 구도도 생겨.

            ---

            *2022년 9월, 영국*

            **Charlie:** 트러스 쇼크 기억해? 대규모 감세 발표 후 국채가 급락(금리 급등)했어. 「재정이 지속 가능한가?」에 대한 **신뢰 붕괴**가 조달 비용을 올렸지. 기축통화국(미국)은 버티기 쉽지만, **신뢰가 흔들리면** 같은 메커니즘이 작동해.

            **Bob:** 재무부 TGA 잔고가 **크게 늘면** 세수·국채 자금이 연준 계정에 묶여 **지급준비금·유동성이 줄어들어**. 단기금융시장(SOFR)이 튀는 날, TGA·국채 발행 일정을 함께 보는 이유야.

            ---

            *1970년대*

            **Charlie:** **재정 확장**이 물가·임금 기대를 누적시킨 뒤, 1973·79년 **오일쇼크**와 겹치며 「물가↑ + 실업↑」 스태그플레이션이 터졌어. **임금 상승이 생산성을 웃돌아** 단위 노동 비용이 올라가고, **임금–물가 스파이럴**이 기대를 끌어올리는 경로도 중요했지.

            **Alice:** 결국 돈 가치는 연준 혼자 못 정한다는 거네.

            **Bob:** 맞아. 돈의 가치는 **통화정책만의 문제가 아니야**. 재정·TGA·국채 수급이 유동성과 기대를 동시에 흔들어.
          bodyProse: |
            연준만이 아니다. **재무부의 지출·국채 발행·TGA(일반계좌)** 도 시중 유동성을 빼거나 더한다. 재정이 과열되면 연준이 물가를 잡기 **어려워지는(재정 우위)** 구도도 생긴다.

            2022년 9월 영국 **트러스 쇼크**는 대규모 감세 발표 후 국채가 급락(금리 급등)한 사례다. 「재정이 지속 가능한가?」에 대한 **신뢰 붕괴**가 조달 비용을 올렸다.

            재무부 TGA 잔고가 **크게 늘면** **지급준비금·유동성이 줄어든다**. SOFR이 튀는 날, TGA·국채 발행 일정을 함께 본다.

            1960~70년대 **재정 확장** 뒤 1973·79년 **오일쇼크**와 겹치며 스태그플레이션이 터졌다. **임금–물가 스파이럴**이 기대를 끌어올리는 경로도 중요했다.

            **정리:** 돈의 가치는 **통화정책만의 문제가 아니다**. 재정·TGA·국채 수급이 유동성과 기대를 동시에 흔든다.
