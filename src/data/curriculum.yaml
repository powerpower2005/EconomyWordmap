        - id: part-same-macro-assets
          title: "7. 같은 거시, 다른 자산 — 1,000만 원의 표현"
          subtitle: "현금 · 단기채 · 장기채 · 주식 · 금 · 달러 · 유가"
          bodyDialogue: |
            **Alice:** 맨 처음 내 1,000만 원 — 어디에 뒀느냐에 따라 결과가 달라진다고?

            **Bob:** 맞아. 2020~23 **같은 거시**에도 **어디에 두었느냐**에 따라 갈려. 돈의 가치는 **현금만**이 아니라 **자산 형태**로도 표현돼. 금리는 주식만이 아니라 채권·금·달러·수입물가까지 한꺼번에 건드려.

            ---

            **Bob:** **통장·예금·MMF**는 2020~21년 이자는 낮지만 원금은 안전했고, QE 국면에서 주식 대비 **기회비용**이 컸어. 2022~23년에는 명목 이자는 올랐지만 **실질은 마이너스**일 수 있고, CPI 주간에는 주식보다 덜 출렁였지.

            **Alice:** 그때 「단기채」라는 말도 많이 들었는데?

            **Bob:** 2023년쯤 미국 **3개월 국채** 수익률이 5%대까지 갔어. **단기채**는 금리 인상을 비교적 빨리 따라가면서, 2022형 긴축기에 **현금 대안**·**옵션 가치** 역할을 했지 — 장기채처럼 가격이 크게 깨지지 않는 그릇이야.

            ---

            **Bob:** **장기 국채 ETF**(예: TLT)는 2020~21년 QE·금리↓로 **채권 가격↑**했어. 2022년엔 **10년물 수익률**이 1% 안팎에서 4% 안팎으로 올라 **채권 가격 급락**(듀레이션) — 「안전하니까 채권」만으로는 부족했던 국면이야. **장기금리**는 정책금리와 같이 움직이지만, 인플레 기대·재정·공급이 섞여 **주택담보대출 금리**까지 같이 올라갔어.

            **Bob:** **성장주·주식 ETF**는 2020~21년 유동성·저금리로 **밸류에이션↑**, 2022~23년 **장기금리↑**로 할인율이 올라 **고PER·성장주**가 더 크게 조정됐어.

            ---

            **Alice:** 금은 인플레 헤지 아니야? 2022년에도 샀어야 해?

            **Bob:** 금은 이자가 없어서 **금리·실질금리**가 오르면 **기회비용**이 커져 약세 압력이 생겨. 2022년 상반기 유가·인플레 우려에 잠깐 올랐지만, 연준이 세게 올리며 **실질금리**가 플러스로 가까워지자 금값은 밀렸어. 반대로 2020년 3월처럼 **위기 + 금리 인하** 국면에서는 금이 **안전자산**으로 강했지.

            ---

            *2020년 3월 vs 2022년 6월 CPI 서프라이즈*

            **Alice:** 같은 「불안」인데 자산 반응이 달랐다며?

            **Bob:** **안전자산**은 배경이 갈려. 2020년 3월 **코로나 쇼크**엔 **미 국채·금·달러**로 자금이 몰렸어 — 금리는 **내려가는** 쪽이었지. 2022년 6월 **CPI 서프라이즈**엔 「연준이 더 올린다」는 **인플레 대응** 금리 인상 기대가 커져 **국채 가격은 하락**, 성장주도 같이 빠졌어. 2021–23년엔 미국 **장기 국채가 3년 연속** 약세를 보이며 「주식·채권 60/40」 분산이 한꺼번에 깨진 국면이었지. 같은 Fed 뉴스라도 **침체 공포**인지 **인플레 공포**인지 먼저 구분해야 해.

            ---

            **Alice:** 미국 주식 샀는데 원화로 환산하면 더 헷갈려.

            **Bob:** 2022년 **강달러** 국면에 미국 주식을 원화로 환산하면, 주가 하락에 **환율(원/달러)** 약세가 겹쳐 손실이 커 보일 수 있어. 반대로 2023~24년 달러가 잠잠해지면 주가 회복이 원화 수익으로 더 잘 보이기도 하지. **달러 자산**은 **주가 + 환율**을 꼭 나눠 기록해.

            ---

            **Alice:** 주식·채권·금 말고, 기름값은?

            **Bob:** **원유**는 포트폴리오에 직접 안 넣어도 **구매력**을 깎아. 2022년 봄 **WTI 120달러** 안팎·국내 휘발유 급등처럼, 유가는 **수입 물가→CPI**로 이어져 연준 금리 기대까지 건드려. 에너지 비중 큰 소비·수입 의존 업종은 주식만 볼 때보다 먼저 아파.

            ---

            **Alice:** 그럼 지금 뭘 어떻게 나눠야 해?

            **Bob:** **같은 Fed·CPI**라도 **현금·단기채·장기채·주식·금·달러·수입유가** 전달이 달라. 금리 **급등(인플레 대응)** 기엔 장기채·금 **성급 매수**를 경계하고, **단기채·현금** 옵션과 **안전자산 배경**을 먼저 봐. **침체 우려 인하** 국면에선 국채·금이 다시 강할 수 있어. 포트폴리오를 **현금·채권·주식·헤지(금 등)** 그릇으로 나누고, Fed 레짐이 바뀔 때 **비중만** 조절하는 연습을 해(전량 현금화 X).
          bodyProse: |
            2020~23 **같은 거시**에도 **어디에 두었느냐**에 따라 결과가 갈린다. 금리는 주식만이 아니라 채권·금·달러·수입물가까지 건드린다.

            **통장·예금·MMF** — 2022~23년 명목 이자는 올랐지만 **실질은 마이너스**일 수 있다. **단기채**(2023년 3개월 국채 5%대)는 긴축기 **현금 대안**·**옵션 가치** 역할을 했다.

            **장기 국채 ETF**(TLT) — 2022년 **10년물 수익률** 1%→4% 안팎, **채권 가격 급락**. **장기금리**는 **주택담보대출 금리**까지 끌어올렸다. **성장주**는 할인율↑로 더 크게 조정됐다.

            **금** — 이자가 없어 **실질금리**↑ 시 **기회비용**↑. 2022년 상반기 잠깐 올랐으나 연준 긴축 뒤 밀렸다. 2020년 3월 **위기+인하** 국면에서는 **안전자산**으로 강했다.

            **안전자산** — 2020년 3월 **코로나**(금리↓) vs 2022년 6월 **CPI 서프라이즈**(인플레 대응 금리↑): **침체 공포**인지 **인플레 공포**인지 먼저 구분한다. 2021–23년 미국 **장기 국채 3년 연속** 약세는 「주식·채권 60/40」 분산이 동시에 깨진 대표 사례다.

            **달러 자산** — 2022년 **강달러**에 원화 환산 손실이 겹칠 수 있다. **주가 + 환율**을 분리 기록한다.

            **원유** — 2022년 봄 **WTI 120달러**·휘발유 급등. 포트폴리오에 없어도 **구매력**과 CPI 기대를 건드린다.

            **정리:** **현금·단기채·장기채·주식·금·달러** 그릇으로 나누고 Fed 레짐에 따라 **비중만** 조절한다.
