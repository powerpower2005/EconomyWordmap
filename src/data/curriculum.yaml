        - id: part-real-loop
          title: "7. 실물 판독 루프"
          subtitle: "어디서 깨졌나 · 순행/역행 · 선행지수"
          bodyDialogue: |
            **Alice:** 결국 매달 질문을 하나로 줄이면?

            **Bob:** **고용·소비·생산이 원활히 도나?** 고용 쇼크면 소비가 꺾이고 생산이 줄고. 이전지출로 소비만 살리면 생산·고용이 따라올 수도 있고. 자재 병목이면 생산이 먼저 막혀.

            ---

            **Alice:** 그다음이 물가·연준이야?

            **Bob:** 실물 불균형이 **물가**로 나타나면 Fed가 금리를 움직이고 금융시장이 흔들려. 물가 헤드라인은 이미 가격에 반영된 경우가 많아서, 그보다 **앞단 균형이 깨지는 지점**을 보는 게 중요해.

            ---

            **Alice:** 경기순행·역행?

            **Bob:** 순행은 호황에 같이 오르는 쪽(고용·소비·생산·가동률…), 역행은 불황에 오르는 쪽(실업·재고·이전지출…). 선행 합성지수(LEI·CI)는 편리하지만 **구성 지표를 안 열면** 정보를 잃어.

            ---

            **Alice:** 내일부터 습관 하나만?

            **Bob:** 고용 주간·월간을 축으로, 소매·IP·주택이 **같은 이야기인지** 대조해. 어긋나면 그 틈이 다음 물가·금리 서사야.
          bodyProse: |
            실물 판독의 핵심 질문은 고용–소비–생산 순환의 **병목 위치**다. 불균형이 물가·Fed·자산가격으로 전달된다(p251). 경기순행/역행 지표를 구분하고, Conference Board LEI·통계청 CI·OECD CLI 같은 합성 선행지수는 **체크리스트**로 쓰되 구성 지표를 열어 본다.

            **정리:** 월별 세트로 「어디서 깨졌나」를 묻고, 합성지수에만 기대지 않는다.
