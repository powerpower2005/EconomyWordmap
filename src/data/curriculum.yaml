# Investor learning path — stage buckets + suggested term order (not forced).
# Canonical rules: AGENTS.md § Investor learning path
curriculum:
  version: 1
  intro: "단계는 권장 학습 묶음입니다. 순서를 강제하지 않으며, 궁금한 항목부터 열어도 됩니다."
  stages:
    - id: s1-market
      order: 1
      title: "시장"
      subtitle: "내가 사는 게 뭔지"
      learnerQuestion: "What am I actually buying?"
      termIds:
        - stock-market
        - stock-index
        - etf
        - valuation
        - eps
        - per
        - pbr
        - risk-on
        - risk-off
        - market-sentiment

    - id: s2-macro
      order: 2
      title: "매크로 대시보드"
      subtitle: "뉴스에 나오는 숫자"
      learnerQuestion: "What did today's data mean?"
      termIds:
