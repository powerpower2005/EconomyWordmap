    - id: sec-macro-dashboard
      order: 4
      title: "오늘의 GDP·경기·신용은 내 주식에 어떻게 닿는가"
      subtitle: "실질 GDP · DCF · 경기순환 · 신용 사이클"
      learnerQuestion: "What did today's GDP and cycle headlines mean for my portfolio?"
      bodyDialogue: |
        **Alice:** 뉴스에 GDP 성장률, 경기침체, 신용 경색… 매크로가 너무 많아. 내 포트폴리오랑 어떻게 연결돼?

        **Bob:** 한 줄기로 보면 **실물(일·생산)** 과 **금융(신용·금리)** 이 맞물리고, 그게 **기업 이익·할인율**로 주가에 닿아. GDP는 그 실물 쪽의 대표 숫자야 — **근데 총량만으로 분배·환경·체감 후생이 다 보이진 않아.**

        ---

        **Alice:** GDP가 오르면 주식도 무조건 오르지?

        **Bob:** 아니. GDP = **C + I + G + NX**로 쪼개서 **누가** 끌어올렸는지, **실질**인지 **명목**인지 봐야 해. DCF로 말하면 **CF(이익)·g(성장)·r(금리)** 셋 중 뭐가 바뀌었는지가 더 직접적이야.
      bodyProse: |
        거시 헤드라인은 **실물 경제**(재화·서비스·고용)와 **금융 경제**(신용·부채·금리)가 맞물린 뒤, **기업 이익·할인율**을 통해 주가에 전달된다. GDP는 실물 쪽 대표 지표이며, 지출 항목으로 **GDP = C + I + G + NX**로 쪼갠다. 다만 GDP는 **총량·시장 거래** 중심이라 **분배·외부성·체감 후생**을 곧바로 보여 주지는 않는다.

        주식 밸류에이션의 기본 틀은 DCF다. **IV = CF1/(1+r) + … + 터미널/(r−g)** 형태로, 가치가 오르려면 **CF↑·g↑·r↓** 중 하나 이상이 필요하다. 국가 **실질 성장률**은 g의 현실적 상한을, **경기·신용 국면**은 CF 전망과 r(스프레드·리스크 프리미엄)을 좌우한다.

        아래 네 파트는 **GDP·성장·DCF** → **경기순환·신용 사이클** → **시가총액 vs GDP** → **GDP가 못 보는 것** 순으로 이어진다.
      parts:
        - id: part-gdp-dcf
          title: "1. GDP, 실질 성장, DCF"
          subtitle: "C + I + G + NX → CF · g · r"
          bodyDialogue: |
            **Alice:** GDP랑 실질 GDP 차이가 뭐야?

            **Bob:** **명목 GDP**는 물가 포함, **실질 GDP**는 물가를 뺀 생산량. **경제성장률**은 보통 실질 GDP 증가율로 말해.

            ---

            **Alice:** 물가만 올라도 GDP는 커 보이는 거 아니야?

            **Bob:** **명목 GDP**는 그래. **GDP 디플레이터**(명목÷실질×100)로 물가를 떼거나 **실질 GDP**로 생산량 변화를 봐. **중앙은행** **성장률 전망**도 **실질** 기준이야 — 금리 동결과 함께 전망만 깎이면 둔화 신호.

            ---

            **Alice:** DCF는 어디에 쓰여?

            **Bob:** 미래 **현금흐름(CF)** 을 **할인율(r)** 로 할인해 **내재가치**를 보는 틀이야. **터미널/(r−g)** 에서 **g**는 장기 성장인데, 한 나라 실질 성장을 크게 넘기 어렵다는 게 현실적 상한이야.

            ---

            **Alice:** 「금리 내리면 주식 오른다」는 그 세 변수로 보면?

            **Bob:** **r↓**는 할인율이 내려가 멀티플이 올라가는 경로, **CF↑**는 수요·투자가 살아 이익 전망이 좋아지는 경로, **g↑**는 연착륙·부양 기대가 성장 가정을 올리는 경로야. 근데 침체 신호로 내리면 CF가 꺾여서 오히려 떨어질 수도 있어 — **배경**이 갈라.

            ---

            **Alice:** 호황이면 뭘 보면 돼?

            **Bob:** 실질 GDP·고용·**EPS** 전망(CF)과 **금리·스프레드**(r). CPI만 보지 말고 **성장 + 금리**를 같이 봐.

            ---

            **Alice:** 성장률 '전망'도 주가에 닿아?

            **Bob:** **성장률 전망**이 연초 대비 올라가면 주가가 먼저 반응하는 경우가 많아. **잠재성장률**을 넘기면 상승 국면, 밑으로 내려가면 둔화 국면으로 읽기도 해.

            ---

            **Alice:** 생산성이랑 잠재 성장은 어떻게 연결돼?

            **Bob:** **노동 생산성**이 오르면 같은 인력으로 더 많이 만들 수 있어. 그게 쌓이면 **잠재 GDP**·**잠재성장률** 추정이 올라가. 반대로 실질 GDP가 잠재를 크게 넘으면 **아웃풋 갭**이 양(+) — 경기 과열 신호로 **중앙은행**이 금리를 올리거나 높게 유지할 수 있어.

            ---

            **Alice:** 그럼 성장이 좋으면 주식도 무조건 오르는 거 아니야?

            **Bob:** 과열·아웃풋 갭이 크면 이익은 좋아도 **긴축 기대**가 먼저 와서 주가는 조정될 수 있어. 성장·잠재·갭·금리를 세트로 봐.
          bodyProse: |
            **GDP = C + I + G + NX** — I에는 설비·재고 등 민간투자, G에는 이전지출 제외. **명목 GDP**는 당해 가격×생산량, **실질 GDP**는 기준연도 가격×생산량으로 물가를 제거한 뒤 **경제성장률**을 본다. **GDP 디플레이터**(명목÷실질×100)는 CPI와 달리 수출입·투자재 등 GDP 전체 물가를 반영한다. **중앙은행** **성장률 전망**은 실질 GDP 기준이며, 금리 결정과 함께 상·하향 개정된다.

            DCF: **IV = CF1/(1+r) + … + 터미널/(r−g)** (r>g). **CF↑·g↑·r↓**가 가치 상승 요인. **실질 성장률**은 g 상한, **호황/침체**는 CF·스프레드(r)에 직접 닿는다. **성장률 전망** 상·하향 개정은 주가에 선반영될 수 있고, **잠재성장률**은 경기 상승·하강을 나누는 기준선으로 쓰인다. 「금리 인하 → 주가 상승」 통념도 **r↓·CF↑·g↑** 세 경로로 읽되, 침체 신호 인하·인플레 국면에서는 CF·g가 꺾여 반대로 작용할 수 있다.

            **노동 생산성** 개선은 **잠재 GDP**·**잠재성장률** 추정의 핵심 변수다. 실질 GDP가 잠재를 상회하면 **아웃풋 갭**이 양(+)이 되어 과열로 해석되고, **중앙은행**은 금리·통화정책 판단에 이를 참고한다. 성장이 잠재를 넘는다고 주식이 항상 유리한 것은 아니며, 과열·긴축 기대가 선반영될 수 있다.

            **정리:** GDP 헤드라인은 C·I·G·NX와 **명목/실질/디플레이터**를 구분하고, 포트폴리오는 **EPS(CF)·금리(r)·성장(g)·성장 전망·생산성·아웃풋 갭**으로 연결해 읽는다. 금리 인하는 r·CF·g 중 어디를 통해 주가에 닿는지 국면을 먼저 가른다.
          termIds:
            - gdp
            - real-gdp
            - nominal-gdp
            - gdp-deflator
            - economic-growth
            - inflation
            - potential-growth-rate
            - potential-gdp
            - output-gap
            - labor-productivity
            - growth-forecast
            - national-accounts
            - aggregate-demand
            - consumption
            - investment
            - fiscal-policy
            - trade-deficit
            - dcf
            - valuation
            - eps
            - interest-rate
            - policy-rate
            - central-bank
            - credit-spread
          propositionIds:
            - p12
            - p172
            - p185
            - p186
            - p187
            - p189
            - p190
            - p191
            - p102
            - p152
            - p196

        - id: part-cycles
          title: "2. 경기순환과 신용 사이클"
          subtitle: "실물 ↔ 금융, GDP의 I 항"
          bodyDialogue: |
            **Alice:** 경기침체랑 신용 경색이랑 다른 거야?

            **Bob:** **경기순환**은 실물(실질 GDP·고용) 확장·수축, **신용 사이클**은 대출·레버리지 팽창·수축. 동전 양면처럼 붙어 있지만 **어느 쪽이 먼저 터지는지**는 매번 달라 — **신용창조·M2·경색** 메커니즘은 **「통화량과 신용」** 섹션에서 자세히 봤지.

            ---

            **Alice:** 「확장이 오래됐으니 곧 침체」 같은 말, 맞아?

            **Bob:** **아니야.** 확장은 나이 들어 죽지 않아 — **경제 충격**(금융·유가·긴축 등)이 추세를 깨야 수축으로 넘어가. 「late-cycle」은 **무엇이 터질지** 보라는 신호지, 달력만 세라는 뜻은 아니야.

            ---

            **Alice:** 신용이 줄면 GDP에 뭐가 닿아?

            **Bob:** **투자(I)** — GDP = C+I+G+NX에서 **변동성이 가장 큰 항**. 신용 경색이 **지속**되면 I가 위축되고 실물 경로가 약해져. 전형적 침체는 **투자 감소→고용·소비 위축** 순서가 흔해.

            ---

            **Alice:** 그래서 뭘 보면 돼?

            **Bob:** **실질 GDP·고용**과 **가산금리·수익률 곡선**을 **세트**로. 신용 국면 상세는 **「통화량과 신용」** 6파트·여기 1파트(GDP·DCF)와 **역할을 나눠** 보면 된다.
          bodyProse: |
            **경기순환**은 실질 GDP·고용의 확장·수축이며 **규칙적 주기가 아니다**. **신용 사이클**(약 5~8년)은 신용 창조·파괴·디레버리징의 반복 — 메커니즘은 **「통화량과 신용」** 섹션에서 다룬다.

            **경제 충격**이 추세를 깨야 수축으로 전환한다. 신용 경색 **지속** 시 **투자(I)** — GDP 구성 중 **변동성이 가장 큰 항** — 위축으로 실물 경로가 약해진다. 전형적 침체는 **투자 감소→고용·소비 위축** 순서가 흔하다.

            **정리:** 실물(GDP·고용)과 금융(스프레드·곡선)을 **함께** 추적한다. 침체는 ‘두 분기 GDP’만으로 단정하지 말고 **고용·소득·산출** 복합 판단을 같이 본다.
          termIds:
            - business-cycle
            - economic-shock
            - potential-growth-rate
            - recession
            - real-gdp
            - unemployment
            - credit-cycle
            - credit-spread
            - yield-curve
