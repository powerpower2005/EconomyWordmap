        - id: part-cycles
          title: "2. 경기순환과 신용 사이클"
          subtitle: "실물 ↔ 금융, GDP의 I 항"
          bodyDialogue: |
            **Alice:** 경기침체랑 신용 경색이랑 다른 거야?

            **Bob:** **경기순환**은 실물(실질 GDP·고용) 확장·수축, **신용 사이클**은 대출·레버리지 팽창·수축. 동전 양면처럼 붙어 있지만 **어느 쪽이 먼저 터지는지**는 매번 달라 — **신용창조·M2·경색** 메커니즘은 **「통화량과 신용」** 섹션에서 자세히 봤지.

            ---

            **Alice:** 「확장이 오래됐으니 곧 침체」 같은 말, 맞아?

            **Bob:** **아니야.** 확장은 나이 들어 죽지 않아 — **경제 충격**(금융·유가·긴축 등)이 추세를 깨야 수축으로 넘어가. 「late-cycle」은 **무엇이 터질지** 보라는 신호지, 달력만 세라는 뜻은 아니야.

            ---

            **Alice:** 신용이 줄면 GDP에 뭐가 닿아?

            **Bob:** **투자(I)** — GDP = C+I+G+NX에서 **변동성이 가장 큰 항**. **설비(CapEx)** 와 **재고투자**로 나뉘는데, **재고**는 호황에 늘면 경기를 **키우고** 불황에 줄면 **침체를 심화**시키기 쉬워 — 재고↑만 봐선 안 되고 판매·생산이랑 같이 봐. 신용 경색이 **지속**되면 I가 위축되고 실물 경로가 약해져.

            ---

            **Alice:** 그래서 뭘 보면 돼?

            **Bob:** **실질 GDP·고용**과 **경기동향지수·PMI(50 기준)**·**연준 산업생산·설비가동률**·**실업률·고용률·NFP(미국)**·**소비자신뢰(CSI·CCI)** 를 **세트**로. **주택착공·기존주택판매**도 GDP에 수 분기 선행하는 경우가 많아 — 다만 착공만 꺾였다고 수요 둔화로 단정하지 말고 **재고·가격·금리**랑 같이 봐. **PMI**는 설문, **산업생산**은 공식 생산량 — 둘 다 제조·실물인데 성격이 달라. **설비가동률**이 **82%** 넘으면 물가·Fed 압력, **풀가동**이면 **CapEx** 신호로도 봐. 미국 **Employment Situation**은 **가계조사(실업률)** 와 **기관조사(NFP)** 쌍 — 매월 **첫 금요일**에 **연준 이중목표**·금리·주가가 같이 흔들려. **경제가 좋다고 주가도 좋은 건 아니야** — 저실업·완전고용이면 임금·Fed 긴축이 주가를 누를 수 있고, 고실업+부양 기대면 주가가 먼저 오르기도 해. **실업률은 후행**, **주가는 선행**이라 둘이 엇갈리면 이 이유부터 의심해. **고용보조지표**·참가율·**청년·비정규**도 같이 봐.

            ---

            **Alice:** 나열은 알겠는데… 매달 숫자가 쏟아질 때 **읽는 순서**는?

            **Bob:** 그게 다음 이야기의 핵심이야. **MoM·YoY·계절조정·개정**부터, 고용→소비→생산이 **어디서 막혔는지**까지 — GDP 총량보다 빠른 월별 실물을 한 줄기로 따라가 보자.
          bodyProse: |
            **경기순환**은 실질 GDP·고용의 확장·수축이며 **규칙적 주기가 아니다**. **신용 사이클**(약 5~8년)은 신용 창조·파괴·디레버리징의 반복 — 메커니즘은 **「통화량과 신용」** 섹션에서 다룬다.

            **경제 충격**이 추세를 깨야 수축으로 전환한다. **I(민간투자)** 는 **CapEx** 와 **재고투자**로 나뉘며, 재고투자는 국면에 따라 **경기 변동성을 확대** — 불황 재고↓는 침체 심화, 호황 재고↑는 확장 증폭(미판매 적체일 수도 있음). **경기동향지수**·**PMI**·**연준 IP·CU**·**NFP**·**CSI/CCI**·**주택착공·기존주택판매**는 GDP보다 빠른 월별 신호다. 착공 둔화는 수요 약화일 수도, **주택재고**·자재·인력 병목일 수도 있어 **케이스-실러·금리**와 함께 본다. PMI는 **설문**(50 기준), IP·CU는 **공식 생산·가동** 통계. CU **82% 전후** 초과는 **인플레**·Fed 압력, **풀가동**은 **CapEx** 신호. **Employment Situation**(매월 첫 금요일)은 NFP·실업률 이원 구조. **실업률 변화**는 수준보다 주가와 맞는 경우가 많고, **AHE**는 NFP보다 후행. **완전고용**·저실업은 **ULC→이익→주가** 경로로 증시와 어긋날 수 있다.

            **정리:** 실물(GDP·고용)과 **CI·PMI·IP·CU·재고(I)·NFP·CSI/CCI·주택착공·기존주택판매**·금융(스프레드·곡선)을 **함께** 추적한다. 침체는 ‘두 분기 GDP’만으로 단정하지 말고 **고용·소득·산출·재고** 복합 판단을 같이 본다. 월별 지표의 **읽는 법**(리터러시·고용 해부·소매·생산·주택 루프)은 이어지는 **「실물 경제 지표」** 섹션에서 다룬다.
