        - id: part-cycles
          title: "2. 경기순환과 신용 사이클"
          subtitle: "실물 ↔ 금융, 같이 모니터링"
          bodyDialogue: |
            **Alice:** 경기침체랑 신용 경색이랑 다른 거야?

            **Bob:** **경기순환**은 실물(실질 GDP·고용) 확장·수축, **신용 사이클**은 대출·레버리지 팽창·수축. 동전 양면처럼 붙어 있지만 **어느 쪽이 먼저 터지는지**는 매번 달라.

            ---

            **Alice:** 신용이 줄면 뭐가 달라져?

            **Bob:** 대출 상환·부도는 **신용파괴** — 구매력과 부채가 같이 줄어. 정점 넘으면 **디레버리징**으로 수요가 위축돼. 반대로 유예·구제만 하면 부채가 **쌓인 채** 갈 수도 있어.

            ---

            **Alice:** 그래서 뭘 보면 돼?

            **Bob:** **실질 GDP·고용**, **가산금리·수익률 곡선**, **신용 사이클** 국면을 **세트**로. 한쪽만 보면 반쯤만 본 거야.
          bodyProse: |
            **경기순환**은 실질 GDP·고용의 확장·수축. **신용 사이클**(약 5~8년)은 신용 창조·**신용파괴**·디레버리징의 반복. 둘은 분리할 수 없지만 **선후·주도는 국면마다 다르다**.

            신용 정점 이후 **스프레드 확대**, **수익률 곡선 역전**, 은행 **마진 악화**가 함께 나타날 수 있다. 부채 **유예**는 청산과 달리 명목 부채가 유지·누적될 수 있다.

            **정리:** 실물(GDP·고용)과 금융(스프레드·신용)을 **함께** 추적하고, 침체는 ‘두 분기 GDP’만으로 단정하지 말고 고용·소득을 같이 본다.
