            - p202

    - id: sec-real-economy
      order: 5
      title: "실물 지표는 어떻게 읽고, 어디서 순환이 깨지나"
      subtitle: "고용 · 소비 · 생산 · 주택 · Dual Mandate"
      learnerQuestion: "How do I read monthly real-economy prints before Fed and markets reprice?"
      bodyDialogue: |
        **Alice:** GDP 이야긴 알겠는데, 매달 쏟아지는 고용·소매·산업생산은 뭐부터 봐?

        **Bob:** 숫자의 **단위**(전월비·전년비)·**계절조정·개정**부터. 그다음 **고용 → 소비 → 생산**이 한 줄로 도는지, 막히면 **물가·연준**이 움직이는지를 봐.

        ---

        **Alice:** 소비·생산보다 고용이 더 중요하다고들 하던데?

        **Bob:** 연준이 **직접 목표로 잡는 축**이 최대고용과 물가라서 그래. 소매나 산업생산만으로는 금리를 안 움직이지만, 그게 실업·물가로 전달되면 이야기가 달라져.
      bodyProse: |
        분기 GDP보다 빠른 **월·주간 실물 지표**로 고용·소비·생산·주택을 읽고, 순환이 어디서 깨지는지 본다. 지표 리터러시(MoM/YoY, 계절조정, 개정, 명목/실질) → 왜 고용인가(이중목표) → 고용 보고서 → 소비·소득 → 생산·재고·PMI → 주택 선행 → **불균형 → 물가 → Fed** 루프 순이다.

        아래 일곱 파트는 한 줄기다. 합성 선행지수만 보지 말고, 구성 지표를 열어 정보를 잃지 않는 습관을 목표로 한다.
      parts:
        - id: part-indicator-literacy
          title: "1. 지표 리터러시"
          subtitle: "MoM · YoY · 계절조정 · 개정 · 명목/실질"
          bodyDialogue: |
            **Alice:** 헤드라인에 「전월비 +0.3%」랑 「전년비 +3%」가 같이 나와. 뭐가 중요해?

            **Bob:** **MoM(월)** 은 최근 모멘텀, **YoY(연)** 는 계절·기저를 넘어 추세를 볼 때. 분기는 **QoQ**. 같은 숫자도 단위가 다르면 이야기가 달라져.

            ---

            **Alice:** 계절조정이랑 개정이란?

            **Bob:** 연말 쇼핑·여름 휴가처럼 **반복 패턴**을 빼는 게 계절조정. **개정**은 나중에 표본·추정이 바뀌는 것 — 첫 숫자가 뒤집히기도 해. 이동평균은 노이즈를 줄이되 전환점을 늦출 수 있어.

            ---

            **Alice:** 명목이랑 실질은?

            **Bob:** 명목은 가격 포함, 실질은 물가를 뺀 **물량**. 소매·소득·GDP를 볼 때 「가격만 올린 건가」를 먼저 의.

            ---

            **Alice:** 그래서 습관은?

            **Bob:** 단위·계절·개정·명목/실질을 확인하고, **한 달 숫자**보다 **추세 전환**을 봐.
          bodyProse: |
            경제지표 헤드라인은 **MoM/QoQ/YoY** 단위, **계절조정(SA)** 여부, **사후 개정**, **명목 vs 실질**을 함께 읽어야 한다. 이동평균은 변동성을 줄이지만 전환 시점을 늦출 수 있다.

            **정리:** 숫자 하나가 아니라 변환·시차·개정을 보고, 추세 전환을 우선한다.
          termIds:
            - real-gdp
            - nominal-gdp
            - cpi
            - pce
            - gdp
            - business-condition-index
          propositionIds:
            - p204

        - id: part-circular-dual-mandate
          title: "2. 순환과 이중목표"
          subtitle: "왜 고용이 축인가"
          bodyDialogue: |
            **Alice:** 경제가 순환하는데 왜 하필 고용이야?

            **Bob:** 가계가 기업에 **노동**을 주고 **소득**을 받고, 그걸 **소비**로 돌려 생산이 돌아가는 그림이거든. 그 고리가 끊기면 소비·생산이 같이 흔들려.

            ---

            **Alice:** 그럼 연준도 소비·산업생산을 직접 타깃으로 해?

            **Bob:** 아니. **최대 고용**과 **물가 안정**이 이중목표야. 소비나 IP만 나빠진다고 바로 금리를 움직이지는 않아 — 그게 **실업·물가**로 전달될 때 개입해.

            ---

            **Alice:** 투자자는 뭘 먼저 보면 돼?

            **Bob:** 고용·물가 캘린더를 중심에 두고, 소매·IP·주택은 **그 목표로 가는 중간 신호**로 봐.
          bodyProse: |
            실물 순환은 가계·기업·금융·정부·해외 사이에서 소득·소비·저축·투자·세금·정부지출·수출입이 돌며 이어진다. 그중 연준의 **이중목표**는 최대고용과 물가(및 적정 장기금리)다. 소비·산업생산은 중요 신호이나 **직접 타깃은 아님**.

            **정리:** 고용·물가를 축으로 두고, 다른 실물 지표는 전달경로로 읽는다.
          termIds:
            - federal-reserve
            - full-employment
            - unemployment
            - inflation
            - consumption
            - investment
