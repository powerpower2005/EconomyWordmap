        - id: part-reshoring-limits
          title: "3. 리쇼어링과 제조업의 함정"
          subtitle: "설비투자 ≠ 대량 고용"
          bodyDialogue: |
            **Alice:** 공장을 미국으로 돌리면 일자리 많이 생기지 않아?

            **Bob:** 일부는. 그런데 **리쇼어링**에 돈을 쏟으면 다른 **고부가가치** 일자리 기회가 줄 수 있어(**구축효과**). 게다가 **설비투자**가 늘면 **자본집약**이 커져 같은 공장도 사람은 적게 써.

            ---

            **Alice:** 무역흑자 나는 나라가 우리 일자리 뺏은 거 아니야?

            **Bob:** 흑자국·적자국 **둘 다** 제조업 고용 비중이 줄어드는 시기가 있었어. **오프쇼어링**만의 문제가 아니라 **생산성**·**자동화** 공통 추세에 가깝지.

            **Alice:** 철강 같은 전통 공장은 사람 더 쓰지 않아?

            **Bob:** 철강은 **자동화**가 이미 높아. **경제안보** 명분으로 돌려도 고용은 제한적일 수 있어.
          bodyProse: |
            **리쇼어링**은 생산을 본국으로 끌어들이지만, 한정된 자원을 쓰면 다른 일자리·투자 기회가 줄어드는 **구축효과**가 생길 수 있다.

            **설비투자**가 늘면 **제조업** 생산능력은 커지나 **자본축적**·**기술 진보**로 고용 창출은 제한적일 수 있다. 무역흑자국과 적자국이 동시에 제조업 고용을 잃었다면, 일자리 감소를 한 국가의 탈취만으로 설명하기 어렵다.

            **정리:** 리쇼어링·공장 건설 뉴스는 고용 수치·무역수지·생산성을 같이 확인한다.
          termIds:
