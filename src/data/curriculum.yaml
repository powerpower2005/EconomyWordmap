        - id: part-tariffs-dollar
          title: "2. 관세·보호무역과 달러 역설"
          subtitle: "의도와 다른 무역수지"
          bodyDialogue: |
            **Alice:** 관세 올리면 수입 줄고 적자 줄지 않아?

            **Bob:** 단기엔 수입이 줄 수 있어. 그런데 **무역전쟁**이 **지정학** 불안을 키우면 위험회피 자금이 달러로 몰려 **강달러**가 되고, 수출 경쟁력이 떨어져 적자가 커질 수도 있어.

            ---

            *2018~2020년, 미중 관세*

            **Bob:** 관세를 씌웠는데 대중 **무역적자**가 오히려 확대된 구간이 있었지. **감세**와 **관세**를 동시에 쓰며 **재정적자**를 키우면 금리·달러 압력도 겹쳐.

            ---

            **Alice:** 유가만 오르면 수출은 그대로인데 나쁜 거야?

            **Bob:** **수입물가**가 **수출물가**보다 빠르게 오르면 **교역조건**이 나빠져. 같은 수출액으로 사들일 수입이 줄어 — **소득교역조건**은 수출 **물량**까지 봐야 해.

            **Alice:** 그럼 보호무역 뉴스에 수출주만 사면 안 되겠네?

            **Bob:** 맞아. **원/달러**만 보면 놓치기 쉬워 — 국내 **물가**가 더 오르면 **실질실효환율**은 약해질 수 있어. 약세가 곧바로 **경상수지** 개선은 아니고, **외화부채** 부담·환율 **변동성**도 같이 봐.

            **Alice:** 관세 발표일엔 뭘 먼저 보면 돼?

            **Bob:** 환율·금리 반응부터 보고, 「적자 줄인다」는 말과 수치가 맞는지 확인해.
          bodyProse: |
            **관세**·**보호무역**은 수입을 줄여 **무역적자**를 축소하려는 정책이지만, **무역전쟁**이 안전자산 수요를 키우면 **강달러**가 되어 역효과가 날 수 있다. **유가** 등 **수입물가**가 **수출물가**보다 빠르게 오르면 **교역조건**이 악화되고, **소득교역조건**은 수출 물량까지 함께 봐야 한다.

            **원/달러** **명목환율**만으로 **수출 경쟁력**을 단정하면 안 된다 — **실질실효환율(REER)** 과 국내 **물가**가 경쟁력을 보완한다. 통화 **약세**가 즉시 **경상수지**를 개선하지 않을 수 있고(J커브·수입원가), **외화부채** 원화환산 부담과 환율 **변동성**도 함께 본다.

            **감세**와 관세를 함께 쓰며 **재정적자**를 키우면 금리·달러 경로가 무역 목표와 충돌할 수 있다.

            **정리:** 관세·유가·ToT·REER·달러·금리·외채·무역수지를 한 묶음으로 본다.
