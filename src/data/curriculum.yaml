    - id: sec-valuation
      order: 3
      title: "주식을 사면 뭘 사는 건가"
      subtitle: "이익 · 밸류 · 시장 국면"
      learnerQuestion: "What am I actually buying when I buy a stock?"
      bodyDialogue: |
        **Alice:** 주식 사면 그냥 「회사 조각」 맞지?

        **Bob:** 맞아. 본질은 **미래 현금흐름(기업 이익)** 에 대한 권리야. 주가는 그 이익을 **PER·PBR·DCF** 같은 **밸류에이션**으로 할인해 매긴 숫자고, **금리**가 할인율이라 민감해.

        ---

        **Alice:** 그럼 이익만 좋으면 무조건 오르는 거야?

        **Bob:** 아니. 같은 이익이라도 **금리↑·VIX↑**면 멀티플이 눌릴 수 있어. **강세장**·**리스크온**과 **약세장**·**리스크오프**는 같은 EPS라도 주가 반응이 달라.

        **Alice:** 그래서 뭘 보면 돼?

        **Bob:** **EPS·이익 전망**, **PER/PBR**, **금리**, **VIX·변동성**을 세트로. CPI만큼 금리·밸류 뉴스도 캘린더에 넣어.
      bodyProse: |
        주식의 본질은 **미래 현금흐름(기업 이익)** 에 대한 권리다. **EPS**는 이익을 주당으로 나눈 값이고, **PER·PBR·DCF**는 이익·자산·현금흐름을 **밸류에이션**하는 도구다. **금리**는 할인율이라 멀티플에 직접 닿는다.

        같은 **이익**이라도 **금리 상승·변동성(VIX) 확대**면 PER이 눌릴 수 있다. **강세장**·**약세장**, **리스크온**·**리스크오프**는 시장 **국면**이고, **매파**·**비둘기파** 발언은 금리 기대를 바꾼다.

        아래 세 파트는 한 줄기 — 이익·EPS → 멀티플·금리 → 시장 국면·습관.
      parts:
        - id: part-earnings-eps
          title: "1. 이익과 EPS"
          subtitle: "주식의 분자"
          bodyDialogue: |
            **Alice:** EPS가 뭐야?

            **Bob:** **기업 이익**을 발행주식 수로 나눈 값이 **EPS**야. 주가 ÷ EPS = **PER**. 이익이 늘면 PER을 그대로 둬도 주가는 오를 수 있어.

            ---

            **Alice:** 장부 이익이랑 현금이랑 다른 경우도 있어?

            **Bob:** **재무제표**는 손익·재무상태·**현금흐름표** 세트야. 발생주의 **이익**과 **현금**은 괴릴 수 있어 — 매출채권·재고·CAPEX만 커도 **흑자도산** 위험이 있어.

            ---

            **Alice:** 자사주 매입이 EPS에 영향 줘?

            **Bob:** 주식 수가 줄면 이익이 같아도 EPS는 올라. 다만 **순 발행**·감가·일회성 항목까지 같이 봐야 해.

            **Alice:** 그래서?

            **Bob:** 헤드라인 **이익**·**EPS** 성장률과 가이던스를 먼저 보고, PER은 그다음. **현금흐름표**·영업 CF까지 같이 보면 이익 품질을 걸러낼 수 있어.
          bodyProse: |
            **기업 이익**은 주식 투자의 현금흐름 근원이다. **EPS**는 이익을 주식 수로 나눈 값이며 **PER**의 분모다. **재무제표**(손익·재무상태·**현금흐름표**)는 accrual **이익**과 **현금**을 분리해 **흑자도산** 리스크를 본다. **자사주 매입**은 주식 수를 줄여 EPS를 기계적으로 높일 수 있다.

            **정리:** 이익·EPS·발행/매입과 **영업 CF**를 먼저 보고, 멀티플은 그다음.
          termIds:
            - earnings
            - eps
            - per
            - financial-statements
            - cash-flow-statement
            - share-buyback
            - net-equity-issuance
            - stock-market
          propositionIds:
            - p102
            - p176
            - p194
            - p207

        - id: part-multiples-rates
          title: "2. PER · PBR · 금리"
          subtitle: "할인율이 멀티플을 누른다"
          bodyDialogue: |
            **Alice:** PER 30배면 비싼 거야?

            **Bob:** **금리**·성장률·리스크 프리미엄에 따라 달라. **PER**(주가÷EPS)이 낮다고 **무조건 싸다**고 볼 수는 없어 — 성장·금리·이익 품질을 같이 봐(11.4).

            ---

            **Alice:** PBR은?

            **Bob:** **PBR**은 장부가치 대비 주가. PER은 **이익**, PBR은 **자산** 기준이야. **시가총액/GDP**는 시장 전체가 실물 대비 얼마나 큰지 보는 거시 밸류 지표야.

            ---

            **Alice:** 부채 많은 회사는 무조건 피해야 해?

            **Bob:** **부채비율**만으론 부족해. **이자보상비율**·**유동비율**·**매출액영업이익률**을 같이 봐 — 금리↑·**신용경색** 때 고레버리지가 먼저 터져.

            **Alice:** 그래서?

            **Bob:** CPI·연준뿐 아니라 **장기금리**·**손익분기 인플레이션**·**TIPS**도 밸류 캘린더에 넣어. 재무 건전성은 **부채비율**·**이자보상**·CF 세트로.
          bodyProse: |
            **PER·PBR**은 **밸류에이션** 멀티플이고 **DCF**는 **현금흐름표**·FCF 할인 모형이다. PER(주가÷EPS)이 낮다고 무조건 저평가는 아니며, **시가총액/GDP**는 시장 전체의 거시 밸류를 본다. **부채비율**·**이자보상비율**·**유동비율**·**매출액영업이익률**은 레버리지·상환능력·본업 수익성을 본다. **금리**·**장기금리** 상승은 할인율↑ → 멀티플↓ 경로로 작용하고, **신용경색**과 겹치면 고부채 종목이 먼저 조정될 수 있다.

            **정리:** 이익·CF·부채 지표와 **금리·밸류**를 같은 차트에 둔다.
