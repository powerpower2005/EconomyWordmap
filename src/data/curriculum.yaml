# Investor learning path — thematic sections, continuous Markdown prose.
curriculum:
  version: 2
  intro: "각 섹션은 하나의 이야기로 읽습니다. 대화·만화 컷 형식이면 본문을 위에서 아래로 흘려 읽으면 됩니다. 아래 용어·명제는 본문을 다 읽은 뒤 펼쳐 보면 됩니다."
  sections:
    - id: sec-money-value
      order: 1
      title: "내 돈의 가치는 어떻게 정해지는가"
      subtitle: "구매력 · 은행 · 연준 · 유동성"
      learnerQuestion: "Why does the purchasing power of my cash change?"
      body: |
        *2021년 초. Alice의 통장에 1,000만 원이 있다.*

        **Alice:** 2024년인데 잔고는 여전히 1,000만 원이야. 근데 외식, 주유, 마트 — 다 비싸졌어. 숫자는 그대로인데 뭔가 이상하지 않아?

        **Bob:** 환율처럼 눈에 보이는 숫자가 아니야. 돈의 가치는 **같은 돈으로 살 수 있는 양**, 즉 **구매력**으로 정해져.

        ---

        **Bob:** 이 섹션 여덟 파트는 한 줄기로 이어져 — 물가·실질, 은행, 연준, 한국 투자자 전달, 재정 견제, 유동성, 같은 거시·다른 자산, 통제 실패.

        *2022년 어느 주. 화요일 새벽, 한국 시간 — 미국 CPI가 예상보다 높게 나온다.*

        **Alice:** 수요일엔 위원 발언 때문에 성장주랑 채권 ETF가 같이 출렁였고, 목~금엔 밸류에이션 높은 종목이 더 크게 빠졌어. 나는 아무것도 안 했는데 왜 계좌만 줄지?

        **Bob:** CPI 하나가 **연준 기대 → 금리 → 자산 가격**으로 다섯 일 안에 전달된 거야. 통장·MMF 이자는 아직 그대로인데 주식·채권 계좌는 이미 반응한 거지. 이 섹션 전체가 그 한 주를 길게 풀어 쓴 이야기야.
      parts:
        - id: part-purchasing-power
          title: "1. 돈의 가치 = 구매력"
          subtitle: "통장 잔고 숫자 ≠ 실제 살 수 있는 양"
          body: |
            **Alice:** 「인플레이션 3%」가 뭔 소리인지 모르겠어. 그냥 뉴스 숫자 아니야?

            **Bob:** 체감으로 말해 줄게. 작년에 1만 원이면 되던 점심이 올해 1만 500원이면, **예금 잔고는 그대로인데 실질 구매력은 33% 줄어든 것**과 같아.

            ---

            *2022년, CPI 발표일*

            **Alice:** 그날 주식·채권이 같이 출렁인 건 왜야?

            **Bob:** 2022년 미국 CPI는 한동안 **예상치를 크게 웃돌며** 나왔어. 시장은 연준이 더 세게 올리겠다고 해석했지. 물가 숫자 하나가 연준 기대를 바꾸고 자산 가격까지 흔든다 — **돈의 가치**가 시장에 닿는 첫 관문이야.

            ---

            **Alice:** 사람들이 「앞으로도 오를 거야」라고 믿기 시작하면 더 심해져?

            **Bob:** 맞아. 그 기대가 임금·임대료·가격 설정에 미리 반영돼. 1970년대처럼 기대인플레이션이 풀리면 연준이 금리를 올려도 이미 오를 예정인 가격을 막기 어렵고, 2020년대 일부 국면처럼 기대가 목표에 **고정(anchored)** 되어 있으면 일시적 충격이 영구화되지 않을 수 있어.

            ---

            **Alice:** 예금 이자 4% 받는데 CPI 5%면 괜찮은 거 아니야?

            **Bob:** **명목 이자** 4%여도 CPI 5%면 **실질 구매력은 여전히 줄어**. **실질금리(명목 − 물가)** 가 마이너스인 동안 통장·예금만 늘리면 조용히 가치가 깎여. 2022년 후반~2023년 초 미국은 금리를 올렸는데 실질금리가 한동안 마이너스에 머문 구간이 있었어.

            **Bob:** **정리하면** — 돈의 가치는 통장 숫자가 아니라 **물가와 기대**가 정해. 수익·이자는 **명목이 아니라 실질**로 계산하고, CPI·PCE 발표일은 금리 기대가 바뀌는 날로 캘린더에 표시해. 실질금리가 마이너스인데 현금·예금만 늘리지 말고, 단기채·MMF처럼 **금리를 따라가는 그릇**을 검토해 봐.
          termIds:
            - inflation
            - expected-inflation
            - disinflation
            - cpi
            - money-supply
            - real-interest-rate
          propositionIds:
            - p4
            - p60
            - p81

        - id: part-banks
          title: "2. 은행의 역할 — 돈은 어디서 생기나"
          subtitle: "현금 인출이 아니라, 대출과 동시에 창출"
          body: |
            **Alice:** 은행은 그냥 내 돈 보관하는 금고 아니야?

            **Bob:** 현대 경제에서 **새 돈의 상당 부분은 은행 대출과 동시에 생겨**. A가 주택담보대출 3억 원을 받으면 A 통장에 **3억 원 예금이 동시에 찍혀** — 금고에서 현금을 꺼내 준 게 아니야. 은행 전체로 보면 **대출과 예금이 함께 늘어나**. 통화량은 중앙은행만이 아니라 **은행의 신용창출**에 크게 의존해.

            ---

            **Alice:** 그럼 저금리 때 대출이 늘면 뭐가 문제야?

            **Bob:** 2000년대처럼 저금리·느슨한 대출이 이어지면 부동산·주식 등 **자산 가격을 부추기는 신용**이 쌓여. 바젤 규제(자기자본비율)는 「은행이 감당할 수 있는 만큼만 빌려라」는 속도 제한장치고, 규제를 맞추기 위해 **증자 대신 대출을 줄이는** 은행도 많았지.

            **Bob:** **정리하면** — 은행은 예금을 보관하는 금고가 아니라 **인가받은 신용창출 기관**이야. 돈의 양은 여기서 출발해.
          termIds:
            - bank
            - deposit
            - loan
            - credit-creation
            - fractional-reserve-banking
            - capital-adequacy-ratio
            - basel-accords
          propositionIds:
            - p109
            - p110
            - p111
            - p112
            - p113
            - p116

        - id: part-fed
          title: "3. 연준의 역할 — 물가와 금리"
          subtitle: "「2% 인플레」 목표와 기준금리"
          body: |
            **Alice:** 연준이 뭐 하는 데야? 왜 CPI 나올 때마다 시장이 난리야?

            **Bob:** 연준(Fed)은 **물가 안정(약 2% 인플레)** 을 최우선 목표 중 하나로 삼아. 물가가 목표를 넘으면 **기준금리(policy rate)를 올려** 차입·투자·소비를 식히려 해 — 전달은 즉각적이지 않아.

            ---

            *2022~2023년, 금리 인상 국면*

            **Bob:** 물가가 높게 나오자 연준은 **공격적으로 기준금리를 인상**했어. 시장은 「금리 ↑ → 미래 현금흐름 할인율 ↑ → 성장주 밸류에이션 ↓」 식으로 주식을 재가격했고, 동시에 **채권 가격은 하락**(금리와 역관계)했지.

            **Alice:** 금리 내리면 무조건 주식에 좋은 거 아니야?

            **Bob:** 「침체 우려 때문에 내리는 금리」는 오히려 주식에 악재일 수 있어 — **배경**이 중요해.

            ---

            **Alice:** 그럼 언제 금리를 내리는데?

            **Bob:** 물가 **상승률**이 꺾여 디스인플레이션이 확인되면 인하 여지를 검토하지만, **기대인플레이션이 여전히 높거나** 고용·자산이 과열되면 물가가 잠잠해도 인하를 미뤄.

            **Bob:** **정리하면** — 연준은 **물가 신호에 반응해 금리**를 움직여. 투자자에게는 「왜 올렸/내렸는가(배경)」가 방향만큼 중요해.
          termIds:
            - federal-reserve
            - central-bank
            - policy-rate
            - interest-rate
            - inflation-targeting
            - government-bond
            - bond-market
          propositionIds:
            - p1
            - p59
            - p58
            - p82

        - id: part-korea-investor
          title: "4. 한국 투자자 — Fed 뉴스가 원·코스피까지"
          subtitle: "미국 CPI → 달러·원 → 수입물가·외국인"
          body: |
            **Alice:** 미국 CPI만 보면 되는 거 아니야? 나 한국 주식만 사는데.

            **Bob:** 미국 Fed·CPI 이야기만으로 끝나면 **국내 포트폴리오**와 연결이 끊겨. 한국 투자자에게는 보통 **세 단계**로 전달돼.

            ---

            **Bob:** **첫째, Fed·미국 CPI.** 서프라이즈 → 연준 긴축 기대 → 글로벌 **금리·할인율** 재가격. 미국 자산부터 움직이고 **달러 강세** 압력이 커져.

            **Bob:** **둘째, 달러·원화.** 미국 **금리↑ + 위험회피** → **강달러·약원**(2022년 원/달러 1,220 → 1,400대). 원화 약세는 **수입 에너지·원자재**의 원화 가격을 올려 **국내 물가**에도 압력을 줘.

            ---

            *2022년 2~3월, 우크라이나 전쟁 직후*

            **Alice:** 그때 기름값도 확 오르지 않았어? 주식만 본 게 아니었네.

            **Bob:** **WTI 원유**가 배럴당 120달러 안팎까지 치솟았어. 한국은 수입 의존도가 높아 **휘발유·LPG** 가격이 바로 올랐고, 이미 약했던 **원화**까지 겹치면서 **국내 물가** 체감이 더 커졌지. **원자재시장** 충격은 주식 차트 밖에서 구매력을 깎는 경로야.

            **Bob:** **셋째, 코스피·외국인.** **위험회피**와 **외국인 자금 이탈**이 겹치면 코스피 급락·원화 동반 약세가 이어져. 「미국만 보면 되지」가 아니라 **환율·외국인 수급·수입물가**까지 한 묶음으로 봐야 해.

            ---

            **Alice:** 그럼 CPI 나온 다음 날 뭘 봐?

            **Bob:** **정리하면** — Fed 뉴스 → **달러/원 → 수입 유가·원자재 → 외국인**까지 이어지면 국내 주식·현금 가치를 같이 해석해. 미국 CPI·FOMC 다음 날 **원/달러·코스피·외국인 순매수**를 함께 보고, 원화 약세·유가 급등 국면에서는 **수입 의존·에너지 비중** 큰 업종과 주유·가스 요금을 체크해. 달러 자산 보유 시 **주가 수익 + 환율**을 분리해 기록해.
          termIds:
            - korean-won
            - exchange-rate
            - strong-dollar
            - inflation
            - stock-market
            - risk-off
            - crude-oil
            - commodity-market
          propositionIds:
