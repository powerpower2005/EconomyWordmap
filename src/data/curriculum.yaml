        - id: part-fed
          title: "3. 연준의 역할 — 물가와 금리"
          subtitle: "「2% 인플레」 목표와 기준금리"
          bodyDialogue: |
            **Alice:** 연준이 뭐 하는 데야? 왜 CPI 나올 때마다 시장이 난리야?

            **Bob:** 연준(Fed)은 **물가 안정(약 2% 인플레)** 을 최우선 목표 중 하나로 삼아. 물가가 목표를 넘으면 **기준금리(policy rate)를 올려** 차입·투자·소비를 식히려 해 — 전달은 즉각적이지 않아.

            ---

            *2022~2023년, 금리 인상 국면*

            **Bob:** 물가가 높게 나오자 연준은 **공격적으로 기준금리를 인상**했어. 시장은 「금리 ↑ → 미래 현금흐름 할인율 ↑ → 성장주 밸류에이션 ↓」 식으로 주식을 재가격했고, 동시에 **채권 가격은 하락**(금리와 역관계)했지.

            **Alice:** 금리 내리면 무조건 주식에 좋은 거 아니야?

            **Bob:** 「침체 우려 때문에 내리는 금리」는 오히려 주식에 악재일 수 있어 — **배경**이 중요해.

            ---

            **Alice:** 그럼 언제 금리를 내리는데?

            **Bob:** 물가 **상승률**이 꺾여 디스인플레이션이 확인되면 인하 여지를 검토하지만, **기대인플레이션이 여전히 높거나** 고용·자산이 과열되면 물가가 잠잠해도 인하를 미뤄.

            **Alice:** 그럼 연준 볼 때 뭐가 제일 중요해?

            **Bob:** **물가 신호에 반응해 금리**를 움직여. 「왜 올렸/내렸는가(배경)」가 방향만큼 중요해.
          bodyProse: |
            연준(Fed)은 **물가 안정(약 2% 인플레)** 을 최우선 목표 중 하나로 삼는다. 물가가 목표를 넘으면 **기준금리(policy rate)를 올려** 차입·투자·소비를 식히려 한다 — 전달은 즉각적이지 않다.

            2022~2023년 물가가 높게 나오자 연준은 **공격적으로 기준금리를 인상**했다. 시장은 「금리 ↑ → 미래 현금흐름 할인율 ↑ → 성장주 밸류에이션 ↓」 식으로 주식을 재가격했고, 동시에 **채권 가격은 하락**(금리와 역관계)했다. 「침체 우려 때문에 내리는 금리」는 오히려 주식에 악재일 수 있다 — **배경**이 중요하다.

            물가 **상승률**이 꺾여 디스인플레이션이 확인되면 인하 여지를 검토하지만, **기대인플레이션이 여전히 높거나** 고용·자산이 과열되면 물가가 잠잠해도 인하를 미룬다.

            **정리:** 연준은 **물가 신호에 반응해 금리**를 움직인다. 투자자에게는 「왜 올렸/내렸는가(배경)」가 방향만큼 중요하다.
          termIds:
