    - id: sec-valuation
      order: 3
      title: "주식을 사면 뭘 사는 건가"
      subtitle: "이익 · 밸류 · 시장 국면"
      learnerQuestion: "What am I actually buying when I buy a stock?"
      bodyDialogue: |
        **Alice:** 주식 사면 그냥 「회사 조각」 맞지?

        **Bob:** 맞아. 본질은 **미래 현금흐름(기업 이익)** 에 대한 권리야. 주가는 그 이익을 **PER·PBR·DCF** 같은 **밸류에이션**으로 할인해 매긴 숫자고, **금리**가 할인율이라 민감해.

        ---

        **Alice:** 그럼 이익만 좋으면 무조건 오르는 거야?

        **Bob:** 아니. 같은 이익이라도 **금리↑·VIX↑**면 멀티플이 눌릴 수 있어. **강세장**·**리스크온**과 **약세장**·**리스크오프**는 같은 EPS라도 주가 반응이 달라.

        **Alice:** 그래서 뭘 보면 돼?

        **Bob:** **EPS·이익 전망**, **PER/PBR**, **금리**, **VIX·변동성**을 세트로. CPI만큼 금리·밸류 뉴스도 캘린더에 넣어.
      bodyProse: |
        주식의 본질은 **미래 현금흐름(기업 이익)** 에 대한 권리다. **EPS**는 이익을 주당으로 나눈 값이고, **PER·PBR·DCF**는 이익·자산·현금흐름을 **밸류에이션**하는 도구다. **금리**는 할인율이라 멀티플에 직접 닿는다.

        같은 **이익**이라도 **금리 상승·변동성(VIX) 확대**면 PER이 눌릴 수 있다. **강세장**·**약세장**, **리스크온**·**리스크오프**는 시장 **국면**이고, **매파**·**비둘기파** 발언은 금리 기대를 바꾼다.

        아래 세 파트는 한 줄기 — 이익·EPS → 멀티플·금리 → 시장 국면·습관.
      parts:
        - id: part-earnings-eps
          title: "1. 이익과 EPS"
          subtitle: "주식의 분자"
          bodyDialogue: |
            **Alice:** EPS가 뭐야?

            **Bob:** **기업 이익**을 발행주식 수로 나눈 값이 **EPS**야. 주가 ÷ EPS = **PER**. 이익이 늘면 PER을 그대로 둬도 주가는 오를 수 있어.

            ---

            **Alice:** 자사주 매입이 EPS에 영향 줘?

            **Bob:** 주식 수가 줄면 이익이 같아도 EPS는 올라. 다만 **순 발행**·감가·일회성 항목까지 같이 봐야 해.

            **Alice:** 그래서?

            **Bob:** 헤드라인 **이익**·**EPS** 성장률과 가이던스를 먼저 보고, PER은 그다음.
          bodyProse: |
            **기업 이익**은 주식 투자의 현금흐름 근원이다. **EPS**는 이익을 주식 수로 나눈 값이며 **PER**의 분모다. **자사주 매입**은 주식 수를 줄여 EPS를 기계적으로 높일 수 있다.

            **정리:** 이익·EPS·발행/매입을 먼저 보고, 멀티플은 그다음.
          termIds:
            - earnings
            - eps
            - per
            - share-buyback
            - net-equity-issuance
            - stock-market
          propositionIds:
            - p102
            - p176
            - p194

        - id: part-multiples-rates
          title: "2. PER · PBR · 금리"
          subtitle: "할인율이 멀티플을 누른다"
          bodyDialogue: |
            **Alice:** PER 30배면 비싼 거야?

            **Bob:** **금리**·성장률·리스크 프리미엄에 따라 달라. **금리↑**면 미래 이익 할인율이 올라 **밸류에이션**이 눌려 — 2022년 성장주 조정처럼.

            ---

            **Alice:** PBR은?

            **Bob:** **PBR**은 장부가치 대비 주가. PER은 **이익**, PBR은 **자산** 기준이야. **DCF**는 이익·성장·**금리**를 한 번에 넣는 모형 — 금리 인하는 **r↓·CF↑·g↑** 경로로 주가에 닿을 수 있어.

            **Alice:** 그래서?

            **Bob:** CPI·연준뿐 아니라 **장기금리**·**손익분기 인플레이션**·**TIPS**도 밸류 캘린더에 넣어.
          bodyProse: |
            **PER·PBR**은 **밸류에이션** 멀티플이고 **DCF**는 현금흐름 할인 모형이다. **금리**·**장기금리** 상승은 할인율↑ → 멀티플↓ 경로로 작용한다. 금리 인하는 **r↓**가 직접이고 **CF·g** 기대 개선이 수반될 때 더 강하다. **손익분기 인플레이션**·**TIPS**는 시장이 내재한 물가 기대를 본다.

            **정리:** 이익만이 아니라 **금리·밸류**를 같은 차트에 둔다.
          termIds:
            - valuation
            - per
            - pbr
            - dcf
            - interest-rate
            - long-term-interest-rate
            - long-term-bond
            - breakeven-inflation
            - tips
            - risk-premium
          propositionIds:
            - p12
            - p107
            - p136
            - p164
            - p172
            - p196

        - id: part-market-regime
          title: "3. 강세장 · VIX · 리스크온"
          subtitle: "같은 EPS, 다른 국면"
          bodyDialogue: |
            **Alice:** 뉴스에 「강세장」「리스크온」이 뭐야?

            **Bob:** **강세장**은 주가가 장기 상승 추세, **약세장**은 하락 추세. **리스크온**은 위험자산 선호, **리스크오프**는 현금·채권 쪽으로 도망.

            ---

            **Alice:** VIX는?

            **Bob:** **VIX**는 **변동성**·공포 지수. VIX 급등일엔 레버리지 청산이 겹치면 **주식시장**이 급락할 수 있어.

            ---

            **Alice:** 연착륙·경착륙은?

            **Bob:** **연착륙**은 긴축 뒤 인플레만 잡고 실업은 버티는 시나리오, **경착륙**은 침체로 가는 시나리오. **매파**·**비둘기파** 발언이 어느 쪽에 가까운지 보면 금리·주가 해석이 달라져.

            **Alice:** 그래서?

            **Bob:** EPS·PER과 함께 **VIX**, **리스크온/오프**, **강세/약세** 국면을 기록해. 국면이 바뀌면 같은 좋은 이익 뉴스도 다르게 읽혀.
          bodyProse: |
            **강세장**·**약세장**, **리스크온**·**리스크오프**는 시장 **국면**이다. **VIX**·**변동성**은 포지션·공포를 반영한다. **연착륙**·**경착륙**, **매파**·**비둘기파**는 금리·경기 시나리오와 정책 **기조**를 구분하는 언어다.

            **정리:** 이익·밸류와 **국면·변동성**을 같은 노트에 적는다.
          termIds:
