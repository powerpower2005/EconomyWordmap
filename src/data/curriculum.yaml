    - id: sec-fiscal-trade
      order: 6
      title: "재정·무역이 내 포트폴리오를 흔들 때"
      subtitle: "무역적자 · 관세 · 리쇼어링 · 제조업"
      learnerQuestion: "What else can swamp my thesis beyond rates and inflation?"
      bodyDialogue: |
        **Alice:** 뉴스에 「무역적자 줄인다」「제조업 일자리 늘린다」가 나오면 달러랑 수출주만 보면 되는 거 아니야?

        **Bob:** 방향만 보면 위험해. **무역적자**는 수입이 수출보다 많다는 뜻이고, 미국처럼 **재정적자**와 **저축 부족**이 겹치면 **쌍둥이 적자**로 금리·**강달러**·적자가 한꺼번에 이어질 수 있어.

        ---

        **Alice:** 그럼 관세 올리면 적자 줄고 공장 일자리 늘지 않아?

        **Bob:** 의도는 그렇지. 그런데 **관세**·**무역전쟁**이 불안을 키우면 돈이 달러로 몰려 **강달러**가 되고, 오히려 적자가 커지는 역설도 있었어. **리쇼어링**도 설비는 늘어도 **자동화** 때문에 고용은 제한적일 수 있고.

        **Alice:** 그래서 뭘 보면 돼?

        **Bob:** 정책 레토릭과 실제 결과를 분리해. 무역수지·달러·제조업 고용·설비투자를 같이 보고, 「일자리↑ = 적자↓」처럼 단순 연결하지 마.
      bodyProse: |
        금리·물가 다음으로 포트폴리오를 흔드는 축이 **재정**과 **무역**이다. **무역적자**는 한 나라가 세계보다 더 많이 사는 상태이고, **재정적자**와 **저축** 부족이 겹치면 **쌍둥이 적자** 경로로 금리·달러·적자가 연쇄될 수 있다.

        **관세**·**보호무역**·**리쇼어링**은 적자 축소·제조업 회복을 노리지만, **강달러**·생산성·수입 구조 때문에 의도와 다른 결과가 나올 수 있다. 제조업은 산출은 늘어도 **고용**은 줄 수 있고, 설비투자 규모만큼 **무역적자**가 줄지도 않는다.

        아래 여섯 파트는 한 줄기다 — 적자 구조 → 관세·달러 역설 → 리쇼어링 한계 → 에너지·제조 → 방산·수혜 체크 → 투자자 습관.
      parts:
        - id: part-twin-deficit
          title: "1. 무역적자와 쌍둥이 적자"
          subtitle: "저축 · 재정 · 달러"
          bodyDialogue: |
            **Alice:** 무역적자가 크다는 건 나쁜 거야?

            **Bob:** 항상 그렇진 않아. 뉴스 **무역수지**와 **국제수지표**의 **경상수지**·**상품수지**는 FOB/CIF·서비스·본원소득까지 포함 범위가 달라. 다만 미국처럼 **가계 저축**이 부족하고 **통합재정수지** 적자·**국가부채**가 겹치면 **금리**·**강달러**·무역적자가 한꺼번에 이어지는 **쌍둥이 적자** 그림이 자주 나와.

            ---

            **Alice:** 경상수지 흑자면 돈이 국내에만 쌓이는 거지?

            **Bob:** 아니. **경상수지** 흑자 뒤엔 **금융계정**으로 해외투자·순자본 유출이 따라붙는 경우가 많아 — **국제수지표** 항등식이야.

            ---

            **Alice:** 그럼 흑자만 오래 가면 **순대외금융자산**도 바로 늘어?

            **Bob:** 꼭 그렇진 않아. **국제투자대조표**는 주가·환율 **평가**까지 반영해서, 경상 흑자인데도 외국인 주식 평가가 커지면 **순대외금융자산**이 한동안 마이너스일 수 있어.

            ---

            **Alice:** 그럼 정부가 지출만 줄이면 돼?

            **Bob:** 이론상 **저축**을 늘리는 **긴축**이 도움이 될 수 있어. 다만 정치적으로 어렵고, 달러가 **기축통화**면 다른 나라 수요가 구조를 바꿔 놓기도 하지.

            **Alice:** 투자할 때는?

            **Bob:** 감세·부양 뉴스와 무역·경상 수지를 한 묶음으로 봐. 재정이 풀리는데 적자만 줄겠다고 하면 환율·금리 경로부터 의심해.
          bodyProse: |
            **무역적자**(통관 무역수지)와 **경상수지**·**상품수지**는 범위·평가가 달라 헤드라인만으로 대외 균형을 단정하면 안 된다. **국제수지표**는 **경상수지**·**금융계정** 등으로 대외거래 유량을 기록하며, **국제투자대조표**의 **순대외금융자산**은 저량 잔액이라 경상 흑자와 단기 괴리가 날 수 있다.

            **통합재정수지** 적자와 **저축** 부족이 겹치면 **금리**·**강달러**·무역적자가 동반되는 **쌍둥이 적자** 논의가 나온다.

            **정리:** 무역수지·경상수지·순IIP·재정·저축·달러를 한 줄기로 추적하고, 흑자=즉시 순자산 개선은 IIP 평가 앞에서 의심한다.
          termIds:
            - trade-deficit
            - twin-deficit
