    - id: sec-fiscal-trade
      order: 3
      title: "재정·무역이 내 포트폴리오를 흔들 때"
      subtitle: "무역적자 · 관세 · 리쇼어링 · 제조업"
      learnerQuestion: "What else can swamp my thesis beyond rates and inflation?"
      bodyDialogue: |
        **Alice:** 뉴스에 「무역적자 줄인다」「제조업 일자리 늘린다」가 나오면 달러랑 수출주만 보면 되는 거 아니야?

        **Bob:** 방향만 보면 위험해. **무역적자**는 수입이 수출보다 많다는 뜻이고, 미국처럼 **재정적자**와 **저축 부족**이 겹치면 **쌍둥이 적자**로 금리·**강달러**·적자가 한꺼번에 이어질 수 있어.

        ---

        **Alice:** 그럼 관세 올리면 적자 줄고 공장 일자리 늘지 않아?

        **Bob:** 의도는 그렇지. 그런데 **관세**·**무역전쟁**이 불안을 키우면 돈이 달러로 몰려 **강달러**가 되고, 오히려 적자가 커지는 역설도 있었어. **리쇼어링**도 설비는 늘어도 **자동화** 때문에 고용은 제한적일 수 있고.

        **Alice:** 그래서 뭘 보면 돼?

        **Bob:** 정책 레토릭과 실제 결과를 분리해. 무역수지·달러·제조업 고용·설비투자를 같이 보고, 「일자리↑ = 적자↓」처럼 단순 연결하지 마.
      bodyProse: |
        금리·물가 다음으로 포트폴리오를 흔드는 축이 **재정**과 **무역**이다. **무역적자**는 한 나라가 세계보다 더 많이 사는 상태이고, **재정적자**와 **저축** 부족이 겹치면 **쌍둥이 적자** 경로로 금리·달러·적자가 연쇄될 수 있다.

        **관세**·**보호무역**·**리쇼어링**은 적자 축소·제조업 회복을 노리지만, **강달러**·생산성·수입 구조 때문에 의도와 다른 결과가 나올 수 있다. 제조업은 산출은 늘어도 **고용**은 줄 수 있고, 설비투자 규모만큼 **무역적자**가 줄지도 않는다.

        아래 여섯 파트는 한 줄기다 — 적자 구조 → 관세·달러 역설 → 리쇼어링 한계 → 에너지·제조 → 방산·수혜 체크 → 투자자 습관.
      parts:
        - id: part-twin-deficit
          title: "1. 무역적자와 쌍둥이 적자"
          subtitle: "저축 · 재정 · 달러"
          bodyDialogue: |
            **Alice:** 무역적자가 크다는 건 나쁜 거야?

            **Bob:** 항상 그렇진 않아. 다만 미국처럼 **가계 저축**이 부족하고 **재정**도 적자면 국내 자본이 모자라 **금리**·**달러**가 강해지고 **무역적자**도 함께 커지는 **쌍둥이 적자** 그림이 자주 나와.

            ---

            **Alice:** 그럼 정부가 지출만 줄이면 돼?

            **Bob:** 이론상 **저축**을 늘리는 **긴축**이 도움이 될 수 있어. 다만 정치적으로 어렵고, 달러가 **기축통화**면 다른 나라 수요가 구조를 바꿔 놓기도 하지.

            **Alice:** 투자할 때는?

            **Bob:** 감세·부양 뉴스와 무역적자를 한 묶음으로 봐. 재정이 풀리는데 적자만 줄겠다고 하면 환율·금리 경로부터 의심해.
          bodyProse: |
            **무역적자**는 수입이 수출을 초과하는 상태다. **재정적자**와 **저축** 부족이 겹치면 국내 투자 재원이 부족해져 **금리**·**강달러**·무역적자가 동반되는 **쌍둥이 적자** 논의가 나온다.

            지출을 줄여 **저축**을 늘리는 긴축이 무역·재정 균형에 도움이 될 수 있으나, 실행은 어렵고 기축통화 수요가 경로를 바꿀 수 있다.

            **정리:** 감세·부양과 무역적자를 분리해 보지 말고, 재정·저축·달러를 한 줄기로 추적한다.
          termIds:
            - trade-deficit
            - twin-deficit
            - fiscal-policy
            - savings
            - national-debt
            - interest-rate
            - strong-dollar
            - weak-dollar
            - exchange-rate
          propositionIds:
            - p141
            - p144

        - id: part-tariffs-dollar
          title: "2. 관세·보호무역과 달러 역설"
          subtitle: "의도와 다른 무역수지"
          bodyDialogue: |
            **Alice:** 관세 올리면 수입 줄고 적자 줄지 않아?

            **Bob:** 단기엔 수입이 줄 수 있어. 그런데 **무역전쟁**이 **지정학** 불안을 키우면 위험회피 자금이 달러로 몰려 **강달러**가 되고, 수출 경쟁력이 떨어져 적자가 커질 수도 있어.

            ---

            *2018~2020년, 미중 관세*

            **Bob:** 관세를 씌웠는데 대중 **무역적자**가 오히려 확대된 구간이 있었지. **감세**와 **관세**를 동시에 쓰며 **재정적자**를 키우면 금리·달러 압력도 겹쳐.

            **Alice:** 그럼 보호무역 뉴스에 수출주만 사면 안 되겠네?

            **Bob:** 맞아. 관세 발표일엔 환율·금리 반응부터 보고, 「적자 줄인다」는 말과 수치가 맞는지 확인해.
          bodyProse: |
            **관세**·**보호무역**은 수입을 줄여 **무역적자**를 축소하려는 정책이지만, **무역전쟁**이 안전자산 수요를 키우면 **강달러**가 되어 역효과가 날 수 있다.

            **감세**와 관세를 함께 쓰며 **재정적자**를 키우면 금리·달러 경로가 무역 목표와 충돌할 수 있다. 2018~2020년 미중 관세전쟁 중 대중 무역적자 확대가 대표적 사례다.

            **정리:** 관세 뉴스는 수출주만이 아니라 달러·금리·무역수지 통계를 함께 본다.
          termIds:
            - tariff
            - protectionism
            - trade-war
            - neo-mercantilism
            - tax-cut
            - geopolitical-risk
            - risk-off
          propositionIds:
            - p142
            - p143

        - id: part-reshoring-limits
          title: "3. 리쇼어링과 제조업의 함정"
          subtitle: "설비투자 ≠ 대량 고용"
          bodyDialogue: |
            **Alice:** 공장을 미국으로 돌리면 일자리 많이 생기지 않아?

            **Bob:** 일부는. 그런데 **리쇼어링**에 돈을 쏟으면 다른 **고부가가치** 일자리 기회가 줄 수 있어(**구축효과**). 게다가 **설비투자**가 늘면 **자본집약**이 커져 같은 공장도 사람은 적게 써.

            ---

            **Alice:** 무역흑자 나는 나라가 우리 일자리 뺏은 거 아니야?

            **Bob:** 흑자국·적자국 **둘 다** 제조업 고용 비중이 줄어드는 시기가 있었어. **오프쇼어링**만의 문제가 아니라 **생산성**·**자동화** 공통 추세에 가깝지.

            **Alice:** 철강 같은 전통 공장은 사람 더 쓰지 않아?

            **Bob:** 철강은 **자동화**가 이미 높아. **경제안보** 명분으로 돌려도 고용은 제한적일 수 있어.
          bodyProse: |
            **리쇼어링**은 생산을 본국으로 끌어들이지만, 한정된 자원을 쓰면 다른 일자리·투자 기회가 줄어드는 **구축효과**가 생길 수 있다.

            **설비투자**가 늘면 **제조업** 생산능력은 커지나 **자본축적**·**기술 진보**로 고용 창출은 제한적일 수 있다. 무역흑자국과 적자국이 동시에 제조업 고용을 잃었다면, 일자리 감소를 한 국가의 탈취만으로 설명하기 어렵다.

            **정리:** 리쇼어링·공장 건설 뉴스는 고용 수치·무역수지·생산성을 같이 확인한다.
          termIds:
            - reshoring
            - offshoring
            - manufacturing
            - industrial-policy
            - economic-security
            - capital-expenditure
            - capital-accumulation
            - technological-progress
            - crowding-out-effect
            - unemployment
          propositionIds:
            - p145
            - p146
            - p165
            - p166
            - p167

        - id: part-energy-manufacturing
          title: "4. 에너지와 제조업"
          subtitle: "원유 · 가스 · 원자력"
          bodyDialogue: |
            **Alice:** 트럼프 당선이면 화석주만 사면 되는 거야?

            **Bob:** 그렇게 단순하지 않아. **원유**·**천연가스**는 **제조업** 원가와 **인플레**에 닿고, 미국은 에너지 **순수출**국이기도 해. 레토릭과 실제 생산은 어긋날 수 있지.

            ---

            **Alice:** 신재생은 끝난 거야?

            **Bob:** 간헐성·**공급망** 의존 한계가 드러나면 **원자력**·가스 같은 기저 전력 논의가 강해져. **AI 설비투자**가 전력 수요를 키우는 것도 변수야.

            **Alice:** 바이든 IRA는?

            **Bob:** **산업정책**이 특정 주에 묶이면 정권이 바뀌어도 철회가 어려워. **설비투자**는 이미 늘었을 수 있어.
          bodyProse: |
            에너지 정책은 「친화석 vs 친환경」 이진법만으로 읽기 어렵다. **원유**·**천연가스**는 **제조업** 에너지·운송 원가와 **무역흑자**·인플레이션 완충에 연결되고, **원자력**은 데이터센터 전력·규제 완화 논의와 맞닿는다.

            **산업정책**·IRA가 **설비투자**를 끌어올린 뒤에는 정치적으로 되돌리기 어려울 수 있다. **정리:** 에너지 섹터는 정권 라벨보다 생산·수출·제조업 원가·전력 수요를 함께 본다.
          termIds:
            - crude-oil
            - natural-gas
            - nuclear-power
            - manufacturing
            - trade-surplus
            - industrial-policy
            - capital-expenditure
            - ai-capex
            - inflation
            - supply-chain
          propositionIds:
            - p168

        - id: part-defense-beneficiary
          title: "5. 방산·수혜주 체크"
          subtitle: "고용 ≠ 이익"
          bodyDialogue: |
            **Alice:** 정책 수혜주면 무조건 오르지?

            **Bob:** **고용** 숫자만 보면 위험해. **리쇼어링**·관세 **수혜**여도 **생산성**·마진이 안 따라오면 이익은 안 늘 수 있어.

            ---

            **Alice:** 방산은?

            **Bob:** **국방 지출**·**경제안보**는 국내 **제조**·조달 중심이라 보호무역과 결이 맞아. **니어쇼어링**도 **관세** 불확실성에 취약할 수 있지.

            **Alice:** 그래서?

            **Bob:** 「수혜」라는 말과 **설비투자**·이익·생산성 숫자를 분리해서 봐.
          bodyProse: |
            정치·Agenda 수혜 논리는 **고용 창출**을 강조하지만, **생산성**·이익으로 이어지지 않을 수 있다. **리쇼어링**이 R&D 역량을 희생하게 만들면 장기 수혜가 아닐 수 있다.

            **국방 지출**은 **제조업**·**경제안보**와 연결되나 재정·인플레 변수도 있다. **니어쇼어링**은 **관세** 확대 시 투자가 지연될 수 있다.

            **정리:** 수혜주는 레토릭·고용이 아니라 생산성·마진·실제 **설비투자**를 확인한다.
          termIds:
            - defense-spending
            - economic-security
            - manufacturing
            - reshoring
            - nearshoring
            - tariff
            - technological-progress
            - iron-ore
          propositionIds:
            - p167
            - p146

        - id: part-investor-habits
          title: "6. 투자자 습관"
          subtitle: "레토릭과 결과 분리"
          bodyDialogue: |
            **Alice:** 정치인이 「제조업 부활」이라고 하면 뭘 사야 해?

            **Bob:** 막 사지 마. **제조업** ETF·수출주만 보지 말고, 같은 기간 **무역적자**·달러·**금리**가 어떻게 움직였는지부터 대조해.

            ---

            **Alice:** 자유무역이 무조건 이득은 아닌 거지?

            **Bob:** 국가 전체 후생과 **분배**는 다를 수 있어. **비교우위**만으로 산업 사다리를 고정할 수 없다는 비판도 있고, **경제안보** 때문에 선택적 **보호무역** 논의가 돌아오지.

            **Alice:** 그래서 내가 뭘 바꿔야 해?

            **Bob:** 무역·재정 헤드라인은 「누가 이기나」가 아니라 **달러·금리·적자·고용** 네 축으로 읽어. 정책이 강해질수록 역설도 커질 수 있으니, 단순 테마주보다 거시 전달 경로를 먼저 본다.
          bodyProse: |
            「제조업 부활」「적자 축소」 레토릭은 **제조업** 고용·**무역적자**·달러·**금리** 숫자와 대조해야 한다. 과거에 고용은 늘었는데 적자도 커진 사례가 있다.

            **비교우위** 기반 자유무역과 **분배**·**경제안보**·**보호무역** 긴장을 같이 본다. 정책 강도가 올라갈수록 환율·금리 역설도 커질 수 있다.

            **정리:** 무역·재정 테마는 종목 이름보다 달러·금리·적자·고용 전달 경로를 먼저 추적한다.
          termIds:
            - comparative-advantage
            - free-trade
            - manufacturing
            - trade-deficit
            - strong-dollar
            - populism
          propositionIds:
