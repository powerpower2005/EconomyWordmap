            - p110
            - p111
            - p113
            - p118

        - id: part-m2-multiplier
          title: "2. M2와 통화승수의 현실"
          subtitle: "교과서 M≈C/r vs QE·0% 준비율"
          bodyDialogue: |
            **Alice:** 한국은행·연준이 찍은 돈은 M2로 어떻게 이어져?

            **Bob:** **본원통화**(현금+지급준비금)가 은행을 거치며 **통화승수** 연쇄로 **M2**(광의통화)가 커진다 — 교과서식으로 M≈C/r. 다만 **대출수요·규제·QE** 때 **지급준비금 적체**면 「같은 배수만큼」은 아닐 때가 많아.

            ---

            *2008년 이후*

            **Bob:** QE로 **본원통화·지준금**은 급증했는데 **M2** 증가율은 더 완만했어. 은행이 전부 대출로 풀지 않고 **지준금에 쌓아두면** 승수가 낮아지지. 미국은 2020년 **지급준비율 0%** 이후에도 **대출수요·자본규제**가 신용창출을 좌우해.

            ---

            **Alice:** M2가 늘었는데 물가는 안 오를 때도 있잖아.

            **Bob:** **화폐유통속도**가 떨어지면 같은 M2도 거래에 덜 쓰여 — 「통화↑=물가↑」 직관이 약해지는 국면이야. **유동성 함정**과 겹치면 더 그렇고.

            **Alice:** 그럼 M2만 보면 돼?

            **Bob:** M2 **증가율·본원통화 대비 괴리**·**속도**를 같이 봐. 기계적 승수만 믿지 마.
          bodyProse: |
            **본원통화**가 **통화승수** 연쇄를 거쳐 **M2**로 확대된다 — 교과서식 M≈C/r. QE·**지급준비금 적체**·약한 대출수요가 겹치면 같은 본원통화도 M2로 **기계적으로** 이어지지 않을 수 있다.

            2008년 이후 QE로 본원통화·지준금은 급증했으나 M2 증가율은 더 완만했다. **지급준비율 0%** 이후에도 **대출수요·자본규제**가 신용창출을 좌우한다.

            **화폐유통속도** 하락 시 같은 M2도 거래에 덜 쓰인다 — 「통화↑=물가↑」 직관이 약해질 수 있다.

            **정리:** M2 **증가율**·본원통화 대비 **괴리**·**유통속도**를 세트로 본다.
          termIds:
            - base-money
            - m1
            - m2
            - money-supply
            - money-multiplier
            - reserves
            - velocity-of-money
            - liquidity-trap
          propositionIds:
            - p157
            - p158
            - p116
            - p80
            - p115

        - id: part-credit-expansion
          title: "3. 신용 팽창기"
          subtitle: "금융가속 · 자산 · 레버리지"
          bodyDialogue: |
            **Alice:** 저금리·대출 늘면 뭐가 좋아?

            **Bob:** **신용 창조**가 지출·**투자(I)** 를 키우고 GDP를 끌어올려 — **금융 가속기**가 실물을 밀어 올리는 구간이야. 2000년대 **저금리**·느슨한 대출이 **부동산·주식** 가격을 부추겼지.

            ---

            **Alice:** 그럼 계속 빌리면 되는 거야?

            **Bob:** **신용이 늘면 성장**하지만 **과도한 신용**은 **버블**과 **위기**를 키워. 담보 가격↑ → 더 빌릴 수 있음 → 담보↑… **금융 가속기**가 **역방향**으로 돌기 전까지는 달콤해.

            ---

            **Charlie:** 은행 밖 **그림자금융**도 같은 기능을 할 때가 있어 — 규제 밖에서 **신용**이 늘면 M2 통계만으로는 다 안 보일 수 있지.

            **Alice:** 언제 위험해져?

            **Bob:** **가산금리·신용 스프레드**가 벌어지고 **수익률 곡선**이 역전되기 시작하면 late-cycle 신호로 본다 — 달력이 아니라 **신호**를 봐.
          bodyProse: |
            **신용 창조**가 **투자(I)** ·지출을 키우면 **금융 가속기**가 실물 GDP를 끌어올린다. 2000년대 저금리·느슨한 대출은 **부동산·주식** **자산 버블**을 부추겼다.

            **신용↑→성장**이지만 **과도한 신용**은 **버블·위기**를 키운다. **그림자금융**은 규제 밖 신용창출 경로다.

            **가산금리·스프레드** 확대·**수익률 곡선 역전**은 late-cycle **신호**다 — 확장 「나이」만으로 침체를 단정하지 않는다.

            **정리:** 팽창기엔 **누가** 레버리지를 쌓는지(가계·기업·금융)를 추적한다.
          termIds:
