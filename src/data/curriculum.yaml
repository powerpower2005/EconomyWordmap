        - id: part-consumption-income
          title: "4. 소비와 소득"
          subtitle: "소매 · 심리 · DPI · 저축 · PCE"
          bodyDialogue: |
            **Alice:** 선진국에선 산업생산보다 소비가 더 중요하다며?

            **Bob:** 수요 축이 가계 소비거든. 다만 **소매판매**는 재화 중심이라 **서비스**가 빠져 — COVID 때 그 구멍이 컸어. 차·기름 빼는 **ex-Autos**도 같이 봐.

            ---

            **Alice:** 심리지수는?

            **Bob:** 미시간 등 **소비자신뢰**는 향후 지출과 상관이 있지만, 위기 뒤엔 심리만 좋아도 저축이 늘며 지출이 안 따라올 수 있어.

            ---

            **Alice:** 소득·저축·PCE는?

            **Bob:** **개인소득·실질 가처분소득**이 소비 여력. 소득−지출=저축. 위기 때 저축이 급등하거나, 저축이 급락·이자지출이 급등하면 악재 신호야. **PCE**라고 불리는 건 연준이 보는 **물가**고, 지출 금액이랑 헷갈리면 안 돼.
          bodyProse: |
            소비는 실물 **수요**, 소매판매는 그 중 **재화** 속보다. 서비스 누락·자동차·에너지 비중을 통제해야 한다. 소비자신뢰는 선행 신호이나 예비적 저축이 있으면 탄력성이 약해진다. 개인소득·DPI·저축과 짝으로 읽고, Wordmap의 `pce`는 **물가지수**다.

            **정리:** 소매·심리·소득·저축을 세트로 보고 구성 편향을 보정한다.
          termIds:
            - retail-sales
            - consumption
            - consumer-confidence
            - personal-income
            - disposable-income
            - savings
            - pce
            - core-pce
            - inflation
          propositionIds:
            - p233
            - p248
            - p84

        - id: part-production-inventory
          title: "5. 생산 · 가동 · 재고 · PMI"
          subtitle: "공급 측과 설문"
          bodyDialogue: |
            **Alice:** 산업생산이랑 PMI 뭐가 달라?

            **Bob:** **산업생산(IP)** 은 연준이 내는 **공식 생산량**, **PMI**는 구매관리자 **설문**(50 중립). 둘 다 제조·실물이지만 성격이 달라. PMI가 먼저 분위기를 잡고 IP가 확인하는 식이 많아.

            ---

            **Alice:** 설비가동률 82%?

            **Bob:** 그 전후를 넘기면 **물가 압력** 이야기로 자주 읽어. 산업별로 **과거 평균 대비** 고가동이면 그 쪽 **CapEx** 힌트도 돼. 해외 생산 이전으로 의미가 약해졌다가, 리쇼어링으로 다시 보는 시각도 있어.

            ---

            **Alice:** 재고는?

            **Bob:** 재고가 쌓이는데 판매가 안 따라오면 나중에 생산·고용 조정이 올 수 있어. 호황 때 재고↑만 보고 좋아하면 안 돼 — 판매·생산이랑 같이 봐.
          bodyProse: |
            IP·설비가동률은 공식 실물, PMI/ISM은 속보 설문이다. CU **82% 전후**·산업별 과거 대비 고가동은 물가·CapEx 신호로 쓰되 조건부가 많다. 재고투자는 국면에 따라 사이클을 증폭한다.

            **정리:** PMI·IP·CU·재고를 한 세트로 보고 50선·82% 휴리스틱의 한계를 기억한다.
          termIds:
            - industrial-production
            - capacity-utilization
            - purchasing-managers-index
            - inventory-investment
            - manufacturing
            - capital-expenditure
            - gdp
            - inflation
          propositionIds:
