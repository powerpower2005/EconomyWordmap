    - id: sec-fiscal-trade
      order: 5
      title: "재정·무역이 내 포트폴리오를 흔들 때"
      subtitle: "무역적자 · 관세 · 리쇼어링 · 제조업"
      learnerQuestion: "What else can swamp my thesis beyond rates and inflation?"
      bodyDialogue: |
        **Alice:** 뉴스에 「무역적자 줄인다」「제조업 일자리 늘린다」가 나오면 달러랑 수출주만 보면 되는 거 아니야?

        **Bob:** 방향만 보면 위험해. **무역적자**는 수입이 수출보다 많다는 뜻이고, 미국처럼 **재정적자**와 **저축 부족**이 겹치면 **쌍둥이 적자**로 금리·**강달러**·적자가 한꺼번에 이어질 수 있어.

        ---

        **Alice:** 그럼 관세 올리면 적자 줄고 공장 일자리 늘지 않아?

        **Bob:** 의도는 그렇지. 그런데 **관세**·**무역전쟁**이 불안을 키우면 돈이 달러로 몰려 **강달러**가 되고, 오히려 적자가 커지는 역설도 있었어. **리쇼어링**도 설비는 늘어도 **자동화** 때문에 고용은 제한적일 수 있고.

        **Alice:** 그래서 뭘 보면 돼?

        **Bob:** 정책 레토릭과 실제 결과를 분리해. 무역수지·달러·제조업 고용·설비투자를 같이 보고, 「일자리↑ = 적자↓」처럼 단순 연결하지 마.
      bodyProse: |
        금리·물가 다음으로 포트폴리오를 흔드는 축이 **재정**과 **무역**이다. **무역적자**는 한 나라가 세계보다 더 많이 사는 상태이고, **재정적자**와 **저축** 부족이 겹치면 **쌍둥이 적자** 경로로 금리·달러·적자가 연쇄될 수 있다.

        **관세**·**보호무역**·**리쇼어링**은 적자 축소·제조업 회복을 노리지만, **강달러**·생산성·수입 구조 때문에 의도와 다른 결과가 나올 수 있다. 제조업은 산출은 늘어도 **고용**은 줄 수 있고, 설비투자 규모만큼 **무역적자**가 줄지도 않는다.

        아래 여섯 파트는 한 줄기다 — 적자 구조 → 관세·달러 역설 → 리쇼어링 한계 → 에너지·제조 → 방산·수혜 체크 → 투자자 습관.
      parts:
        - id: part-twin-deficit
          title: "1. 무역적자와 쌍둥이 적자"
          subtitle: "저축 · 재정 · 달러"
          bodyDialogue: |
            **Alice:** 무역적자가 크다는 건 나쁜 거야?

            **Bob:** 항상 그렇진 않아. 다만 미국처럼 **가계 저축**이 부족하고 **재정정책**·**국가부채** 적자가 겹치면 국내 자본이 모자라 **금리**·**강달러**·**약달러**·**무역적자**가 한꺼번에 이어지는 **쌍둥이 적자** 그림이 자주 나와.

            ---

            **Alice:** 그럼 정부가 지출만 줄이면 돼?

            **Bob:** 이론상 **저축**을 늘리는 **긴축**이 도움이 될 수 있어. 다만 정치적으로 어렵고, 달러가 **기축통화**면 다른 나라 수요가 구조를 바꿔 놓기도 하지.

            **Alice:** 투자할 때는?

            **Bob:** 감세·부양 뉴스와 무역적자를 한 묶음으로 봐. 재정이 풀리는데 적자만 줄겠다고 하면 환율·금리 경로부터 의심해.
          bodyProse: |
            **무역적자**는 수입이 수출을 초과하는 상태다. **재정적자**와 **저축** 부족이 겹치면 국내 투자 재원이 부족해져 **금리**·**강달러**·무역적자가 동반되는 **쌍둥이 적자** 논의가 나온다.

            지출을 줄여 **저축**을 늘리는 긴축이 무역·재정 균형에 도움이 될 수 있으나, 실행은 어렵고 기축통화 수요가 경로를 바꿀 수 있다.

            **정리:** 감세·부양과 무역적자를 분리해 보지 말고, 재정·저축·달러를 한 줄기로 추적한다.
          termIds:
            - trade-deficit
            - twin-deficit
            - fiscal-policy
            - savings
            - national-debt
            - interest-rate
            - strong-dollar
            - weak-dollar
            - exchange-rate
          propositionIds:
            - p141
            - p144

        - id: part-tariffs-dollar
          title: "2. 관세·보호무역과 달러 역설"
          subtitle: "의도와 다른 무역수지"
          bodyDialogue: |
            **Alice:** 관세 올리면 수입 줄고 적자 줄지 않아?

            **Bob:** 단기엔 수입이 줄 수 있어. 그런데 **무역전쟁**이 **지정학** 불안을 키우면 위험회피 자금이 달러로 몰려 **강달러**가 되고, 수출 경쟁력이 떨어져 적자가 커질 수도 있어.

            ---

            *2018~2020년, 미중 관세*

            **Bob:** 관세를 씌웠는데 대중 **무역적자**가 오히려 확대된 구간이 있었지. **감세**와 **관세**를 동시에 쓰며 **재정적자**를 키우면 금리·달러 압력도 겹쳐.

            **Alice:** 그럼 보호무역 뉴스에 수출주만 사면 안 되겠네?

            **Bob:** 맞아. 관세 발표일엔 환율·금리 반응부터 보고, 「적자 줄인다」는 말과 수치가 맞는지 확인해.
          bodyProse: |
            **관세**·**보호무역**은 수입을 줄여 **무역적자**를 축소하려는 정책이지만, **무역전쟁**이 안전자산 수요를 키우면 **강달러**가 되어 역효과가 날 수 있다.

            **감세**와 관세를 함께 쓰며 **재정적자**를 키우면 금리·달러 경로가 무역 목표와 충돌할 수 있다. 2018~2020년 미중 관세전쟁 중 대중 무역적자 확대가 대표적 사례다.

            **정리:** 관세 뉴스는 수출주만이 아니라 달러·금리·무역수지 통계를 함께 본다.
