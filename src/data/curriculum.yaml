    - id: sec-money-credit-cycle
      order: 2
      title: "통화량과 신용은 어디서 오고, 언제 꺾이나"
      subtitle: "신용창조 · M2 · 신용 사이클 · 디레버리징"
      learnerQuestion: "Where does money and credit come from, and when does the cycle turn?"
      bodyDialogue: |
        **Alice:** 통장 숫자는 그대로인데 M2·신용 사이클 얘기만 나오면 헷갈려. 돈이랑 신용이 뭐가 다른 거야?

        **Bob:** **돈(통화)** 은 지금 쓸 수 있는 구매력이고, **신용**은 「나중에 갚겠다」는 약속인데 — 현대 은행에서는 **대출과 동시에 예금(통화)** 이 찍혀. 그래서 **통화량**과 **신용 사이클**은 한 줄기로 이어져.

        ---

        **Alice:** 그럼 연준만 보면 되는 거 아니야?

        **Bob:** 아니. **은행의 신용창조**가 M2를 키우고, 팽창이 길어지면 **자산·레버리지**가 쌓이다가 **경색·디레버리징**으로 꺾여. **창조 → M2·승수 → 팽창 → 경색 → 청산 → 모니터링** 순으로 따라가면 된다.
      bodyProse: |
        **통화량(M2 등)** 은 경제 안 유통되는 구매력의 총량이고, **신용 사이클**은 대출·레버리지가 팽창·수축하며 경기·자산 가격을 움직이는 금융 국면이다. 현대 경제에서 둘은 분리하기 어렵다 — 은행 **신용창조** 과정에서 대출과 예금(통화)이 동시에 늘어나기 때문이다.

        아래 여섯 파트는 **신용창조 → M2·통화승수 → 신용 팽창 → 정점·경색 → 디레버리징·장기 사이클 → 투자자 모니터링** 순으로 이어진다. 「본원통화를 풀면 M2가 기계적으로 오른다」는 직관과 「신용이 줄면 실물 GDP가 꺾인다」는 전달 경로를 함께 본다.
      parts:
        - id: part-credit-creation
          title: "1. 돈은 어디서 생기나"
          subtitle: "대출과 동시에 창출되는 예금"
          bodyDialogue: |
            **Alice:** 은행에 1억을 넣으면 은행이 그 1억만 빌려주는 거지?

            **Bob:** 아니야. A가 **1억 대출**을 받으면 A 통장에 **1억 예금이 동시에 찍혀** — 금고에서 꺼내 준 게 아니야. 은행 전체로 보면 **대출과 예금이 함께 늘어나**. 이게 **신용창조**야.

            ---

            **Alice:** 그럼 돈은 가계→은행→기업으로만 흘러?

            **Bob:** **자금순환표**로 보면 가계 **저축**이 투자를 넘으면 여유자금이 예금·대출 경로로 **기업·정부**에 조달돼 — 실물(저축−투자)과 금융(조달·운용)이 한 표에 연결돼.

            ---

            **Alice:** 그럼 은행은 무한대로 찍어낼 수 있어?

            **Bob:** **지급준비율**·**자기자본비율**(바젤) 같은 **건전성 규제**가 속도 제한장치야. 규제를 맞추려 **증자 대신 대출을 줄이는** 은행도 많았지. **부분준비금제** 은행은 예금 일부만 준비금으로 두고 나머지를 대출로 돌려.

            **Alice:** 그래서 은행은 뭐 하는 데?

            **Bob:** 예금 금고가 아니라 **국가가 허가한 신용창출 기관**이야. 통화량 이야기는 여기서 시작해.
          bodyProse: |
            A가 **1억 대출**을 받으면 A 통장에 **1억 예금이 동시에 찍힌다** — 금고에서 꺼내 준 게 아니다. 은행 전체로 **대출과 예금이 함께 늘어나**는 **신용창조**가 현대 통화량의 핵심 출발점이다. **자금순환표**는 가계 **저축−투자** 차가 금융 **조달·운용**으로 이어지는 경로를 부문별로 보여 준다.

            **지급준비율**·**자기자본비율**(바젤)이 속도 제한장치다. **부분준비금제**는 예금 일부만 준비금으로 두고 나머지를 대출로 돌린다.

            **정리:** 은행 = **신용창출 기관**. 통화량·FoF 이야기는 여기서 시작한다.
          termIds:
