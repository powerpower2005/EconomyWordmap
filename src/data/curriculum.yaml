        - id: part-korea-investor
          title: "4. 한국 투자자 — Fed 뉴스가 원·코스피까지"
          subtitle: "미국 CPI → 달러·원 → 수입물가·외국인"
          bodyDialogue: |
            **Alice:** 미국 CPI만 보면 되는 거 아니야? 나 한국 주식만 사는데.

            **Bob:** 미국 Fed·CPI 이야기만으로 끝나면 **국내 포트폴리오**와 연결이 끊겨.

            ---

            **Bob:** 보통 **달러**부터 움직여. CPI 서프라이즈 → 연준 긴축 기대 → 글로벌 **금리·할인율** 재가격. 미국 자산부터 반응하고 **달러 강세** 압력이 커져.

            **Alice:** 그다음은?

            **Bob:** **원화**야. 미국 **금리↑ + 위험회피** → **강달러·약원**(2022년 원/달러 1,220 → 1,400대). 원화 약세는 **수입 에너지·원자재** 값을 올려 **국내 물가**에도 압력을 줘.

            ---

            *2022년 2~3월, 우크라이나 전쟁 직후*

            **Alice:** 그때 기름값도 확 오르지 않았어? 주식만 본 게 아니었네.

            **Bob:** **WTI 원유**가 배럴당 120달러 안팎까지 치솟았어. 한국은 수입 의존도가 높아 **휘발유·LPG** 가격이 바로 올랐고, 이미 약했던 **원화**까지 겹치면서 **국내 물가** 체감이 더 커졌지. **원자재시장** 충격은 주식 차트 밖에서 구매력을 깎는 경로야.

            **Alice:** 코스피는?

            **Bob:** **위험회피**랑 **외국인 자금 이탈**이 겹치면 코스피 급락·원화 동반 약세가 이어져. 「미국만 보면 되지」가 아니라 **환율·외국인 수급·수입물가**까지 한 묶음으로 봐야 해.

            ---

            **Alice:** 그럼 CPI 나온 다음 날 뭘 봐?

            **Bob:** Fed 뉴스 → **달러/원 → 수입 유가·원자재 → 외국인**까지 이어지면 국내 주식·현금 가치를 같이 해석해. 미국 CPI·FOMC 다음 날 **원/달러·코스피·외국인 순매수**를 함께 보고, 원화 약세·유가 급등 국면에서는 **수입 의존·에너지 비중** 큰 업종과 주유·가스 요금을 체크해. 달러 자산 보유 시 **주가 수익 + 환율**을 분리해 기록해.
          bodyProse: |
            미국 Fed·CPI 이야기만으로 끝나면 **국내 포트폴리오**와 연결이 끊긴다. 한국 투자자에게는 보통 **세 단계**로 전달된다.

            **첫째, Fed·미국 CPI.** 서프라이즈 → 연준 긴축 기대 → 글로벌 **금리·할인율** 재가격. 미국 자산부터 움직이고 **달러 강세** 압력이 커진다.

            **둘째, 달러·원화.** 미국 **금리↑ + 위험회피** → **강달러·약원**(2022년 원/달러 1,220 → 1,400대). 원화 약세는 **수입 에너지·원자재**의 원화 가격을 올려 **국내 물가**에도 압력을 준다.

            **2022년 2~3월** 우크라이나 전쟁 직후 **WTI 원유**가 배럴당 120달러 안팎까지 치솟았다. 한국은 수입 의존도가 높아 **휘발유·LPG** 가격이 바로 올랐고, 약했던 **원화**까지 겹치며 **국내 물가** 체감이 커졌다. **원자재시장** 충격은 주식 차트 밖에서 구매력을 깎는 경로다.

            **셋째, 코스피·외국인.** **위험회피**와 **외국인 자금 이탈**이 겹치면 코스피 급락·원화 동반 약세가 이어진다.

            **정리:** 미국 CPI·FOMC 다음 날 **원/달러·코스피·외국인 순매수**를 함께 보고, 달러 자산은 **주가 수익 + 환율**을 분리해 기록한다.
