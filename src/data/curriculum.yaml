# Investor learning path — thematic sections, continuous Markdown prose.
curriculum:
  version: 2
  intro: "각 섹션은 하나의 이야기로 읽습니다. **대화로** 또는 **설명으로** 읽을 수 있습니다. 아래 용어·명제는 본문을 다 읽은 뒤 펼쳐 보면 됩니다."
  sections:
    - id: sec-money-value
      order: 1
      title: "내 돈의 가치는 어떻게 정해지는가"
      subtitle: "구매력 · 은행 · 연준 · 유동성"
      learnerQuestion: "Why does the purchasing power of my cash change?"
      bodyDialogue: |
        *2021년 초. Alice의 통장에 1,000만 원이 있다.*

        **Alice:** 2024년인데 잔고는 여전히 1,000만 원이야. 근데 외식, 주유, 마트 — 다 비싸졌어. 숫자는 그대로인데 뭔가 이상하지 않아?

        **Bob:** 환율처럼 눈에 보이는 숫자가 아니야. 돈의 가치는 **같은 돈으로 살 수 있는 양**, 즉 **구매력**으로 정해져.

        **Alice:** 그럼 통장 숫자는 그대로인데 왜 CPI 나올 때마다 내 계좌부터 출렁이는 거야?

        ---

        *2022년 어느 주. 화요일 새벽, 한국 시간 — 미국 CPI가 예상보다 높게 나온다.*

        **Alice:** 수요일엔 위원 발언 때문에 성장주랑 채권 ETF가 같이 출렁였고, 목~금엔 밸류에이션 높은 종목이 더 크게 빠졌어. 나는 아무것도 안 했는데 왜 계좌만 줄지?

        **Bob:** CPI 하나가 **연준 기대 → 금리 → 자산 가격**으로 다섯 일 안에 전달된 거야. 통장·MMF 이자는 아직 그대로인데 주식·채권 계좌는 이미 반응한 거지.

        **Alice:** 그 다섯 일 말고, 그 앞뒤로는 뭐가 이어져?

        **Bob:** 같은 줄기야. 점심값이 왜 오르는지, 은행이 돈을 어떻게 만드는지, 연준이 CPI를 보는 이유 — 방금 그 주가 그걸 압축해 놓은 거야.
      bodyProse: |
        2021년 초 통장에 1,000만 원이 있었다. 2024년에도 잔고는 1,000만 원 그대로다. 그런데 같은 돈으로 살 수 있는 것은 분명 줄었다 — 외식, 주유, 마트 장보기 모두 비싸졌다. 숫자는 그대로인데 **가치**가 달라진 이유를, 은행·연준·유동성이라는 실제 메커니즘으로 따라간다.

        돈의 가치는 환율처럼 눈에 보이는 숫자가 아니라 **같은 돈으로 살 수 있는 양(구매력)** 이다. 아래 여덟 파트는 한 줄기로 이어진다 — 물가·실질 → 은행 → 연준 → 한국 투자자 전달 → 재정 견제 → 유동성 → 같은 거시·다른 자산 → 통제 실패.

        **2022년 어느 주, 화요일 새벽(한국 시간)** 미국 CPI가 예상보다 높게 나온다. **수요일** 위원 발언·점도표가 고금리 유지 쪽으로 읽히며 성장주·채권 ETF가 함께 출렁인다. **목~금** 금리 상승 → 할인율 상승 경로로 밸류에이션 높은 종목이 더 크게 조정된다. 통장·MMF 이자는 아직 그대로인데 주식·채권 계좌는 이미 반응했다. CPI 하나가 **연준 기대 → 금리 → 자산 가격**으로 다섯 일 안에 전달된 것이다.
      parts:
        - id: part-purchasing-power
          title: "1. 돈의 가치 = 구매력"
          subtitle: "통장 잔고 숫자 ≠ 실제 살 수 있는 양"
          bodyDialogue: |
            **Alice:** 「인플레이션 3%」가 뭔 소리인지 모르겠어. 그냥 뉴스 숫자 아니야?

            **Bob:** 체감으로 말해 줄게. 작년에 1만 원이면 되던 점심이 올해 1만 500원이면, **예금 잔고는 그대로인데 실질 구매력은 33% 줄어든 것**과 같아.

            ---

            *2022년, CPI 발표일*

            **Alice:** 그날 주식·채권이 같이 출렁인 건 왜야?

            **Bob:** 2022년 미국 CPI는 한동안 **예상치를 크게 웃돌며** 나왔어. 시장은 연준이 더 세게 올리겠다고 해석했지. 물가 숫자 하나가 연준 기대를 바꾸고 자산 가격까지 흔든다 — **돈의 가치**가 시장에 닿는 첫 관문이야.

            ---

            **Alice:** 사람들이 「앞으로도 오를 거야」라고 믿기 시작하면 더 심해져?

            **Bob:** 맞아. 그 기대가 임금·임대료·가격 설정에 미리 반영돼. 1970년대처럼 기대인플레이션이 풀리면 연준이 금리를 올려도 이미 오를 예정인 가격을 막기 어렵고, 2020년대 일부 국면처럼 기대가 목표에 **고정(anchored)** 되어 있으면 일시적 충격이 영구화되지 않을 수 있어.

            ---

            **Alice:** 예금 이자 4% 받는데 CPI 5%면 괜찮은 거 아니야?

            **Bob:** **명목 이자** 4%여도 CPI 5%면 **실질 구매력은 여전히 줄어**. **실질금리(명목 − 물가)** 가 마이너스인 동안 통장·예금만 늘리면 조용히 가치가 깎여. 2022년 후반~2023년 초 미국은 금리를 올렸는데 실질금리가 한동안 마이너스에 머문 구간이 있었어.

            **Alice:** 그래서 내가 뭘 바꿔야 해?

            **Bob:** 돈의 가치는 통장 숫자가 아니라 **물가와 기대**가 정해. 수익·이자는 **명목이 아니라 실질**로 계산하고, CPI·PCE 발표일은 금리 기대가 바뀌는 날로 캘린더에 표시해. 실질금리가 마이너스인데 현금·예금만 늘리지 말고, 단기채·MMF처럼 **금리를 따라가는 그릇**을 검토해 봐.
          bodyProse: |
            「인플레이션 3%」는 추상적 숫자처럼 들리지만, 체감은 이렇게 온다. 작년에 1만 원이면 되던 점심이 올해 1만 500원이 되면, **예금 잔고는 그대로인데 실질 구매력은 33% 줄어든 것**과 같다.

            2022년 미국 CPI는 한동안 **예상치를 크게 웃돌며** 발표됐다. 시장은 연준이 더 세게 금리를 올리겠구나라고 해석했고, 그날 주식·채권이 함께 출렁였다. 물가 숫자 하나가 연준 행동 기대를 바꾸고 자산 가격까지 흔든다 — **돈의 가치**가 시장에 닿는 첫 관문이다.

            사람들이 「앞으로도 물가가 오를 것」이라고 굳게 믿기 시작하면, 임금·임대료·가격 설정에 미리 반영된다. 1970년대처럼 기대인플레이션이 풀리면 연준이 금리를 올려도 이미 오를 예정인 가격을 막기 어렵다. 반대로 2020년대 일부 국면처럼 기대가 목표에 **고정(anchored)** 되어 있으면, 일시적 충격이 영구화되지 않을 수 있다.

            예금·MMF **명목 이자**가 4%여도 CPI가 5%면 **실질 구매력은 여전히 줄어든다**. **실질금리(명목 − 물가)** 가 마이너스인 동안 통장·예금 비중을 「안전하니까」만 보고 늘리면 조용히 가치가 깎인다.

            **정리:** 돈의 가치는 통장 숫자가 아니라 **물가와 기대**가 정한다. CPI·PCE 발표일은 금리 기대가 바뀌는 날로 캘린더에 표시하고, 실질금리가 마이너스인데 현금·예금만 늘리지 말고 단기채·MMF처럼 **금리를 따라가는 그릇**을 검토한다.
