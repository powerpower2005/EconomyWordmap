        - id: part-gdp-limits
          title: "4. GDP가 못 보는 것"
          subtitle: "총량 vs 분배 · 외부성 · 후생"
          bodyDialogue: |
            **Alice:** GDP 성장률만 보면 경제가 잘 사는 거 아니야?

            **Bob:** **총량** 숫자라 **누가** 얼마나 받는지는 안 보여. 성장이 **불평등**을 키우거나 **트리클다운**이 안 되면 체감은 약할 수 있어. **외부성**·**생태경제학** 관점에선 오염·환경 비용도 GDP에 제대로 안 잡혀.

            ---

            *2020년 봉쇄 — 거리는 비었는데 하늘은 맑아진 날*

            **Alice:** 탄소는 줄었는데 GDP는 떨어졌잖아. 이상한 거 아니야?

            **Bob:** GDP는 **시장 거래**만 잡아. **외부성** — 오염·교통체증·**생태경제학**이 지적하는 환경 훼손 비용은 빠지고, **병원·교도소** 같은 대응 지출은 오히려 성장으로 잡힐 수 있어.

            ---

            **Alice:** 집값·월세만 오른 것도 성장이야?

            **Bob:** **귀속임대료** 등으로 주거 **질**은 같아도 GDP는 올라갈 수 있어. **소비자 후생**과 방향이 어긋날 수 있지.

            ---

            **Alice:** 그래서 뭘 보면 돼?

            **Bob:** GDP·**실질 성장**에 **실업·가계부채·분배**, **금리·스프레드**를 세트로. **국민대차대조표**로 **자산−부채=순자산**도 같이 봐 — 부채만 크다고 건전성이 나쁘다고 단정할 수는 없어. **Beyond GDP**처럼 한 숫자에만 올인하지 말고, **후생·환경**은 별도 렌즈로 — ESG·탄소·규제 헤드라인도 같이.
          bodyProse: |
            GDP는 **시장 거래 가격·산출(총량)** 중심 지표다. **국민계정(SNA)** 체계로 생산·소득·지출 3면 등가로 추계하지만, **소득 분배·무급 돌봄·환경 훼손·미래세대 비용**은 충분히 담기지 않는다. 따라서 **실질 GDP 성장 = 국민 후생·행복 향상**이라고 단정하기 어렵다(p179).

            **부(-) 외부성**은 GDP에 차감되지 않고, 범죄·질병·재난 **대응 지출**은 산출로 잡혀 **역설적으로 GDP를 키울** 수 있다(p180, p181). 임대료·주거비만 오른 경우에도 **귀속임대료** 등으로 GDP는 늘 수 있어 **소비자 후생**과 어긋난다. 가계 **부채**만 보면 재무 건전성을 알기 어렵고 **국민대차대조표**의 자산·순자산과 함께 봐야 한다(p202).

            **정리:** GDP 헤드라인은 **C·I·G·NX·실질/명목**과 함께 **실업·분배·가계부채·순자산·금리**를 보고, **환경·ESG·탄소(피구세 등)** 는 별도 축으로 읽는다. **Beyond GDP** 논의는 이 한계를 보완하는 대안 지표 모색이다.
          termIds:
            - gdp
            - real-gdp
            - economic-growth
            - national-accounts
