        - id: part-debt-cycle-endgame
          title: "9. 장기 부채 사이클 말기"
          subtitle: "재정 우위 · AI 변수 · 자산 헤지"
          bodyDialogue: |
            **Bob:** **장기 부채 사이클**은 단기 **신용 사이클**이 수십 년 쌓여 **국가부채**·GDP 대비 부채비율이 정점에 닿는 구조야. 1930년대는 실제 **디레버리징**이었고, 2008년은 **양적완화**로 **유예**됐지.

            ---

            **Alice:** 그럼 지금은?

            **Bob:** 이자 지급이 **국방비**를 넘기는 수준이면 **재정 우위**—통화정책이 물가보다 이자 부담에 끌려다닌다—신호로 읽히기도 해. 빚을 푸는 길은 긴축·디폴트·**부채 화폐화**·부 이전인데, 정치적으로는 화폐화(인플레) 경로가 현실적 대안으로 거론돼.

            ---

            **Charlie:** 여기에 **AI** 변수가 끼어. 낙관은 생산성이 GDP를 키워 부채비율을 낮춘다는 그림이고, 회의는 **AI 설비투자**가 먼저 몰려 인플레를 부른 뒤 생산성은 늦게 온다는 그림이야.

            **Bob:** 그래서 시나리오를 나눠 봐. AI가 정말 성장을 키우면 기술주, 재정·Capex가 먼저 인플레를 부르면 **원자재**·**금**, 재정이 한계에 닿으면 법정화폐 헤지로 **금**·실물자산이 강할 수 있어. **장기 금리**↑는 고밸류 성장주·장기채를 누르고 실물자산과는 대칭적으로 갈라질 수 있지.
          bodyProse: |
            **장기 부채 사이클**은 신용이 누적되어 **국가부채**·**debt-to-GDP**가 정점에 닿는 구조다. 2008년은 **디레버리징** 청산 시점이었으나 **양적완화**로 유예됐다. 이자 부담이 커지면 **재정 우위** 논의가 커지고, 부채 정리는 **부채 화폐화**·인플레 경로가 현실적 대안으로 거론된다.

            **AI**는 분모(GDP)를 키울 낙관과, **AI Capex**가 먼저 인플레를 부르는 회의가 공존한다. **장기 금리** 상승 국면에서는 고밸류 기술주·장기채가 약하고 **금**·**원자재**가 상대 강세를 보일 수 있다(디플레이션형 충격은 예외).

            **정리:** 초장기 레이어(부채 사이클)와 중단기 모멘텀을 분리해 보고, 시나리오별로 기술주 vs 실물자산 비중을 나눠 생각한다.
