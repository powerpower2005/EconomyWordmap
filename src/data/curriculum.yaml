        - id: part-employment-report
          title: "3. 고용 보고서 해부"
          subtitle: "가계 vs NFP · 시간 · 실업수당"
          bodyDialogue: |
            **Alice:** 매월 첫 금요일에 뭐가 나와?

            **Bob:** **Employment Situation**. **가계조사**는 실업률·참가율·고용률(인구대비), **기관조사**는 **NFP**·주당 노동시간·시급. 시장은 단기적으로 실업률보다 **NFP 증감·컨센서스**에 더 민감해.

            ---

            **Alice:** 투잡은?

            **Bob:** 가계에선 사람 1명, 기업(NFP)에선 일자리 2개로 잡혀. 그래서 둘이 어긋날 수 있어. 정부 일자리는 빼고 **민간**도 같이 봐.

            ---

            **Alice:** 시간이랑 시급은?

            **Bob:** 회복 초엔 기업이 **고용보다 노동시간**을 먼저 늘려. 시간이 늘고 시급이 오르는 산업은 호황 힌트야. **주간 실업수당(claims)** 은 매주라 시의성이 좋고, 변동성 때문에 **4주 이동평균**을 써.

            ---

            **Alice:** 실업 기간은?

            **Bob:** **5주 이하**가 급증하면 대규모 해고 물결, **15주 이상**이 늘면 침체가 깊어지기 전 신호로 읽히곤 해 — 추세로 확인해.

            ---

            **Alice:** 숫자 하나보다 전환이 중요하다며?

            **Bob:** 응. 절대 수준보다 **감소세가 바닥을 찍고 돌아서는 구간**, 그리고 컨센서스 대비 서프라이즈를 봐.
          bodyProse: |
            Employment Situation은 **가계조사**(실업·참가·고용률)와 **기관조사**(NFP·주당시간·AHE) 이원 구조다. 시장은 NFP·컨센서스에 민감하고, 회복기에는 **평균 주당 노동시간**이 NFP에 선행하는 경우가 많다. **Initial Claims**는 주간·4주 MA로 동행에 가깝게 본다. 실업기간 분포(단기 급증 vs 장기 누적)는 해고 물결과 침체 누적을 구분하는 휴리스틱이다.

            **정리:** 가계 vs NFP를 짝으로 보고, hours·claims·기간·서프라이즈·추세 전환을 세트로 읽는다.
          termIds:
