        - id: part-liquidity-control
          title: "6. 유동성 통제 — QE · 지준금 · SOFR"
          subtitle: "눈에 안 보이는 배관이 자산 가격까지 연결"
          bodyDialogue: |
            **Alice:** 기준금리 말고도 연준이 건드리는 게 더 있어?

            **Bob:** 2008년 이후 연준은 **지급준비금(reserves)** 이 풍부한 「floor system」에서 단기금리를 유도해. QE는 **연준 대차대조표**를 키우며 자산을 사들여 **지준금을 늘리고**, QT는 반대로 **줄여**. IORB는 은행이 돈을 **대출 vs 적치**할 유인을 정하지.

            ---

            *2020년 3월*

            **Bob:** 연준이 국채·MBS를 대량 매입하며 **지준금이 급증**했어. 은행이 전부를 대출로 풀지 않고 **지준금에 쌓아두면**, 물가로 바로 이어지지 않을 수 있어. 그럼에도 이후 **2020~22년 유동성·수요**가 겹치며 인플레이션이 커졌지.

            ---

            **Alice:** 2022년부터는 반대로 줄이는 거야?

            **Bob:** QT로 지준금을 줄이면 **유동성 회수** 압력이 생겨. TGA·국채 **QRA 발행 서프라이즈**가 크면 장기금리가 올라 채권·주식에 부담을 줘. SOFR(레포 금리)가 **급등**하면 단기 자금 시장이 경색됐다는 신호야.

            **Charlie:** 2019년 9월 **레포 시장 스트레스**, 2023년 **QT 속도 논의**처럼, 지준금이 **최소 적정 수준(LCLoR)** 아래로 내려가면 단기금리가 예상 밖으로 튈 수 있어.

            **Alice:** 기준금리만 보면 안 되는 거네.

            **Bob:** 연준의 「레버」는 기준금리만이 아니야. **지준금·IORB·QT·TGA·QRA**가 한 묶음으로 움직여.
          bodyProse: |
            2008년 이후 연준은 **지급준비금(reserves)** 이 풍부한 「floor system」에서 단기금리를 유도한다. QE·QT는 **연준 대차대조표**와 **지준금**을 확대·축소한다. IORB는 은행이 돈을 **대출 vs 적치**할 유인을 정한다.

            2020년 3월 연준이 국채·MBS를 대량 매입하며 **지준금이 급증**했다. 이후 **2020~22년 유동성·수요**가 겹치며 인플레이션이 커졌다.

            2022년부터 QT로 **유동성 회수** 압력이 생긴다. SOFR **급등**은 단기 자금 시장 경색 신호다. 지준금이 **LCLoR** 아래로 내려가면 단기금리가 예상 밖으로 튈 수 있다.

            **정리:** 연준의 레버는 기준금리만이 아니다. **지준금·IORB·QT·TGA·QRA**가 한 묶음으로 움직인다.
