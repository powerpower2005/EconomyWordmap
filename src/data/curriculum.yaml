        - id: part-failures
          title: "8. 통제가 실패할 때"
          subtitle: "유동성 함정 · 뱅크런 · Too big to fail"
          lead: |
            설계된 메커니즘도 **국면과 심리**에 따라 무너진다.
            「금리를 내리면 경기가 살아난다」가 통하지 않는 **유동성 함정**, 한 은행의 불신이 **전체로 번지는** 뱅크런,
            **구제 기대**가 위험 감수를 키우는 도덕적 해이까지 — 돈의 가치와 금융 안정이 같이 흔들리는 지점이다.
          examples:
            - title: "2023년 3월 — SVB와 지역은행 뱅크런"
              period: "2023-03"
              body: |
                한 지역은행의 **예금 인출 사태**가 다른 은행으로 **불신이 전염**되며 연쇄 이탈 — p94.
                예금보험·연준 **유동성 공급**이 작동해 전체 붕괴는 막았지만, 「은행 돈도 안전하지 않을 수 있다」는 기억이 남았다.
            - title: "2008년 — 레버리지 버블이 시스템으로"
              period: "2008"
              body: |
                주택담보 **신용·레버리지** 버블이 터지며 **디레버리징** 악순환 — p77, p43.
                「개별 은행은 건전하다」고 해도 **동시에 줄이면** 시스템 전체가 무너진다.
                **Too big to fail** 기대가 **도덕적 해이**를 키웠다는 비판 — p115.
            - title: "1990년대 일본 — 유동성 함정"
              period: "1990~"
              body: |
                금리를 **0% 근처**까지 내려도 신용·수요가 살아나지 않는 **유동성 함정** — p28.
                「통화를 풀면 물가가 오른다」는 직관이 **약해지는** 대표 국면.
          takeaway: "메커니즘을 알아도 **실패 모드**를 알아야 한다. 뱅크런·시스템 리스크·유동성 함정은 「내 돈의 가치」를 갑자기 바꾼다."
          investorActions:
            - "예금을 **한 은행·한 형태**에만 몰지 않는다 — SVB(p94) 이후 **FDIC/예금보험 한도**를 확인한다."
            - "브로커 **현금·MMF·단기채**는 은행 예금과 **다른 그릇**임을 구분한다."
            - "「금리 내리면 다 오른다」 **유동성 함정** 국면(p28)을 기억하고, 레짐을 먼저 본다."
          termIds:
