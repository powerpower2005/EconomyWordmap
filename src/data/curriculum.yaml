            - p173
            - p155
            - p112

        - id: part-deleveraging
          title: "5. 디레버리징과 장기 부채 사이클"
          subtitle: "2008 · 일본 · QE 유예"
          bodyDialogue: |
            **Alice:** 버블 터지면 그냥 금리 내리면 되는 거 아니야?

            **Bob:** **부채 부담** 정점에선 **디레버리징** — 지출 삭감·디폴트·**부채 화폐화**·부 이전 네 갈래. **소득 증가율 > 이자율**이 아니면 부담이 **악화**될 수 있어. 금리 **0%** 근처에서도 회복이 더딘 **잃어버린 10년**이 가능해.

            ---

            *2008년 vs 1930년대*

            **Bob:** **단기 신용 사이클**이 수십 년 쌓이면 **장기 부채 사이클** 정점 — 1930년대는 실제 **청산**, 2008년은 **양적완화**로 **유예**됐지. **부채 유예**는 명목 부채가 **쌓인 채** 갈 수 있어.

            ---

            *1990년대 일본*

            **Charlie:** **유동성 함정** — 금리를 내려도 **신용·수요**가 살아나지 않아. 「통화를 풀면 다 오른다」가 **약해지는** 국면이야.

            **Alice:** 그럼 지금은?

            **Bob:** 고부채·**재정 우위**·AI 변수는 **「돈의 가치」** 섹션 말미 파트에서 이어져. 여기서 기억할 건 — **디레버리징**은 단기 금리 인하만으로 끝나지 **않는** 경우가 많다는 점.
          bodyProse: |
            **디레버리징**은 부채 부담을 줄이는 과정 — 지출 삭감·디폴트·**부채 화폐화**·부 이전. **소득 증가율 > 이자율**이 아니면 부담이 악화될 수 있다.

            **장기 부채 사이클** — 단기 **신용 사이클** 누적으로 **debt-to-GDP** 정점. 1930년대 **청산**, 2008년 **QE 유예**. **부채 유예**는 명목 부채 **누적** 가능.

            일본 **유동성 함정** — 「통화↑=수요↑」 직관이 약해지는 국면.

            **정리:** 디레버리징은 **금리 인하만**으로 끝나지 않는 경우가 많다 — **청산 vs 유예**를 구분한다.
          termIds:
            - deleveraging
            - long-term-debt-cycle
            - credit-cycle
            - debt-burden
            - debt-to-gdp
            - quantitative-easing
            - liquidity-trap
            - debt-monetization
            - national-debt
          propositionIds:
            - p154
            - p155
            - p174
            - p103
            - p77

        - id: part-investor-monitor
          title: "6. 투자자가 볼 세트"
          subtitle: "M2 · 신용 · 스프레드 · 곡선"
          bodyDialogue: |
            **Alice:** 매주 뭘 체크하면 돼?

            **Bob:** **M2·본원통화 증가율**(괴리), **신용 스프레드**·**수익률 곡선**, **은행 여신**·**투자(I)** 추이를 **한 세트**로. **실질 GDP·고용**과 **금융** 신호를 나눠 보면 반쯤만 본 거야.

            ---

            **Alice:** M2만 오르면 주식도 오르지?

            **Bob:** **유통속도**·**신용 국면**·**금리**가 같이 작동해 — M2↑인데 **긴축**·**경색**이면 **주식**은 오히려 약할 수 있어. **유동성**은 **레짐**(인플레 대응 vs 침체 공포)을 먼저 구분해.

            ---

            **Alice:** GDP 헤드라인이랑은?

            **Bob:** **「통화량과 신용」** 은 **창조·사이클 메커니즘**, **「GDP·경기」** 섹션은 **헤드라인→포트폴리오** 연결 — 둘 다 보되 역할이 달라.

            **Alice:** 그래서 습관은?

            **Bob:** late-cycle **신호**(스프레드·곡선)가 켜지면 **레버리지·고PER** 비중을 점검하고, **경색** 국면에선 **현금·단기채 옵션**을 유지해. 침체는 「두 분기 GDP」만으로 단정하지 말고 **고용·소득**까지 본다.
          bodyProse: |
            **M2·본원통화 증가율**(괴리), **신용 스프레드**, **수익률 곡선**, **은행 여신**, **투자(I)** 를 **한 세트**로 추적한다. **실질 GDP·고용**과 **금융** 신호를 함께 본다.

            M2↑만으로 **주식**↑를 단정할 수 없다 — **유통속도**·**신용 국면**·**금리 레짐**이 같이 작동한다.

            **정리:** late-cycle **신호**에 **레버리지·고PER** 점검, **경색**에 **유동성 옵션** 유지. 침체는 GDP 두 분기만으로 단정하지 않는다.
          termIds:
