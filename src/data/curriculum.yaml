            - p101
            - p20

        - id: part-checks
          title: "5. 견제 — 재정이 통화를 흔들 때"
          subtitle: "재무부 · TGA · 재정 우위"
          body: |
            **Alice:** 연준만 보면 되는 거 아니었어?

            **Bob:** 아니야. **재무부의 지출·국채 발행·TGA(일반계좌)** 도 시중 유동성을 빼거나 더해. 재정이 과열되면 연준이 물가를 잡기 **어려워지는(재정 우위)** 구도도 생겨.

            ---

            *2022년 9월, 영국*

            **Charlie:** 트러스 쇼크 기억해? 대규모 감세 발표 후 국채가 급락(금리 급등)했어. 「재정이 지속 가능한가?」에 대한 **신뢰 붕괴**가 조달 비용을 올렸지. 기축통화국(미국)은 버티기 쉽지만, **신뢰가 흔들리면** 같은 메커니즘이 작동해.

            **Bob:** 재무부 TGA 잔고가 **크게 늘면** 세수·국채 자금이 연준 계정에 묶여 **지급준비금·유동성이 줄어들어**. 단기금융시장(SOFR)이 튀는 날, TGA·국채 발행 일정을 함께 보는 이유야.

            ---

            *1970년대*

            **Charlie:** **재정 확장**이 물가·임금 기대를 누적시킨 뒤, 1973·79년 **오일쇼크**와 겹치며 「물가↑ + 실업↑」 스태그플레이션이 터졌어. **임금 상승이 생산성을 웃돌아** 단위 노동 비용이 올라가고, **임금–물가 스파이럴**이 기대를 끌어올리는 경로도 중요했지.

            **Alice:** 결국 돈 가치는 연준 혼자 못 정한다는 거네.

            **Bob:** **정리하면** — 돈의 가치는 **통화정책만의 문제가 아니야**. 재정·TGA·국채 수급이 유동성과 기대를 동시에 흔들어.
          termIds:
            - fiscal-policy
            - fiscal-dominance
            - central-bank-independence
            - national-debt
            - tga
            - treasury
            - unit-labor-cost
            - wage-price-spiral
          propositionIds:
            - p6
            - p129
            - p131
            - p128
            - p147
            - p149

        - id: part-liquidity-control
          title: "6. 유동성 통제 — QE · 지준금 · SOFR"
          subtitle: "눈에 안 보이는 배관이 자산 가격까지 연결"
          body: |
            **Alice:** 기준금리 말고도 연준이 건드리는 게 더 있어?

            **Bob:** 2008년 이후 연준은 **지급준비금(reserves)** 이 풍부한 「floor system」에서 단기금리를 유도해. QE는 자산을 사들여 **지준금을 늘리고**, QT는 반대로 **줄여**. IORB는 은행이 돈을 **대출 vs 적치**할 유인을 정하지.

            ---

            *2020년 3월*

            **Bob:** 연준이 국채·MBS를 대량 매입하며 **지준금이 급증**했어. 은행이 전부를 대출로 풀지 않고 **지준금에 쌓아두면**, 물가로 바로 이어지지 않을 수 있어. 그럼에도 이후 **2020~22년 유동성·수요**가 겹치며 인플레이션이 커졌지.

            ---

            **Alice:** 2022년부터는 반대로 줄이는 거야?

            **Bob:** QT로 지준금을 줄이면 **유동성 회수** 압력이 생겨. TGA·국채 **QRA 발행 서프라이즈**가 크면 장기금리가 올라 채권·주식에 부담을 줘. SOFR(레포 금리)가 **급등**하면 단기 자금 시장이 경색됐다는 신호야.

            **Charlie:** 2019년 9월 **레포 시장 스트레스**, 2023년 **QT 속도 논의**처럼, 지준금이 **최소 적정 수준(LCLoR)** 아래로 내려가면 단기금리가 예상 밖으로 튈 수 있어.

            **Bob:** **정리하면** — 연준의 「레버」는 기준금리만이 아니야. **지준금·IORB·QT·TGA·QRA**가 한 묶음으로 움직여.
          termIds:
            - base-money
            - reserves
            - iorb
            - floor-system
            - quantitative-easing
            - quantitative-tightening
            - fed-assets
            - repo-market
            - sofr
            - qra
            - lclor
          propositionIds:
