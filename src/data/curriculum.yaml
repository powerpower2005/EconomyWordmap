        - id: part-investor-habits
          title: "6. 투자자 습관"
          subtitle: "레토릭과 결과 분리"
          bodyDialogue: |
            **Alice:** 정치인이 「제조업 부활」이라고 하면 뭘 사야 해?

            **Bob:** 막 사지 마. **제조업** ETF·수출주만 보지 말고, 같은 기간 **무역적자**·달러·**금리**가 어떻게 움직였는지부터 대조해.

            ---

            **Alice:** 자유무역이 무조건 이득은 아닌 거지?

            **Bob:** 국가 전체 후생과 **분배**는 다를 수 있어. **비교우위**만으로 산업 사다리를 고정할 수 없다는 비판도 있고, **포퓰리즘**·**경제안보** 때문에 선택적 **보호무역** 논의가 돌아오지. **강달러**·약달러도 수출·적자에 직접 닿아.

            **Alice:** 그래서 내가 뭘 바꿔야 해?

            **Bob:** 무역·재정 헤드라인은 「누가 이기나」가 아니라 **달러·금리·적자·고용** 네 축으로 읽어. 정책이 강해질수록 역설도 커질 수 있으니, 단순 테마주보다 거시 전달 경로를 먼저 본다.
          bodyProse: |
            「제조업 부활」「적자 축소」 레토릭은 **제조업** 고용·**무역적자**·달러·**금리** 숫자와 대조해야 한다. 과거에 고용은 늘었는데 적자도 커진 사례가 있다.

            **비교우위**·**자유무역**과 **포퓰리즘**·**보호무역**·**강달러** 긴장을 같이 본다. 정책 강도가 올라갈수록 환율·금리 역설도 커질 수 있다.

            **정리:** 무역·재정 테마는 종목 이름보다 달러·금리·적자·고용 전달 경로를 먼저 추적한다.
