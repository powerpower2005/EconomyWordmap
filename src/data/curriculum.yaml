        - id: part-housing-leading
          title: "6. 주택 — 실물의 선행 창"
          subtitle: "허가 · 착공 · 심리 · 가격"
          bodyDialogue: |
            **Alice:** 주택이 GDP에서 작다는데 왜 중요해?

            **Bob:** 비중은 작아도 **침체 때 먼저 꺾이고 회복 때 먼저 살아나는** 경향이 있고, 가구·가전까지 파급되면 영향이 커져.

            ---

            **Alice:** 허가랑 착공?

            **Bob:** **건축허가**가 보통 **착공**보다 1~3개월 앞서. 허가만 나고 착공이 안 된 물량이 급증하면 자재·인력 병목일 수 있어. **NAHB**는 그달 심리, **케이스-실러**는 가격인데 발표가 늦어.

            ---

            **Alice:** 착공만 꺾이면 경기 끝이야?

            **Bob:** 아니. 재고·가격·금리를 같이 봐 — 수요 둔화일 수도, 공급 차질일 수도 있어.
          bodyProse: |
            주택은 경기 선행 창이다. 허가→착공→판매·가격·관련 소비로 읽고, NAHB는 속보 심리·케이스-실러는 후행 가격이다. 착공 둔화≠즉시 수요 붕괴(p245).

            **정리:** 허가·착공·재고·가격·금리를 세트로 본다.
