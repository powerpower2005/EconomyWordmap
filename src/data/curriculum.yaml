        - id: part-credit-crunch
          title: "4. 정점 · 경색 · 신용파괴"
          subtitle: "돈맥경화와 실물 전달"
          bodyDialogue: |
            **Alice:** 「신용 경색」이 뭐야?

            **Bob:** 은행·시장이 **대출을 급격히 줄이면** **신용창출** 경로가 막혀 — 비유적으로 **돈맥경화**. **통화승수** 연쇄도 끊기고 **가산금리**가 벌어져.

            ---

            *2008년*

            **Charlie:** 주택담보 **MBS**·**레버리지** 버블이 터지며 **신용파괴**가 시작됐어 — 상환·부도로 **구매력과 부채가 같이** 줄어. **투자(I)** 가 먼저 꺾이고 GDP = C+I+G+NX에서 실물이 따라 내려갔지.

            ---

            **Alice:** 「금융은 이미 망했는데 GDP는 아직」 같은 말도 있던데?

            **Bob:** **신용 사이클**과 **경기순환**은 붙어 있지만 **어느 쪽이 먼저** 터지는지는 매번 달라. 금융 충격 → 실물, 또는 실물 둔화 → 신용 위축 — **선후**를 세트로 봐.

            **Alice:** 그럼 뭘 보면 돼?

            **Bob:** **신용 스프레드**·**수익률 곡선**·은행 **여신** 추이. 경색이 **지속**되면 **투자** 위축으로 **침체** 신호가 강해져.
          bodyProse: |
            **신용 경색**은 **신용창출** 경로가 막힌 상태(**돈맥경화**). **통화승수**·**가산금리**·**스프레드**가 함께 움직인다.

            2008년 **신용파괴** — 상환·부도로 구매력·부채가 동시에 줄어 **투자(I)** 가 먼저 꺾였다.

            **신용 사이클**과 **경기순환**은 분리 불가하나 **선후**는 국면마다 다르다.

            **정리:** **스프레드·곡선·여신**을 세트로 — 경색 **지속** 시 실물 **투자** 위축을 본다.
          termIds:
            - credit-crunch
            - credit-destruction
            - credit-creation
            - money-multiplier
            - credit-spread
