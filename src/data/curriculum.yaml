        - id: part-same-macro-assets
          title: "7. 같은 거시, 다른 자산 — 1,000만 원의 표현"
          subtitle: "예금 · 채권 · 주식은 같은 Fed 뉴스에 다르게 반응"
          lead: |
            섹션 시작의 **1,000만 원**을 「어디에 두었느냐」에 따라 2020~23 **같은 거시**에도 결과가 갈린다.
            돈의 가치는 **현금만**이 아니라 **자산 형태**로도 표현된다.
          examples:
            - title: "통장·예금·MMF"
              period: "2020 vs 2022~23"
              body: |
                **2020~21:** 이자는 낮지만 **원금은 안전**, QE 국면에서 **주식 대비 기회비용** 큼.
                **2022~23:** 명목 이자는 오르지만 **실질은 마이너스**일 수 있고, CPI 주간에는 **주식보다 덜** 출렁임.
            - title: "장기 국채 ETF"
              period: "2020 vs 2022~23"
              body: |
                **2020~21:** QE·금리↓ → **채권 가격↑**, 「안전자산」으로 돈이 몰림.
                **2022~23:** 금리 급등 → **채권 가격 급락**(듀레이션) — p58. 「안전하니까 채권」만으로는 부족했던 국면.
            - title: "성장주·주식 ETF"
              period: "2020 vs 2022~23"
              body: |
                **2020~21:** 유동성·저금리 → **밸류에이션↑**, p91.
                **2022~23:** 할인율↑ → **고PER·성장주**가 더 크게 조정 — p102.
          takeaway: "**같은 Fed·CPI**라도 자산별 전달 경로가 다르다. 현금·채권·주식을 **한 줄기**로 같이 본다."
          investorActions:
            - "금리 **급등기**에 장기채 「이제 싸다」 **성급 매수**를 경계한다 — 듀레이션(p58)을 먼저 본다."
            - "유동성 **완화(2020형)** 국면: 현금 **기회비용** 큼 / **긴축(2022형)** 국면: 현금·단기채 **옵션 가치** ↑."
            - "포트폴리오를 **현금·채권·주식** 세 그릇으로 나눠, Fed 레짐이 바뀔 때 **비중만** 조절하는 연습을 한다(전량 현금화 X)."
