    - id: sec-theory-history
      order: 2
      title: "경제학은 왜 두 갈래로 나뉘는가"
      subtitle: "고전학파 · 케인즈 · 신자유주의"
      learnerQuestion: "When does the usual market story break, and what replaced it?"
      bodyDialogue: |
        **Alice:** 뉴스마다 「케인즈식 부양」「신자유주의 개혁」이 나오는데, 이게 그냥 정치 싸움이야?

        **Bob:** 아니야. **고전학파**(시장이 스스로 조정)와 **케인즈주의**(정부가 수요를 메움)가 현대 경제 정책의 두 기둥이야. 1929년 **대공황**이 첫 번째 균열을 냈고, 1970년대 **스태그플레이션**이 두 번째 균열을 냈지.

        ---

        **Alice:** 대공황 때 뭐가 달랐는데?

        **Bob:** 당시 경제학은 「초과공급이면 가격이 내려 수요가 늘어 균형으로 돌아간다」(**세이의 법칙**)고 믿었어. 그런데 실업률이 37%까지 올라도 노동시장이 새 균형을 못 찾았지. 케인즈는 **유효수요** 부족을 원인으로 봤고, 정부 **재정 부양**·공공사업으로 일자리를 만들자고 했어.

        ---

        **Alice:** 그럼 케인즈가 이겼어?

        **Bob:** 한동안은. 그런데 1970년대 **오일쇼크** 뒤 물가와 실업이 동시에 오르는 **스태그플레이션**이 터지면서 「정부가 다 해결한다」는 환상이 깨졌어. 그 반동으로 **신자유주의**—자유무역·규제 완화·작은 정부—가 레이건·대처 시대에 확산됐지. 다만 빈부격차 비판도 함께 커졌어.

        **Alice:** 투자할 때 이걸 왜 알아야 해?

        **Bob:** 같은 CPI 뉴스도 정부가 **부양**할지 **긴축**할지에 따라 주식·채권 반응이 달라져. 지금 정책 레짐이 어느 학파 쪽에 가까운지 보면 시장 해석의 출발점이 잡혀.
      bodyProse: |
        현대 경제 정책은 크게 **고전학파**(시장 자율 조정)와 **케인즈주의**(정부 수요 관리) 두 기둥 위에 서 있다. 1776년 스미스의 국부론은 산업혁명기 부의 분배 문제를 시장에 맡기자는 고전학파의 출발점이었고, **보이지 않는 손**은 개인의 이익 추구가 가격을 통해 사회 전체 이익으로 이어진다는 핵심 논리다.

        1929년 **대공황**은 이 믿음의 첫 균열이었다. **세이의 법칙**에 따르면 초과공급은 가격 하락으로 수요를 끌어올려 균형으로 돌아가야 하지만, 실업률 37%·**디플레이션**에도 노동시장은 회복하지 못했다. 케인즈는 **유효수요** 부족을 진단했고, **재정 정책**과 승수효과로 경기를 끌어올리자고 했다.

        1970년대 **스태그플레이션**은 두 번째 균열이다. 수요 관리만으로는 물가와 실업을 동시에 잡기 어렵다는 한계가 드러나 **신자유주의**—**공급주의**·규제 완화·작은 정부—가 반동으로 부상했다. 빈부격차 확대 비판도 함께 제기된다.

        **정리:** 정책 뉴스(부양 vs 긴축, 규제 vs 완화)를 읽을 때 지금 레짐이 어느 학파에 가까운지부터 보면 자산 가격 반응을 해석하기 쉽다.
      parts:
        - id: part-schools-timeline
          title: "1. 산업혁명 → 대공황 → 스태그플레이션"
          subtitle: "학파가 바뀐 세 번의 충격"
          bodyDialogue: |
            **Bob:** 고전학파는 산업혁명으로 늘어난 부를 시장 가격—임금·지대·이윤—으로 나누자고 봤어. 대공황은 「시장이 알아서 고친다」의 한계를 보여줬고, 스태그플레이션은 「정부가 다 고친다」의 한계를 보여줬지.
          bodyProse: |
            고전학파(산업혁명·국부론) → 케인즈 혁명(대공황·유효수요) → 신자유주의 반동(스태그플레이션·공급주의) 순으로 정책 주류가 이동했다.
