    - id: sec-macro-dashboard
      order: 4
      title: "오늘의 GDP·경기·신용은 내 주식에 어떻게 닿는가"
      subtitle: "실질 GDP · DCF · 경기순환 · 신용 사이클"
      learnerQuestion: "What did today's GDP and cycle headlines mean for my portfolio?"
      bodyDialogue: |
        **Alice:** 뉴스에 GDP 성장률, 경기침체, 신용 경색… 매크로가 너무 많아. 내 포트폴리오랑 어떻게 연결돼?

        **Bob:** 한 줄기로 보면 **실물(일·생산)** 과 **금융(신용·금리)** 이 맞물리고, 그게 **기업 이익·할인율**로 주가에 닿아. GDP는 그 실물 쪽의 대표 숫자야.

        ---

        **Alice:** GDP가 오르면 주식도 무조건 오르지?

        **Bob:** 아니. GDP = **C + I + G + NX**로 쪼개서 **누가** 끌어올렸는지, **실질**인지 **명목**인지 봐야 해. DCF로 말하면 **CF(이익)·g(성장)·r(금리)** 셋 중 뭐가 바뀌었는지가 더 직접적이야.
      bodyProse: |
        거시 헤드라인은 **실물 경제**(재화·서비스·고용)와 **금융 경제**(신용·부채·금리)가 맞물린 뒤, **기업 이익·할인율**을 통해 주가에 전달된다. GDP는 실물 쪽 대표 지표이며, 지출 항목으로 **GDP = C + I + G + NX**로 쪼갠다.

        주식 밸류에이션의 기본 틀은 DCF다. **IV = CF1/(1+r) + … + 터미널/(r−g)** 형태로, 가치가 오르려면 **CF↑·g↑·r↓** 중 하나 이상이 필요하다. 국가 **실질 성장률**은 g의 현실적 상한을, **경기·신용 국면**은 CF 전망과 r(스프레드·리스크 프리미엄)을 좌우한다.

        아래 두 파트는 **GDP·성장·DCF** → **경기순환·신용 사이클** 순으로 이어진다.
      parts:
        - id: part-gdp-dcf
          title: "1. GDP, 실질 성장, DCF"
          subtitle: "C + I + G + NX → CF · g · r"
          bodyDialogue: |
            **Alice:** GDP랑 실질 GDP 차이가 뭐야?

            **Bob:** **명목 GDP**는 물가 포함, **실질 GDP**는 물가를 뺀 생산량. **경제성장률**은 보통 실질 GDP 증가율로 말해.

            ---

            **Alice:** DCF는 어디에 쓰여?

            **Bob:** 미래 **현금흐름(CF)** 을 **할인율(r)** 로 할인해 **내재가치**를 보는 틀이야. **터미널/(r−g)** 에서 **g**는 장기 성장인데, 한 나라 실질 성장을 크게 넘기 어렵다는 게 현실적 상한이야.

            ---

            **Alice:** 호황이면 뭘 보면 돼?

            **Bob:** 실질 GDP·고용·**EPS** 전망(CF)과 **금리·스프레드**(r). CPI만 보지 말고 **성장 + 금리**를 같이 봐.
          bodyProse: |
            **GDP = C + I + G + NX** — I에는 설비·재고 등 민간투자, G에는 이전지출 제외. **실질 GDP**로 물가를 제거한 뒤 **경제성장률**을 본다.

            DCF: **IV = CF1/(1+r) + … + 터미널/(r−g)** (r>g). **CF↑·g↑·r↓**가 가치 상승 요인. **실질 성장률**은 g 상한, **호황/침체**는 CF·스프레드(r)에 직접 닿는다.

            **정리:** GDP 헤드라인은 C·I·G·NX와 **실질/명목**을 구분하고, 포트폴리오는 **EPS(CF)·금리(r)·성장(g)** 로 연결해 읽는다.
