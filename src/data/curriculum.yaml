        - id: part-failures
          title: "8. 통제가 실패할 때"
          subtitle: "유동성 함정 · 뱅크런 · Too big to fail"
          bodyDialogue: |
            **Alice:** 그럼 메커니즘만 알면 다 맞춰지는 거야?

            **Bob:** 설계된 메커니즘도 **국면과 심리**에 따라 무너져. 「금리를 내리면 경기가 살아난다」가 통하지 않는 **유동성 함정**, 한 은행의 불신이 **전체로 번지는** 뱅크런, **구제 기대**가 위험 감수를 키우는 도덕적 해이까지 — 돈의 가치와 금융 안정이 같이 흔들리는 지점이야.

            ---

            *2023년 3월*

            **Charlie:** **SVB** 사태 기억해? 한 지역은행의 예금 인출이 다른 은행으로 **불신이 전염**되며 연쇄 이탈로 이어졌어. 예금보험·연준 **유동성 공급**이 전체 붕괴는 막았지만, 「은행 돈도 안전하지 않을 수 있다」는 기억이 남았지.

            **Bob:** 2008년 주택담보 **신용·레버리지** 버블이 터지며 **부채 부담** 정점에서 **디레버리징** 악순환이 돌았어. 단기 **신용 사이클**이 수십 년 쌓여 **장기 부채 사이클** 정점에 닿은 사례지. 「개별 은행은 건전하다」고 해도 **동시에 줄이면** 시스템 전체가 무너져. **Too big to fail** 기대가 **도덕적 해이**를 키웠다는 비판도 남았고.

            ---

            *1990년대 일본*

            **Charlie:** 금리를 **0% 근처**까지 내려도 신용·수요가 살아나지 않는 **유동성 함정**에 빠졌어. 「통화를 풀면 물가가 오른다」는 직관이 **약해지는** 대표 국면이야.

            **Alice:** 그럼 뭘 조심해야 해?

            **Bob:** 메커니즘을 알아도 **실패 모드**를 알아야 해. 예금을 **한 은행·한 형태**에만 몰지 않고 **FDIC/예금보험 한도**를 확인해. 브로커 **현금·MMF·단기채**는 은행 예금과 **다른 그릇**임을 구분하고, 「금리 내리면 다 오른다」 **유동성 함정** 국면을 기억해 레짐을 먼저 봐.
          bodyProse: |
            설계된 메커니즘도 **국면과 심리**에 따라 무너진다 — **유동성 함정**, **뱅크런**, **도덕적 해이**.

            2023년 3월 **SVB** 사태는 불신이 연쇄 이탈로 번졌다. 2008년 **부채 부담** 정점의 **디레버리징**과 **장기 부채 사이클**, **Too big to fail** 논쟁이 남았다. 1990년대 일본 **유동성 함정**은 「금리를 내리면 다 오른다」는 직관이 약해지는 국면이다.

            **정리:** 예금을 한 곳에만 몰지 말고 **FDIC/예금보험 한도**를 확인한다. 브로커 **현금·MMF·단기채**는 은행 예금과 다른 그릇이다.
