        - id: part-m2-multiplier
          title: "2. M2와 통화승수의 현실"
          subtitle: "교과서 M≈C/r vs QE·0% 준비율"
          bodyDialogue: |
            **Alice:** 한국은행·연준이 찍은 돈은 M2로 어떻게 이어져?

            **Bob:** **본원통화**(현금+지급준비금)가 은행을 거치며 **통화승수** 연쇄로 **M2**(광의통화)가 커진다 — 교과서식으로 M≈C/r. 다만 **대출수요·규제·QE** 때 **지급준비금 적체**면 「같은 배수만큼」은 아닐 때가 많아.

            ---

            **Alice:** M1이랑 M2·Lf 차이는?

            **Bob:** **M1**은 현금+결제성예금, **M2**는 2년 미만 저축·시장형 상품까지. **Lf**·**L**은 더 넓은 **광의유동성** — 가치저장·장기 채권까지. 한은은 M2를 **정보변수**로 봐.

            ---

            **Alice:** 통화는 어디서 공급돼?

            **Bob:** **재정**(지출>세입), **민간신용**(대출), **대외**(경상흑자·환전), 기타 네 갈래. **credit-creation**이 M2를 직접 키워.

            ---

            *2008년 이후*

            **Bob:** QE로 **본원통화·지준금**은 급증했는데 **M2** 증가율은 더 완만했어. 은행이 전부 대출로 풀지 않고 **지준금에 쌓아두면** 승수가 낮아지지. 미국은 2020년 **지급준비율 0%** 이후에도 **대출수요·자본규제**가 신용창출을 좌우해.

            ---

            **Alice:** M2가 늘었는데 물가는 안 오를 때도 있잖아.

            **Bob:** **화폐유통속도**가 떨어지면 같은 M2도 거래에 덜 쓰여 — 「통화↑=물가↑」 직관이 약해지는 국면이야. **유동성 함정**과 겹치면 더 그렇고.

            **Alice:** 그럼 M2만 보면 돼?

            **Bob:** M2 **증가율·본원통화 대비 괴리**·**속도**를 같이 봐. 기계적 승수만 믿지 마.
          bodyProse: |
            **본원통화**가 **통화승수** 연쇄를 거쳐 **M2**로 확대된다 — 교과서식 M≈C/r. **M1**(결제성)·**M2**(광의통화)·**Lf/L**(광의유동성)은 포괄범위가 다르다. 통화공급 경로는 **재정**·**민간신용**·**대외**(경상수지)·기타 — **credit-creation**이 M2 1차 경로.

            QE·**지급준비금 적체**·약한 대출수요가 겹치면 같은 본원통화도 M2로 **기계적으로** 이어지지 않을 수 있다. **화폐유통속도** 하락 시 「통화↑=물가↑」 직관이 약해질 수 있다.

            **정리:** M2 **증가율**·공급 경로·**유통속도**·**inflation-targeting** 맥락을 세트로 본다.
