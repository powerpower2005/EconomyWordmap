        - id: part-defense-beneficiary
          title: "5. 방산·수혜주 체크"
          subtitle: "고용 ≠ 이익"
          bodyDialogue: |
            **Alice:** 정책 수혜주면 무조건 오르지?

            **Bob:** **고용** 숫자만 보면 위험해. **리쇼어링**·관세 **수혜**여도 **생산성**·마진이 안 따라오면 이익은 안 늘 수 있어.

            ---

            **Alice:** 방산은?

            **Bob:** **국방 지출**·**경제안보**는 국내 **제조**·조달 중심이라 보호무역과 결이 맞아. **철광석**·원자재·**기술(technological-progress)** 수혜도 같이 보지만, **니어쇼어링**도 **관세** 불확실성에 취약할 수 있지.

            **Alice:** 그래서?

            **Bob:** 「수혜」라는 말과 **설비투자**·이익·생산성 숫자를 분리해서 봐.
          bodyProse: |
            정치·Agenda 수혜 논리는 **고용 창출**을 강조하지만, **생산성**·이익으로 이어지지 않을 수 있다. **리쇼어링**이 R&D 역량을 희생하게 만들면 장기 수혜가 아닐 수 있다.

            **국방 지출**은 **제조업**·**경제안보**·**철광석** 등 원자재·**기술 진보**와 연결되나 재정·인플레 변수도 있다. **니어쇼어링**은 **관세** 확대 시 투자가 지연될 수 있다.

            **정리:** 수혜주는 레토릭·고용이 아니라 생산성·마진·실제 **설비투자**를 확인한다.
          termIds:
            - defense-spending
            - economic-security
            - manufacturing
            - reshoring
            - nearshoring
            - tariff
            - technological-progress
            - iron-ore
          propositionIds:
