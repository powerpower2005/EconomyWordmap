            - p77
            - p94
            - p115

        - id: part-debt-cycle-endgame
          title: "9. 고부채·재정 우위와 AI 변수"
          subtitle: "이자 부담 · 자산 헤지"
          bodyDialogue: |
            **Alice:** 부채가 많아지면 결국 뭐가 터져?

            **Bob:** **장기 부채 사이클**·디레버리징 메커니즘은 **「통화량과 신용」** 섹션에서 봤지. 여기서는 **말기 국면**만 — 이자 지급이 **국방비**를 넘기면 **재정 우위**—통화정책이 물가보다 이자 부담에 끌려다닌다—신호로 읽히기도 해.

            ---

            **Alice:** 빚은 어떻게 풀어?

            **Bob:** 긴축·디폴트·**부채 화폐화**·부 이전 네 갈래인데, 정치적으로는 화폐화(인플레) 경로가 현실적 대안으로 거론돼.

            ---

            **Charlie:** 여기에 **AI** 변수가 끼어. 낙관은 생산성이 GDP를 키워 부채비율을 낮춘다는 그림이고, 회의는 **AI 설비투자**가 먼저 몰려 인플레를 부른 뒤 생산성은 늦게 온다는 그림이야.

            **Bob:** 그래서 시나리오를 나눠 봐. AI가 정말 성장을 키우면 기술주, 재정·Capex가 먼저 인플레를 부르면 **원자재**·**금**, 재정이 한계에 닿으면 법정화폐 헤지로 **금**·실물자산이 강할 수 있어. **장기 금리**↑는 고밸류 성장주·장기채를 누르고 실물자산과는 대칭적으로 갈라질 수 있지.
          bodyProse: |
            **장기 부채 사이클**·디레버리징 메커니즘은 **「통화량과 신용」** 섹션에서 다룬다. 이 파트는 **말기 국면** — 이자 부담이 커지면 **재정 우위** 논의가 커지고, 부채 정리는 **부채 화폐화**·인플레 경로가 현실적 대안으로 거론된다.

            **AI**는 분모(GDP)를 키울 낙관과, **AI Capex**가 먼저 인플레를 부르는 회의가 공존한다. **장기 금리** 상승 국면에서는 고밸류 기술주·장기채가 약하고 **금**·**원자재**가 상대 강세를 보일 수 있다(디플레이션형 충격은 예외).

            **정리:** 초장기 레이어(부채·재정)와 중단기 모멘텀을 분리해 보고, 시나리오별로 기술주 vs 실물자산 비중을 나눠 생각한다.
