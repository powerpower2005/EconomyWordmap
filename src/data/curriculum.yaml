        - id: part-market-regime
          title: "3. 강세장 · VIX · 리스크온"
          subtitle: "같은 EPS, 다른 국면"
          bodyDialogue: |
            **Alice:** 뉴스에 「강세장」「리스크온」이 뭐야?

            **Bob:** **강세장**은 주가가 장기 상승 추세, **약세장**은 하락 추세. **리스크온**은 위험자산 선호, **리스크오프**는 현금·채권 쪽으로 도망.

            ---

            **Alice:** VIX는?

            **Bob:** **VIX**는 **변동성**·공포 지수. VIX 급등일엔 레버리지 청산이 겹치면 **주식시장**이 급락할 수 있어.

            ---

            **Alice:** 연착륙·경착륙은?

            **Bob:** **연착륙**은 긴축 뒤 인플레만 잡고 실업은 버티는 시나리오, **경착륙**은 침체로 가는 시나리오. **매파**·**비둘기파** 발언이 어느 쪽에 가까운지 보면 금리·주가 해석이 달라져.

            **Alice:** 그래서?

            **Bob:** EPS·PER과 함께 **VIX**, **리스크온/오프**, **강세/약세** 국면을 기록해. 국면이 바뀌면 같은 좋은 이익 뉴스도 다르게 읽혀.
          bodyProse: |
            **강세장**·**약세장**, **리스크온**·**리스크오프**는 시장 **국면**이다. **VIX**·**변동성**은 포지션·공포를 반영한다. **연착륙**·**경착륙**, **매파**·**비둘기파**는 금리·경기 시나리오와 정책 **기조**를 구분하는 언어다.

            **정리:** 이익·밸류와 **국면·변동성**을 같은 노트에 적는다.
