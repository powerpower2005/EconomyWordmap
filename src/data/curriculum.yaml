        - id: part-banks
          title: "2. 은행의 역할 — 돈은 어디서 생기나"
          subtitle: "현금 인출이 아니라, 대출과 동시에 창출"
          bodyDialogue: |
            **Alice:** 은행은 그냥 내 돈 보관하는 금고 아니야?

            **Bob:** 현대 경제에서 **새 돈의 상당 부분은 은행 대출과 동시에 생겨**. A가 주택담보대출 3억 원을 받으면 A 통장에 **3억 원 예금이 동시에 찍혀** — 금고에서 현금을 꺼내 준 게 아니야. 은행 전체로 보면 **대출과 예금이 함께 늘어나**. 통화량은 중앙은행만이 아니라 **은행의 신용창조**에 크게 의존해.

            **Alice:** 그럼 한국은행이 찍은 돈은 계속 불어나?

            **Bob:** 교과서식으로는 **본원통화**가 들어오면 은행이 **지급준비율**만큼 남기고 나머지를 대출→예금→재대출하는 **통화승수** 연쇄로 **M2**가 커진다. 다만 현실에서는 대출수요·규제·QE 때 **지급준비금 적체** 때문에 「같은 배수만큼」은 아닐 때가 많아.

            ---

            **Alice:** 그럼 저금리 때 대출이 늘면 뭐가 문제야?

            **Bob:** 2000년대처럼 저금리·느슨한 대출이 이어지면 부동산·주식 등 **자산 가격을 부추기는 신용**이 쌓여. 바젤 규제(자기자본비율)는 「은행이 감당할 수 있는 만큼만 빌려라」는 속도 제한장치고, 규제를 맞추기 위해 **증자 대신 대출을 줄이는** 은행도 많았지.

            **Alice:** 그래서 은행은 결국 뭐 하는 데야?

            **Bob:** 예금을 보관하는 금고가 아니라 **인가받은 신용창출 기관**이야. 돈의 양은 여기서 출발해.
          bodyProse: |
            「은행에 돈을 맡긴다」고만 생각하기 쉽지만, 현대 경제에서 **새 돈의 상당 부분은 은행 대출과 동시에 생긴다**. A가 주택담보대출 3억 원을 받으면 A 통장에 **3억 원 예금이 동시에 찍힌다** — 금고에서 현금을 꺼내 준 게 아니다. 은행 전체로 보면 **대출과 예금이 함께 늘어난다**.             통화량은 중앙은행만이 아니라 **은행의 신용창조**에 크게 의존한다.

            교과서식으로는 **본원통화**가 은행을 거치며 **지급준비율**만큼 남기고 재대출되는 **통화승수** 연쇄로 **M2**가 확대된다. 다만 QE·규제·약한 대출수요가 겹치면 같은 본원통화도 기계적으로 같은 배수만큼 M2로 이어지지 않을 수 있다.

            2000년대처럼 저금리·느슨한 대출이 이어지면 부동산·주식 등 **자산 가격을 부추기는 신용**이 쌓인다. 바젤 규제(자기자본비율)는 「은행이 감당할 수 있는 만큼만 빌려라」는 속도 제한장치다.

            **정리:** 은행은 예금을 보관하는 금고가 아니라 **인가받은 신용창출 기관**이다. 돈의 양은 여기서 출발한다.
