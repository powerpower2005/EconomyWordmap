    premise: GDP는 국경 안 생산 총량이고 GNI = GDP + 국외순요소소득으로 거주자 소득을 본다. 헤드라인 GDP·1인당 GDP 성장이 곧 국민 생활수준·가처분소득 개선으로 이어진다는 직관에 근거한다.
