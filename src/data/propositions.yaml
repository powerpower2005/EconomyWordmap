        detail: 생산·고용·임금·가처분소득이 함께 늘고 국외순요소소득이 크게 빠지지 않으면 GDP·GNI·PDI가 방향을 같이 한다.
      - label: 폐쇄·균형적 개방경제
        detail: 이익·소득이 거주자에게 분배되고 조세 왜곡·SPE 유입이 작으면 GDP와 GNI 괴리가 제한적이다.
    fails:
      - label: 이익 이동·SPE·IP 귀속
        detail: GDP·1인당 GDP·FDI는 부풀지만 GNI·가처분소득·소비·실업은 뒤처질 수 있다.
        example: 아일랜드 2015년 GDP 급등(레프러콘 경제학) vs 실업·소비 지표.
      - label: 분배·가계 부문 쏠림
        detail: GDP 성장 이익이 비거주자·법인·상위층에 쏠리면 GNI·PDI·PGDI는 GDP보다 약하게 늘거나 정체될 수 있다.
      - label: 국외순요소소득·교역조건
        detail: 해외 이익 유출·교역조건 악화가 크면 실질 GNI는 실질 GDP보다 더 약할 수 있다.
    verdict: 실물 성장·분배·NFP 조건에서만 성립하며, 개방경제·조세 왜곡·분배 불균형 앞에서는 GDP 헤드라인만으로 판단할 수 없는 조건부 명제다.
  - id: p198
    statement: 교역조건이 악화하면 실질 GNI는 실질 GDP보다 더 크게 떨어질 수 있다
