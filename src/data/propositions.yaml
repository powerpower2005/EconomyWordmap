    premise: 외생적 통화공급(승수이론)에 따라 중앙은행이 본원통화·지급준비율로 M2를 기계적으로 결정한다는 견해에 근거한다. 내생적 공급론은 대출수요→예금→M2 순서를 강조(8.5.1.4·참고8-1).
    holds:
