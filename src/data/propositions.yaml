propositions:
  - id: p1
    statement: 금리가 오르면 물가가 내려간다
    category: 통화정책
    termIds:
      - interest-rate
      - inflation
      - policy-rate
      - aggregate-demand
      - expected-inflation
    premise: 금리가 오르면 차입 비용이 커져 소비·투자가 위축되고 총수요가 둔화되어 물가 상승 압력이 완화된다는 통화정책 전달경로에 근거한다.
    holds:
      - label: 수요 견인 인플레이션 국면
        detail: 경기 과열과 수요 초과로 물가가 오르는 국면에서는 금리 인상이 총수요를 식혀 물가를 낮추는 효과가 비교적 뚜렷하다.
        example: 2022~2023년 미국 연준의 공격적 금리 인상 이후 인플레이션이 점진적으로 둔화.
      - label: 기대인플레이션이 안정된 경우
        detail: 중앙은행 신뢰가 높아 기대가 안정(anchored)되어 있으면 금리 인상 신호만으로도 물가 기대가 빠르게 조정된다.
    fails:
      - label: 공급 충격발 인플레이션
        detail: 에너지·원자재·공급망 차질로 인한 물가 상승은 수요 억제로 잡기 어렵고, 금리를 올려도 물가가 잘 내려가지 않으며 경기만 위축될 수 있다.
        example: 1970년대 오일쇼크 스태그플레이션.
      - label: 정책 시차
        detail: 금리 인상이 물가에 미치는 효과는 보통 수개월에서 1년 이상 시차를 두고 나타나 단기에는 물가가 계속 오를 수 있다.
      - label: 재정 확장 동반
        detail: 대규모 재정 지출이 함께 이뤄지면 통화 긴축 효과가 일부 상쇄되어 물가가 잘 잡히지 않는다.
    verdict: 장기·수요 견인 국면에서는 대체로 성립하지만, 공급 충격이나 정책 시차, 재정 변수 앞에서는 약하거나 지연된다. 무조건 참이 아닌 조건부 명제다.
  - id: p2
    statement: 자유무역은 모두에게 이득이다
    category: 국제경제
    termIds:
      - free-trade
      - comparative-advantage
      - consumer-welfare
      - trade-war
      - strategic-trade-theory
      - inequality
      - manufacturing
    premise: 비교우위에 따라 각국이 잘하는 분야에 특화하면 전체 생산과 후생이 커지고 소비자 가격이 낮아진다는 포지티브섬 논리에 근거한다.
    holds:
      - label: 국가 전체의 후생
        detail: 교역으로 전체 생산이 늘고 소비자는 더 싸고 다양한 상품을 얻어 평균적으로 후생이 증가한다.
        example: 세계화 이후 신흥국 성장과 글로벌 빈곤율 하락.
      - label: 경쟁 촉진과 생산성
        detail: 수입 경쟁이 국내 기업의 효율을 끌어올리고 분업·전문화를 심화한다.
    fails:
      - label: 분배 문제(패자 발생)
        detail: 전체는 이득이어도 경쟁에서 밀린 특정 산업·노동자는 일자리와 소득을 잃어 불평등이 커질 수 있다.
        example: 선진국 제조업 공동화와 러스트벨트 쇠퇴.
      - label: 불완전 경쟁·전략 산업
        detail: 소수 기업이 지배하는 산업에서는 전략적 무역이론처럼 보조금·보호가 자국에 이득이 될 수 있어 무조건적 자유무역이 최선이 아니다.
      - label: 경제 안보
        detail: 핵심 물자를 특정국에 의존하면 공급망 무기화 위험이 커져 효율만으로 판단하기 어렵다.
    verdict: 국가 전체 합으로는 이득이 크지만 분배·전략·안보 측면에서 패자와 위험이 생긴다. 재분배와 선택적 보호로 보완해야 하는 조건부 명제다.
  - id: p3
    statement: 정부는 시장에 개입하지 않는 것이 좋다
    category: 경제이론
    termIds:
      - laissez-faire
      - invisible-hand
      - market-failure
      - externality
      - public-goods
      - keynesian-economics
      - industrial-policy
    premise: 개인의 이기심이 가격 메커니즘을 통해 자원을 효율적으로 배분한다는 보이지 않는 손의 논리에 근거한다.
    holds:
      - label: 경쟁적이고 외부효과가 적은 시장
        detail: 정보가 충분하고 경쟁적인 시장에서는 가격이 수요와 공급을 효율적으로 조정해 개입이 오히려 비효율을 낳는다.
      - label: 지식·정보의 분산
        detail: 가격은 분산된 정보를 집약하므로 중앙 계획보다 시장이 자원 배분에 유리하다.
    fails:
      - label: 시장 실패
        detail: 외부효과·공공재·독점·정보 비대칭이 있으면 시장만으로는 효율적 배분에 실패해 정부 개입이 정당화된다.
        example: 환경오염(외부효과)과 국방(공공재).
      - label: 단기 총수요 부족
        detail: 가격·임금이 경직적인 단기에는 시장이 스스로 완전고용을 회복하지 못해 케인즈식 수요 관리가 필요할 수 있다.
        example: 1930년대 대공황.
    verdict: 경쟁시장에서는 대체로 옳지만 시장 실패와 단기 침체 영역에서는 개입이 필요하다. 개입 여부는 영역에 따라 갈린다.
  - id: p4
    statement: 통화량이 늘어나면 물가가 오른다
    category: 통화
    termIds:
      - money-supply
      - inflation
      - velocity-of-money
      - quantitative-easing
      - expected-inflation
    premise: 교환방정식 MV=PY에서 유통속도와 생산이 일정하면 통화량 증가가 물가 상승으로 이어진다는 화폐수량설에 근거한다.
    holds:
      - label: 장기와 고인플레이션 국면
        detail: 장기적으로, 특히 통화를 과도하게 찍어내는 초인플레이션 국면에서는 통화량과 물가가 강하게 함께 움직인다.
        example: 바이마르 독일·짐바브웨의 초인플레이션.
    fails:
      - label: 유동성 함정과 속도 하락
        detail: 경기 불안으로 화폐유통속도가 떨어지면 통화가 늘어도 지출과 물가로 이어지지 않는다.
        example: 2010년대 대규모 양적완화에도 낮게 유지된 물가.
      - label: 단기와 기대
        detail: 단기에는 통화량보다 기대인플레이션과 신용·수요 상황이 물가를 더 좌우한다.
    verdict: 장기에는 성립하는 경향이 있으나 단기와 유통속도·금융중개 상황에 따라 약해진다. 시점에 크게 의존하는 명제다.
  - id: p5
    statement: 관세를 매기면 자국 산업이 보호되고 무역수지가 개선된다
    category: 국제경제
    termIds:
      - tariff
      - protectionism
      - consumer-welfare
      - trade-war
      - trade-deficit
      - strong-dollar
      - geopolitical-risk
    premise: 수입품에 세금을 매기면 수입 가격이 올라 수입이 줄고 국내 생산이 보호된다는 보호무역 논리에 근거한다.
    holds:
      - label: 단기 산업 보호
        detail: 초기 유치산업이나 위기에 빠진 사양 산업을 단기적으로 보호해 시간을 벌어줄 수 있다.
    fails:
      - label: 소비자 후생 감소
        detail: 관세는 국내 가격을 올려 소비자와 관세 대상 원자재를 쓰는 기업의 비용을 높인다.
      - label: 보복과 무역전쟁
        detail: 상대국이 보복 관세로 맞대응하면 수출도 줄어 양측 모두 손해를 본다.
      - label: 무역수지 효과의 불확실성
        detail: 환율 절상과 공급망 비용 상승이 동반되면 무역수지 개선 효과가 상쇄되어 결과가 불확실하다.
      - label: 분쟁→위험회피→강달러
        detail: 무역분쟁이 지정학·성장 불안을 키우면 달러가 안전자산으로 강해져 무역적자가 오히려 커질 수 있다.
        example: 2018~2020년 미중 관세전쟁 중 대중 무역적자 확대·위안화 약세·달러 강세.
    verdict: 단기 보호는 가능하지만 소비자 비용, 보복, 환율·안전자산 반응 때문에 순효과는 불확실하다. 선택적·한시적으로만 정당화된다.
  - id: p6
    statement: 재정적자가 늘면 국채 금리가 오른다
    category: 정부
    termIds:
      - fiscal-policy
      - government-bond
      - long-term-interest-rate
      - tax-cut
      - bond-market
    premise: 재정적자가 커지면 국채 발행이 늘고 재정 건전성 우려가 커져 채권이 매도되고 금리가 오른다는 논리에 근거한다.
    holds:
      - label: 재정 신뢰가 흔들릴 때
        detail: 시장이 재정 지속가능성을 의심하면 국채가 급히 매도되어 금리가 치솟는다.
        example: 2022년 영국 트러스 정부의 감세안 발표 후 국채 급락(트러스 쇼크).
    fails:
      - label: 안전자산 선호
        detail: 위기 국면에서 국채로 안전자산 수요가 몰리면 적자 확대에도 금리가 오히려 내려갈 수 있다.
      - label: 중앙은행 매입과 자국통화 부채
        detail: 중앙은행이 국채를 매입하거나 자국통화 표시 국채 수요가 강하면 적자에도 금리가 낮게 유지될 수 있다.
        example: 장기 저금리를 유지해 온 일본과 평시의 미국.
    verdict: 시장의 재정 신뢰와 통화정책·안전자산 수요 상황에 따라 결과가 갈리는 조건부 명제다.
  - id: p7
    statement: 통화가 약세가 되면 수출이 늘어난다
    category: 국제경제
    termIds:
      - exchange-rate
      - weak-dollar
      - trade-surplus
      - korean-won
      - inflation
    premise: 자국 통화가 약세가 되면 수출품의 외화 표시 가격이 낮아져 가격 경쟁력이 올라가 수출이 늘고 무역수지가 개선된다는 논리에 근거한다.
    holds:
      - label: 중기 가격 경쟁력 효과
        detail: 시간이 지나 수출 물량이 가격 변화에 반응하면(J커브 후반) 수출이 늘고 무역수지가 개선된다.
      - label: 글로벌 수요가 견조할 때
        detail: 해외 경기가 좋아 수요가 충분하면 환율 약세의 가격 효과가 수출 증가로 잘 이어진다.
    fails:
      - label: J커브 초기
        detail: 환율 약세 직후에는 수입 가격이 먼저 올라 단기적으로 무역수지가 오히려 악화될 수 있다.
      - label: 수입 중간재 의존
        detail: 한국처럼 원자재·중간재를 많이 수입하는 구조에서는 약세로 수입 비용이 올라 채산성과 물가를 압박한다.
      - label: 글로벌 가치사슬
        detail: 생산이 여러 나라에 분산된 글로벌 가치사슬에서는 환율 변화가 최종 가격에 잘 전가되지 않아 효과가 제한된다.
    verdict: 중기적으로 수요가 받쳐줄 때는 성립하지만 J커브 초기, 수입 의존, 글로벌 가치사슬 때문에 즉각적이지 않은 조건부 명제다.
  - id: p8
    statement: 정부 지출을 늘리면 경기가 살아난다
    category: 정부
    termIds:
      - fiscal-policy
      - aggregate-demand
      - gdp
      - keynesian-economics
      - government-bond
    premise: 정부 지출이 총수요를 직접 늘리고 소비·투자로 파급되어(재정승수) 생산과 고용이 늘어난다는 케인즈식 논리에 근거한다.
    holds:
      - label: 불황과 유휴자원
        detail: 실업과 유휴 설비가 많은 불황기에는 재정승수가 커서 지출 확대가 경기를 효과적으로 끌어올린다.
        example: 2008년 금융위기·2020년 팬데믹 대응 재정 부양.
      - label: 유동성 함정
        detail: 금리가 매우 낮아 통화정책 여력이 없을 때는 재정정책의 효과가 상대적으로 크다.
    fails:
      - label: 완전고용 근처의 구축효과
        detail: 경기가 이미 과열에 가까우면 정부 차입이 금리를 올려 민간 투자를 밀어내(구축효과) 효과가 줄어든다.
      - label: 재정 신뢰·부채 우려
        detail: 부채가 과도하면 지출 확대가 금리 상승과 신뢰 훼손으로 이어져 역효과를 낼 수 있다.
    verdict: 경기 국면(유휴자원 여부)에 따라 효과가 크게 달라지는 조건부 명제다.
  - id: p9
    statement: 최저임금을 올리면 고용이 줄어든다
    category: 미시경제
    termIds:
      - unemployment
      - perfect-competition
      - market-failure
      - inequality
    premise: 완전경쟁 노동시장에서 임금이라는 가격에 하한을 두면 노동 공급이 수요를 초과해 실업이 늘어난다는 수요·공급 논리에 근거한다.
    holds:
      - label: 경쟁적 시장과 큰 인상폭
        detail: 노동시장이 경쟁적이고 인상폭이 크면 청년·저숙련 일자리에서 고용이 위축될 수 있다.
    fails:
      - label: 수요독점 노동시장
        detail: 고용주가 임금 결정력을 가진 수요독점 시장에서는 적정 수준의 최저임금 인상이 고용을 줄이지 않거나 오히려 늘릴 수 있다.
      - label: 소비 진작 효과
        detail: 저소득층 소득이 늘면 소비가 증가해 수요가 살아나 고용 감소를 상쇄할 수 있다.
    verdict: 노동시장 구조와 인상폭에 따라 결과가 갈리며 실증 결과도 혼재된 조건부 명제다.
  - id: p10
    statement: 양적완화(QE)는 인플레이션을 일으킨다
    category: 통화
    termIds:
      - quantitative-easing
      - inflation
      - money-supply
      - velocity-of-money
      - bank
    premise: 중앙은행이 자산을 사들여 본원통화를 늘리면 통화량이 늘어 물가가 오른다는 화폐수량설적 논리에 근거한다.
    holds:
      - label: 신용·수요로 이어질 때
        detail: 풀린 돈이 대출과 지출로 이어지고 수요가 강하면 물가 상승으로 연결된다.
        example: 2020~2022년 대규모 부양과 공급 차질이 겹친 인플레이션.
    fails:
      - label: 지급준비금에 머무를 때
        detail: 은행이 늘어난 유동성을 대출로 풀지 않고 지급준비금으로 쌓아두면 물가로 잘 이어지지 않는다.
        example: 2010년대 미국·유럽의 QE에도 낮게 유지된 물가.
      - label: 유통속도 하락
        detail: 경기 불안과 디레버리징으로 화폐유통속도가 떨어지면 통화 증가가 물가로 전달되지 않는다.
    verdict: 통화량 증가가 신용·수요로 이어지는지에 달려 있어 항상 인플레이션을 부르지는 않는 조건부 명제다.
  - id: p11
    statement: 주가는 경기를 선행한다
    category: 금융
    termIds:
      - stock-market
      - gdp
      - economic-growth
      - investment
      - recession
    premise: 주가는 미래 기업 이익과 경기 기대를 미리 반영하므로 실물 경기보다 앞서 움직인다는 논리에 근거한다.
    holds:
      - label: 평균적 선행성
        detail: 역사적으로 주식시장은 경기 저점에 앞서 반등하고 고점에 앞서 꺾이는 경향이 있어 선행지표로 쓰인다.
    fails:
      - label: 거짓 신호
        detail: 주가는 실제보다 자주 경기 전환을 예고해 빗나가며, 침체 없는 조정이나 조정 없는 침체도 나타난다.
      - label: 유동성 장세
        detail: 금리·유동성에 의해 펀더멘털과 무관하게 움직이면 경기와의 연결이 약해진다.
      - label: 시총이 GDP를 앞서는 장기 구간
        detail: 1980년대 이후처럼 밸류·금리·이익 쏠림으로 시가총액/GDP가 급등하면, 주가·시총이 실질 GDP 성장률과 장기적으로 동행하지 않을 수 있다.
    verdict: 평균적으로 선행하는 경향은 있으나 잡음과 거짓 신호가 많아 단독으로 신뢰하기 어려운 명제다.
  - id: p12
    statement: 금리를 내리면 주가가 오른다
    category: 금융
    termIds:
      - interest-rate
      - policy-rate
      - stock-market
      - investment
      - dcf
      - valuation
      - eps
      - economic-growth
    relationIds:
      - r178
      - r907
      - r913
    premise: 금리 인하는 DCF 세 변수에 각각 작용할 수 있다. (1) 할인율 r이 내려가면 같은 CF·g에서도 내재가치가 오르고, (2) 투자·소비 진작으로 기업 이익 CF 전망이 개선되며, (3) 연착륙·부양 기대가 성장률 g 가정을 올릴 수 있다. 세 경로가 동시에·순서대로·상쇄되기도 한다.
    holds:
      - label: r(할인율) 경로
        detail: 무위험·장기금리가 내려가면 DCF 할인율이 낮아져 같은 CF·g에서도 멀티플·내재가치가 올라간다.
        example: 2019~2021년 저금리 국면의 성장주·고멀티플 랠리.
      - label: CF(이익) 경로
        detail: 경기가 크게 나쁘지 않은 국면에서 금리 인하는 수요·투자를 살려 EPS·이익 전망을 끌어올릴 수 있다.
      - label: g(성장 기대) 경로
        detail: 인하가 연착륙·경기 부양 기대를 키우면 DCF 영구성장률(g) 가정과 성장주 밸류에이션이 올라갈 수 있다.
    fails:
      - label: 침체 신호로서의 인하 (CF↓)
        detail: 경기 급랭 우려 때문에 다급하게 내리는 인하는 이익 전망 악화가 r↓를 압도해 오히려 주가 하락과 동반될 수 있다.
      - label: 이미 선반영 (r 경로 무력)
        detail: 시장이 인하를 미리 반영했다면 실제 인하에도 주가가 더 오르지 않거나 차익실현이 나올 수 있다.
      - label: 인플레·스태그플레이션 (g·CF 악화)
        detail: 물가가 높은데 금리만 내리면 실질금리·스프레드가 개선되지 않거나 인플레 재평가로 g·CF 기대가 오히려 꺾일 수 있다.
      - label: 유동성 함정 (CF·g 경로 단절)
        detail: 금리가 이미 0에 가깝고 신용·수요가 반응하지 않으면 r↓만으로는 이익·성장 기대가 살아나지 않는다.
        example: 1990년대 일본 유동성 함정.
    verdict: r·CF·g 세 경로의 상대적 크기와 인하 배경(경기·인플레 국면)에 따라 방향이 갈리는 조건부 명제다.
  - id: p13
    statement: 국가부채가 많으면 경제성장이 둔화된다
    category: 정부
    termIds:
      - fiscal-policy
      - government-bond
      - economic-growth
      - long-term-interest-rate
    premise: 부채가 늘면 이자 부담과 금리 상승, 미래 증세 우려가 투자와 성장을 짓누른다는 논리에 근거한다.
    holds:
      - label: 과도한 부채와 신뢰 위기
        detail: 부채가 지나치게 많고 특히 외화 표시일 때는 금리 급등과 신뢰 위기로 성장이 꺾인다.
    fails:
      - label: 기축통화·저금리
        detail: 자국통화로 빌리고 안전자산 수요가 강한 나라는 높은 부채에도 낮은 금리를 유지하며 성장할 수 있다.
      - label: 생산적 투자
        detail: 부채가 인프라·교육 등 생산성을 높이는 투자에 쓰이면 장기 성장을 오히려 견인할 수 있다.
    verdict: 부채의 규모뿐 아니라 통화 주권과 부채의 용도(질)에 크게 의존하는 조건부 명제다.
  - id: p14
    statement: 기술 발전은 일자리를 없앤다
    category: 거시경제
    termIds:
      - technological-progress
      - unemployment
      - manufacturing
      - economic-growth
    premise: 자동화와 기계가 사람의 일을 대체하므로 기술이 발전하면 일자리가 줄어든다는 논리에 근거한다.
    holds:
      - label: 단기 전환 비용
        detail: 특정 직무와 산업에서는 자동화로 일자리가 사라지고 노동자가 재배치되기까지 마찰적 실업이 생긴다.
        example: 산업혁명기 러다이트 운동, 제조 자동화로 인한 공장 고용 감소.
    fails:
      - label: 장기 일자리 창출
        detail: 생산성 향상이 소득과 수요를 늘리고 새로운 산업·직무를 만들어 장기적으로는 고용이 줄지 않는 경향이 있다.
      - label: 보완 효과
        detail: 기술이 사람의 생산성을 높여 보완하는 경우 일자리의 성격이 바뀔 뿐 총량은 유지되거나 늘 수 있다.
      - label: 글로벌 제조 고용 추세
        detail: 중국·인도 등에서도 제조업 고용 비중이 하락하면 특정국 탓만으로 일자리 감소를 설명하기 어렵다.
        example: 전 세계 제조업 고용이 산출 증가와 함께 정체·감소하는 공통 패턴.
    verdict: 단기적 일자리 대체는 분명하나 장기적으로는 창출 효과가 커, 시점에 따라 평가가 갈리는 명제다.
  - id: p16
    statement: 물가가 오르면 실업이 줄어든다(필립스 곡선)
    category: 거시경제
    termIds:
      - inflation
      - unemployment
      - expected-inflation
      - aggregate-demand
    premise: 총수요가 늘면 고용이 늘고 물가도 함께 오르므로 인플레이션과 실업 사이에 단기 트레이드오프가 있다는 논리에 근거한다.
    holds:
      - label: 단기 수요 충격 국면
        detail: 기대인플레이션이 안정된 단기에는 총수요 변화에 따라 물가와 실업이 반대로 움직이는 관계가 관찰된다.
    fails:
      - label: 장기 수직
        detail: 장기적으로는 실업이 자연실업률로 회귀해 물가만 오를 뿐 트레이드오프가 사라진다.
      - label: 스태그플레이션
        detail: 공급 충격으로 기대인플레이션이 흔들리면 물가와 실업이 동시에 오르는 스태그플레이션이 나타난다.
        example: 1970년대 오일쇼크.
    verdict: 단기에는 성립하지만 장기와 기대 변동, 공급 충격 앞에서는 깨지는 조건부 명제다.
  - id: p17
    statement: 금은 인플레이션 헤지 수단이다
    category: 원자재
    termIds:
      - gold
      - inflation
      - real-interest-rate
      - strong-dollar
    premise: 금은 화폐가치가 하락할 때 실물 안전자산으로서 가치를 보존해 인플레이션을 방어한다는 논리에 근거한다.
    holds:
      - label: 장기·실질금리 하락 국면
        detail: 장기적으로, 특히 실질금리가 낮거나 통화 신뢰가 흔들리는 고인플레이션 국면에서 금이 가치를 보존하는 경향이 있다.
    fails:
      - label: 실질금리 상승·강달러
        detail: 인플레이션이 높아도 실질금리가 오르고 달러가 강해지면 이자 없는 금은 부진할 수 있다.
        example: 2022년 인플레이션 급등기에도 긴축·강달러로 금값 약세 구간.
      - label: 단기 변동성
        detail: 단기적으로는 위험선호·달러·금리에 휘둘려 물가와의 연결이 약하다.
      - label: 헤지 쏠림 후 긴축
        detail: 인플레 헤지 목적으로 금 매수가 과열된 뒤 중앙은행이 강력히 긴축하면 금값이 급락할 수 있다.
        example: 1970년대 금 급등 후 1980–82년 볼커 긴축기 온스당 850달러→300달러 수준.
    verdict: 장기적 보존 수단이지만 단기에는 실질금리와 달러에 더 민감한 조건부 명제다.
  - id: p18
    statement: 관세로 보호하면 자국 일자리를 지킬 수 있다
    category: 국제경제
    termIds:
      - tariff
      - protectionism
      - manufacturing
      - trade-war
      - consumer-welfare
      - reshoring
    premise: 수입을 관세로 억제하면 국내 생산과 그 산업의 고용이 보호된다는 보호무역 논리에 근거한다.
    holds:
      - label: 보호 대상 산업의 단기 고용
        detail: 관세 대상 산업에서는 단기적으로 수입 경쟁이 줄어 고용이 방어될 수 있다.
    fails:
      - label: 전후방 산업의 비용 증가
        detail: 관세로 원자재·부품 값이 오르면 이를 쓰는 더 큰 산업의 비용과 고용이 악화되어 순고용은 줄 수 있다.
      - label: 보복 관세
        detail: 상대국이 보복하면 수출 산업의 일자리가 줄어 보호 효과가 상쇄된다.
    verdict: 보호 대상 산업의 일자리는 지킬 수 있어도 전체 고용으로 보면 상충해 순효과가 불확실한 명제다.
  - id: p19
    statement: 중앙은행이 금리를 올리면 반드시 경기침체가 온다
    category: 통화정책
    termIds:
      - policy-rate
      - unemployment
      - inflation
      - federal-reserve
    premise: 금리 인상이 수요를 위축시키므로 긴축은 결국 경기침체(경착륙)로 이어진다는 논리에 근거한다.
    holds:
      - label: 과도하고 급격한 긴축
        detail: 물가를 잡기 위해 빠르고 큰 폭으로 긴축하면 수요가 급랭해 침체로 이어진 사례가 많다.
        example: 1980년대 초 볼커의 고강도 긴축과 경기침체.
    fails:
      - label: 연착륙 가능성
        detail: 공급 여건 개선이 동반되거나 긴축 속도가 완만하면 침체 없이 물가만 둔화되는 연착륙이 가능하다.
        example: 1994~1995년, 2023~2024년 연착륙 논쟁.
    verdict: 긴축의 속도와 공급 여건에 따라 경착륙과 연착륙이 갈리므로 '반드시'는 성립하지 않는 명제다.
  - id: p20
    statement: 달러가 강해지면 신흥국 경제가 어려워진다
    category: 국제경제
    termIds:
      - strong-dollar
      - exchange-rate
      - korean-won
      - supply-chain
    premise: 달러 강세는 달러 표시 부채의 상환 부담을 키우고 신흥국에서 자본을 유출시켜 금융 불안을 부른다는 논리에 근거한다.
    holds:
      - label: 달러부채가 많은 신흥국
        detail: 달러 부채가 크고 외환보유가 부족한 신흥국은 강달러 국면에서 상환 부담과 자본유출로 위기에 취약하다.
        example: 1997년 아시아 외환위기, 2013년 테이퍼 텐트럼.
    fails:
      - label: 대외건전성이 양호한 경우
        detail: 경상흑자·충분한 외환보유·낮은 달러부채를 가진 나라는 강달러의 충격을 비교적 잘 견딘다.
    verdict: 신흥국의 대외건전성과 달러부채 수준에 따라 충격의 크기가 크게 달라지는 조건부 명제다.
  - id: p21
    statement: 상품의 가치는 생산에 들어간 노동·비용으로 결정된다
    category: 경제이론
    termIds:
      - labor-theory-of-value
      - subjective-value-theory
      - marginal-utility
      - diamond-water-paradox
    premise: 투입된 노동량과 생산 비용이 상품의 객관적 가치를 결정한다는 고전파 노동가치설에 근거한다.
    holds:
      - label: 장기 경쟁시장의 공급가
        detail: 장기 경쟁 균형에서는 생산 비용이 가격의 하한을 형성해 비용과 가격이 비슷하게 수렴하는 경향이 있다.
    fails:
      - label: 다이아몬드-물 역설
        detail: 생존에 필수인 물은 싸고 쓸모가 적은 다이아몬드는 비싼 현상을 비용만으로는 설명하지 못한다.
      - label: 희소성과 수요
        detail: 가치는 비용뿐 아니라 희소성과 소비자의 주관적 한계효용에 의해 결정되며, 한계혁명이 이를 보였다.
    verdict: 비용은 공급 측 요인일 뿐 가치는 수요(한계효용)와 함께 결정된다. 비용만으로 가치를 설명하려던 명제는 한계가 분명하다.
  - id: p22
    statement: 사람은 항상 합리적으로 선택한다
    category: 경제이론
    termIds:
      - homo-economicus
      - bounded-rationality
      - behavioral-economics
      - marginal-analysis
    premise: 사람은 완전한 정보로 자기 효용을 극대화한다는 합리적 경제인 가정에 근거하며, 한계에서의 합리적 계산을 전제한다.
    holds:
      - label: 반복적·고액 거래
        detail: 결과가 크고 반복 학습이 가능한 상황에서는 사람들이 평균적으로 합리적 선택에 가깝게 행동한다.
    fails:
      - label: 인지 편향과 휴리스틱
        detail: 현실의 사람은 손실 회피·현상 유지·과신 등 체계적 편향에 휘둘려 합리적 예측에서 벗어난다.
      - label: 제한된 합리성
        detail: 정보·시간·계산 능력의 한계 때문에 최적 대신 만족할 만한 선택에 그친다.
    verdict: 근사 모델로는 유용하지만 체계적 비합리성이 존재해 행동경제학의 보정이 필요한 조건부 명제다.
  - id: p23
    statement: 많이 소비할수록 추가 만족은 줄어든다
    category: 미시경제
    termIds:
      - diminishing-marginal-utility
      - marginal-utility
      - consumer-sovereignty
    premise: 같은 재화를 한 단위 더 소비할수록 추가로 얻는 만족(한계효용)이 줄어든다는 한계효용 체감 법칙에 근거한다.
    holds:
      - label: 대부분의 일반 재화
        detail: 음식·물 등 대다수 재화에서 소비가 늘수록 추가 만족이 줄어 수요 곡선이 우하향한다.
    fails:
      - label: 중독재와 수집·네트워크재
        detail: 중독성 재화나 수집품, 사용자가 늘수록 가치가 커지는 네트워크 재화에서는 한계효용이 오히려 커질 수 있다.
    verdict: 일반 재화에서는 폭넓게 성립하지만 중독·수집·네트워크 효과가 있는 재화에서는 예외가 있는 명제다.
  - id: p24
    statement: 시장이 파레토 효율이면 바람직하다
    category: 미시경제
    termIds:
      - pareto-efficiency
      - welfare-economics
      - inequality
      - market-failure
    premise: 누구의 후생도 해치지 않고는 개선이 불가능한 파레토 효율 상태가 자원 배분의 바람직한 기준이라는 논리에 근거한다.
    holds:
      - label: 효율 평가 기준
        detail: 낭비 없는 자원 배분을 판단하는 명확한 기준으로 유용하다.
    fails:
      - label: 분배·형평성 외면
        detail: 극단적으로 불평등한 배분도 파레토 효율일 수 있어 효율은 공정성을 보장하지 않는다.
      - label: 시장 실패
        detail: 외부효과·공공재·독점·정보 비대칭이 있으면 시장 균형이 파레토 효율에 미치지 못한다.
    verdict: 효율의 기준일 뿐 공정성과는 별개이며 시장 실패 앞에서는 달성되지도 않는, 보완이 필요한 명제다.
  - id: p25
    statement: 가격은 수요와 공급이 만나는 점에서 결정된다
    category: 미시경제
    termIds:
      - supply-and-demand
      - price-mechanism
      - monopoly
      - information-asymmetry
    premise: 소비자의 한계효용에서 나온 수요와 생산자의 한계비용에서 나온 공급이 교차하는 점에서 가격이 정해진다는 마셜의 가위 논리에 근거한다.
    holds:
      - label: 경쟁시장
        detail: 다수의 참여자와 충분한 정보가 있는 경쟁시장에서는 가격이 수요·공급 균형점으로 잘 수렴한다.
    fails:
      - label: 불완전 경쟁
        detail: 독점·과점에서는 기업이 가격 결정력을 가져 균형 가격에서 벗어난다.
      - label: 정보 비대칭과 통제
        detail: 정보 비대칭, 가격 통제, 기대 변화가 있으면 단순 수급 균형에서 괴리된다.
    verdict: 경쟁시장의 기준 모델로 강력하지만 시장 구조와 정보 조건에 따라 수정이 필요한 명제다.
  - id: p26
    statement: 불황에는 정부가 지출을 늘려 수요를 살려야 한다
    category: 거시경제
    termIds:
      - keynesian-economics
      - effective-demand
      - fiscal-policy
      - multiplier
      - national-debt
    premise: 민간 수요가 부족할 때 정부가 재정 지출로 총수요를 메워야 한다는 케인즈 처방에 근거한다.
    holds:
      - label: 유효수요 부족 국면
        detail: 유휴 자원이 많고 민간이 지출을 줄이는 불황에서는 정부 지출이 승수효과로 경기를 회복시킨다.
        example: 2008년 글로벌 금융위기와 2020년 코로나19 때의 대규모 재정 부양.
      - label: 유동성 함정
        detail: 금리가 0에 가까워 통화정책이 막히면 재정정책이 거의 유일한 수요 보완 수단이 된다.
    fails:
      - label: 완전고용·공급 충격
        detail: 자원이 이미 완전히 쓰이거나 공급 측 충격이 원인이면 부양이 인플레이션과 스태그플레이션을 부른다.
      - label: 부채와 정부 실패
        detail: 적자가 누적되어 국가부채가 늘고 정치적 남용으로 효율이 떨어질 수 있다.
    verdict: 불황이 수요 부족 때문인지에 따라 효과가 크게 갈리는 조건부 처방이다.
  - id: p27
    statement: 불황기에는 비효율 기업을 청산해야 회복이 빠르다
    category: 경제이론
    termIds:
      - austrian-school
      - malinvestment
      - creative-destruction
      - zombie-firm
      - unemployment
    premise: 잘못 배분된 투자와 좀비기업을 정리해야 자원이 재배분되어 건강하게 회복된다는 오스트리아적 처방에 근거한다.
    holds:
      - label: 구조적 비효율 누적
        detail: 저금리로 좀비기업이 만연해 생산성이 정체된 국면에서는 청산이 자원을 효율적으로 재배분한다.
    fails:
      - label: 급성 수요 붕괴
        detail: 대규모 청산이 대량 실업과 총수요 급락, 디플레이션 악순환을 일으켜 불황을 더 깊게 만들 수 있다.
    verdict: 장기 생산성에는 옳지만 단기의 고통과 수요 붕괴를 외면한다는 한계가 있는 명제다.
  - id: p28
    statement: 중앙은행이 금리를 낮추면 경기가 살아난다
    category: 통화정책
    termIds:
      - interest-rate
      - liquidity-trap
      - malinvestment
      - central-bank
    premise: 금리 인하가 차입 비용을 낮춰 투자와 소비를 자극한다는 통념에 근거한다.
    holds:
      - label: 정상 국면
        detail: 금리에 여유가 있는 평상시에는 인하가 투자·소비를 늘려 수요를 진작한다.
    fails:
      - label: 유동성 함정
        detail: 금리가 이미 0에 가까우면 추가 인하가 수요를 늘리지 못해 무력해진다.
      - label: 장기 저금리의 부작용
        detail: 지나치게 오래 낮은 금리는 말인베스트먼트와 자산 버블을 키운다.
    verdict: 경기 국면과 금리 수준에 따라 효과가 달라지는 조건부 명제다.
  - id: p29
    statement: 정부 지출은 승수효과로 더 큰 소득을 만든다
    category: 거시경제
    termIds:
      - multiplier
      - fiscal-policy
      - aggregate-demand
      - lucas-critique
    premise: 정부 지출이 소득을 늘리고 그 소득이 다시 소비로 이어져 처음 지출보다 큰 총수요를 만든다는 승수 이론에 근거한다.
    holds:
      - label: 유휴 자원이 많은 불황
        detail: 쓰이지 않던 노동·자본이 많을 때는 승수가 1보다 커서 지출 효과가 증폭된다.
    fails:
      - label: 완전고용의 구축효과
        detail: 자원이 꽉 찬 상태에서는 정부 지출이 민간 투자를 밀어내 효과가 상쇄된다.
      - label: 루카스 비판
        detail: 사람들이 정책을 미리 예상하고 행동을 바꾸면 기대했던 승수효과가 줄어든다.
    verdict: 경기 국면과 자원 여유에 따라 승수 크기가 크게 달라지는 명제다.
  - id: p31
    statement: 실업을 낮추려 경기를 부양하면 결국 인플레이션만 오른다
    category: 거시경제
    termIds:
      - phillips-curve
      - natural-rate-of-unemployment
      - monetarism
      - inflation
      - unemployment
    premise: 실업을 자연실업률 이하로 낮추려는 부양은 결국 인플레이션만 가속시킨다는 프리드먼의 자연실업률 가설에 근거한다.
    holds:
      - label: 자연실업률 근처
        detail: 실업이 이미 자연율 수준이고 기대 인플레이션이 형성된 상태에서 부양하면 고용은 그대로고 물가만 오른다.
        example: 1970년대 미국의 부양책이 스태그플레이션으로 귀결된 사례.
    fails:
      - label: 깊은 불황
        detail: 유휴 자원이 많은 침체에서는 부양이 단기 필립스 상충을 통해 실질 고용을 개선할 수 있다.
    verdict: 경기가 자연실업률에서 얼마나 떨어져 있는지에 따라 갈리는 조건부 명제다.
  - id: p32
    statement: 중앙은행은 재량보다 정해진 규칙을 따라야 한다
    category: 통화정책
    termIds:
      - monetary-policy-rule
      - time-inconsistency
      - central-bank-independence
      - monetarism
    premise: 시간 불일치 때문에 재량적 정책은 신뢰를 잃으므로 예측 가능한 규칙이 우월하다는 통화주의 주장에 근거한다.
    holds:
      - label: 신뢰와 기대 안정
        detail: 평상시에는 예측 가능한 규칙이 인플레이션 기대를 안정시키고 정책 신뢰를 높인다.
    fails:
      - label: 예외적 충격
        detail: 금융위기나 큰 공급 충격에는 경직된 규칙이 대응력을 떨어뜨려 재량적 개입이 필요할 수 있다.
    verdict: 신뢰 확보엔 유리하지만 충격 대응의 유연성과 상충하는 명제다.
  - id: p33
    statement: 일시적 소득 증가는 소비를 크게 늘린다
    category: 경제이론
    termIds:
      - permanent-income-hypothesis
      - multiplier
      - fiscal-policy
    premise: 재난지원금이나 일회성 감세 같은 일시 소득이 소비를 크게 부양한다는 통념에 근거한다.
    holds:
      - label: 유동성 제약 가구
        detail: 현금이 부족한 저소득 가구에서는 일시 소득이 곧바로 소비로 이어진다.
    fails:
      - label: 영구소득가설
        detail: 소비가 평생 기대 소득을 따른다면 일시 소득은 대부분 저축되어 부양 효과가 작다.
    verdict: 가계의 유동성 제약 정도에 따라 효과가 크게 갈리는 조건부 명제다.
  - id: p34
    statement: 중앙은행이 통화량 목표를 정하면 물가를 안정시킬 수 있다
    category: 통화정책
    termIds:
      - quantity-theory-of-money
      - money-supply
      - velocity-of-money
      - inflation-targeting
    premise: 화폐수량설에 따라 통화량 증가율을 통제하면 물가가 안정된다는 통화주의 준칙에 근거한다.
    holds:
      - label: 유통속도 안정
        detail: 화폐 유통속도가 안정적이고 화폐의 정의가 명확할 때는 통화량 통제가 물가를 안정시킨다.
    fails:
      - label: 유통속도 불안정
        detail: 금융 혁신으로 유통속도와 화폐 정의가 흔들리면서 1980년대 이후 대부분 통화량 목표제를 포기했다.
    verdict: 유통속도 안정이라는 전제가 무너지면 작동하지 않아 금리·물가목표제로 전환된 명제다.
  - id: p35
    statement: 인플레이션 기대는 한번 형성되면 잡기 어렵다
    category: 거시경제
    termIds:
      - inflation
      - rational-expectations
      - central-bank-independence
      - stagflation
    premise: 임금과 물가가 서로 밀어 올리는 기대 악순환이 자리 잡으면 인플레이션을 통제하기 어렵다는 1970년대 교훈에 근거한다.
    holds:
      - label: 낮은 신뢰·임금연동
        detail: 중앙은행 신뢰가 낮고 임금-물가 연동이 강하면 기대가 굳어져 인플레이션이 지속된다.
    fails:
      - label: 신뢰 높은 중앙은행
        detail: 독립성과 신뢰가 높은 중앙은행은 강한 긴축으로 기대를 빠르게 안정시킬 수 있다.
        example: 1979~1982년 폴 볼커의 고금리 정책이 인플레이션 기대를 단기간에 꺾은 사례.
    verdict: 중앙은행의 신뢰성에 따라 기대 안정 속도가 달라지는 조건부 명제다.
  - id: p36
    statement: 정부의 체계적 정책은 사람들이 미리 예상해 효과가 없다
    category: 경제이론
    termIds:
      - policy-ineffectiveness
      - rational-expectations
      - new-classical-economics
      - quantitative-easing
    premise: 사람들이 합리적 기대로 정부의 체계적 정책을 예상하고 대응하면 효과가 상쇄된다는 새고전파의 정책 무력화 명제에 근거한다.
    holds:
      - label: 예고된 평상시 정책
        detail: 충분히 예고되고 반복된 통화정책은 기대에 반영되어 실질 변수에 미치는 효과가 제한적이다.
    fails:
      - label: 예상 밖 비전통 정책
        detail: 2008년과 2020년처럼 예상치 못한 양적완화나 대규모 재정 부양은 실제로 큰 효과를 냈다.
    verdict: 정책의 예상 가능성과 경기 상황에 따라 갈리며, 극단적 적용은 위기에서 반증된 명제다.
  - id: p37
    statement: 시장 가격은 이용 가능한 모든 정보를 반영한다
    category: 금융
    termIds:
      - efficient-market-hypothesis
      - rational-expectations
      - herd-behavior
      - behavioral-economics
    premise: 자산 가격이 모든 정보를 즉시 반영해 시장을 꾸준히 이기기 어렵다는 효율적 시장 가설에 근거한다.
    holds:
      - label: 유동성 높은 평상시 시장
        detail: 거래가 활발한 시장에서는 새 정보가 빠르게 가격에 반영되어 초과수익을 꾸준히 내기 어렵다.
    fails:
      - label: 버블과 군중 행동
        detail: 군중 행동과 과잉 자신감으로 버블과 붕괴가 반복되어 가격이 정보에서 크게 이탈한다.
        example: 2008년 서브프라임 버블의 형성과 붕괴.
    verdict: 평균적으로는 유효하지만 비합리성과 쏠림 앞에서는 무너지는 조건부 명제다.
  - id: p38
    statement: 과거 데이터로 추정한 모형은 정책이 바뀌어도 신뢰할 수 있다
    category: 경제이론
    termIds:
      - lucas-critique
      - rational-expectations
      - dsge-model
    premise: 과거 행동 패턴을 추정한 계량 모형으로 정책 효과를 예측할 수 있다는 전통적 접근에 근거한다.
    holds:
      - label: 안정적 정책 체제
        detail: 정책 체제가 그대로 유지되는 동안에는 추정된 관계가 비교적 잘 유지된다.
    fails:
      - label: 루카스 비판
        detail: 정책이 바뀌면 사람들의 기대와 행동이 바뀌어 과거에 추정한 모형 파라미터가 이동한다.
    verdict: 정책 변화 시에는 신뢰할 수 없어 기대·행동 반응을 명시적으로 반영해야 하는 명제다.
  - id: p39
    statement: 금융시장은 내버려두면 스스로 안정된다
    category: 금융
    termIds:
      - efficient-market-hypothesis
      - financial-instability-hypothesis
      - leverage-ratio
      - systemic-risk
    premise: 시장이 효율적이고 합리적이면 금융도 자기 교정을 통해 안정을 유지한다는 관점에 근거한다.
    holds:
      - label: 평온기
        detail: 위기가 없는 평온기에는 차익거래와 가격 조정이 시장을 균형으로 되돌린다.
    fails:
      - label: 민스키의 동학
        detail: 안정이 길어질수록 부채와 위험 감수가 늘어 금융이 스스로 불안정해지고 시스템 리스크로 번진다.
        example: 장기 호황 뒤에 터진 2008년 위기.
    verdict: 평온기에는 그럴듯하나 호황의 자기파괴적 동학을 놓치는 명제다.
  - id: p40
    statement: 거시경제는 대표적 경제주체 하나로 충분히 설명된다
    category: 경제이론
    termIds:
      - representative-agent
      - heterogeneous-agent
      - dsge-model
      - inequality
    premise: 경제를 평균적인 합리적 주체 한 명으로 단순화해도 핵심을 설명할 수 있다는 모형 가정에 근거한다.
    holds:
      - label: 총량 흐름 분석
        detail: 총생산·물가 같은 총량 변수의 큰 흐름을 간결하게 분석할 때는 유용하다.
    fails:
      - label: 이질성과 불평등
        detail: 부채 많은 가계와 은행의 상호작용, 불평등이 위기를 증폭시키는 과정을 담지 못한다.
        example: 2008년 위기에서 가계·금융기관의 이질적 상호작용이 충격을 키운 사례.
    verdict: 단순화에는 유용하나 이질성과 분배가 중요한 국면에서는 보완이 필요한 명제다.
  - id: p41
    statement: 사람은 같은 크기의 이익과 손실을 똑같이 느낀다
    category: 경제이론
    termIds:
      - prospect-theory
      - loss-aversion
      - cognitive-bias
      - behavioral-economics
    premise: 표준 효용이론은 같은 크기의 이득과 손실을 대칭적으로 평가한다고 가정한다.
    holds:
      - label: 작고 감정 개입 적은 거래
        detail: 금액이 작고 반복적인 거래에서는 이익과 손실을 비교적 대칭적으로 다룬다.
    fails:
      - label: 손실 회피
        detail: 프로스펙트 이론에 따르면 사람들은 손실의 고통을 이득의 기쁨보다 약 두 배 크게 느낀다.
    verdict: 손실 회피라는 체계적 편향 때문에 대체로 성립하지 않는 명제다.
  - id: p42
    statement: 선택 설계(넛지)로 사람들의 더 나은 결정을 유도할 수 있다
    category: 정부
    termIds:
      - nudge
      - behavioral-economics
      - cognitive-bias
    premise: 선택의 구조를 바꾸면 강제 없이도 사람들의 행동을 개선할 수 있다는 넛지 이론에 근거한다.
    holds:
      - label: 기본값 설계
        detail: 연금 자동가입처럼 기본 선택지를 바꾸면 저축률이 크게 오른다.
    fails:
      - label: 지속성과 조작 논란
        detail: 효과가 일시적이거나 맥락에 의존하고, 정부의 은밀한 조작이라는 비판과 자율성 침해 논란이 따른다.
    verdict: 특정 영역에선 효과적이나 투명성과 적용 범위에 따라 논란이 남는 조건부 명제다.
  - id: p43
    statement: 개인이 각자 합리적으로 행동하면 시스템 전체도 안전하다
    category: 경제이론
    termIds:
      - systemic-risk
      - herd-behavior
      - leverage-ratio
      - financial-instability-hypothesis
    premise: 개별 주체가 합리적으로 위험을 관리하면 전체 금융 시스템도 안전하다는 통념에 근거한다.
    holds:
      - label: 평상시
        detail: 위기가 없는 평상시에는 개별 건전성 규제가 작동해 시스템도 안정적으로 유지된다.
    fails:
      - label: 구성의 오류
        detail: 모두가 동시에 부채를 줄이고 자산을 팔면 개별적으로 합리적인 행동이 집단적 붕괴를 부른다.
        example: 2008년 위기의 디레버리징과 투매 악순환.
    verdict: 개별 합리성과 시스템 안정이 어긋나 거시건전성 감독이 필요함을 보여주는 명제다.
  - id: p44
    statement: 행동경제학이 주류 경제학을 대체할 수 있다
    category: 경제이론
    termIds:
      - behavioral-economics
      - behavioral-finance
      - dsge-model
      - rational-expectations
    premise: 인간의 비합리성을 다루는 행동경제학이 합리성 가정의 주류 경제학을 대신할 수 있다는 기대에 근거한다.
    holds:
      - label: 미시적 설명력
        detail: 개인의 편향과 미시적 의사결정을 설명하는 데 주류 모델보다 강력하다.
    fails:
      - label: 예측력과 체계의 한계
        detail: 편향이 언제 발현될지 예측력이 약하고, 경제 전체를 다루는 통합 거시 이론 체계가 아직 미완이다.
    verdict: 주류를 대체하기보다 미시적 기초·기대 이론과 결합해 보완하는 단계의 명제다.
  - id: p45
    statement: 자산 버블은 부풀 때 식별하고 막을 수 있다
    category: 금융
    termIds:
      - asset-bubble
      - irrational-exuberance
      - efficient-market-hypothesis
      - macroprudential-policy
    premise: 버블을 실시간으로 알아채 정책으로 미리 터뜨리거나 막을 수 있다는 기대에 근거한다.
    holds:
      - label: 극단적 과열 신호
        detail: 밸류에이션과 레버리지가 급증하는 극단적 과열은 거시건전성 정책으로 일부 억제할 수 있다.
    fails:
      - label: 사후성과 타이밍
        detail: 버블과 정상적 상승의 구분이 사후에야 분명해지고 개입 타이밍을 맞추기가 매우 어렵다.
    verdict: 사전 식별과 개입은 부분적으로만 가능하며 타이밍이 핵심 난제인 명제다.
  - id: p46
    statement: 세율을 낮추면 세수가 오히려 늘어난다
    category: 정부
    termIds:
      - laffer-curve
      - tax-cut
      - supply-side-economics
      - national-debt
    premise: 세율과 세수의 관계가 비선형이라는 래퍼 곡선에 근거해 감세가 세수를 늘릴 수 있다고 본다.
    holds:
      - label: 세율이 너무 높은 경우
        detail: 현재 세율이 세수를 극대화하는 지점보다 높은 금지 영역에 있으면 인하가 생산과 세수를 함께 늘릴 수 있다.
    fails:
      - label: 이미 낮은 세율
        detail: 세율이 극대점 왼쪽에 있으면 인하는 곧바로 세수 감소로 이어지며 레이건 시대처럼 재정적자가 커진다.
        example: 레이건·트럼프 감세 후 실제로는 재정적자가 확대됨.
      - label: OECD 내 더 낮은 경쟁국
        detail: 법인세만 낮춰도 헝가리(9%) 등 더 낮은 세율국·조세피난처로 자본·이익이 이동하면 세수·유치 효과가 제한된다.
        example: 아일랜드(12.5%) 대비 헝가리·칠레 등 OECD 저세율국.
    verdict: 현재 세율의 위치에 따라 달라지는 조건부 명제이며 항상 성립하지는 않는다.
  - id: p47
    statement: 감세는 장기 경제 성장을 촉진한다
    category: 경제이론
    termIds:
      - supply-side-economics
      - tax-cut
      - economic-growth
      - trickle-down-effect
    premise: 세율을 낮추면 노동·투자·창업 유인이 살아나 공급 측 성장으로 이어진다는 공급주의에 근거한다.
    holds:
      - label: 공급 측 유인 회복
        detail: 과도한 세 부담이 생산 의욕을 꺾고 있을 때는 감세가 투자와 노동 공급을 늘려 성장에 기여한다.
    fails:
      - label: 트리클다운 미작동
        detail: 추가 소득이 소비·투자보다 저축으로 향하거나 단기 수요가 부족하면 성장 효과는 약하고 불평등만 심화될 수 있다.
      - label: 통계만 부풀리는 FDI·이익 이동
        detail: 법인세 인하가 SPE·IP 귀속 등 조세회피성 자본만 끌어오면 GDP·FDI는 오르지만 고용·가처분소득·분배는 따라가지 않을 수 있다.
        example: 아일랜드 2015년 24.4% GDP 급등(레프러콘 경제학) vs 실업·소비 지표.
    verdict: 구조와 국면에 따라 효과가 갈리며 분배·단기 수요·조세 왜곡 문제를 함께 봐야 하는 명제다.
  - id: p48
    statement: 공급을 늘리면 인플레이션을 잡을 수 있다
    category: 거시경제
    termIds:
      - aggregate-supply
      - inflation
      - supply-shock
      - disinflation
      - tariff
    premise: 값싼 에너지 등으로 총공급을 늘리면 수요를 짓누르지 않고도 물가를 잡는 인플레이션 없는 호황이 가능하다는 발상이다.
    holds:
      - label: 공급견인 물가 하락
        detail: 에너지 증산 등 총공급 확대는 공급 충격의 반대로 작동해 물가를 끌어내리는 디스인플레이션 경로를 연다.
    fails:
      - label: 수요견인·비용상승 상쇄
        detail: 물가 상승이 수요 견인이거나, 같은 정부의 관세가 비용을 밀어 올리면 공급 측 물가 인하 효과가 상쇄된다.
    verdict: 물가 상승의 원인과 동시에 쓰이는 다른 정책에 따라 달라지는 조건부 명제다.
  - id: p49
    statement: 관세와 감세를 함께 쓰면 물가 효과가 상쇄된다
    category: 거시경제
    termIds:
      - supply-side-economics
      - neo-mercantilism
      - tariff
      - tax-cut
      - inflation
    premise: 감세·규제완화·에너지 증산(공급주의)은 디스인플레이션, 관세(신중상주의)는 비용 상승 인플레이션으로 정반대 방향이라는 점에 근거한다.
    holds:
      - label: 두 힘의 충돌
        detail: 한 손의 공급 확대가 물가를 낮추고 다른 손의 관세가 물가를 높여 서로 일부 상쇄되며 물가 경로가 모호해진다.
        example: 감세·에너지 증산과 관세를 함께 추진하는 현 미국 정책의 내적 긴장.
    fails:
      - label: 한쪽의 우세
        detail: 관세 인상 폭이 크거나 에너지 비용까지 오르면 인플레이션 경로가 우세해 상쇄가 무너진다.
    verdict: 두 힘의 상대적 크기에 따라 물가와 중앙은행 대응이 갈리는 레짐 의존적 명제다.
  - id: p50
    statement: 규제를 풀면 경제가 더 빨리 성장한다
    category: 정부
    termIds:
      - deregulation
      - economic-growth
      - supply-side-economics
      - market-failure
    premise: 규제 비용을 줄이면 공급과 투자 유인이 살아나 생산성과 성장이 높아진다는 공급주의에 근거한다.
    holds:
      - label: 과잉 규제 해소
        detail: 불필요한 규제가 비용과 진입장벽을 키우고 있을 때는 완화가 투자와 혁신, 성장을 촉진한다.
    fails:
      - label: 시장 실패 방치
        detail: 외부효과·시스템 위험 등 시장 실패가 있는 영역에서 규제를 풀면 안전·환경·금융 건전성 악화로 더 큰 비용을 부를 수 있다.
        example: 금융 규제 완화가 누적된 뒤 터진 2008년 위기.
    verdict: 규제의 성격과 시장 실패 여부에 따라 효과가 갈리는 조건부 명제다.
  - id: p51
    statement: 총수요를 늘리면 경제가 성장한다
    category: 거시경제
    termIds:
      - aggregate-demand
      - aggregate-supply
      - inflation
      - full-employment
    premise: 지출을 늘려 총수요를 키우면 산출과 고용이 늘어난다는 케인즈식 수요관리에 근거한다.
    holds:
      - label: 유휴 자원이 있을 때
        detail: 불황으로 생산설비와 노동이 놀고 있을 때는 총수요 확대가 물가를 크게 자극하지 않고 산출을 늘린다.
    fails:
      - label: 완전고용 부근
        detail: 경제가 완전고용에 가까우면 총공급이 한계에 부딪혀 추가 수요는 산출보다 물가만 끌어올린다.
    verdict: 총공급 여력(경기 국면)에 따라 성장이 되기도, 물가만 오르기도 하는 조건부 명제다.
  - id: p52
    statement: 재정정책으로 경기를 안정시킬 수 있다
    category: 정부
    termIds:
      - fiscal-policy
      - aggregate-demand
      - multiplier
      - national-debt
    premise: 정부가 지출과 조세로 총수요를 조절해 경기 변동을 완화할 수 있다는 케인즈주의에 근거한다.
    holds:
      - label: 깊은 불황·유동성 함정
        detail: 통화정책이 무력한 깊은 불황에서는 정부 지출의 승수효과가 총수요를 떠받쳐 경기를 회복시킨다.
    fails:
      - label: 시차·부채·구축효과
        detail: 집행 시차와 정치적 왜곡이 있고, 국가부채 누적과 금리 상승으로 민간 투자를 밀어내면 효과가 약해진다.
    verdict: 경기 국면과 재정 여력에 따라 효과가 달라지는 조건부 명제다.
  - id: p53
    statement: 수익률 곡선이 역전되면 경기침체가 온다
    category: 거시경제
    termIds:
      - yield-curve
      - term-spread
      - recession
      - business-cycle
      - interest-rate
    premise: 장기금리가 단기금리보다 낮아지는 장단기 역전이 경기침체를 예고한다는 경험칙에 근거한다.
    holds:
      - label: 강한 선행 신호
        detail: 역사적으로 장단기 금리 역전 뒤 일정 시차를 두고 경기침체가 따라온 사례가 많아 신뢰도 높은 선행지표로 쓰인다.
        example: 미국 국채 10년-2년 금리 역전 후 침체가 뒤따른 여러 사례.
    fails:
      - label: 기간 프리미엄·정책 왜곡
        detail: 양적완화 등으로 장기금리가 인위적으로 눌리면 역전이 침체가 아닌 정책 효과를 반영할 수 있다.
      - label: 시차와 거짓 신호
        detail: 역전과 침체 사이 시차가 길고 들쭉날쭉하며, 역전이 와도 침체가 비껴가는 경우가 있다.
        example: 2022년 역전 이후 침체 시점을 둘러싼 논쟁.
    verdict: 방향성은 강하지만 시점과 신뢰도가 국면에 따라 달라지는 조건부 명제다.
  - id: p54
    statement: 정부가 빚을 내 지출하면 민간 투자가 줄어든다
    category: 거시경제
    termIds:
      - crowding-out-effect
      - fiscal-policy
      - national-debt
      - investment
      - interest-rate
    premise: 정부 차입이 금리를 올려 민간 투자를 밀어낸다는 구축효과에 근거한다.
    holds:
      - label: 완전고용·자금 제약
        detail: 경제가 완전고용에 가깝고 저축이 제한적이면 정부 차입이 금리를 올려 민간 투자를 구축한다.
    fails:
      - label: 불황·유동성 함정
        detail: 유휴자원이 많고 금리가 0에 가까운 불황에서는 구축효과가 약하고 오히려 민간 투자를 끌어들이는 효과가 나타날 수 있다.
    verdict: 경기 국면과 자금 사정에 따라 강도가 달라지는 조건부 명제다.
  - id: p55
    statement: 기준금리를 올리면 자국 통화가 강세가 된다
    category: 국제경제
    termIds:
      - policy-rate
      - exchange-rate
      - interest-rate
      - real-interest-rate
    premise: 금리를 올리면 다른 나라와의 금리차가 벌어져 더 높은 수익을 좇는 외국 자본이 유입되고, 통화 수요가 늘어 환율이 강세가 된다는 금리차·자본이동 논리에 근거한다.
    holds:
      - label: 금리차가 환율을 주도하는 국면
        detail: 위험선호가 안정적이고 자본 이동이 자유로우면 금리 인상이 자본 유입과 통화 강세로 이어진다.
        example: 2022년 미국의 빠른 금리 인상기에 달러가 주요국 통화 대비 큰 폭으로 강세.
    fails:
      - label: 위험회피·자본 이탈
        detail: 금리를 올려도 그 나라의 신용·정치 위험이 커지면 자본이 오히려 빠져나가 통화가 약세가 될 수 있다.
        example: 신흥국이 방어적으로 금리를 올려도 통화가 급락하는 사례.
      - label: 경상수지·정책 신뢰
        detail: 만성적 경상수지 적자나 중앙은행 신뢰 부족 상황에서는 금리 인상의 통화 강세 효과가 약하다.
    verdict: 위험선호가 안정된 정상 국면에서는 대체로 성립하지만, 위기·신뢰 약화 국면에서는 반대로 통화가 약해질 수 있는 조건부 명제다.
  - id: p56
    statement: 양적긴축(QT)을 하면 위험자산 가격이 하락한다
    category: 통화정책
    termIds:
      - quantitative-tightening
      - fed-balance-sheet
      - money-supply
      - stock-market
    premise: 중앙은행이 보유 자산을 줄이면 시중 유동성이 흡수되고 할인율이 높아져, 주식 같은 위험자산의 밸류에이션에 부담을 준다는 유동성 논리에 근거한다.
    holds:
      - label: 유동성 장세
        detail: 실적보다 유동성이 가격을 끌어온 국면에서는 유동성 회수가 위험자산에 직접적인 하방 압력으로 작용한다.
        example: 2022년 연준의 대차대조표 축소와 함께 성장주가 크게 조정.
    fails:
      - label: 강한 펀더멘털
        detail: 기업 실적과 성장이 충분히 강하면 유동성 축소에도 위험자산이 버티거나 오를 수 있다.
      - label: 예고·점진적 진행
        detail: QT가 충분히 예고되어 시장에 선반영되면 실제 진행 시 추가 충격은 제한적이다.
    verdict: 유동성이 가격을 주도한 국면에서는 성립하지만, 펀더멘털과 선반영 정도에 따라 효과가 달라지는 조건부 명제다.
  - id: p57
    statement: 강달러 국면에서는 금값이 약세를 보인다
    category: 원자재
    termIds:
      - strong-dollar
      - gold
      - real-interest-rate
      - exchange-rate
    premise: 금은 달러로 표시되고 이자를 주지 않는 자산이라, 달러와 실질금리가 오르면 보유 매력이 떨어져 가격이 눌린다는 논리에 근거한다.
    holds:
      - label: 실질금리가 주도하는 국면
        detail: 실질금리 상승과 달러 강세가 동반될 때는 무이자 자산인 금의 기회비용이 커져 가격이 약세를 보인다.
    fails:
      - label: 위기·지정학 리스크
        detail: 전쟁·금융위기처럼 안전자산 수요가 폭발하면 달러와 금이 동시에 강세를 보여 역관계가 깨진다.
        example: 지정학적 위기 국면에서 달러와 금이 동반 상승.
      - label: 중앙은행 매입·수급
        detail: 각국 중앙은행의 대규모 금 매입 등 수급 요인이 강하면 달러 흐름과 무관하게 금값이 오를 수 있다.
    verdict: 실질금리가 가격을 주도하는 평상 국면에서는 성립하지만, 위기·수급 변수 앞에서는 깨질 수 있는 조건부 명제다.
  - id: p58
    statement: 기준금리를 올리면 채권 가격이 떨어진다
    category: 채권
    termIds:
      - policy-rate
      - bond-price
      - interest-rate
      - government-bond
    premise: 채권 가격과 시장금리는 역의 관계에 있어, 금리가 오르면 기존에 발행된 고정금리 채권의 상대 매력이 떨어져 가격이 하락한다는 할인 논리에 근거한다.
    holds:
      - label: 금리와 가격의 역관계
        detail: 고정금리 채권은 시장금리가 오르면 현재가치가 낮아져 가격이 하락하며, 만기가 길수록 하락 폭이 크다.
    fails:
      - label: 선반영
        detail: 금리 인상이 이미 시장에 충분히 반영되어 있으면 실제 인상 시 가격이 크게 움직이지 않는다.
      - label: 안전자산 수요·침체 우려
        detail: 기준금리 인상이 경기침체 우려를 키우면 안전자산 수요로 장기 국채 금리가 오히려 내려(가격 상승) 단기와 다르게 움직일 수 있다.
    verdict: 단기적·수학적으로는 거의 항상 성립하지만, 선반영과 만기별 기대 차이로 장기물은 다르게 움직일 수 있는 조건부 명제다.
  - id: p59
    statement: 인플레이션이 높아지면 중앙은행이 기준금리를 올린다
    category: 통화정책
    termIds:
      - inflation
      - policy-rate
      - expected-inflation
      - interest-rate
    premise: 물가안정목표제를 운영하는 중앙은행은 인플레이션이 목표를 넘으면 총수요를 식히기 위해 금리를 올린다는 정책 반응 논리에 근거한다.
    holds:
      - label: 수요 견인·물가목표제
        detail: 경기 과열로 물가가 오르는 국면에서는 중앙은행이 신뢰 유지를 위해 금리를 인상한다.
        example: 2022~2023년 주요국 중앙은행의 연쇄 금리 인상.
    fails:
      - label: 스태그플레이션 딜레마
        detail: 물가와 함께 경기 침체가 진행되면 금리 인상이 경기를 더 위축시킬 수 있어 중앙은행이 주저한다.
      - label: 재정 우위·금융안정
        detail: 정부 부채 부담이나 금융 불안이 크면 물가가 높아도 금리를 충분히 올리지 못하는 경우가 있다.
    verdict: 물가목표제와 수요 견인 국면에서는 성립하지만, 스태그플레이션·재정 제약 앞에서는 지연·약화되는 조건부 명제다.
  - id: p60
    statement: 기대인플레이션이 오르면 실제 물가도 오른다
    category: 거시경제
    termIds:
      - expected-inflation
      - inflation
      - money-supply
    premise: 경제주체가 물가 상승을 예상하면 임금·가격 설정에 미리 반영해 실제 물가가 따라 오른다는 자기실현적 기대 논리에 근거한다.
    holds:
      - label: 기대가 고정되지 않은 경우
        detail: 중앙은행 신뢰가 약해 기대가 풀리면(de-anchored) 임금·가격 인상이 연쇄적으로 일어나 실제 물가를 끌어올린다.
        example: 1970년대 임금·물가 악순환.
    fails:
      - label: 기대가 잘 고정된 경우
        detail: 중앙은행 신뢰가 높아 기대가 목표에 단단히 고정되어 있으면 일시적 기대 변동이 실제 물가로 잘 전이되지 않는다.
    verdict: 기대의 고정 여부가 관건으로, 신뢰가 약할수록 강하게 성립하는 조건부 명제다.
  - id: p61
    statement: 자국 통화가 강세가 되면 무역흑자가 줄어든다
    category: 국제경제
    termIds:
      - exchange-rate
      - trade-surplus
      - trade-deficit
      - strong-dollar
      - weak-dollar
    premise: 통화가 강세가 되면 수출품 가격 경쟁력이 떨어지고 수입품이 싸져, 시간이 지나면 수출이 줄고 수입이 늘어 무역흑자가 축소(무역적자는 확대)된다는 가격 경쟁력 논리에 근거한다.
    holds:
      - label: 가격 탄력적·J커브 이후
        detail: 수출입이 가격에 민감하고 환율 변화가 가격에 충분히 반영된 뒤에는 통화 강세가 무역흑자를 줄이고 무역적자를 키운다.
    fails:
      - label: J커브 초기
        detail: 환율이 바뀐 직후에는 계약 가격·물량 조정이 늦어 무역수지가 한동안 반대로 움직이기도 한다.
      - label: 품질·글로벌 수요 주도
        detail: 수출 경쟁력이 가격보다 품질·기술에 좌우되거나 글로벌 수요가 강하면 환율의 무역수지 효과가 작다.
      - label: 강달러만이 원인이 아닐 때
        detail: 저축 부족·재정적자·자본 유입 등 구조 요인이 무역적자를 키우면 환율만으로 원인을 설명하기 어렵다.
    verdict: 가격 경쟁력이 작동하는 중기에는 성립하지만, J커브 초기·비가격 경쟁력·쌍둥이 적자 구조 앞에서는 약해지는 조건부 명제다.
  - id: p62
    statement: 양적완화(QE)는 채권 금리를 낮춘다
    category: 통화정책
    termIds:
      - quantitative-easing
      - bond-price
      - government-bond
      - interest-rate
      - fed-balance-sheet
    premise: 중앙은행이 국채 등을 대규모로 매입하면 채권 수요가 늘어 가격이 오르고 수익률(금리)이 내려간다는 수급 논리에 근거한다.
    holds:
      - label: 매입 시행·확대 국면
        detail: 중앙은행이 실제로 자산 매입을 늘리는 동안에는 채권 가격이 오르고 장기금리가 눌린다.
        example: 글로벌 금융위기 이후 QE 국면의 장기금리 하락.
    fails:
      - label: 인플레이션 기대 자극
        detail: QE가 과도한 물가 상승 기대를 부르면 장기금리가 오히려 오를 수 있다.
        example: 테이퍼 텐트럼 등 기대 변화에 따른 장기금리 급등.
      - label: 효과 체감
        detail: 이미 금리가 매우 낮은 상태에서는 추가 매입의 금리 인하 효과가 작아진다.
    verdict: 매입을 늘리는 국면에서는 성립하지만, 인플레이션 기대와 효과 체감 앞에서는 약해지는 조건부 명제다.
  - id: p63
    statement: 경제가 성장하면 실업률이 내려간다
    category: 거시경제
    termIds:
      - economic-growth
      - unemployment
      - business-cycle
      - aggregate-demand
    premise: 생산이 늘면 기업이 더 많은 노동을 필요로 해 고용이 늘고 실업률이 내려간다는 오쿤의 법칙에 근거한다.
    holds:
      - label: 정상적 경기 확장
        detail: 총수요가 늘어 생산이 확대되는 국면에서는 성장률 상승이 실업률 하락으로 이어진다.
        example: 경기 회복기에 성장과 함께 실업률이 점진적으로 하락.
    fails:
      - label: 고용 없는 성장
        detail: 자동화·생산성 향상으로 같은 인력으로 더 많이 생산하면 성장해도 고용이 늘지 않을 수 있다.
      - label: 노동시장 경직·시차
        detail: 고용은 경기에 후행하는 경향이 있어 성장 초기에는 실업률이 바로 내려가지 않는다.
    verdict: 정상적 경기 확장기에는 대체로 성립하지만, 생산성 주도 성장과 고용의 시차 앞에서는 약해지는 조건부 명제다.
  - id: p64
    statement: 자국 통화가 약세가 되면 물가가 오른다
    category: 거시경제
    termIds:
      - exchange-rate
      - inflation
      - strong-dollar
      - expected-inflation
    premise: 통화가 약세가 되면 수입품과 원자재의 자국 통화 가격이 올라 전반적 물가를 끌어올린다는 환율 전가(pass-through) 논리에 근거한다.
    holds:
      - label: 수입 의존·높은 전가율
        detail: 에너지·식량 등 수입 의존도가 높고 가격 전가가 빠른 경제에서는 통화 약세가 곧바로 물가 상승으로 이어진다.
        example: 원자재 수입국에서 통화 급락 후 수입물가 급등.
    fails:
      - label: 낮은 전가율·마진 흡수
        detail: 기업이 환율 변동을 가격에 전가하지 않고 마진으로 흡수하거나 수요가 약하면 물가로 잘 전이되지 않는다.
      - label: 글로벌 디스인플레 압력
        detail: 세계적으로 물가 하락 압력이 강하면 통화 약세에도 국내 물가가 크게 오르지 않을 수 있다.
    verdict: 수입 의존도가 높고 전가율이 클수록 성립하지만, 마진 흡수와 수요 약세 앞에서는 약해지는 조건부 명제다.
  - id: p65
    statement: 관세를 올리면 상대국도 보복관세로 맞선다
    category: 국제경제
    termIds:
      - tariff
      - trade-war
      - free-trade
      - comparative-advantage
    premise: 한 나라가 일방적으로 관세를 올리면 상대국이 자국 산업을 지키려 보복관세로 대응해 무역전쟁으로 번진다는 상호 대응 논리에 근거한다.
    holds:
      - label: 교역 상호의존·정치적 대응
        detail: 양국의 교역 규모가 크고 국내 정치 압력이 강하면 관세에 관세로 맞서 갈등이 확대된다.
        example: 2018년 이후 미중 상호 관세 부과.
    fails:
      - label: 협상 타결
        detail: 관세가 협상 카드로 쓰여 합의에 이르면 보복 없이 마무리될 수 있다.
      - label: 보복 여력 부족
        detail: 상대국의 경제 규모나 대체 시장이 작아 보복 여력이 없으면 맞대응이 약하거나 없다.
    verdict: 교역 상호의존이 크고 정치 압력이 높을수록 성립하지만, 협상과 힘의 비대칭 앞에서는 달라지는 조건부 명제다.
  - id: p66
    statement: 외부효과가 있으면 시장은 비효율적이 된다
    category: 미시경제
    termIds:
      - externality
      - market-failure
      - public-goods
    premise: 생산·소비가 제3자에게 미치는 비용이나 편익이 가격에 반영되지 않으면, 시장이 사회적으로 바람직한 수준보다 과다·과소 생산해 비효율이 생긴다는 외부효과 논리에 근거한다.
    holds:
      - label: 큰 부정적 외부효과
        detail: 환경오염처럼 사회적 비용이 큰데 가격에 반영되지 않으면 과잉 생산으로 사회적 손실이 커진다.
        example: 대기오염을 유발하는 생산의 과다.
    fails:
      - label: 코즈 정리(재산권·낮은 거래비용)
        detail: 재산권이 명확하고 협상 비용이 낮으면 당사자 간 거래로 외부효과를 스스로 해결할 수 있다.
      - label: 외부효과가 작은 경우
        detail: 영향이 미미하면 시장 결과의 비효율도 무시할 만하다.
    verdict: 외부효과가 크고 협상이 어려울수록 성립하지만, 재산권·거래비용 조건에 따라 시장이 스스로 해결할 수도 있는 조건부 명제다.
  - id: p67
    statement: 정보 비대칭이 크면 시장이 제대로 작동하지 않는다
    category: 미시경제
    termIds:
      - information-asymmetry
      - market-failure
    premise: 거래 당사자 간 정보 격차가 크면 역선택과 도덕적 해이가 생겨 좋은 상품이 시장에서 밀려나거나 거래 자체가 위축된다는 정보경제학 논리에 근거한다.
    holds:
      - label: 역선택이 강한 시장
        detail: 중고차·보험·신용 시장처럼 품질·위험 정보가 한쪽에 치우치면 거래가 위축되거나 가격이 왜곡된다.
        example: 중고차 시장의 레몬 문제.
    fails:
      - label: 신호·선별 장치
        detail: 보증·자격증·평판·공시 같은 신호와 선별 장치가 작동하면 정보 격차가 줄어 시장이 회복된다.
    verdict: 정보 격차가 크고 보완 장치가 없을수록 성립하지만, 신호·선별·규제로 상당 부분 완화되는 조건부 명제다.
  - id: p68
    statement: 독점기업은 생산을 줄이고 가격을 올린다
    category: 미시경제
    termIds:
      - monopoly
      - perfect-competition
      - market-failure
    premise: 시장지배력을 가진 독점기업은 한계수입이 가격보다 낮아, 이윤을 극대화하려 경쟁시장보다 적게 생산하고 높은 가격을 매긴다는 독점 이론에 근거한다.
    holds:
      - label: 진입장벽 높은 독점
        detail: 신규 진입이 어려운 독점에서는 산출을 제한하고 가격을 올려 소비자 후생이 줄어든다.
    fails:
      - label: 경합시장(잠재적 경쟁)
        detail: 진입이 쉬워 잠재적 경쟁 위협이 크면 독점기업도 가격을 함부로 올리지 못한다.
      - label: 규제·혁신 유인
        detail: 가격 규제가 있거나 독점 이윤이 혁신 투자로 이어지면 단순한 산출 제한 논리와 달라진다.
    verdict: 진입장벽이 높은 독점에서는 성립하지만, 경합시장·규제 앞에서는 약해지는 조건부 명제다.
  - id: p69
    statement: 공공재는 시장이 충분히 공급하지 못한다
    category: 미시경제
    termIds:
      - public-goods
      - market-failure
      - externality
    premise: 여러 사람이 동시에 쓰고(비경합) 대가를 안 낸 사람을 배제하기 어려운(비배제) 공공재는, 무임승차 때문에 민간이 충분히 공급할 유인이 없다는 공공재 이론에 근거한다.
    holds:
      - label: 순수 공공재
        detail: 국방·치안·기초연구처럼 배제가 어렵고 무임승차가 심한 재화는 시장이 과소 공급해 정부 공급이 필요하다.
    fails:
      - label: 배제가 가능해지는 경우
        detail: 기술로 이용자를 배제할 수 있게 되면(유료화·구독) 민간 공급이 가능해진다.
      - label: 자발적 공급
        detail: 커뮤니티·민간의 자발적 기여나 평판 유인으로 일부 공공재가 공급되기도 한다.
    verdict: 순수 공공재일수록 성립하지만, 배제 가능성과 자발적 공급 여지에 따라 달라지는 조건부 명제다.
  - id: p70
    statement: 물가가 내려가면(디플레이션) 경기가 더 나빠진다
    category: 거시경제
    termIds:
      - deflation
      - aggregate-demand
      - recession
      - business-cycle
    premise: 물가가 지속 하락하면 소비·투자를 미루고 실질 부채 부담이 커져 총수요가 더 위축된다는 부채-디플레이션 논리에 근거한다.
    holds:
      - label: 수요 부진발 디플레이션
        detail: 수요 위축으로 물가가 떨어지고 부채가 많은 경제에서는 소비 지연과 실질부채 증가가 악순환을 만든다.
        example: 1930년대 대공황, 일본의 장기 디플레이션.
    fails:
      - label: 공급 개선발 '좋은 디플레이션'
        detail: 생산성 향상이나 기술 발전으로 비용이 낮아져 물가가 내리는 경우에는 성장과 물가 하락이 함께 갈 수 있다.
      - label: 일시적·완만한 하락
        detail: 기대가 안정된 상태의 일시적 물가 하락은 악순환으로 이어지지 않는다.
    verdict: 수요 부진과 높은 부채가 결합된 디플레이션에서는 성립하지만, 공급 개선발 디플레이션에서는 깨질 수 있는 조건부 명제다.
  - id: p71
    statement: 연준이 통화정책 방향을 바꾸면 주식시장이 크게 출렁인다
    category: 통화정책
    termIds:
      - federal-reserve
      - stock-market
      - policy-rate
      - quantitative-easing
    premise: 연준의 금리·유동성 결정과 발언이 할인율과 시중 유동성, 위험선호를 바꿔 위험자산 가격을 좌우한다는 논리에 근거한다.
    holds:
      - label: 유동성 장세·정책 전환점
        detail: 유동성이 가격을 끌어온 국면이나 금리 방향이 바뀌는 전환점(피벗)에서는 연준의 신호가 증시를 크게 움직인다.
        example: 연준의 긴축 전환 시사에 증시가 급락한 사례.
    fails:
      - label: 펀더멘털 우위
        detail: 기업 실적과 성장이 압도적으로 강하면 연준 신호에도 증시가 견딘다.
      - label: 선반영·예상대로
        detail: 정책이 시장 예상대로 나오거나 이미 선반영되면 실제 발표 시 반응이 작다.
    verdict: 유동성 장세와 정책 전환점에서는 강하게 성립하지만, 펀더멘털과 선반영 앞에서는 약해지는 조건부 명제다.
  - id: p72
    statement: 금리가 오르면 가계의 빚 부담이 커진다
    category: 금융
    termIds:
      - interest-rate
      - household-debt
      - policy-rate
      - consumption
    premise: 금리가 오르면 변동금리 대출과 신규 차입의 이자가 늘어 원리금 상환 부담이 커지고 소비 여력이 줄어든다는 논리에 근거한다.
    holds:
      - label: 변동금리·고부채 가계
        detail: 변동금리 비중이 높고 부채가 많은 가계는 금리 인상이 곧바로 이자 부담 증가로 이어진다.
        example: 주택담보대출 변동금리 비중이 높은 경제에서 금리 인상 후 가계 이자 부담 급증.
    fails:
      - label: 고정금리·장기 만기
        detail: 고정금리 비중이 높거나 만기가 길면 금리 인상이 당장의 상환 부담으로 전이되지 않는다.
      - label: 소득 증가 상쇄
        detail: 임금 상승 등 소득이 함께 늘면 이자 부담 증가가 상쇄될 수 있다.
    verdict: 변동금리 비중과 부채 수준이 높을수록 성립하는 조건부 명제다.
  - id: p73
    statement: 구리 가격은 경기를 미리 알려준다 (닥터 코퍼)
    category: 원자재
    termIds:
      - copper
      - gdp
      - real-gdp
      - business-cycle
    premise: 구리는 건설·제조업 전반에 광범위하게 쓰여 수요가 실물경기와 직결되므로, 가격이 경기를 선행해서 보여준다는 경험적 논리에 근거한다.
    holds:
      - label: 산업 수요가 주도하는 국면
        detail: 실물 수요가 구리 가격을 움직이는 국면에서는 구리 가격이 경기 방향의 선행 신호로 작동한다.
    fails:
      - label: 공급 충격·투기
        detail: 광산 파업·재고 변화 같은 공급 요인이나 투기적 자금이 가격을 움직이면 경기 신호가 흐려진다.
      - label: 특정국 수요 편중
        detail: 중국 등 특정국 수요에 크게 좌우되면 글로벌 경기와의 연결이 약해진다.
    verdict: 산업 수요가 가격을 주도하는 국면에서는 유효하지만, 공급·투기·수요 편중 앞에서는 신호가 교란되는 조건부 명제다.
  - id: p74
    statement: 법인세를 내리면 주가가 오른다
    category: 금융
    termIds:
      - corporate-tax
      - stock-market
      - investment
    premise: 법인세 인하는 기업의 세후 이익과 배당 여력을 키워 기업 가치 평가에 우호적으로 작용한다는 논리에 근거한다.
    holds:
      - label: 이익 개선이 반영되는 시장
        detail: 세후 이익 증가가 곧바로 가격에 반영되는 국면에서는 법인세 인하가 주가에 호재로 작용한다.
        example: 법인세 인하 정책 발표 후 관련 지수 상승.
    fails:
      - label: 선반영
        detail: 감세가 이미 예상·반영되어 있으면 실제 시행 시 추가 상승이 제한된다.
      - label: 재정·금리 부작용
        detail: 감세가 재정적자와 금리 상승 우려를 키우거나 경기 둔화가 이익을 압도하면 주가가 오르지 않을 수 있다.
    verdict: 세후 이익 경로로 대체로 우호적이지만, 선반영과 재정·경기 변수에 따라 달라지는 조건부 명제다.
  - id: p75
    statement: 경기침체가 오면 주가가 떨어진다
    category: 금융
    termIds:
      - recession
      - stock-market
      - gdp
      - unemployment
    premise: 침체는 기업 이익과 고용 전망을 악화시켜 위험자산을 회피하게 만든다는 논리에 근거한다.
    holds:
      - label: 이익 전망 악화 본격화
        detail: 침체로 기업 이익 전망이 꺾이는 국면에서는 주가가 하락 압력을 받는다.
    fails:
      - label: 주가의 선행성
        detail: 주가는 경기를 선행하므로 침체가 '확인'되는 시점에는 이미 바닥을 치고 반등하는 경우가 많다.
      - label: 정책 부양 기대
        detail: 침체에 대응한 금리 인하·부양책 기대가 크면 침체 중에도 주가가 오를 수 있다.
    verdict: 침체 진입 국면에서는 성립하지만, 주가의 선행성과 정책 기대 탓에 시점이 어긋나는 조건부 명제다.
  - id: p76
    statement: 공급 충격은 스태그플레이션을 일으킨다
    category: 거시경제
    termIds:
      - supply-shock
      - stagflation
      - inflation
      - unemployment
    premise: 유가 등 비용 측 충격은 물가를 끌어올리는 동시에 생산과 고용을 위축시켜, 인플레이션과 실업이 함께 오르는 스태그플레이션을 부른다는 논리에 근거한다.
    holds:
      - label: 크고 지속적인 에너지·원자재 충격
        detail: 광범위한 비용 충격은 물가 상승과 경기 위축을 동시에 일으켜 정책 대응을 어렵게 만든다.
        example: 1970년대 오일쇼크.
    fails:
      - label: 일시적·작은 충격
        detail: 충격이 작고 일시적이면 물가에 미치는 영향이 제한적이다.
      - label: 기대 안정·공급 대체
        detail: 인플레이션 기대가 잘 고정되어 있고 대체 공급원이 빠르게 작동하면 충격이 흡수된다.
    verdict: 크고 지속적인 공급 충격에서는 성립하지만, 충격이 작거나 기대가 안정되면 약해지는 조건부 명제다.
  - id: p77
    statement: 자산 버블이 꺼지면 금융위기로 번진다
    category: 금융
    termIds:
      - asset-bubble
      - global-financial-crisis
      - systemic-risk
    premise: 빚으로 부푼 자산 가격이 무너지면 담보가치 하락과 부실, 연쇄적 디레버리징으로 금융시스템 전반의 위기로 확산된다는 논리에 근거한다.
    holds:
      - label: 레버리지로 부푼 버블
        detail: 부채와 금융기관이 깊이 얽힌 버블이 붕괴하면 시스템 리스크로 번진다.
        example: 2008년 서브프라임 버블 붕괴와 글로벌 금융위기.
    fails:
      - label: 레버리지·연결이 약한 버블
        detail: 차입이 적고 금융시스템과 연결이 약한 자산의 버블은 붕괴해도 위기로 잘 번지지 않는다.
        example: 닷컴 버블 붕괴는 금융시스템 위기로 크게 번지지 않음.
    verdict: 부채와 금융 연결이 깊은 버블일수록 성립하지만, 레버리지가 낮으면 붕괴해도 시스템 위기로 가지 않는 조건부 명제다.
  - id: p78
    statement: 군중 심리(쏠림)가 자산 버블을 키운다
    category: 금융
    termIds:
      - herd-behavior
      - asset-bubble
      - irrational-exuberance
    premise: 남을 따라 사는 쏠림 행동은 가격을 펀더멘털에서 벗어나게 하고 자기강화적으로 더 끌어올려 버블을 부풀린다는 행동재무학 논리에 근거한다.
    holds:
      - label: 정보 부족·FOMO 국면
        detail: 정보가 부족하고 '뒤처질 수 없다'는 심리가 강하면 쏠림이 가격을 과열시킨다.
        example: 급등기 개인 자금의 추격 매수.
    fails:
      - label: 교정 메커니즘 작동
        detail: 차익거래·공매도 등 가격을 되돌리는 메커니즘이 잘 작동하면 쏠림이 오래 가지 못한다.
      - label: 펀더멘털 뒷받침
        detail: 가격 상승이 실제 실적·성장으로 뒷받침되면 버블이 아니라 정당화된 상승일 수 있다.
    verdict: 교정 장치가 약하고 심리가 과열될수록 성립하는 조건부 명제다.
  - id: p79
    statement: 자본이 쌓이면 경제가 성장한다
    category: 경제이론
    termIds:
      - capital-accumulation
      - economic-growth
      - investment
    premise: 투자로 자본 스톡이 늘면 1인당 생산능력이 커져 경제가 성장한다는 자본축적·성장이론에 근거한다.
    holds:
      - label: 자본이 부족한 발전 초기
        detail: 자본이 희소한 단계에서는 투자 확대가 생산능력을 크게 늘려 빠른 성장을 이끈다.
        example: 고도성장기 신흥국의 대규모 투자 주도 성장.
    fails:
      - label: 수확체감
        detail: 자본이 이미 풍부한 선진국에서는 추가 자본의 성장 기여가 점차 줄어든다.
      - label: 제도·기술 부재
        detail: 재산권·법치·기술 같은 토대 없이 자본만 투입하면 성장으로 잘 이어지지 않는다.
    verdict: 자본이 부족한 단계에서는 강하게 성립하지만, 수확체감과 제도·기술 조건 앞에서는 약해지는 조건부 명제다.
  - id: p80
    statement: 감세를 하면서 지출을 줄이지 않으면 국가부채가 늘어난다
    category: 정부
    termIds:
      - reaganomics
      - national-debt
      - tax-cut
      - fiscal-policy
    premise: 세수가 줄어드는데 지출을 그대로 유지하면 재정적자가 누적되어 국가부채가 불어난다는 재정 산식에 근거한다.
    holds:
      - label: 감세 효과가 세수 손실을 못 메울 때
        detail: 감세의 경기 자극 효과가 줄어든 세수를 메우지 못하고 지출도 유지되면 부채가 늘어난다.
        example: 레이건 시대 감세 이후 재정적자·국가부채 급증.
    fails:
      - label: 강한 성장·세수 증대
        detail: 감세가 충분히 강한 성장과 세수 증가를 부르면 부채 증가가 제한될 수 있다(드물게).
      - label: 지출 동반 삭감
        detail: 감세와 함께 정부 지출을 줄이면 적자 확대를 막을 수 있다.
    verdict: 지출 삭감이나 강한 성장 효과가 없으면 부채 증가가 일반적인 조건부 명제다.
  - id: p81
    statement: 물가지표가 예상보다 높게 나오면 금리 인상 기대가 커진다
    category: 통화정책
    termIds:
      - cpi
      - pce
      - core-pce
      - policy-rate
      - stock-market
    premise: 연준이 CPI·PCE 같은 물가지표를 기준으로 통화정책을 결정하므로, 물가가 예상보다 높으면 시장은 금리 인상(또는 인하 지연)을 예상한다는 논리에 근거한다.
    holds:
      - label: 물가가 정책 초점인 국면
        detail: 인플레이션이 정책의 최우선 변수일 때는 물가지표 서프라이즈가 금리 기대와 자산 가격을 곧바로 움직인다.
        example: 예상보다 높은 CPI 발표에 금리 인상 기대가 커지고 증시가 하락한 사례.
    fails:
      - label: 고용·금융안정이 우선일 때
        detail: 고용 둔화나 금융 불안이 더 시급하면 물가가 높아도 연준이 인상에 신중해진다.
      - label: 일시적 요인으로 해석될 때
        detail: 물가 상승이 일시적·기저효과로 판단되면 정책 기대가 크게 흔들리지 않는다.
    verdict: 물가가 정책 초점인 국면에서는 강하게 성립하지만, 고용·금융안정이 앞서거나 일시적 요인으로 해석되면 약해지는 조건부 명제다.
  - id: p82
    statement: 물가 상승세가 꺾이면(디스인플레이션) 금리 인하 여지가 생긴다
    category: 통화정책
    termIds:
      - disinflation
      - interest-rate
      - policy-rate
      - expected-inflation
    premise: 물가 상승률이 둔화되어 디스인플레이션이 확인되면 중앙은행이 긴축을 풀고 금리를 내릴 명분이 생긴다는 논리에 근거한다.
    holds:
      - label: 물가 둔화가 추세로 확인될 때
        detail: 여러 지표에서 물가 상승세 둔화가 확인되면 중앙은행이 금리 인하로 방향을 틀 여지가 넓어진다.
    fails:
      - label: 기대인플레이션이 높게 고착
        detail: 기대인플레이션이 여전히 높으면 일시적 둔화만으로는 인하에 나서지 않는다.
      - label: 고용·자산가격 과열
        detail: 고용이 과열이거나 자산 버블 우려가 크면 물가가 꺾여도 인하를 미룬다.
    verdict: 물가 둔화가 추세로 확인되고 기대가 안정될 때 성립하는 조건부 명제다.
  - id: p83
    statement: 공급망이 막히면 물가가 오른다
    category: 거시경제
    termIds:
      - supply-chain
      - inflation
      - manufacturing
    premise: 공급망 차질은 생산·물류 비용을 높이고 재화 공급을 줄여 물가 상승 압력으로 작용한다는 논리에 근거한다.
    holds:
      - label: 광범위·지속적 차질
        detail: 주요 부품·물류의 병목이 광범위하고 오래가면 비용 상승이 가격에 전가되어 물가가 오른다.
        example: 팬데믹 이후 반도체·물류 병목으로 인한 물가 상승.
    fails:
      - label: 수요 약세
        detail: 수요가 약하면 기업이 비용 상승을 가격에 전가하지 못해 물가로 잘 이어지지 않는다.
      - label: 빠른 정상화·대체
        detail: 차질이 일시적이고 대체 공급원이 빠르게 작동하면 물가 영향이 제한된다.
    verdict: 차질이 광범위·지속적이고 수요가 받쳐줄 때 성립하는 조건부 명제다.
  - id: p84
    statement: 실업이 늘면 소비가 줄어든다
    category: 거시경제
    termIds:
      - unemployment
      - consumption
      - recession
    premise: 실업 증가는 가계의 소득과 소득 기대를 떨어뜨려 소비를 위축시킨다는 논리에 근거한다.
    holds:
      - label: 고용이 소득의 주된 원천일 때
        detail: 근로소득 의존도가 높은 가계에서 실업이 늘면 소비가 눈에 띄게 줄어든다.
    fails:
      - label: 안전망·저축 완충
        detail: 실업급여 등 사회안전망과 저축이 두터우면 소비 위축이 완화된다.
      - label: 정부 이전지출
        detail: 정부의 현금 지원이 소득 공백을 메우면 소비가 크게 줄지 않는다.
    verdict: 안전망·저축·이전지출이 약할수록 강하게 성립하는 조건부 명제다.
  - id: p86
    statement: 저금리가 오래 지속되면 좀비기업이 늘어난다
    category: 금융
    termIds:
      - interest-rate
      - zombie-firm
      - economic-growth
    premise: 낮은 금리는 이자도 제대로 못 갚는 부실기업의 차환을 쉽게 만들어 퇴출되어야 할 기업을 연명시킨다는 논리에 근거한다.
    holds:
      - label: 장기 저금리·느슨한 신용
        detail: 저금리가 오래가고 대출이 느슨하면 한계기업이 정리되지 않고 누적되어 생산성과 성장을 갉아먹는다.
        example: 장기 저금리기에 좀비기업 비중이 늘어난 사례.
    fails:
      - label: 구조조정·퇴출 작동
        detail: 부실기업 정리와 시장 퇴출 메커니즘이 잘 작동하면 저금리에도 좀비기업이 누적되지 않는다.
      - label: 금리 정상화
        detail: 금리가 오르면 차환이 어려워져 한계기업이 자연스럽게 정리된다.
    verdict: 저금리가 길고 퇴출 메커니즘이 약할수록 성립하는 조건부 명제다.
  - id: p87
    statement: 자본이득세를 올리면 주식 투자 매력이 떨어진다
    category: 정부
    termIds:
      - capital-gains-tax
      - stock-market
      - investment
    premise: 자본이득세 인상은 매도 차익에 대한 세부담을 키워 실현 유인과 세후 기대수익을 낮춘다는 논리에 근거한다.
    holds:
      - label: 세후 수익이 의사결정을 좌우할 때
        detail: 세후 수익에 민감한 투자자가 많으면 자본이득세 인상이 매도·관망을 유발해 주식 매력을 낮춘다.
    fails:
      - label: 대체 투자처 부재
        detail: 마땅한 대안이 없으면 세금이 올라도 자금이 주식에 머문다.
      - label: 성장 기대 우위
        detail: 강한 성장·실적 기대가 세부담을 압도하면 영향이 제한된다.
    verdict: 세후 수익 민감도가 높고 대안이 있을 때 성립하는 조건부 명제다.
  - id: p88
    statement: 제도(재산권·법치)의 질이 장기 성장을 좌우한다
    category: 경제이론
    termIds:
      - institutional-economics
      - economic-growth
      - capital-accumulation
    premise: 재산권 보호와 법치 같은 제도가 투자·혁신의 유인을 결정하므로, 제도의 질이 장기 경제성장의 근본 요인이라는 제도경제학 논리에 근거한다.
    holds:
      - label: 제도 격차가 클 때
        detail: 비슷한 자원·자본을 가져도 제도가 좋은 경제가 더 높은 장기 성장을 보인다.
        example: 재산권·법치가 약한 나라에서 자본 투입에도 성장이 정체된 사례.
    fails:
      - label: 단기 자원·경기 변수
        detail: 단기적으로는 자원 붐이나 경기 요인이 성장을 더 크게 좌우할 수 있다.
      - label: 측정의 어려움
        detail: 제도의 질은 계량화가 어려워 인과를 단정하기 힘든 경우가 있다.
    verdict: 장기·국가 간 비교에서 강하게 성립하지만, 단기에는 다른 변수에 가려지는 조건부 명제다.
  - id: p89
    statement: 반도체 수출통제는 글로벌 공급망을 흔든다
    category: 국제경제
    termIds:
      - export-control
      - semiconductor
      - supply-chain
    premise: 반도체는 산업 전반의 핵심 부품이라 특정국에 대한 장비·기술 수출통제가 생산·조달 경로를 끊어 공급망 전반을 교란한다는 논리에 근거한다.
    holds:
      - label: 대체가 어려운 핵심 기술
        detail: 첨단 공정처럼 대체 공급원이 거의 없는 영역에서는 수출통제가 공급망에 큰 충격을 준다.
        example: 대중 반도체 장비 수출통제.
    fails:
      - label: 자급·우회로 확보
        detail: 통제 대상국이 자체 생산이나 우회 조달로 대응하면 충격이 시간이 지나며 완화된다.
      - label: 범용·대체 가능 품목
        detail: 범용 반도체처럼 공급원이 많은 품목은 통제 효과가 작다.
    verdict: 대체가 어려운 핵심 기술일수록 성립하지만, 자급·우회로가 마련되면 효과가 약해지는 조건부 명제다.
  - id: p91
    statement: 시중에 돈이 풀리면 자산 가격이 오른다
    category: 금융
    termIds:
      - liquidity
      - stock-market
      - quantitative-easing
    premise: 유동성이 풍부해지면 할인율이 낮아지고 갈 곳 없는 자금이 위험자산으로 몰려 가격을 끌어올린다는 논리에 근거한다.
    holds:
      - label: 완화적 통화·유동성 장세
        detail: 저금리와 양적완화로 유동성이 넘치는 국면에서는 주식·부동산 등 자산 가격이 함께 오른다.
        example: 대규모 양적완화 시기의 자산 가격 동반 상승.
    fails:
      - label: 실물로 흘러가지 않을 때
        detail: 유동성이 위험자산이 아니라 안전자산·예금에 묶이면 자산 가격을 밀어 올리지 못한다.
      - label: 펀더멘털 악화 동반
        detail: 이익 전망이 크게 나빠지면 유동성이 풍부해도 가격이 오르지 않는다.
    verdict: 완화적 유동성 장세에서는 강하게 성립하지만, 자금이 실물·위험자산으로 가지 않거나 펀더멘털이 무너지면 깨지는 조건부 명제다.
  - id: p92
    statement: 통화를 평가절하하면 수출 경쟁력이 올라간다
    category: 국제경제
    termIds:
      - devaluation
      - trade-surplus
      - exchange-rate
    premise: 자국 통화 가치가 낮아지면 수출품의 외화 표시 가격이 싸져 가격 경쟁력이 높아진다는 논리에 근거한다.
    holds:
      - label: 가격에 민감한 수출 구조
        detail: 가격 경쟁이 중요한 품목에서는 평가절하가 수출 물량을 늘려 무역수지를 개선한다.
    fails:
      - label: 수입 의존·전가
        detail: 원자재·부품을 수입에 의존하면 수입물가 상승이 비용을 키워 효과가 상쇄된다.
      - label: J커브 효과
        detail: 초기에는 무역수지가 오히려 악화됐다가 시차를 두고 개선되는 J커브가 나타난다.
      - label: 경쟁적 평가절하
        detail: 상대국도 통화를 함께 낮추면 경쟁력 우위가 사라진다.
    verdict: 가격 민감 품목에서는 성립하지만, 수입 의존·J커브·경쟁적 절하 앞에서는 효과가 제한되는 조건부 명제다.
  - id: p93
    statement: 신용등급이 강등되면 빌리는 비용이 올라간다
    category: 금융
    termIds:
      - credit-rating
      - credit-spread
      - government-bond
    premise: 신용등급 하락은 부도 위험이 커졌다는 신호라, 투자자들이 더 높은 가산금리를 요구해 조달 비용이 오른다는 논리에 근거한다.
    holds:
      - label: 위험에 민감한 시장
        detail: 신용 위험을 가격에 즉시 반영하는 시장에서는 강등이 가산금리 상승과 조달비용 증가로 이어진다.
        example: 국가·기업 신용등급 강등 직후 채권 금리 급등.
    fails:
      - label: 이미 선반영
        detail: 강등이 예상되어 금리에 미리 반영되어 있으면 실제 강등 시 추가 영향이 작다.
      - label: 안전자산 지위
        detail: 기축통화국 국채처럼 안전자산 지위가 견고하면 강등에도 조달비용이 크게 오르지 않기도 한다.
    verdict: 위험에 민감한 시장에서는 성립하지만, 선반영되었거나 안전자산 지위가 강하면 약해지는 조건부 명제다.
  - id: p94
    statement: 한 은행에서 시작된 뱅크런은 금융시스템 전체로 번질 수 있다
    category: 금융
    termIds:
      - bank-run
      - systemic-risk
      - liquidity
      - deposit-insurance
      - lender-of-last-resort
    premise: 한 은행의 예금 인출 사태가 다른 은행에 대한 불신으로 번지면 연쇄 인출과 유동성 고갈로 시스템 전체가 흔들린다는 논리에 근거한다.
    holds:
      - label: 불안이 전염되는 국면
        detail: 은행 간 연결이 깊고 예금자 신뢰가 약하면 한 곳의 뱅크런이 빠르게 전염된다.
        example: 2023년 일부 미국 지역은행 연쇄 예금 이탈.
    fails:
      - label: 예금보험·최종대부자
        detail: 예금보험과 중앙은행의 유동성 공급이 작동하면 인출 사태가 한 은행에 그친다.
      - label: 건전성이 확인될 때
        detail: 다른 은행의 건전성이 분명하면 불신이 번지지 않는다.
    verdict: 신뢰가 약하고 안전장치가 부실할수록 성립하지만, 예금보험·최종대부자가 작동하면 차단되는 조건부 명제다.
  - id: p95
    statement: 레버리지를 크게 쓰면 수익도 손실도 함께 커진다
    category: 금융
    termIds:
      - leverage-effect
      - debt-ratio
      - systemic-risk
    premise: 빌린 돈을 지렛대로 쓰면 자기자본 대비 수익률이 확대되지만, 손실도 같은 배수로 커진다는 레버리지의 양면성에 근거한다.
    holds:
      - label: 가격이 예상대로 움직일 때
        detail: 투자 방향이 맞으면 레버리지가 수익률을 크게 끌어올린다.
      - label: 가격이 반대로 갈 때
        detail: 방향이 틀리면 손실이 증폭되고, 증거금 부족 시 강제 청산으로 위험이 커진다.
    fails:
      - label: 변동성이 매우 낮을 때
        detail: 가격 변동이 거의 없으면 레버리지의 확대 효과 자체가 작다.
    verdict: 방향이 맞으면 수익을, 틀리면 손실을 증폭하는 양날의 칼로, 변동성이 클수록 위험이 커지는 조건부 명제다.
  - id: p96
    statement: 과점 시장에서는 기업들이 담합하기 쉽다
    category: 미시경제
    termIds:
      - oligopoly
      - cartel
      - consumer-welfare
    premise: 소수의 기업만 경쟁하는 과점에서는 서로의 행동을 관찰·조율하기 쉬워 가격·생산량을 담합할 유인이 커진다는 논리에 근거한다.
    holds:
      - label: 기업 수가 적고 제품이 비슷할 때
        detail: 참가자가 적고 감시가 쉬우면 담합이 형성·유지되어 가격이 오르고 소비자 후생이 줄어든다.
    fails:
      - label: 이탈 유인·경쟁당국 규제
        detail: 몰래 가격을 낮춰 점유율을 늘리려는 이탈 유인이 크거나 담합 규제가 강하면 카르텔이 깨진다.
      - label: 신규 진입
        detail: 새 경쟁자가 진입하면 담합이 무너진다.
    verdict: 기업 수가 적고 감시가 쉬울수록 성립하지만, 이탈 유인·규제·신규 진입 앞에서는 무너지는 조건부 명제다.
  - id: p97
    statement: 가산금리(신용 스프레드)가 급격히 벌어지면 경기침체 신호다
    category: 금융
    termIds:
      - credit-spread
      - recession
      - credit-crunch
    premise: 신용 스프레드 확대는 투자자들이 부도 위험을 크게 본다는 뜻이라, 자금 경색과 경기 둔화의 선행 신호로 읽힌다는 논리에 근거한다.
    holds:
      - label: 위험회피가 확산될 때
        detail: 스프레드가 빠르게 벌어지면 기업 자금 조달이 막히고 투자·고용이 위축되어 침체로 이어지기 쉽다.
        example: 금융위기 직전 회사채 스프레드 급등.
    fails:
      - label: 일시적 수급 요인
        detail: 특정 섹터의 일시적 충격으로 스프레드가 벌어진 경우는 전체 경기 신호가 아닐 수 있다.
      - label: 정책 개입
        detail: 중앙은행의 유동성 공급이 스프레드를 빠르게 되돌리면 침체로 이어지지 않는다.
    verdict: 위험회피가 광범위하게 확산될 때 성립하지만, 일시적 수급이나 정책 개입 앞에서는 약해지는 조건부 명제다.
  - id: p98
    statement: 전쟁이 터져도 1년 뒤 증시 방향은 그때의 거시환경이 결정한다
    category: 국제경제
    termIds:
      - geopolitical-risk
      - stock-market
      - business-cycle
      - recession
    premise: 전쟁 같은 지정학 충격은 단기 위험 프리미엄을 높여 주가를 떨어뜨리지만 그 효과는 대체로 한 달 안팎의 단기에 소멸하고, 이후 방향은 충격이 발생한 시점의 경기 국면과 통화정책 스탠스가 결정한다는 실증 연구에 근거한다.
    holds:
      - label: 경기 확장 + 완화적 통화정책
        detail: 경기가 확장 중이거나 밸류에이션이 충분히 낮고 정부가 돈을 풀면 단기 충격 뒤 1년 수익률이 플러스로 돌아선다.
        example: 2001년 9·11 당시 한국 증시는 PBR 0.78의 바닥이라 1년 뒤 +38%, 걸프전·이라크전도 1년 후 큰 폭 상승.
    fails:
      - label: 경기 둔화 + 긴축
        detail: 경기가 둔화되는데 인플레이션으로 중앙은행이 긴축하면 충격 이후에도 증시가 1년간 더 하락한다.
        example: 2022년 우크라이나 전쟁은 고인플레·금리 인상기와 겹쳐 한국·미국 증시 모두 1년 뒤 마이너스.
    verdict: 전쟁 자체보다 발발 시점의 경기 국면과 통화정책이 중기 수익률을 좌우하는 조건부 명제다.
  - id: p99
    statement: 지정학 위기가 오면 안전자산으로 돈이 몰린다
    category: 금융
    termIds:
      - geopolitical-risk
      - safe-haven-asset
      - risk-off
      - gold
    premise: 불확실성이 커지면 투자자들이 위험자산을 팔고 금·달러·국채 같은 안전자산으로 갈아탄다는 위험회피 논리에 근거한다.
    holds:
      - label: 갑작스러운 큰 충격
        detail: 예상치 못한 큰 지정학 충격 직후 단기에는 안전자산 가격이 오르고 위험자산이 눌린다.
    fails:
      - label: 인플레·금리 동반 상승
        detail: 물가와 금리가 함께 오르는 국면에서는 안전자산으로 여겨지던 국채마저 약세를 보일 수 있다.
        example: 2022년에는 위기에도 채권 가격이 함께 하락.
      - label: 위기 선반영
        detail: 시장이 위기를 이미 가격에 반영했으면 추가 자금 이동이 작다.
    verdict: 갑작스러운 충격 직후 단기에 성립하지만, 인플레·금리 환경에 따라 안전자산도 흔들리는 조건부 명제다.
  - id: p100
    statement: 지정학 리스크로 유가가 급등하면 증시에 악재다
    category: 거시경제
    termIds:
      - crude-oil
      - geopolitical-risk
      - inflation
      - stock-market
    premise: 전쟁이 유가·원자재를 끌어올리면 인플레이션이 가속되고 중앙은행이 긴축으로 대응해 밸류에이션이 눌리며, 기업 비용 상승으로 이익이 줄어 주가를 압박한다는 논리에 근거한다.
    holds:
      - label: 산유 지역 분쟁 + 높은 인플레
        detail: 공급 차질로 유가가 급등하고 이미 물가 압력이 높은 국면에서는 긴축이 강화되어 증시가 하락한다.
        example: 2022년 브렌트유가 90달러에서 130달러를 넘으며 긴축과 증시 하락을 부추김.
    fails:
      - label: 여유 생산능력·비축 방출
        detail: 여유 생산능력이나 전략비축 방출로 유가가 빠르게 안정되면 충격이 제한된다.
      - label: 수요 둔화발 유가 하락
        detail: 경기 둔화로 유가가 오히려 내리면 인플레 압력이 줄어든다.
    verdict: 인플레이션 압력이 높은 국면일수록 강하게 성립하는 조건부 명제다.
  - id: p101
    statement: 위험회피 국면엔 한국 같은 수출·신흥 시장이 더 크게 하락한다
    category: 국제경제
    termIds:
      - risk-off
      - capital-flight
      - stock-market
      - korean-won
    premise: 위험회피가 오면 외국인 자금이 안전한 선진국·달러로 이동하면서, 외국인 비중이 높고 수출·반도체 의존도가 큰 한국 같은 시장은 자본 유출과 통화 약세로 낙폭이 커진다는 논리에 근거한다.
    holds:
      - label: 외국인 의존·수출 구조
        detail: 외국인 보유 비중이 높고 에너지 수입·반도체 경기에 민감한 구조에서는 위험회피 충격이 증폭된다.
        example: 2022년 원달러 환율 1220에서 1400 돌파와 외국인 자금 이탈로 코스피 급락.
    fails:
      - label: 저평가 바닥
        detail: 이미 저PBR로 충분히 싸서 추가 하락 여지가 작으면 낙폭이 제한된다.
      - label: 디커플링 국면
        detail: 자체 펀더멘털이 강해 해외와 따로 움직이면 동반 급락을 피한다.
    verdict: 외국인 의존과 수출 구조가 클수록 성립하지만, 저평가 바닥이나 디커플링에서는 약해지는 조건부 명제다.
  - id: p102
    statement: 금리가 오르면 고평가 주식이 더 크게 눌린다
    category: 금융
    termIds:
      - interest-rate
      - valuation
      - stock-market
      - eps
      - long-term-interest-rate
      - commodity-market
    premise: 금리 상승은 미래 이익의 할인율을 높여 밸류에이션 멀티플을 압축하며, 이익이 먼 미래에 몰린 고평가·성장주가 특히 큰 타격을 받는다는 논리에 근거한다.
    holds:
      - label: 금리 급등 + 고멀티플
        detail: 금리가 빠르게 오르는 국면에서 이익 근거가 약한 고밸류에이션 종목일수록 낙폭이 크다.
    fails:
      - label: 이익이 금리를 압도
        detail: 실적 증가가 금리 상승을 압도하면 고평가 주식도 버틴다.
      - label: 저평가 주식
        detail: 이미 저PBR로 싼 주식은 금리 상승의 멀티플 압축 효과가 작다.
      - label: 실물자산·원자재 대칭
        detail: 장기금리 상승이 인플레이션·재정 부담 신호로 읽히면 금·에너지 등 실물자산은 상대적으로 강할 수 있다.
        example: 장기 부채 사이클 말기·재정 우위 국면의 자산 로테이션.
    verdict: 금리 상승기에 밸류에이션이 높을수록 강하게 성립하지만, 실물자산 헤지 경로와는 대칭적으로 갈라질 수 있다.
  - id: p103
    statement: 정부 부채가 감당 못 할 만큼 커지면 결국 인플레이션으로 푼다
    category: 통화정책
    termIds:
      - debt-to-gdp
      - debt-monetization
      - inflation
      - deleveraging
      - long-term-debt-cycle
      - national-debt
    relationIds:
      - r659
      - r660
      - r855
      - r856
    premise: 정치 양극화·포퓰리즘 환경에서는 긴축으로 명목부채를 줄이기 어려워, 부채를 화폐화하고 인플레이션으로 실질 가치를 깎는 경로를 택하기 쉽다는 정치경제 논리에 근거한다.
    holds:
      - label: 정치 양극화 + 자국통화 부채
        detail: 허리띠를 졸라매는 디레버리징이 정치적으로 불가능하고 부채가 자국통화로 표시되면, 화폐화·인플레이션으로 부담을 녹이는 길을 택한다.
        example: 역사적 고부채국의 금융 억압·인플레이션을 통한 부채 축소.
      - label: 장기 부채 사이클 말기
        detail: GDP 대비 부채비율이 역사적 고점에 근접하고 이자 부담이 커지면 명목 상환보다 실질 가치 희석 경로가 현실적 대안이 됨.
        example: 2020년대 미국 국가부채 120%대·연간 이자 1조 달러.
    fails:
      - label: 강한 재정규율·독립적 중앙은행
        detail: 재정 규율이 작동하고 중앙은행이 독립적이면 화폐화 대신 긴축으로 부채를 관리한다.
      - label: 외화표시 부채
        detail: 부채가 외화로 표시되면 인플레이션으로 실질가치를 줄일 수 없어 디폴트·긴축이 불가피하다.
      - label: 생산성 혁명이 분모를 키우는 경우
        detail: 기술 진보로 GDP가 빠르게 늘면 같은 명목부채라도 부채비율이 자연스럽게 낮아져 화폐화 압력이 약해질 수 있다.
        example: 1990년대 IT 혁명기 생산성·성장 동반.
    verdict: 긴축이 정치적으로 어렵고 부채가 자국통화일수록 성립하지만, 생산성·성장이 분모를 키우면 압력이 완화되는 조건부 명제다.
  - id: p104
    statement: 큰 정부·양극화 시대엔 정치 사이클이 시장을 크게 좌우한다
    category: 정부
    termIds:
      - political-cycle
      - fiscal-policy
      - stock-market
      - populism
    premise: 정부 역할과 양극화가 커지면 선거 승리 유인이 압도해, 선거 전 부양과 선거 후 긴축·후유증이 시장 흐름을 좌우한다는 논리에 근거한다.
    holds:
      - label: 선거 임박·접전 + 부양 여력
        detail: 선거가 가깝고 접전일수록 정권은 수단을 가리지 않고 부양해 단기 자산가격을 떠받친다.
        example: 대선을 앞둔 단기채 발행 확대 등 유동성 부양.
    fails:
      - label: 지지율 붕괴
        detail: 지지율이 걷잡을 수 없이 추락하면 부양 동력 자체가 약해진다.
      - label: 인플레 급등 제약
        detail: 선거 전 인플레이션이 빠르게 오르면 부양이 오히려 역풍이 되어 제약된다.
    verdict: 선거가 임박하고 부양 여력이 있을 때 성립하지만, 지지율 붕괴·인플레 급등 앞에서는 약해지는 조건부 명제다.
  - id: p105
    statement: 단기 부양책은 중장기적으로 더 큰 위기를 부른다
    category: 거시경제
    termIds:
      - political-cycle
      - fiscal-policy
      - national-debt
      - recession
    premise: 구조 문제를 해결하지 않고 봉합하는 부양은 부채와 불균형을 키워 나중에 더 크게 터진다는 논리에 근거한다.
    holds:
      - label: 생산성으로 연결되지 않는 소비성 부양
        detail: 성장 기반을 늘리지 못하는 부양은 부채만 쌓아 후일 더 큰 조정을 부른다.
    fails:
      - label: 생산성·공급 확충형 부양
        detail: 부양이 실제 투자·생산성·공급 확대로 이어지면(승수가 크면) 반대급부 없이 성장으로 연결될 수 있다.
    verdict: 부양이 생산성으로 이어지지 못할수록 성립하는 조건부 명제다.
  - id: p106
    statement: 안정적 레짐에선 베타만으로 충분하지만, 레짐이 흔들리면 베타만으론 위험하다
    category: 금융
    termIds:
      - market-regime
      - beta
      - alpha
      - stock-market
    premise: 화폐가치와 거시환경이 안정적일 때는 지수추종(베타)만으로 부를 쌓을 수 있지만, 레짐이 흔들리면 자산 간 변동이 커져 베타 의존이 위험해지고 선별(알파)·자산배분이 중요해진다는 논리에 근거한다.
    holds:
      - label: 변혁·고변동 레짐
        detail: 지반(법정화폐 가치)이 흔들리는 시기에는 단순 지수추종의 위험이 커지고 종목·자산 선별의 가치가 부각된다.
    fails:
      - label: 장기 평화·완화 레짐
        detail: 거시가 안정적이고 유동성이 우호적이면 베타(지수추종)만으로도 꾸준히 부를 쌓을 수 있다.
    verdict: 레짐이 흔들릴수록 베타 단독 전략의 위험이 커지는 조건부 명제다.
  - id: p107
    statement: 밸류에이션의 싸다·비싸다는 절대 수치가 아니라 심리·유동성·금리가 결정한다
    category: 금융
    termIds:
      - valuation
      - per
      - interest-rate
      - market-sentiment
    premise: PER 30 같은 고정 기준은 없고, 적정 멀티플은 시장 참여자의 심리와 통화정책·금리·유동성 환경에 따라 달라진다는 논리에 근거한다.
    holds:
      - label: 금리·유동성·심리가 변하는 국면
        detail: 같은 PER도 저금리·풍부한 유동성·낙관 심리에서는 정당화되지만, 반대 환경에서는 비싸게 평가된다.
    fails:
      - label: 극단적 거품·붕괴
        detail: 어떤 컨텍스트로도 설명되지 않는 극단적 과열·공포 수준에서는 절대적 과대·과소평가로 볼 수 있다.
    verdict: 밸류에이션은 절대 기준이 아니라 심리·유동성·금리 컨텍스트에 의존한다는 조건부 명제다.
  - id: p108
    statement: 주변의 비전문가까지 주식을 물으면 시장 고점 신호다
    category: 금융
    termIds:
      - market-sentiment
      - irrational-exuberance
      - stock-market
      - herd-behavior
    premise: 평소 주식에 관심 없던 대중까지 뛰어들면 추가 매수 여력이 소진되고 과열이 극에 달했다는 역발상 신호라는 경험칙에 근거한다.
    holds:
      - label: 광범위한 대중 참여·미디어 과열
        detail: 비전문가의 대규모 추격 매수와 과열된 보도가 겹치면 시장이 정점에 가까운 경우가 많다.
        example: 버블 정점에서의 개인 자금 쏠림.
    fails:
      - label: 강세장 초중반의 건강한 참여
        detail: 구조적 강세장 초중반의 참여 확대는 고점이 아니라 추세의 시작일 수 있다.
      - label: 펀더멘털 뒷받침
        detail: 실적·성장이 뒷받침되면 대중 참여가 거짓 신호가 된다.
    verdict: 대중의 과열 참여가 극단일수록 고점 신호로 유효한 조건부 명제다.
  - id: p109
    statement: 은행의 대출은 곧 예금과 등가다
    category: 금융
    termIds:
      - loan
      - deposit
      - credit-creation
      - bank
    premise: 은행이 대출을 실행하면 그 금액이 차입자의 예금 계좌에 동시에 생기므로, 대출과 예금은 신용화폐 회계에서 동전의 양면이라는 논리에 근거한다.
    holds:
      - label: 신용화폐 회계 차원
        detail: 대출 승인과 동시에 같은 금액의 예금이 창출되어 은행 전체로는 대출과 예금이 함께 늘어난다.
        example: 주택담보대출 실행액이 곧바로 차주의 예금으로 입금되는 구조.
    fails:
      - label: 개별 은행·예금 이탈
        detail: 개별 은행 차원에서는 창출된 예금이 다른 은행으로 빠져나갈 수 있어 지급준비금을 따로 확보해야 한다.
      - label: 뱅크런
        detail: 대규모 인출 사태에서는 금고의 현금과 창출된 예금·대출 사이의 간극이 드러나 등가가 깨진다.
    verdict: 은행 시스템 전체의 회계 차원에서 성립하지만, 개별 은행·뱅크런 상황에서는 지급준비의 제약이 드러나는 조건부 명제다.
  - id: p110
    statement: 은행은 성장에 필요한 돈의 수요를 채워주도록 국가가 허가한 기관이다
    category: 금융
    termIds:
      - bank
      - banking-license
      - credit-creation
      - economic-growth
    premise: 성장을 지향하는 정부가 돈의 공급과 수요의 미스매치를 메우기 위해, 자본금 이상으로 신용을 창출할 수 있는 인가를 은행에 부여한다는 논리에 근거한다.
    holds:
      - label: 성장 지향 + 신용 수요 초과
        detail: 성장에 필요한 자금 수요가 저축을 앞설 때, 인가받은 은행의 신용창출이 그 간극을 메워 성장을 뒷받침한다.
    fails:
      - label: 과잉 신용·버블
        detail: 신용이 과도하게 풀리면 자산 버블과 부실로 이어져 규제·억제의 대상이 된다.
      - label: 신뢰 붕괴
        detail: 은행 건전성에 대한 신뢰가 무너지면 인가가 있어도 신용 공급 기능이 마비된다.
    verdict: 성장 자금 수요가 저축을 앞설 때 그 역할이 정당화되지만, 과잉 신용은 규제로 억제되는 조건부 명제다.
  - id: p111
    statement: 은행은 보유한 지급준비금보다 훨씬 많은 돈을 창출한다
    category: 금융
    termIds:
      - fractional-reserve-banking
      - credit-creation
      - money-supply
      - reserves
    premise: 부분지급준비제도 아래에서 은행은 받은 예금의 일부만 지급준비금으로 두고 나머지로 대출·신용을 일으켜, 본원통화보다 훨씬 큰 통화량을 만들어낸다는 논리에 근거한다.
    holds:
      - label: 부분지급준비 + 인가
        detail: 낮은 지급준비 요건과 은행 인가가 결합하면 통화승수를 통해 적은 준비금으로 큰 신용을 창출한다.
    fails:
      - label: 100% 지급준비 주장
        detail: 예금 전액을 준비금으로 두자는 시카고 플랜 같은 체제에서는 신용창출이 제한된다.
      - label: 뱅크런·신용 경색
        detail: 예금 인출이 몰리거나 대출이 막히면 신용창출이 역회전한다.
    verdict: 부분지급준비와 인가가 작동할 때 성립하지만, 100% 준비제도나 뱅크런에서는 깨지는 조건부 명제다.
  - id: p112
    statement: 신용이 늘면 성장하지만, 과도한 신용은 버블과 위기를 키운다
    category: 금융
    termIds:
      - credit-creation
      - economic-growth
      - credit-cycle
      - asset-bubble
    premise: 신용창출은 자금 수요를 채워 성장을 돕지만, 생산으로 연결되지 않는 과잉 신용은 자산 가격을 부풀려 신용 사이클의 붕괴와 위기로 이어진다는 논리에 근거한다.
    holds:
      - label: 생산적 신용 + 적정 수준
        detail: 신용이 설비·투자 등 생산 활동으로 흘러가면 성장으로 이어진다.
    fails:
      - label: 투기적 과잉 신용
        detail: 신용이 자산 매입에 쏠려 버블을 키우면 신용 사이클의 수축기에 큰 위기로 터진다.
        example: 과잉 신용이 부른 자산 버블과 그 붕괴.
    verdict: 신용이 생산으로 연결되면 성장을, 투기로 쏠리면 위기를 부르는 조건부 명제다.
  - id: p113
    statement: 모든 시중은행은 자기자본 대비 지나친 투자를 하지 못하도록 규제를 받는다
    category: 금융
    termIds:
      - capital-adequacy-ratio
      - basel-accords
      - prudential-regulation
      - bank
    premise: 자기자본비율(BIS 비율)을 일정 수준 이상으로 유지하도록 강제하면, 은행은 보유한 자본에 비해 과도한 대출·자산매입을 할 수 없다는 논리에 근거한다.
    holds:
      - label: 바젤 채택 + 감독 작동
        detail: 바젤 규제를 받아들이고 감독이 제대로 작동하면 은행의 투자 총액은 자기자본에 묶인다.
        example: BIS 비율 하한을 맞추기 위해 위험자산을 줄이는 은행.
    fails:
      - label: 규제 사각·그림자금융
        detail: 규제를 받지 않는 그림자금융이나 부외(off-balance) 거래로 위험이 빠져나가면 규제가 무력화된다.
      - label: 위험가중치 조작
        detail: 위험가중치 산정을 낮춰 잡으면 실제 위험 대비 자본이 부족해질 수 있다.
    verdict: 바젤이 채택되고 감독이 작동하는 한 성립하지만, 그림자금융·가중치 조작 영역에서는 새는 조건부 명제다.
  - id: p114
    statement: 바젤은 대표적인 자본 규제 가이드라인이다
    category: 금융
    termIds:
      - basel-accords
      - capital-adequacy-ratio
      - risk-weighted-assets
      - bis
    premise: 국제결제은행(BIS)이 마련한 바젤 기준이 자기자본비율과 위험가중자산 개념을 통해 전 세계 은행 건전성 규제의 사실상 표준으로 자리 잡았다는 논리에 근거한다.
    holds:
      - label: 국제 표준으로서의 바젤
        detail: 주요국 은행 규제가 바젤 기준을 토대로 설계되어 자본·유동성 요건의 공통 잣대가 된다.
    fails:
      - label: 국가별 도입 차이
        detail: 도입 시점과 강도가 나라마다 달라 일률적으로 적용된다고 보기 어렵다.
    verdict: 국제 자본 규제의 사실상 표준이라는 점에서 성립하는, 정의에 가까운 명제다.
  - id: p115
    statement: 구제받을 거란 기대(대마불사)가 은행의 도덕적 해이를 키운다
    category: 금융
    termIds:
      - too-big-to-fail
      - moral-hazard
      - bailout
      - global-financial-crisis
    premise: 손실이 나면 결국 정부·중앙은행이 구제해 줄 것이라는 기대가 있으면, 은행은 이익만 좇아 과도한 위험을 떠안는다는 논리에 근거한다.
    holds:
      - label: 대형 은행 + 암묵적 보증
        detail: 시스템적으로 중요한 은행일수록 구제 기대가 커져 무분별한 모기지 대출 같은 위험 추구가 강해진다.
        example: 도덕적 해이가 극에 달해 터진 2008년 글로벌 금융위기.
    fails:
      - label: 정리절차·베일인 도입
        detail: 부실 시 주주·채권자가 먼저 손실을 흡수하는 정리체계가 명확하면 구제 기대가 약해진다.
      - label: 소형 은행
        detail: 망해도 시스템 충격이 작은 은행은 구제 기대가 낮아 유인 왜곡이 덜하다.
    verdict: 암묵적 구제 보증이 있는 대형 은행에서 강하게 성립하지만, 정리체계가 갖춰지면 약해지는 조건부 명제다.
  - id: p116
    statement: 자본규제가 강해지면 은행은 자본을 늘리기보다 대출을 줄인다
    category: 금융
    termIds:
      - capital-adequacy-ratio
      - basel-accords
      - credit-creation
      - loan
    premise: BIS 비율을 맞추려면 분자인 자기자본을 늘리거나 분모인 위험자산을 줄여야 하는데, 증자가 번거롭고 힘들어 은행은 투자(대출·자산매입) 축소를 택한다는 논리에 근거한다.
    holds:
      - label: 증자 부담이 큰 국면
        detail: 자본 조달이 어렵고 비싼 시기에는 대출·자산을 줄여 비율을 맞춰 신용창출이 위축된다.
        example: 자산은 느는데 자기자본은 거의 늘지 않는 규제 충족 국면.
    fails:
      - label: 자본 조달이 쉬울 때
        detail: 주가가 높고 증자가 수월하면 자본을 늘려 투자 규모를 유지할 수 있다.
    verdict: 자본 확충이 어려운 국면에서 성립하는, 규제의 손쉬운 대응을 설명하는 조건부 명제다.
  - id: p117
    statement: 은행들이 규제요건을 충족하고 나면 신용창출을 늘려 물가 상승 압력이 커질 수 있다
    category: 금융
    termIds:
      - credit-creation
      - money-multiplier
      - inflation
      - basel-accords
    premise: 규제 충족을 위해 미뤄둔 신용창출 의지가 요건을 채운 뒤 되살아나면, 통화승수가 높아지고 돈의 유통속도가 빨라져 물가 상승 압력으로 작동한다는 논리에 근거한다.
    holds:
      - label: 규제 충족 + 수요 회복
        detail: 핵심 은행들이 자본·대출 요건을 거의 충족한 상태에서 신용 수요가 살아나면 통화승수 상승이 물가를 밀어올린다.
    fails:
      - label: 수요 부진
        detail: 실물 자금 수요가 약하면 은행이 여력을 갖춰도 신용이 늘지 않아 물가 압력으로 이어지지 않는다.
      - label: 추가 규제 강화
        detail: 거시건전성 규제가 다시 강해지면 신용창출 재개가 억제된다.
    verdict: 규제 충족과 수요 회복이 겹칠 때 성립하는, 향후 인플레이션을 경계하는 전망적 명제다.
  - id: p118
    statement: 지급준비율을 높이면 은행의 신용창출 여력이 줄어든다
    category: 통화정책
    termIds:
      - required-reserve-ratio
      - credit-creation
      - money-multiplier
      - money-supply
    premise: 예금 대비 일정 비율을 중앙은행에 의무 예치하도록 하면 그만큼 대출로 돌릴 재원이 줄어, 지급준비율이 통화승수와 시중 통화량을 조절하는 정책수단이 된다는 논리에 근거한다.
    holds:
      - label: 지급준비율이 유효한 체제
        detail: 지준율이 0보다 크고 그것이 실질 제약으로 작동하면, 지준율 인상은 신용창출 여력을 직접 줄인다.
        example: 지준율 10%면 100억 본원통화가 최대 1,000억 예금으로, 20%면 그보다 작게 확장된다.
    fails:
      - label: 지준율 0% · 초과지준 풍부
        detail: 미국처럼 지준율이 0%이고 지준금이 풍부하면 지준율 자체는 제약이 아니라 자본·유동성 규제와 대출수요가 신용을 좌우한다.
    verdict: 지준율이 실질 제약인 체제에서 성립하지만, 0% 풍부지준 환경에서는 규제·대출수요가 더 중요한 조건부 명제다.
  - id: p119
    statement: 지급준비율 0% 시대에도 은행은 신용창출에 적극 나서지 않았다
    category: 통화정책
    termIds:
      - required-reserve-ratio
      - credit-creation
      - basel-accords
      - loan
    premise: 2020년 지준율이 0%가 되어 신용창출의 속도 방지턱이 사라졌음에도, 바젤 규제 충족과 약한 대출수요 탓에 은행 대출 증가세가 강하게 살아나지 않았다는 관찰에 근거한다.
    holds:
      - label: 규제 부담 + 약한 수요
        detail: 자본규제를 맞추느라 투자를 줄여온 데다 재정지출로 자금이 넉넉해 대출수요까지 약하면, 지준율을 풀어도 신용이 폭증하지 않는다.
    fails:
      - label: 규제 충족 + 수요 회복
        detail: 은행이 규제 요건을 갖추고 대출수요가 살아나면 0% 지준율 위에서 신용창출이 빠르게 확대될 수 있다.
    verdict: 규제 부담과 약한 수요가 겹친 국면에서 성립하며, 그 조건이 풀리면 깨질 수 있는 조건부 명제다.
  - id: p120
    statement: 양적완화로 풀린 돈은 대출이 아니라 지급준비금으로 쌓였다
    category: 통화정책
    termIds:
      - quantitative-easing
      - reserves
      - credit-creation
      - iorb
    premise: 연준이 양적완화로 자산을 대량 매입해 지준금 계좌에 돈을 밀어넣었지만, 규제로 신용창출에 소극적이고 IORB 이자 유인까지 겹쳐 은행이 이를 대출로 소화하지 않고 지준금으로 쌓아두었다는 논리에 근거한다.
    holds:
      - label: 규제 위축 + IORB 유인
        detail: 자본규제로 투자를 줄인 데다 지준금에 안전한 이자가 붙으니 풀린 돈이 신용창출보다 지준금 적치로 흘렀다.
        example: 2008년 이후 본원통화와 지급준비금이 거의 나란히 급증한 추이.
    fails:
      - label: 신용창출 재개 국면
        detail: 규제 충족과 수요 회복으로 은행이 적극 대출에 나서면 쌓인 지준금이 신용창출로 전환될 수 있다.
    verdict: 규제 위축과 IORB 유인이 작동하는 동안 성립하지만, 신용창출이 재개되면 달라지는 조건부 명제다.
  - id: p121
    statement: IORB가 높을수록 은행은 위험을 감수하기보다 지준금에 돈을 묶어둔다
    category: 통화정책
    termIds:
      - iorb
      - reserves
      - credit-creation
      - bank
    premise: 연준이 지급준비금에 리스크 없는 이자(IORB)를 충분히 높게 지급하면, 은행은 굳이 위험을 무릅쓰고 대출·투자에 나서기보다 안전한 이자 수취를 선호해 지준금을 온존한다는 논리에 근거한다.
    holds:
      - label: IORB가 시장 수익률 대비 매력적일 때
        detail: IORB가 높아 위험 대비 수익이 신통치 않으면 은행은 지준금 적치를 택해 신용창출이 위축된다.
    fails:
      - label: IORB 인하 · 고수익 기회
        detail: IORB가 낮아지거나 대출·투자 수익이 충분히 높아지면 은행은 지준금을 헐어 위험을 감수한다.
    verdict: IORB가 시장 대비 매력적인 국면에서 성립하며, 이자가 낮아지면 약해지는 조건부 명제다.
  - id: p122
    statement: 지급준비금은 여전히 시중 유동성과 신용창출 여력의 바로미터다
    category: 통화정책
    termIds:
      - reserves
      - money-supply
      - credit-creation
      - base-money
    premise: 지준율 0% 시대에도 은행업의 비즈니스 모델은 그대로여서, 예금이 늘면 지준금도 같은 비율로 늘던 관계처럼 지급준비금 추이가 시중 유동성과 신용창출 여력을 비추는 지표로 남는다는 논리에 근거한다.
    holds:
      - label: 은행 모델 불변 + 연준 연결고리
        detail: 지준금은 연준과 시중은행 거래의 매개라서, 그 규모·추이가 정책 의도와 유동성 상태를 가늠하는 핵심 퍼즐 조각이 된다.
    fails:
      - label: 다른 변수 우위
        detail: 재정정책·역레포·TGA·단기자금 시장 등 다른 변수가 더 크게 움직이면 지준금만으로는 상황을 다 읽지 못한다.
    verdict: 지준금이 핵심 지표라는 점에서 성립하지만, 다른 유동성 변수와 함께 봐야 하는 조건부 명제다.
  - id: p123
    statement: 양적긴축으로 지준금이 일정 수준 아래로 줄면 예측 못한 유동성 충격이 터질 수 있다
    category: 통화정책
    termIds:
      - quantitative-tightening
      - reserves
      - lclor
      - liquidity
    premise: 연준이 정책여력 확보를 위해 QT로 지준금을 풍부한 수준에서 줄여가지만, 최소 적정 지준금 수준(LCLoR)을 사전에 알 수 없어 일정 선 아래로 내려가면 단기금리 급등·유동성 경색 같은 충격이 현실화될 수 있다는 논리에 근거한다.
    holds:
      - label: LCLoR 근접 · 풍부지준 레짐
        detail: 지준금이 LCLoR에 근접하면 머니마켓 스프레드·변동성이 튀며 예상치 못한 유동성 스트레스가 터질 수 있다.
        example: 헤드라이트 고장난 버스로 한밤중 절벽길을 가는 것에 비유되는 연준의 신중한 QT.
    fails:
      - label: 충분한 완충 · 점진적 만기상환
        detail: 지준금이 여전히 풍부하고 매도 대신 만기상환 방식으로 천천히 줄이면 충격 위험은 제한된다.
    verdict: 지준금이 LCLoR에 근접하는 국면에서 성립하는, QT 리스크를 경계하는 전망적 명제다.
  - id: p124
    statement: 양적긴축으로 지급준비금을 줄이면 민간 신용·통화승수 확대에 따른 인플레 재점화를 억제할 수 있다
    category: 통화정책
    termIds:
      - quantitative-tightening
      - reserves
      - credit-creation
      - inflation
      - money-multiplier
    relationIds:
      - r751
      - r756
      - r742
      - r743
    premise: 은행이 규제를 충족하고 신용창출에 적극 나서면 통화승수와 유통속도가 올라 물가 압력이 커질 수 있는데, QT로 지준금(민간 신용의 씨앗)을 줄이면 그 여력을 제한해 인플레 재점화를 막을 수 있다는 논리에 근거한다.
    holds:
      - label: 규제 충족 + 신용 재개 국면
        detail: 핵심 은행이 요건을 채운 뒤 대출을 늘리려 할 때 QT로 지준금을 줄이면 신용·승수 확대 속도를 완화해 물가 압력을 억제할 수 있다.
    fails:
      - label: QT 과속 · LCLoR 근접
        detail: 지준금을 너무 빠르게 줄이면 유동성 충격·금단현상이 먼저 터져 경기·시장 안정이 깨질 수 있다.
      - label: 신용 위축 지속
        detail: 은행이 여전히 소극적이면 지준금 축소만으로는 물가 압력 완화 효과가 제한적이다.
    verdict: 신용 재개가 우려되는 국면에서 성립하나, QT 속도와 LCLoR 리스크를 함께 봐야 하는 조건부 명제다.
  - id: p125
    statement: 2008년 이후 지급준비금 증가는 주식 등 위험자산과 더 강한 양의 상관을 보인다
    category: 통화정책
    termIds:
      - reserves
      - stock-market
      - quantitative-easing
      - base-money
      - fed-assets
    relationIds:
      - r755
      - r754
      - r750
    premise: QE로 본원통화·지준금 비중이 커지면서 2008년 이전에는 미미했던 지급준비금과 자산시장의 연동이 강해졌고, 2020년대 팬데믹 QE 이후에는 상관이 더욱 커졌다는 관찰에 근거한다.
    holds:
      - label: QE·풍부지준 레짐
        detail: 연준 자산 매입으로 지준금이 늘면 유동성 기대가 위험자산 가격을 끌어올리는 경향이 강해진다.
        example: 2008년 이후 지급준비금 YoY와 S&P500 YoY의 양의 상관, 2022~2024년 상관 계수 약 0.87.
    fails:
      - label: 2008년 이전 · 유동성 스트레스
        detail: 지준금이 통화정책 여유분이 아니던 시기나 급격한 QT·금융 스트레스 국면에서는 상관이 약해지거나 역전될 수 있다.
        example: 2008년 이전 지급준비금과 S&P500 YoY의 약한 음의 상관(약 -0.35).
    verdict: QE 이후 레짐에서 성립하는 관찰이며, 레짐 전환·스트레스 시에는 약해지는 조건부 명제다.
  - id: p126
    statement: IORB 인상과 양적긴축을 병행하면 지급준비금 감소 속도와 신용창출을 동시에 조절할 수 있다
    category: 통화정책
    termIds:
      - iorb
      - quantitative-tightening
      - reserves
      - credit-creation
      - policy-rate
    relationIds:
      - r757
      - r751
      - r753
    premise: QT만으로 지준금을 줄이면 금단현상 위험이 있고, IORB만으로는 지준금 규모 자체는 유지되므로, 두 수단을 병행하면 지준금 축소(QT)와 신용창출 속도 조절(IORB·기준금리)을 나눠 가며 긴축할 수 있다는 논리에 근거한다.
    holds:
      - label: 풍부→충분 지준금 전환기
        detail: 지준금이 abundant에서 ample로 줄어드는 구간에서 QT 속도와 IORB·기준금리를 함께 조절하면 유동성 충격 없이 신용 확대를 억제할 수 있다.
    fails:
      - label: LCLoR 근접 · QT 과속
        detail: 지준금이 이미 빠듯하면 IORB를 높여도 단기자금 시장 스트레스를 막기 어렵다.
      - label: 신용 수요 부진
        detail: 대출수요가 약하면 IORB·QT 병행의 실질 효과가 제한적이다.
    verdict: 풍부지준에서 점진적 긴축을 설계할 때 성립하는, 정책 조합을 설명하는 조건부 명제다.
  - id: p127
    statement: 완전고용에 가까운 국면에서 확장적 재정·감세를 이어가면 물가 상승 압력이 누적된다
    category: 정부
    termIds:
      - fiscal-policy
      - tax-cut
      - inflation
      - aggregate-demand
      - phillips-curve
    relationIds:
      - r128
