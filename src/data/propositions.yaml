      - r1087
      - r472
    premise: GDP는 분기별로 작성·개정되며 발표까지 시차가 있어, '가장 최근 분기 GDP'가 **지금 이 순간**의 경기 국면을 곧바로 반영한다는 직관에 근거한다.
    holds:
      - label: GDP와 동행지표가 일치
        detail: 동행종합지수·고용·소매 등 월별 지표가 GDP 방향과 같고 개정이 작으면 최신 분기 GDP가 현재 국면을 대략 설명할 수 있다.
    fails:
      - label: 분기·시차
        detail: GDP는 월별·속보 지표(PMI·경기동향지수·심리지수)보다 느리고, 발표 시점에는 이미 다음 분기 초반 데이터가 쌓여 있을 수 있다.
      - label: 명목 vs 실질·구성
        detail: 명목 GDP·재고·수입 변동만으로는 실질 수요·C/I/G/NX 기인을 구분하기 어렵다.
      - label: 선행·후행 혼동
        detail: 선행지수·수익률 곡선·PMI가 GDP보다 먼저 꺾이거나 회복하는 경우가 많아 GDP만으로는 전환점을 놓치기 쉽다.
    verdict: 총량 참고는 되지만 현재·근시 경기 판단에는 월별 CI·PMI·고용 등과 함께 봐야 하는 조건부 명제다.
  - id: p205
    statement: 실업률이 낮으면 항상 좋은 고용 시장이다
    category: 거시경제
    termIds:
      - unemployment
      - natural-rate-of-unemployment
      - full-employment
      - phillips-curve
      - inflation
      - wage-price-spiral
      - policy-rate
      - central-bank
    relationIds:
      - r1094
      - r1095
      - r800
      - r334
    premise: 실업률이 낮을수록 노동시장이 좋다는 직관에 근거한다. 그러나 자연실업률(NAIRU) 이하로 내려가면 임금·물가 압력이 커지고 중앙은행 긴축으로 이어질 수 있다는 필립스·통화정책 논리가 있다.
    holds:
      - label: 자연실업률 근처·완만한 인플레
        detail: 실업이 자연률 근처이고 임금·물가가 안정적이면 저실업은 소득·소비·기업 이익에 유리할 수 있다.
      - label: 회복 초기
        detail: 침체 이후 실업률 하락은 수요 회복·고용 창출 신호로 긍정적으로 해석될 수 있다.
    fails:
      - label: NAIRU 이하 과열
        detail: 실업이 너무 낮으면 임금 스파이럴·인플레 재가속으로 금리 인상·밸류에이션 조정 압력이 커질 수 있다.
      - label: 참가율·확장실업
        detail: 공식 실업률만 낮고 참가율·고용보조지표가 나쁘면 slack이 남아 있을 수 있다.
      - label: 불완전·단시간 고용
        detail: 고용률은 높아도 근로시간·임금·품질이 낮으면 체감 고용은 약할 수 있다.
    verdict: 자연실업률·물가·참가율 조건에서만 성립하며, 과열·확장실업·고용 질 앞에서는 깨지는 조건부 명제다.
  - id: p206
    statement: 공식 실업률만 보면 노동시장 여력을 알 수 있다
    category: 거시경제
    termIds:
      - unemployment
