        detail: 에너지·원자재 수입가격이 오르고 수출 단가가 따라가지 못하면 교역조건이 악화되어 실질 GNI가 실질 GDP보다 약해질 수 있다.
      - label: 개방·수입 의존 경제
        detail: 수출입/GNI 비율이 높은 경제는 교역조건 충격이 국민 실질소득에 GDP보다 직접적으로 전달된다.
    fails:
      - label: 교역조건 개선·내수 주도
        detail: 수출가격이 수입보다 빠르게 오르거나 성장이 순수 내수·서비스에 의존하면 GDP·GNI 괴리가 작거나 GNI가 상대적으로 유리할 수 있다.
      - label: 환율·가격 전가 완충
        detail: 환율 조정·기업 마진·재고·가격 전가로 단기 GDP·물가 지표와 GNI 반응 시차·크기가 달라질 수 있다.
      - label: 국외순요소소득 상쇄
        detail: 해외 투자 수익·송금 등 NFP가 무역손익 악화를 상쇄하면 실질 GNI 하락폭이 GDP보다 작을 수 있다.
    verdict: 수입 의존·교역조건 악화 국면에서 특히 성립하며, 환율·NFP·내수 구조에 따라 깨지는 조건부 명제다.
  - id: p199
