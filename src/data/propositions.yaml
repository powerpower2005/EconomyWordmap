      - labor-force-participation-rate
      - labor-underutilization
      - natural-rate-of-unemployment
      - consumption
    relationIds:
      - r476
      - r1089
      - r1097
      - r1098
    premise: ILO 실업률 하나로 노동시장 slack을 충분히 파악할 수 있다는 직관에 근거한다. 구직단념·취업준비·불완전취업은 비경제활동 등으로 분류되어 공식 실업률에서 빠질 수 있다(5.1.1.2·5.1.2).
    holds:
      - label: 참가율·확장지표 안정
        detail: 참가율과 고용보조지표가 공식 실업률과 같은 방향이면 단일 지표로도 대략적 판단이 가능할 수 있다.
    fails:
      - label: 구직단념·취업준비
        detail: 구직을 포기하면 실업자→비경제활동으로 이동해 실업률이 **낮아 보일** 수 있다.
      - label: 고용률 vs 실업률
        detail: 고용률(15세+ 기준)은 분모가 달라 실업률과 괴릴 수 있어 함께 봐야 한다.
      - label: 확장실업·U-6
        detail: 고용보조지표3·U-6는 공식 실업보다 체감 slack을 크게 보여주는 경우가 많다.
    verdict: 필수 보조 지표(고용률·참가율·확장실업) 없이는 성립하기 어려운 조건부 명제다.
  - id: p207
