    premise: 실질 GNI는 실질 GDP에 교역조건 변화에 따른 실질 무역손익과 국외순요소소득을 더해 추계한다. 수출가격 대비 수입가격(교역조건)이 나빠지면 같은 수출물량으로 사들일 수입이 줄어 실질 구매력·소득이 GDP 생산 지표보다 더 크게 훼손될 수 있다는 국민계정 논리에 근거한다.
