        example: "2007년: 장기 확장 끝 무렵 주택·신용 충격이 겹침."
      - label: 구조적 둔화
        detail: 충격 없이도 잠재성장률 하락·인구 고령화로 성장이 둔화하면 '확장 종료'처럼 보일 수 있으나, 이는 축격과 다른 메커니즘이다.
    verdict: 확장 '수명'이 아니라 **충격·취약성**이 전환을 설명한다는 조건부 명제다.
  - id: p193
    statement: 침체는 보통 기업 투자 위축에서 시작한다
