  - id: p138
    statement: 세율을 올리면 소비와 투자가 위축되어 경기가 둔화된다
    category: 정부
    termIds:
      - tax-increase
      - fiscal-policy
      - aggregate-demand
      - consumption
    premise: 증세는 가계·기업의 가처분 소득을 줄여 소비와 투자를 위축시키고 총수요를 눌러 경기를 둔화시킨다는 케인즈식 논리에 근거한다.
    holds:
      - label: 완전고용·과열 국면
        detail: 경기가 과열에 가까울 때 증세는 수요를 식혀 물가 압력을 완화하는 데 기여할 수 있다.
    fails:
      - label: 재정 신뢰·중장기 개혁
        detail: 재정 건전성을 회복한다는 신뢰를 주는 증세는 장기금리를 낮추고 투자를 살릴 수 있다.
      - label: 소득 재분배·승수
        detail: 저소득층에 돌아가는 지출과 함께 쓰이면 증세의 위축 효과가 일부 상쇄될 수 있다.
    verdict: 경기 국면과 재정 신뢰에 따라 둔화·안정 효과가 갈리는, p8(지출 확대)의 대칭 조건부 명제다.
  - id: p139
    statement: 원자재 가격이 오르면 인플레이션 압력이 커진다
    category: 원자재
    termIds:
      - commodity-market
      - inflation
      - crude-oil
      - supply-shock
    premise: 에너지·금속·농산물 등 원자재는 생산·운송 비용에 직접 반영되어 물가를 끌어올리는 공급 측 압력으로 작용한다는 논리에 근거한다.
    holds:
      - label: 에너지·식량 급등
        detail: 유가·곡물 등 핵심 원자재가 급등하면 수입·제조 비용이 올라 CPI·PCE에 빠르게 전가되는 경우가 많다.
        example: 2022년 유가 급등과 물가 상승.
    fails:
      - label: 수요 약세·마진 흡수
        detail: 경기 둔화로 수요가 약하면 기업이 원자재 비용을 가격에 전가하지 못해 물가 효과가 제한된다.
      - label: 통화 강세·보조금
        detail: 달러 강세나 에너지 보조금이 비용 상승을 흡수하면 국내 물가 압력이 완화된다.
    verdict: 수요가 받쳐주고 전가가 될 때 성립하지만, 수요 약세·정책 완충 앞에서는 약해지는 조건부 명제다.
  - id: p140
    statement: ETF 자금 유입이 늘면 추종 지수·시장이 오른다
    category: 금융
    termIds:
      - etf
      - stock-index
      - stock-market
      - liquidity
    premise: ETF는 지수·섹터를 추종해 패시브 자금을 모으고, 순유입 시 추종 종목을 매수해 지수와 시장 수급에 영향을 준다는 논리에 근거한다.
    holds:
      - label: 대규모 순유입·쏠림
        detail: S&P500·나스닥 ETF 등에 자금이 몰리면 대형주·지수 구성 종목이 동반 상승하는 경향이 있다.
    fails:
      - label: 순유출·리밸런싱
        detail: 금리 급등 등으로 ETF에서 자금이 빠지면 지수가 실적보다 크게 하락할 수 있다.
      - label: 지수 외 종목
        detail: ETF 비중이 낮은 중소형·비지수 종목은 유입 효과를 거의 받지 못한다.
    verdict: 패시브 자금이 지수를 주도하는 국면에서는 성립하지만, 유출·비지수 종목 앞에서는 약해지는 조건부 명제다.
  - id: p141
    statement: 재정적자와 저축 부족이 강달러와 무역적자를 동반한다
    category: 국제경제
    termIds:
      - twin-deficit
      - savings
      - fiscal-policy
      - trade-deficit
      - strong-dollar
      - interest-rate
      - national-debt
    premise: 가계 저축이 부족하고 재정이 적자로 국내 자본 수요가 커지면 금리가 오르고 해외 자본이 유입되어 달러가 강해지며, 동시에 무역(경상)적자가 확대되는 쌍둥이 적자 경로가 작동할 수 있다는 논리에 근거한다.
    holds:
      - label: 저축↓·재정적자↑·금리↑
        detail: 재정 확장과 저축 부족이 겹치면 금리·달러 강세와 무역적자가 동반될 수 있다.
        example: 1980년대 레이건 시대 논의, 2010년대 펠드스타인식 미중 불균형 분석.
    fails:
      - label: 기축통화·안전자산 수요
        detail: 달러 수요가 재정이 아니라 위기·결제 수요에서 오면 금리·적자와의 연결이 약해진다.
      - label: 약달러·수입 위축
        detail: 달러가 약하고 내수가 둔화되면 무역적자가 줄어 쌍둥이 적자 그림이 깨질 수 있다.
      - label: 재정긴축·저축 회복
        detail: 지출을 줄여 국내저축을 늘리면 금리·달러·무역적자 압력이 완화될 수 있어(펠드스타인 등) 동반 관계가 약해진다.
        example: 미중 불균형 논의에서 제시된 긴축·저축 경로.
    verdict: 저축·재정·금리·달러가 한 줄기로 이어질 때 성립하지만, 기축통화 수요와 경기 국면·긴축 정책에 따라 강도가 달라지는 조건부 명제다.
  - id: p142
    statement: 관세·무역분쟁이 오히려 무역적자를 키울 수 있다
    category: 국제경제
    termIds:
      - tariff
      - trade-war
      - trade-deficit
      - strong-dollar
      - geopolitical-risk
      - risk-off
      - protectionism
      - manufacturing
      - reshoring
    premise: 관세로 수입을 줄이려 해도 무역분쟁이 지정학·성장 불안을 키우면 위험회피 자금이 달러로 몰려 강달러가 되고, 수출 경쟁력·수입 구조 때문에 무역적자가 오히려 커질 수 있다는 역설적 논리에 근거한다.
    holds:
      - label: 분쟁→risk-off→강달러
        detail: 무역전쟁이 안전자산 선호를 키우면 달러 강세가 무역적자 축소 노력을 상쇄할 수 있다.
        example: 2018~2020년 미중 관세전쟁 중 대중 무역적자 확대.
    fails:
      - label: 협상 타결·환율 안정
        detail: 관세가 협상 카드로 쓰여 갈등이 완화되고 환율이 안정되면 적자 축소 효과가 나타날 수 있다.
      - label: 수입 대체·내수 위축
        detail: 수입이 빠르게 줄거나 내수가 약해지면 분쟁 중에도 적자가 줄 수 있다.
    verdict: 지정학·안전자산 채널이 강할수록 역효과가 커지는, 보호무역 낙관을 깨는 조건부 명제다.
  - id: p143
    statement: 감세·관세·재정적자 확대가 의도와 달리 강달러·무역적자를 악화시킬 수 있다
    category: 국제경제
    termIds:
      - tax-cut
      - tariff
      - twin-deficit
      - trade-deficit
      - strong-dollar
      - neo-mercantilism
      - national-debt
      - manufacturing
      - reshoring
    premise: 감세와 관세를 동시에 쓰며 재정적자를 키우면 금리·달러 강세 압력이 커질 수 있고, 관세의 비용·보복 효과와 겹치면 무역적자 개선 의도와 반대 결과가 날 수 있다는 논리에 근거한다.
    holds:
      - label: 재정적자·금리·달러
        detail: 지출을 줄이지 않은 감세가 재정적자와 금리를 올리면 달러 강세·무역적자 압력이 커질 수 있다.
      - label: 관세+감세 내적 긴장
        detail: 신중상주의(관세)와 공급주의(감세)를 함께 쓰면 물가·금리·달러 경로가 모호해지고 무역·재정 목표가 충돌할 수 있다.
    fails:
      - label: 기축통화 흡수
        detail: 달러 결제·보유 수요가 재정 부담을 완화하면 강달러·적자 악화가 한동안 지연될 수 있다.
      - label: 약달러 정책 성공
        detail: 환율 협약·통화정책이 달러 약세를 이끌면 무역적자 축소 효과가 일부 나타날 수 있다.
    verdict: 재정·금리·달러·무역이 한 방향으로 쌓일 때 역설이 커지는 조건부 명제다.
  - id: p144
    statement: 약달러·환율협약만으로 무역적자가 지속 해소된다
    category: 국제경제
    termIds:
      - plaza-accord
      - weak-dollar
      - trade-deficit
      - devaluation
      - exchange-rate
    premise: 달러를 약하게 만들거나 환율 협약으로 상대국 통화를 절상하면 수출 경쟁력이 올라 무역적자가 줄어든다는 환율 중심 논리에 근거한다.
    holds:
      - label: 단기 환율 조정
        detail: 협약 직후 달러 약세가 나오면 단기적으로 무역수지가 개선될 수 있다.
        example: 1985년 플라자 합의 직후 달러 약세·무역적자 일시 축소.
    fails:
      - label: 구조·저축·재정
        detail: 저축 부족·재정적자·자본 유입 구조가 그대로면 환율만으로 적자가 재발한다.
      - label: J커브·수입 가격
        detail: 약달러가 수입물가를 올리면 초기에는 적자가 악화될 수 있다.
      - label: 경쟁적 절하·금리
        detail: 상대국도 절하하거나 금리 차가 달러를 다시 끌어올리면 효과가 사라진다.
    verdict: 단기 조정에는 도움이 되지만, 쌍둥이 적자·저축 구조를 바꾸지 않으면 지속 해소는 어려운 조건부 명제다.
  - id: p145
    statement: 제조업 생산성 향상이 제조업 고용을 줄인다
    category: 거시경제
    termIds:
      - manufacturing
      - technological-progress
      - unemployment
      - capital-accumulation
      - economic-growth
    premise: 자본집약·자동화·기술 진보로 같은 인력으로 더 많이 생산할 수 있으면 산출은 늘어도 고용 인원은 줄어드는 경향이 있다는 생산성 논리에 근거한다.
    holds:
      - label: 자본집약·자동화
        detail: 설비·장비 투자가 늘면 인력 대비 산출이 커져 제조업 고용이 정체되거나 감소할 수 있다.
        example: "미국 제조업: 고용은 감소했으나 산출은 지속 증가."
      - label: 직무 고숙련화
        detail: 신규 제조 일자리의 기술 문턱이 올라가면 생산성은 오르나 고용 창출력은 약해질 수 있다.
    fails:
      - label: 경기 회복·수요 급증
        detail: 제조 수요가 크게 늘면 단기적으로 고용도 함께 늘 수 있다.
        example: 판데믹 이후 일부 제조업 보복적 고용 증가.
      - label: 리쇼어링·보호무역
        detail: 생산 거점이 본국으로 돌아오면 일부 고용이 회복될 수 있으나 생산성 제약으로 과거 수준 회복은 제한적일 수 있다.
    verdict: 구조적 생산성 향상 국면에서는 성립하지만, 경기·정책 충격 앞에서는 약하거나 단기적으로 깨지는 조건부 명제다.
  - id: p146
    statement: 리쇼어링·보호무역으로 제조업 일자리가 대규모 회복된다
    category: 국제경제
    termIds:
      - reshoring
      - protectionism
      - tariff
      - manufacturing
      - unemployment
      - trade-deficit
      - industrial-policy
    premise: 관세·보조금·산업정책으로 생산을 본국으로 끌어들이면 제조업 고용이 크게 늘어난다는 보호무역·리쇼어링 논리에 근거한다.
    holds:
      - label: 위기 후 여력·정책 결합
        detail: 제조업 고용이 과도하게 줄었던 뒤 보호무역과 산업정책이 겹치면 일부 고용 회복 여지가 있다.
        example: 2008년 이후 제조업 고용 회복 논의, CHIPS Act 등 국내 투자 유인.
    fails:
      - label: 생산성·인건비 제약
        detail: 자동화·고숙련화로 일자리당 산출이 커지면 고용 증가 폭은 제한된다.
      - label: 글로벌 트렌드
        detail: 선진국·중국·인도에서도 제조업 고용 비중이 하락하는 구조적 흐름이 있어 미국만 예외적으로 확대되기 어렵다.
      - label: 무역수지·비용
        detail: 리쇼어링이 비용을 올리거나 무역적자 개선에 기여하지 못하면 정책 지속성이 약해진다.
      - label: 설비투자 규모 ∝ 무역적자 축소
        detail: 국내 제조업 설비투자가 늘어도 자본집약·수입 구조 때문에 무역적자가 비례해 줄지 않을 수 있다.
        example: 2021년 이후 미국 제조업 건설지출 급증.
      - label: 기초 제조도 고자동화
        detail: 철강 등 전통 제조업은 자동화율이 높아 리쇼어링해도 고용 창출력이 제한적이다.
      - label: R&D→저부가 제조 강요
        detail: 국내 생산·일자리 목표로 R&D 중심 기업이 저부가 제조로 회귀하면 기술역량 낭비·생산성 둔화가 생길 수 있다.
        example: 의약품·첨단기업의 국내 제조 리쇼어링 압력.
    verdict: 일부 고용 회복은 가능하나 대규모·지속 회복을 단정하기 어려운 조건부 명제다.
  - id: p165
    statement: 제조업 일자리·생산 확대가 무역적자 축소로 이어진다
    category: 국제경제
    termIds:
      - manufacturing
      - trade-deficit
      - reshoring
      - protectionism
      - tariff
      - twin-deficit
      - tax-cut
    relationIds:
      - r871
    premise: 국내 제조업 고용과 생산을 늘리면 수입 대체·수출 확대로 무역적자가 줄어든다는 보호무역·리쇼어링 논리에 근거한다.
    holds:
      - label: 수입 대체·내수 둔화
        detail: 내수가 약하고 수입 대체가 빠르면 단기적으로 무역수지가 개선될 수 있다.
      - label: 약달러·수출 경쟁력
        detail: 환율이 수출에 유리하고 제조 수요가 붙으면 적자 축소와 고용이 동시에 나타날 수 있다.
    fails:
      - label: 쌍둥이 적자·강달러
        detail: 감세·재정적자 확대가 금리·달러 강세를 키우면 제조업을 키워도 무역적자가 오히려 커질 수 있다.
        example: "2017~2019년 미국: 제조업 일자리 증가와 무역적자 확대가 동시에 관찰."
      - label: 생산성·자본집약
