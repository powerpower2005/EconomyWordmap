propositions:
  - id: p1
    statement: "금리가 오르면 물가가 내려간다"
    category: 통화정책
    termIds: [interest-rate, inflation, policy-rate, aggregate-demand, expected-inflation]
    premise: "금리가 오르면 차입 비용이 커져 소비·투자가 위축되고 총수요가 둔화되어 물가 상승 압력이 완화된다는 통화정책 전달경로에 근거한다."
    holds:
      - label: "수요 견인 인플레이션 국면"
        detail: "경기 과열과 수요 초과로 물가가 오르는 국면에서는 금리 인상이 총수요를 식혀 물가를 낮추는 효과가 비교적 뚜렷하다."
        example: "2022~2023년 미국 연준의 공격적 금리 인상 이후 인플레이션이 점진적으로 둔화."
      - label: "기대인플레이션이 안정된 경우"
        detail: "중앙은행 신뢰가 높아 기대가 안정(anchored)되어 있으면 금리 인상 신호만으로도 물가 기대가 빠르게 조정된다."
    fails:
      - label: "공급 충격발 인플레이션"
        detail: "에너지·원자재·공급망 차질로 인한 물가 상승은 수요 억제로 잡기 어렵고, 금리를 올려도 물가가 잘 내려가지 않으며 경기만 위축될 수 있다."
        example: "1970년대 오일쇼크 스태그플레이션."
      - label: "정책 시차"
        detail: "금리 인상이 물가에 미치는 효과는 보통 수개월에서 1년 이상 시차를 두고 나타나 단기에는 물가가 계속 오를 수 있다."
      - label: "재정 확장 동반"
        detail: "대규모 재정 지출이 함께 이뤄지면 통화 긴축 효과가 일부 상쇄되어 물가가 잘 잡히지 않는다."
    verdict: "장기·수요 견인 국면에서는 대체로 성립하지만, 공급 충격이나 정책 시차, 재정 변수 앞에서는 약하거나 지연된다. 무조건 참이 아닌 조건부 명제다."

  - id: p2
    statement: "자유무역은 모두에게 이득이다"
    category: 국제경제
    termIds: [free-trade, comparative-advantage, consumer-welfare, trade-war, strategic-trade-theory, inequality]
    premise: "비교우위에 따라 각국이 잘하는 분야에 특화하면 전체 생산과 후생이 커지고 소비자 가격이 낮아진다는 포지티브섬 논리에 근거한다."
    holds:
      - label: "국가 전체의 후생"
        detail: "교역으로 전체 생산이 늘고 소비자는 더 싸고 다양한 상품을 얻어 평균적으로 후생이 증가한다."
        example: "세계화 이후 신흥국 성장과 글로벌 빈곤율 하락."
      - label: "경쟁 촉진과 생산성"
        detail: "수입 경쟁이 국내 기업의 효율을 끌어올리고 분업·전문화를 심화한다."
    fails:
      - label: "분배 문제(패자 발생)"
        detail: "전체는 이득이어도 경쟁에서 밀린 특정 산업·노동자는 일자리와 소득을 잃어 불평등이 커질 수 있다."
        example: "선진국 제조업 공동화와 러스트벨트 쇠퇴."
      - label: "불완전 경쟁·전략 산업"
        detail: "소수 기업이 지배하는 산업에서는 전략적 무역이론처럼 보조금·보호가 자국에 이득이 될 수 있어 무조건적 자유무역이 최선이 아니다."
      - label: "경제 안보"
        detail: "핵심 물자를 특정국에 의존하면 공급망 무기화 위험이 커져 효율만으로 판단하기 어렵다."
    verdict: "국가 전체 합으로는 이득이 크지만 분배·전략·안보 측면에서 패자와 위험이 생긴다. 재분배와 선택적 보호로 보완해야 하는 조건부 명제다."

  - id: p3
    statement: "정부는 시장에 개입하지 않는 것이 좋다"
    category: 경제이론
    termIds: [laissez-faire, invisible-hand, market-failure, externality, public-goods, keynesian-economics, industrial-policy]
    premise: "개인의 이기심이 가격 메커니즘을 통해 자원을 효율적으로 배분한다는 보이지 않는 손의 논리에 근거한다."
    holds:
      - label: "경쟁적이고 외부효과가 적은 시장"
        detail: "정보가 충분하고 경쟁적인 시장에서는 가격이 수요와 공급을 효율적으로 조정해 개입이 오히려 비효율을 낳는다."
      - label: "지식·정보의 분산"
        detail: "가격은 분산된 정보를 집약하므로 중앙 계획보다 시장이 자원 배분에 유리하다."
    fails:
      - label: "시장 실패"
        detail: "외부효과·공공재·독점·정보 비대칭이 있으면 시장만으로는 효율적 배분에 실패해 정부 개입이 정당화된다."
        example: "환경오염(외부효과)과 국방(공공재)."
      - label: "단기 총수요 부족"
        detail: "가격·임금이 경직적인 단기에는 시장이 스스로 완전고용을 회복하지 못해 케인즈식 수요 관리가 필요할 수 있다."
        example: "1930년대 대공황."
    verdict: "경쟁시장에서는 대체로 옳지만 시장 실패와 단기 침체 영역에서는 개입이 필요하다. 개입 여부는 영역에 따라 갈린다."

  - id: p4
    statement: "통화량이 늘어나면 물가가 오른다"
    category: 통화
    termIds: [money-supply, inflation, velocity-of-money, quantitative-easing, expected-inflation]
    premise: "교환방정식 MV=PY에서 유통속도와 생산이 일정하면 통화량 증가가 물가 상승으로 이어진다는 화폐수량설에 근거한다."
    holds:
      - label: "장기와 고인플레이션 국면"
        detail: "장기적으로, 특히 통화를 과도하게 찍어내는 초인플레이션 국면에서는 통화량과 물가가 강하게 함께 움직인다."
        example: "바이마르 독일·짐바브웨의 초인플레이션."
    fails:
      - label: "유동성 함정과 속도 하락"
        detail: "경기 불안으로 화폐유통속도가 떨어지면 통화가 늘어도 지출과 물가로 이어지지 않는다."
        example: "2010년대 대규모 양적완화에도 낮게 유지된 물가."
      - label: "단기와 기대"
        detail: "단기에는 통화량보다 기대인플레이션과 신용·수요 상황이 물가를 더 좌우한다."
    verdict: "장기에는 성립하는 경향이 있으나 단기와 유통속도·금융중개 상황에 따라 약해진다. 시점에 크게 의존하는 명제다."

  - id: p5
    statement: "관세를 매기면 자국 산업이 보호되고 무역수지가 개선된다"
    category: 국제경제
    termIds: [tariff, protectionism, consumer-welfare, trade-war, trade-deficit]
    premise: "수입품에 세금을 매기면 수입 가격이 올라 수입이 줄고 국내 생산이 보호된다는 보호무역 논리에 근거한다."
    holds:
      - label: "단기 산업 보호"
        detail: "초기 유치산업이나 위기에 빠진 사양 산업을 단기적으로 보호해 시간을 벌어줄 수 있다."
    fails:
      - label: "소비자 후생 감소"
        detail: "관세는 국내 가격을 올려 소비자와 관세 대상 원자재를 쓰는 기업의 비용을 높인다."
      - label: "보복과 무역전쟁"
        detail: "상대국이 보복 관세로 맞대응하면 수출도 줄어 양측 모두 손해를 본다."
      - label: "무역수지 효과의 불확실성"
        detail: "환율 절상과 공급망 비용 상승이 동반되면 무역수지 개선 효과가 상쇄되어 결과가 불확실하다."
    verdict: "단기 보호는 가능하지만 소비자 비용과 보복 위험, 환율 반응 때문에 순효과는 불확실하다. 선택적·한시적으로만 정당화된다."

  - id: p6
    statement: "재정적자가 늘면 국채 금리가 오른다"
    category: 정부
    termIds: [fiscal-policy, government-bond, long-term-interest-rate, tax-cut, bond-market]
    premise: "재정적자가 커지면 국채 발행이 늘고 재정 건전성 우려가 커져 채권이 매도되고 금리가 오른다는 논리에 근거한다."
    holds:
      - label: "재정 신뢰가 흔들릴 때"
        detail: "시장이 재정 지속가능성을 의심하면 국채가 급히 매도되어 금리가 치솟는다."
        example: "2022년 영국 트러스 정부의 감세안 발표 후 국채 급락(트러스 쇼크)."
    fails:
      - label: "안전자산 선호"
        detail: "위기 국면에서 국채로 안전자산 수요가 몰리면 적자 확대에도 금리가 오히려 내려갈 수 있다."
      - label: "중앙은행 매입과 자국통화 부채"
        detail: "중앙은행이 국채를 매입하거나 자국통화 표시 국채 수요가 강하면 적자에도 금리가 낮게 유지될 수 있다."
        example: "장기 저금리를 유지해 온 일본과 평시의 미국."
    verdict: "시장의 재정 신뢰와 통화정책·안전자산 수요 상황에 따라 결과가 갈리는 조건부 명제다."

  - id: p7
    statement: "통화가 약세가 되면 수출이 늘어난다"
    category: 국제경제
    termIds: [exchange-rate, weak-dollar, trade-surplus, korean-won, inflation]
    premise: "자국 통화가 약세가 되면 수출품의 외화 표시 가격이 낮아져 가격 경쟁력이 올라가 수출이 늘고 무역수지가 개선된다는 논리에 근거한다."
    holds:
      - label: "중기 가격 경쟁력 효과"
        detail: "시간이 지나 수출 물량이 가격 변화에 반응하면(J커브 후반) 수출이 늘고 무역수지가 개선된다."
      - label: "글로벌 수요가 견조할 때"
        detail: "해외 경기가 좋아 수요가 충분하면 환율 약세의 가격 효과가 수출 증가로 잘 이어진다."
    fails:
      - label: "J커브 초기"
        detail: "환율 약세 직후에는 수입 가격이 먼저 올라 단기적으로 무역수지가 오히려 악화될 수 있다."
      - label: "수입 중간재 의존"
        detail: "한국처럼 원자재·중간재를 많이 수입하는 구조에서는 약세로 수입 비용이 올라 채산성과 물가를 압박한다."
      - label: "글로벌 가치사슬"
        detail: "생산이 여러 나라에 분산된 글로벌 가치사슬에서는 환율 변화가 최종 가격에 잘 전가되지 않아 효과가 제한된다."
    verdict: "중기적으로 수요가 받쳐줄 때는 성립하지만 J커브 초기, 수입 의존, 글로벌 가치사슬 때문에 즉각적이지 않은 조건부 명제다."

  - id: p8
    statement: "정부 지출을 늘리면 경기가 살아난다"
    category: 정부
    termIds: [fiscal-policy, aggregate-demand, gdp, keynesian-economics, government-bond]
    premise: "정부 지출이 총수요를 직접 늘리고 소비·투자로 파급되어(재정승수) 생산과 고용이 늘어난다는 케인즈식 논리에 근거한다."
    holds:
      - label: "불황과 유휴자원"
        detail: "실업과 유휴 설비가 많은 불황기에는 재정승수가 커서 지출 확대가 경기를 효과적으로 끌어올린다."
        example: "2008년 금융위기·2020년 팬데믹 대응 재정 부양."
      - label: "유동성 함정"
        detail: "금리가 매우 낮아 통화정책 여력이 없을 때는 재정정책의 효과가 상대적으로 크다."
    fails:
      - label: "완전고용 근처의 구축효과"
        detail: "경기가 이미 과열에 가까우면 정부 차입이 금리를 올려 민간 투자를 밀어내(구축효과) 효과가 줄어든다."
      - label: "재정 신뢰·부채 우려"
        detail: "부채가 과도하면 지출 확대가 금리 상승과 신뢰 훼손으로 이어져 역효과를 낼 수 있다."
    verdict: "경기 국면(유휴자원 여부)에 따라 효과가 크게 달라지는 조건부 명제다."

  - id: p9
    statement: "최저임금을 올리면 고용이 줄어든다"
    category: 미시경제
    termIds: [unemployment, perfect-competition, market-failure, inequality]
    premise: "완전경쟁 노동시장에서 임금이라는 가격에 하한을 두면 노동 공급이 수요를 초과해 실업이 늘어난다는 수요·공급 논리에 근거한다."
    holds:
      - label: "경쟁적 시장과 큰 인상폭"
        detail: "노동시장이 경쟁적이고 인상폭이 크면 청년·저숙련 일자리에서 고용이 위축될 수 있다."
    fails:
      - label: "수요독점 노동시장"
        detail: "고용주가 임금 결정력을 가진 수요독점 시장에서는 적정 수준의 최저임금 인상이 고용을 줄이지 않거나 오히려 늘릴 수 있다."
      - label: "소비 진작 효과"
        detail: "저소득층 소득이 늘면 소비가 증가해 수요가 살아나 고용 감소를 상쇄할 수 있다."
    verdict: "노동시장 구조와 인상폭에 따라 결과가 갈리며 실증 결과도 혼재된 조건부 명제다."

  - id: p10
    statement: "양적완화(QE)는 인플레이션을 일으킨다"
    category: 통화
    termIds: [quantitative-easing, inflation, money-supply, velocity-of-money, bank]
    premise: "중앙은행이 자산을 사들여 본원통화를 늘리면 통화량이 늘어 물가가 오른다는 화폐수량설적 논리에 근거한다."
    holds:
      - label: "신용·수요로 이어질 때"
        detail: "풀린 돈이 대출과 지출로 이어지고 수요가 강하면 물가 상승으로 연결된다."
        example: "2020~2022년 대규모 부양과 공급 차질이 겹친 인플레이션."
    fails:
      - label: "지급준비금에 머무를 때"
        detail: "은행이 늘어난 유동성을 대출로 풀지 않고 지급준비금으로 쌓아두면 물가로 잘 이어지지 않는다."
        example: "2010년대 미국·유럽의 QE에도 낮게 유지된 물가."
      - label: "유통속도 하락"
        detail: "경기 불안과 디레버리징으로 화폐유통속도가 떨어지면 통화 증가가 물가로 전달되지 않는다."
    verdict: "통화량 증가가 신용·수요로 이어지는지에 달려 있어 항상 인플레이션을 부르지는 않는 조건부 명제다."

  - id: p11
    statement: "주가는 경기를 선행한다"
    category: 금융
    termIds: [stock-market, gdp, economic-growth, investment]
    premise: "주가는 미래 기업 이익과 경기 기대를 미리 반영하므로 실물 경기보다 앞서 움직인다는 논리에 근거한다."
    holds:
      - label: "평균적 선행성"
        detail: "역사적으로 주식시장은 경기 저점에 앞서 반등하고 고점에 앞서 꺾이는 경향이 있어 선행지표로 쓰인다."
    fails:
      - label: "거짓 신호"
        detail: "주가는 실제보다 자주 경기 전환을 예고해 빗나가며, 침체 없는 조정이나 조정 없는 침체도 나타난다."
      - label: "유동성 장세"
        detail: "금리·유동성에 의해 펀더멘털과 무관하게 움직이면 경기와의 연결이 약해진다."
    verdict: "평균적으로 선행하는 경향은 있으나 잡음과 거짓 신호가 많아 단독으로 신뢰하기 어려운 명제다."

  - id: p12
    statement: "금리를 내리면 주가가 오른다"
    category: 금융
    termIds: [interest-rate, policy-rate, stock-market, investment]
    premise: "금리가 내리면 미래 현금흐름의 할인율이 낮아져 자산 가치가 오르고 차입·위험선호가 커져 주가에 유리하다는 논리에 근거한다."
    holds:
      - label: "경기 정상 국면의 완화"
        detail: "경기가 크게 나쁘지 않은 상태에서의 금리 인하는 밸류에이션과 위험선호를 높여 주가를 끌어올린다."
    fails:
      - label: "침체 신호로서의 인하"
        detail: "경기 급랭 우려 때문에 다급하게 내리는 인하는 이익 전망 악화로 오히려 주가 하락과 동반될 수 있다."
      - label: "이미 선반영"
        detail: "시장이 인하를 미리 반영했다면 실제 인하에도 주가가 더 오르지 않거나 차익실현이 나올 수 있다."
    verdict: "인하의 배경(경기 상황)에 따라 방향이 갈리는 조건부 명제다."

  - id: p13
    statement: "국가부채가 많으면 경제성장이 둔화된다"
    category: 정부
    termIds: [fiscal-policy, government-bond, economic-growth, long-term-interest-rate]
    premise: "부채가 늘면 이자 부담과 금리 상승, 미래 증세 우려가 투자와 성장을 짓누른다는 논리에 근거한다."
    holds:
      - label: "과도한 부채와 신뢰 위기"
        detail: "부채가 지나치게 많고 특히 외화 표시일 때는 금리 급등과 신뢰 위기로 성장이 꺾인다."
    fails:
      - label: "기축통화·저금리"
        detail: "자국통화로 빌리고 안전자산 수요가 강한 나라는 높은 부채에도 낮은 금리를 유지하며 성장할 수 있다."
      - label: "생산적 투자"
        detail: "부채가 인프라·교육 등 생산성을 높이는 투자에 쓰이면 장기 성장을 오히려 견인할 수 있다."
    verdict: "부채의 규모뿐 아니라 통화 주권과 부채의 용도(질)에 크게 의존하는 조건부 명제다."

  - id: p14
    statement: "기술 발전은 일자리를 없앤다"
    category: 거시경제
    termIds: [technological-progress, unemployment, manufacturing, economic-growth]
    premise: "자동화와 기계가 사람의 일을 대체하므로 기술이 발전하면 일자리가 줄어든다는 논리에 근거한다."
    holds:
      - label: "단기 전환 비용"
        detail: "특정 직무와 산업에서는 자동화로 일자리가 사라지고 노동자가 재배치되기까지 마찰적 실업이 생긴다."
        example: "산업혁명기 러다이트 운동, 제조 자동화로 인한 공장 고용 감소."
    fails:
      - label: "장기 일자리 창출"
        detail: "생산성 향상이 소득과 수요를 늘리고 새로운 산업·직무를 만들어 장기적으로는 고용이 줄지 않는 경향이 있다."
      - label: "보완 효과"
        detail: "기술이 사람의 생산성을 높여 보완하는 경우 일자리의 성격이 바뀔 뿐 총량은 유지되거나 늘 수 있다."
    verdict: "단기적 일자리 대체는 분명하나 장기적으로는 창출 효과가 커, 시점에 따라 평가가 갈리는 명제다."

  - id: p15
    statement: "세율을 낮추면 세수가 늘어난다"
    category: 정부
    termIds: [tax-cut, fiscal-policy, economic-growth]
    premise: "세율을 낮추면 노동·투자 의욕이 살아나 세원이 커져 오히려 세수가 늘 수 있다는 래퍼곡선 논리에 근거한다."
    holds:
      - label: "세율이 매우 높은 구간"
        detail: "세율이 지나치게 높아 경제활동을 위축시키던 구간에서는 인하가 세원 확대를 통해 세수를 늘릴 수 있다."
    fails:
      - label: "일반적 세율 구간"
        detail: "대부분의 현실적 세율 구간에서는 감세가 세수 감소와 재정적자 확대로 이어진다."
        example: "1980년대 미국 감세 이후 재정적자 확대."
    verdict: "현재 세율이 래퍼곡선의 어느 위치에 있느냐에 전적으로 의존하는 조건부 명제다."

  - id: p16
    statement: "물가가 오르면 실업이 줄어든다(필립스 곡선)"
    category: 거시경제
    termIds: [inflation, unemployment, expected-inflation, aggregate-demand]
    premise: "총수요가 늘면 고용이 늘고 물가도 함께 오르므로 인플레이션과 실업 사이에 단기 트레이드오프가 있다는 논리에 근거한다."
    holds:
      - label: "단기 수요 충격 국면"
        detail: "기대인플레이션이 안정된 단기에는 총수요 변화에 따라 물가와 실업이 반대로 움직이는 관계가 관찰된다."
    fails:
      - label: "장기 수직"
        detail: "장기적으로는 실업이 자연실업률로 회귀해 물가만 오를 뿐 트레이드오프가 사라진다."
      - label: "스태그플레이션"
        detail: "공급 충격으로 기대인플레이션이 흔들리면 물가와 실업이 동시에 오르는 스태그플레이션이 나타난다."
        example: "1970년대 오일쇼크."
    verdict: "단기에는 성립하지만 장기와 기대 변동, 공급 충격 앞에서는 깨지는 조건부 명제다."

  - id: p17
    statement: "금은 인플레이션 헤지 수단이다"
    category: 원자재
    termIds: [gold, inflation, real-interest-rate, strong-dollar]
    premise: "금은 화폐가치가 하락할 때 실물 안전자산으로서 가치를 보존해 인플레이션을 방어한다는 논리에 근거한다."
    holds:
      - label: "장기·실질금리 하락 국면"
        detail: "장기적으로, 특히 실질금리가 낮거나 통화 신뢰가 흔들리는 고인플레이션 국면에서 금이 가치를 보존하는 경향이 있다."
    fails:
      - label: "실질금리 상승·강달러"
        detail: "인플레이션이 높아도 실질금리가 오르고 달러가 강해지면 이자 없는 금은 부진할 수 있다."
        example: "2022년 인플레이션 급등기에도 긴축·강달러로 금값 약세 구간."
      - label: "단기 변동성"
        detail: "단기적으로는 위험선호·달러·금리에 휘둘려 물가와의 연결이 약하다."
    verdict: "장기적 보존 수단이지만 단기에는 실질금리와 달러에 더 민감한 조건부 명제다."

  - id: p18
    statement: "관세로 보호하면 자국 일자리를 지킬 수 있다"
    category: 국제경제
    termIds: [tariff, protectionism, manufacturing, trade-war, consumer-welfare]
    premise: "수입을 관세로 억제하면 국내 생산과 그 산업의 고용이 보호된다는 보호무역 논리에 근거한다."
    holds:
      - label: "보호 대상 산업의 단기 고용"
        detail: "관세 대상 산업에서는 단기적으로 수입 경쟁이 줄어 고용이 방어될 수 있다."
    fails:
      - label: "전후방 산업의 비용 증가"
        detail: "관세로 원자재·부품 값이 오르면 이를 쓰는 더 큰 산업의 비용과 고용이 악화되어 순고용은 줄 수 있다."
      - label: "보복 관세"
        detail: "상대국이 보복하면 수출 산업의 일자리가 줄어 보호 효과가 상쇄된다."
    verdict: "보호 대상 산업의 일자리는 지킬 수 있어도 전체 고용으로 보면 상충해 순효과가 불확실한 명제다."

  - id: p19
    statement: "중앙은행이 금리를 올리면 반드시 경기침체가 온다"
    category: 통화정책
    termIds: [policy-rate, unemployment, inflation, federal-reserve]
    premise: "금리 인상이 수요를 위축시키므로 긴축은 결국 경기침체(경착륙)로 이어진다는 논리에 근거한다."
    holds:
      - label: "과도하고 급격한 긴축"
        detail: "물가를 잡기 위해 빠르고 큰 폭으로 긴축하면 수요가 급랭해 침체로 이어진 사례가 많다."
        example: "1980년대 초 볼커의 고강도 긴축과 경기침체."
    fails:
      - label: "연착륙 가능성"
        detail: "공급 여건 개선이 동반되거나 긴축 속도가 완만하면 침체 없이 물가만 둔화되는 연착륙이 가능하다."
        example: "1994~1995년, 2023~2024년 연착륙 논쟁."
    verdict: "긴축의 속도와 공급 여건에 따라 경착륙과 연착륙이 갈리므로 '반드시'는 성립하지 않는 명제다."

  - id: p20
    statement: "달러가 강해지면 신흥국 경제가 어려워진다"
    category: 국제경제
    termIds: [strong-dollar, exchange-rate, korean-won, supply-chain]
    premise: "달러 강세는 달러 표시 부채의 상환 부담을 키우고 신흥국에서 자본을 유출시켜 금융 불안을 부른다는 논리에 근거한다."
    holds:
      - label: "달러부채가 많은 신흥국"
        detail: "달러 부채가 크고 외환보유가 부족한 신흥국은 강달러 국면에서 상환 부담과 자본유출로 위기에 취약하다."
        example: "1997년 아시아 외환위기, 2013년 테이퍼 텐트럼."
    fails:
      - label: "대외건전성이 양호한 경우"
        detail: "경상흑자·충분한 외환보유·낮은 달러부채를 가진 나라는 강달러의 충격을 비교적 잘 견딘다."
    verdict: "신흥국의 대외건전성과 달러부채 수준에 따라 충격의 크기가 크게 달라지는 조건부 명제다."

  - id: p21
    statement: "상품의 가치는 생산에 들어간 노동·비용으로 결정된다"
    category: 경제이론
    termIds: [labor-theory-of-value, subjective-value-theory, marginal-utility, diamond-water-paradox]
    premise: "투입된 노동량과 생산 비용이 상품의 객관적 가치를 결정한다는 고전파 노동가치설에 근거한다."
    holds:
      - label: "장기 경쟁시장의 공급가"
        detail: "장기 경쟁 균형에서는 생산 비용이 가격의 하한을 형성해 비용과 가격이 비슷하게 수렴하는 경향이 있다."
    fails:
      - label: "다이아몬드-물 역설"
        detail: "생존에 필수인 물은 싸고 쓸모가 적은 다이아몬드는 비싼 현상을 비용만으로는 설명하지 못한다."
      - label: "희소성과 수요"
        detail: "가치는 비용뿐 아니라 희소성과 소비자의 주관적 한계효용에 의해 결정되며, 한계혁명이 이를 보였다."
    verdict: "비용은 공급 측 요인일 뿐 가치는 수요(한계효용)와 함께 결정된다. 비용만으로 가치를 설명하려던 명제는 한계가 분명하다."

  - id: p22
    statement: "사람은 항상 합리적으로 선택한다"
    category: 경제이론
    termIds: [homo-economicus, bounded-rationality, behavioral-economics, marginal-analysis]
    premise: "사람은 완전한 정보로 자기 효용을 극대화한다는 합리적 경제인 가정에 근거하며, 한계에서의 합리적 계산을 전제한다."
    holds:
      - label: "반복적·고액 거래"
        detail: "결과가 크고 반복 학습이 가능한 상황에서는 사람들이 평균적으로 합리적 선택에 가깝게 행동한다."
    fails:
      - label: "인지 편향과 휴리스틱"
        detail: "현실의 사람은 손실 회피·현상 유지·과신 등 체계적 편향에 휘둘려 합리적 예측에서 벗어난다."
      - label: "제한된 합리성"
        detail: "정보·시간·계산 능력의 한계 때문에 최적 대신 만족할 만한 선택에 그친다."
    verdict: "근사 모델로는 유용하지만 체계적 비합리성이 존재해 행동경제학의 보정이 필요한 조건부 명제다."

  - id: p23
    statement: "많이 소비할수록 추가 만족은 줄어든다"
    category: 미시경제
    termIds: [diminishing-marginal-utility, marginal-utility, consumer-sovereignty]
    premise: "같은 재화를 한 단위 더 소비할수록 추가로 얻는 만족(한계효용)이 줄어든다는 한계효용 체감 법칙에 근거한다."
    holds:
      - label: "대부분의 일반 재화"
        detail: "음식·물 등 대다수 재화에서 소비가 늘수록 추가 만족이 줄어 수요 곡선이 우하향한다."
    fails:
      - label: "중독재와 수집·네트워크재"
        detail: "중독성 재화나 수집품, 사용자가 늘수록 가치가 커지는 네트워크 재화에서는 한계효용이 오히려 커질 수 있다."
    verdict: "일반 재화에서는 폭넓게 성립하지만 중독·수집·네트워크 효과가 있는 재화에서는 예외가 있는 명제다."

  - id: p24
    statement: "시장이 파레토 효율이면 바람직하다"
    category: 미시경제
    termIds: [pareto-efficiency, welfare-economics, inequality, market-failure]
    premise: "누구의 후생도 해치지 않고는 개선이 불가능한 파레토 효율 상태가 자원 배분의 바람직한 기준이라는 논리에 근거한다."
    holds:
      - label: "효율 평가 기준"
        detail: "낭비 없는 자원 배분을 판단하는 명확한 기준으로 유용하다."
    fails:
      - label: "분배·형평성 외면"
        detail: "극단적으로 불평등한 배분도 파레토 효율일 수 있어 효율은 공정성을 보장하지 않는다."
      - label: "시장 실패"
        detail: "외부효과·공공재·독점·정보 비대칭이 있으면 시장 균형이 파레토 효율에 미치지 못한다."
    verdict: "효율의 기준일 뿐 공정성과는 별개이며 시장 실패 앞에서는 달성되지도 않는, 보완이 필요한 명제다."

  - id: p25
    statement: "가격은 수요와 공급이 만나는 점에서 결정된다"
    category: 미시경제
    termIds: [supply-and-demand, price-mechanism, monopoly, information-asymmetry]
    premise: "소비자의 한계효용에서 나온 수요와 생산자의 한계비용에서 나온 공급이 교차하는 점에서 가격이 정해진다는 마셜의 가위 논리에 근거한다."
    holds:
      - label: "경쟁시장"
        detail: "다수의 참여자와 충분한 정보가 있는 경쟁시장에서는 가격이 수요·공급 균형점으로 잘 수렴한다."
    fails:
      - label: "불완전 경쟁"
        detail: "독점·과점에서는 기업이 가격 결정력을 가져 균형 가격에서 벗어난다."
      - label: "정보 비대칭과 통제"
        detail: "정보 비대칭, 가격 통제, 기대 변화가 있으면 단순 수급 균형에서 괴리된다."
    verdict: "경쟁시장의 기준 모델로 강력하지만 시장 구조와 정보 조건에 따라 수정이 필요한 명제다."

  - id: p26
    statement: "불황에는 정부가 지출을 늘려 수요를 살려야 한다"
    category: 거시경제
    termIds: [keynesian-economics, effective-demand, fiscal-policy, multiplier, national-debt]
    premise: "민간 수요가 부족할 때 정부가 재정 지출로 총수요를 메워야 한다는 케인즈 처방에 근거한다."
    holds:
      - label: "유효수요 부족 국면"
        detail: "유휴 자원이 많고 민간이 지출을 줄이는 불황에서는 정부 지출이 승수효과로 경기를 회복시킨다."
        example: "2008년 글로벌 금융위기와 2020년 코로나19 때의 대규모 재정 부양."
      - label: "유동성 함정"
        detail: "금리가 0에 가까워 통화정책이 막히면 재정정책이 거의 유일한 수요 보완 수단이 된다."
    fails:
      - label: "완전고용·공급 충격"
        detail: "자원이 이미 완전히 쓰이거나 공급 측 충격이 원인이면 부양이 인플레이션과 스태그플레이션을 부른다."
      - label: "부채와 정부 실패"
        detail: "적자가 누적되어 국가부채가 늘고 정치적 남용으로 효율이 떨어질 수 있다."
    verdict: "불황이 수요 부족 때문인지에 따라 효과가 크게 갈리는 조건부 처방이다."

  - id: p27
    statement: "불황기에는 비효율 기업을 청산해야 회복이 빠르다"
    category: 경제이론
    termIds: [austrian-school, malinvestment, creative-destruction, zombie-firm, unemployment]
    premise: "잘못 배분된 투자와 좀비기업을 정리해야 자원이 재배분되어 건강하게 회복된다는 오스트리아적 처방에 근거한다."
    holds:
      - label: "구조적 비효율 누적"
        detail: "저금리로 좀비기업이 만연해 생산성이 정체된 국면에서는 청산이 자원을 효율적으로 재배분한다."
    fails:
      - label: "급성 수요 붕괴"
        detail: "대규모 청산이 대량 실업과 총수요 급락, 디플레이션 악순환을 일으켜 불황을 더 깊게 만들 수 있다."
    verdict: "장기 생산성에는 옳지만 단기의 고통과 수요 붕괴를 외면한다는 한계가 있는 명제다."

  - id: p28
    statement: "중앙은행이 금리를 낮추면 경기가 살아난다"
    category: 통화정책
    termIds: [interest-rate, liquidity-trap, malinvestment, central-bank]
    premise: "금리 인하가 차입 비용을 낮춰 투자와 소비를 자극한다는 통념에 근거한다."
    holds:
      - label: "정상 국면"
        detail: "금리에 여유가 있는 평상시에는 인하가 투자·소비를 늘려 수요를 진작한다."
    fails:
      - label: "유동성 함정"
        detail: "금리가 이미 0에 가까우면 추가 인하가 수요를 늘리지 못해 무력해진다."
      - label: "장기 저금리의 부작용"
        detail: "지나치게 오래 낮은 금리는 말인베스트먼트와 자산 버블을 키운다."
    verdict: "경기 국면과 금리 수준에 따라 효과가 달라지는 조건부 명제다."

  - id: p29
    statement: "정부 지출은 승수효과로 더 큰 소득을 만든다"
    category: 거시경제
    termIds: [multiplier, fiscal-policy, aggregate-demand, lucas-critique]
    premise: "정부 지출이 소득을 늘리고 그 소득이 다시 소비로 이어져 처음 지출보다 큰 총수요를 만든다는 승수 이론에 근거한다."
    holds:
      - label: "유휴 자원이 많은 불황"
        detail: "쓰이지 않던 노동·자본이 많을 때는 승수가 1보다 커서 지출 효과가 증폭된다."
    fails:
      - label: "완전고용의 구축효과"
        detail: "자원이 꽉 찬 상태에서는 정부 지출이 민간 투자를 밀어내 효과가 상쇄된다."
      - label: "루카스 비판"
        detail: "사람들이 정책을 미리 예상하고 행동을 바꾸면 기대했던 승수효과가 줄어든다."
    verdict: "경기 국면과 자원 여유에 따라 승수 크기가 크게 달라지는 명제다."

  - id: p30
    statement: "통화량을 늘리면 물가가 오른다"
    category: 통화
    termIds: [money-supply, inflation, liquidity-trap, quantitative-easing]
    premise: "화폐 공급 증가가 화폐가치를 떨어뜨려 물가를 끌어올린다는 화폐수량설 직관에 근거한다."
    holds:
      - label: "완전고용·장기"
        detail: "생산이 한계에 이른 장기에는 늘어난 통화가 지출로 풀려 물가 상승으로 이어진다."
    fails:
      - label: "유동성 함정과 디플레 압력"
        detail: "수요가 위축된 국면에서는 늘어난 돈이 지출로 가지 않아 물가가 잘 오르지 않는다."
        example: "2010년대 선진국의 대규모 양적완화에도 낮게 유지된 물가."
    verdict: "경제 국면과 화폐 유통속도에 따라 성립 여부가 갈리는 조건부 명제다."

  - id: p31
    statement: "실업을 낮추려 경기를 부양하면 결국 인플레이션만 오른다"
    category: 거시경제
    termIds: [phillips-curve, natural-rate-of-unemployment, monetarism, inflation, unemployment]
    premise: "실업을 자연실업률 이하로 낮추려는 부양은 결국 인플레이션만 가속시킨다는 프리드먼의 자연실업률 가설에 근거한다."
    holds:
      - label: "자연실업률 근처"
        detail: "실업이 이미 자연율 수준이고 기대 인플레이션이 형성된 상태에서 부양하면 고용은 그대로고 물가만 오른다."
        example: "1970년대 미국의 부양책이 스태그플레이션으로 귀결된 사례."
    fails:
      - label: "깊은 불황"
        detail: "유휴 자원이 많은 침체에서는 부양이 단기 필립스 상충을 통해 실질 고용을 개선할 수 있다."
    verdict: "경기가 자연실업률에서 얼마나 떨어져 있는지에 따라 갈리는 조건부 명제다."

  - id: p32
    statement: "중앙은행은 재량보다 정해진 규칙을 따라야 한다"
    category: 통화정책
    termIds: [monetary-policy-rule, time-inconsistency, central-bank-independence, monetarism]
    premise: "시간 불일치 때문에 재량적 정책은 신뢰를 잃으므로 예측 가능한 규칙이 우월하다는 통화주의 주장에 근거한다."
    holds:
      - label: "신뢰와 기대 안정"
        detail: "평상시에는 예측 가능한 규칙이 인플레이션 기대를 안정시키고 정책 신뢰를 높인다."
    fails:
      - label: "예외적 충격"
        detail: "금융위기나 큰 공급 충격에는 경직된 규칙이 대응력을 떨어뜨려 재량적 개입이 필요할 수 있다."
    verdict: "신뢰 확보엔 유리하지만 충격 대응의 유연성과 상충하는 명제다."

  - id: p33
    statement: "일시적 소득 증가는 소비를 크게 늘린다"
    category: 경제이론
    termIds: [permanent-income-hypothesis, multiplier, fiscal-policy]
    premise: "재난지원금이나 일회성 감세 같은 일시 소득이 소비를 크게 부양한다는 통념에 근거한다."
    holds:
      - label: "유동성 제약 가구"
        detail: "현금이 부족한 저소득 가구에서는 일시 소득이 곧바로 소비로 이어진다."
    fails:
      - label: "영구소득가설"
        detail: "소비가 평생 기대 소득을 따른다면 일시 소득은 대부분 저축되어 부양 효과가 작다."
    verdict: "가계의 유동성 제약 정도에 따라 효과가 크게 갈리는 조건부 명제다."

  - id: p34
    statement: "중앙은행이 통화량 목표를 정하면 물가를 안정시킬 수 있다"
    category: 통화정책
    termIds: [quantity-theory-of-money, money-supply, velocity-of-money, inflation-targeting]
    premise: "화폐수량설에 따라 통화량 증가율을 통제하면 물가가 안정된다는 통화주의 준칙에 근거한다."
    holds:
      - label: "유통속도 안정"
        detail: "화폐 유통속도가 안정적이고 화폐의 정의가 명확할 때는 통화량 통제가 물가를 안정시킨다."
    fails:
      - label: "유통속도 불안정"
        detail: "금융 혁신으로 유통속도와 화폐 정의가 흔들리면서 1980년대 이후 대부분 통화량 목표제를 포기했다."
    verdict: "유통속도 안정이라는 전제가 무너지면 작동하지 않아 금리·물가목표제로 전환된 명제다."

  - id: p35
    statement: "인플레이션 기대는 한번 형성되면 잡기 어렵다"
    category: 거시경제
    termIds: [inflation, rational-expectations, central-bank-independence, stagflation]
    premise: "임금과 물가가 서로 밀어 올리는 기대 악순환이 자리 잡으면 인플레이션을 통제하기 어렵다는 1970년대 교훈에 근거한다."
    holds:
      - label: "낮은 신뢰·임금연동"
        detail: "중앙은행 신뢰가 낮고 임금-물가 연동이 강하면 기대가 굳어져 인플레이션이 지속된다."
    fails:
      - label: "신뢰 높은 중앙은행"
        detail: "독립성과 신뢰가 높은 중앙은행은 강한 긴축으로 기대를 빠르게 안정시킬 수 있다."
        example: "1979~1982년 폴 볼커의 고금리 정책이 인플레이션 기대를 단기간에 꺾은 사례."
    verdict: "중앙은행의 신뢰성에 따라 기대 안정 속도가 달라지는 조건부 명제다."

  - id: p36
    statement: "정부의 체계적 정책은 사람들이 미리 예상해 효과가 없다"
    category: 경제이론
    termIds: [policy-ineffectiveness, rational-expectations, new-classical-economics, quantitative-easing]
    premise: "사람들이 합리적 기대로 정부의 체계적 정책을 예상하고 대응하면 효과가 상쇄된다는 새고전파의 정책 무력화 명제에 근거한다."
    holds:
      - label: "예고된 평상시 정책"
        detail: "충분히 예고되고 반복된 통화정책은 기대에 반영되어 실질 변수에 미치는 효과가 제한적이다."
    fails:
      - label: "예상 밖 비전통 정책"
        detail: "2008년과 2020년처럼 예상치 못한 양적완화나 대규모 재정 부양은 실제로 큰 효과를 냈다."
    verdict: "정책의 예상 가능성과 경기 상황에 따라 갈리며, 극단적 적용은 위기에서 반증된 명제다."

  - id: p37
    statement: "시장 가격은 이용 가능한 모든 정보를 반영한다"
    category: 금융
    termIds: [efficient-market-hypothesis, rational-expectations, herd-behavior, behavioral-economics]
    premise: "자산 가격이 모든 정보를 즉시 반영해 시장을 꾸준히 이기기 어렵다는 효율적 시장 가설에 근거한다."
    holds:
      - label: "유동성 높은 평상시 시장"
        detail: "거래가 활발한 시장에서는 새 정보가 빠르게 가격에 반영되어 초과수익을 꾸준히 내기 어렵다."
    fails:
      - label: "버블과 군중 행동"
        detail: "군중 행동과 과잉 자신감으로 버블과 붕괴가 반복되어 가격이 정보에서 크게 이탈한다."
        example: "2008년 서브프라임 버블의 형성과 붕괴."
    verdict: "평균적으로는 유효하지만 비합리성과 쏠림 앞에서는 무너지는 조건부 명제다."

  - id: p38
    statement: "과거 데이터로 추정한 모형은 정책이 바뀌어도 신뢰할 수 있다"
    category: 경제이론
    termIds: [lucas-critique, rational-expectations, dsge-model]
    premise: "과거 행동 패턴을 추정한 계량 모형으로 정책 효과를 예측할 수 있다는 전통적 접근에 근거한다."
    holds:
      - label: "안정적 정책 체제"
        detail: "정책 체제가 그대로 유지되는 동안에는 추정된 관계가 비교적 잘 유지된다."
    fails:
      - label: "루카스 비판"
        detail: "정책이 바뀌면 사람들의 기대와 행동이 바뀌어 과거에 추정한 모형 파라미터가 이동한다."
    verdict: "정책 변화 시에는 신뢰할 수 없어 기대·행동 반응을 명시적으로 반영해야 하는 명제다."

  - id: p39
    statement: "금융시장은 내버려두면 스스로 안정된다"
    category: 금융
    termIds: [efficient-market-hypothesis, financial-instability-hypothesis, leverage-ratio, systemic-risk]
    premise: "시장이 효율적이고 합리적이면 금융도 자기 교정을 통해 안정을 유지한다는 관점에 근거한다."
    holds:
      - label: "평온기"
        detail: "위기가 없는 평온기에는 차익거래와 가격 조정이 시장을 균형으로 되돌린다."
    fails:
      - label: "민스키의 동학"
        detail: "안정이 길어질수록 부채와 위험 감수가 늘어 금융이 스스로 불안정해지고 시스템 리스크로 번진다."
        example: "장기 호황 뒤에 터진 2008년 위기."
    verdict: "평온기에는 그럴듯하나 호황의 자기파괴적 동학을 놓치는 명제다."

  - id: p40
    statement: "거시경제는 대표적 경제주체 하나로 충분히 설명된다"
    category: 경제이론
    termIds: [representative-agent, heterogeneous-agent, dsge-model, inequality]
    premise: "경제를 평균적인 합리적 주체 한 명으로 단순화해도 핵심을 설명할 수 있다는 모형 가정에 근거한다."
    holds:
      - label: "총량 흐름 분석"
        detail: "총생산·물가 같은 총량 변수의 큰 흐름을 간결하게 분석할 때는 유용하다."
    fails:
      - label: "이질성과 불평등"
        detail: "부채 많은 가계와 은행의 상호작용, 불평등이 위기를 증폭시키는 과정을 담지 못한다."
        example: "2008년 위기에서 가계·금융기관의 이질적 상호작용이 충격을 키운 사례."
    verdict: "단순화에는 유용하나 이질성과 분배가 중요한 국면에서는 보완이 필요한 명제다."

  - id: p41
    statement: "사람은 같은 크기의 이익과 손실을 똑같이 느낀다"
    category: 경제이론
    termIds: [prospect-theory, loss-aversion, cognitive-bias, behavioral-economics]
    premise: "표준 효용이론은 같은 크기의 이득과 손실을 대칭적으로 평가한다고 가정한다."
    holds:
      - label: "작고 감정 개입 적은 거래"
        detail: "금액이 작고 반복적인 거래에서는 이익과 손실을 비교적 대칭적으로 다룬다."
    fails:
      - label: "손실 회피"
        detail: "프로스펙트 이론에 따르면 사람들은 손실의 고통을 이득의 기쁨보다 약 두 배 크게 느낀다."
    verdict: "손실 회피라는 체계적 편향 때문에 대체로 성립하지 않는 명제다."

  - id: p42
    statement: "선택 설계(넛지)로 사람들의 더 나은 결정을 유도할 수 있다"
    category: 정부
    termIds: [nudge, behavioral-economics, cognitive-bias]
    premise: "선택의 구조를 바꾸면 강제 없이도 사람들의 행동을 개선할 수 있다는 넛지 이론에 근거한다."
    holds:
      - label: "기본값 설계"
        detail: "연금 자동가입처럼 기본 선택지를 바꾸면 저축률이 크게 오른다."
    fails:
      - label: "지속성과 조작 논란"
        detail: "효과가 일시적이거나 맥락에 의존하고, 정부의 은밀한 조작이라는 비판과 자율성 침해 논란이 따른다."
    verdict: "특정 영역에선 효과적이나 투명성과 적용 범위에 따라 논란이 남는 조건부 명제다."

  - id: p43
    statement: "개인이 각자 합리적으로 행동하면 시스템 전체도 안전하다"
    category: 경제이론
    termIds: [systemic-risk, herd-behavior, leverage-ratio, financial-instability-hypothesis]
    premise: "개별 주체가 합리적으로 위험을 관리하면 전체 금융 시스템도 안전하다는 통념에 근거한다."
    holds:
      - label: "평상시"
        detail: "위기가 없는 평상시에는 개별 건전성 규제가 작동해 시스템도 안정적으로 유지된다."
    fails:
      - label: "구성의 오류"
        detail: "모두가 동시에 부채를 줄이고 자산을 팔면 개별적으로 합리적인 행동이 집단적 붕괴를 부른다."
        example: "2008년 위기의 디레버리징과 투매 악순환."
    verdict: "개별 합리성과 시스템 안정이 어긋나 거시건전성 감독이 필요함을 보여주는 명제다."

  - id: p44
    statement: "행동경제학이 주류 경제학을 대체할 수 있다"
    category: 경제이론
    termIds: [behavioral-economics, behavioral-finance, dsge-model, rational-expectations]
    premise: "인간의 비합리성을 다루는 행동경제학이 합리성 가정의 주류 경제학을 대신할 수 있다는 기대에 근거한다."
    holds:
      - label: "미시적 설명력"
        detail: "개인의 편향과 미시적 의사결정을 설명하는 데 주류 모델보다 강력하다."
    fails:
      - label: "예측력과 체계의 한계"
        detail: "편향이 언제 발현될지 예측력이 약하고, 경제 전체를 다루는 통합 거시 이론 체계가 아직 미완이다."
    verdict: "주류를 대체하기보다 미시적 기초·기대 이론과 결합해 보완하는 단계의 명제다."

  - id: p45
    statement: "자산 버블은 부풀 때 식별하고 막을 수 있다"
    category: 금융
    termIds: [asset-bubble, irrational-exuberance, efficient-market-hypothesis, macroprudential-policy]
    premise: "버블을 실시간으로 알아채 정책으로 미리 터뜨리거나 막을 수 있다는 기대에 근거한다."
    holds:
      - label: "극단적 과열 신호"
        detail: "밸류에이션과 레버리지가 급증하는 극단적 과열은 거시건전성 정책으로 일부 억제할 수 있다."
    fails:
      - label: "사후성과 타이밍"
        detail: "버블과 정상적 상승의 구분이 사후에야 분명해지고 개입 타이밍을 맞추기가 매우 어렵다."
    verdict: "사전 식별과 개입은 부분적으로만 가능하며 타이밍이 핵심 난제인 명제다."
