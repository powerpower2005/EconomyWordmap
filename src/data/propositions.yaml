propositions:
  - id: p1
    statement: "금리가 오르면 물가가 내려간다"
    category: 통화정책
    termIds: [interest-rate, inflation, policy-rate, aggregate-demand, expected-inflation]
    premise: "금리가 오르면 차입 비용이 커져 소비·투자가 위축되고 총수요가 둔화되어 물가 상승 압력이 완화된다는 통화정책 전달경로에 근거한다."
    holds:
      - label: "수요 견인 인플레이션 국면"
        detail: "경기 과열과 수요 초과로 물가가 오르는 국면에서는 금리 인상이 총수요를 식혀 물가를 낮추는 효과가 비교적 뚜렷하다."
        example: "2022~2023년 미국 연준의 공격적 금리 인상 이후 인플레이션이 점진적으로 둔화."
      - label: "기대인플레이션이 안정된 경우"
        detail: "중앙은행 신뢰가 높아 기대가 안정(anchored)되어 있으면 금리 인상 신호만으로도 물가 기대가 빠르게 조정된다."
    fails:
      - label: "공급 충격발 인플레이션"
        detail: "에너지·원자재·공급망 차질로 인한 물가 상승은 수요 억제로 잡기 어렵고, 금리를 올려도 물가가 잘 내려가지 않으며 경기만 위축될 수 있다."
        example: "1970년대 오일쇼크 스태그플레이션."
      - label: "정책 시차"
        detail: "금리 인상이 물가에 미치는 효과는 보통 수개월에서 1년 이상 시차를 두고 나타나 단기에는 물가가 계속 오를 수 있다."
      - label: "재정 확장 동반"
        detail: "대규모 재정 지출이 함께 이뤄지면 통화 긴축 효과가 일부 상쇄되어 물가가 잘 잡히지 않는다."
    verdict: "장기·수요 견인 국면에서는 대체로 성립하지만, 공급 충격이나 정책 시차, 재정 변수 앞에서는 약하거나 지연된다. 무조건 참이 아닌 조건부 명제다."

  - id: p2
    statement: "자유무역은 모두에게 이득이다"
    category: 국제경제
    termIds: [free-trade, comparative-advantage, consumer-welfare, trade-war, strategic-trade-theory, inequality]
    premise: "비교우위에 따라 각국이 잘하는 분야에 특화하면 전체 생산과 후생이 커지고 소비자 가격이 낮아진다는 포지티브섬 논리에 근거한다."
    holds:
      - label: "국가 전체의 후생"
        detail: "교역으로 전체 생산이 늘고 소비자는 더 싸고 다양한 상품을 얻어 평균적으로 후생이 증가한다."
        example: "세계화 이후 신흥국 성장과 글로벌 빈곤율 하락."
      - label: "경쟁 촉진과 생산성"
        detail: "수입 경쟁이 국내 기업의 효율을 끌어올리고 분업·전문화를 심화한다."
    fails:
      - label: "분배 문제(패자 발생)"
        detail: "전체는 이득이어도 경쟁에서 밀린 특정 산업·노동자는 일자리와 소득을 잃어 불평등이 커질 수 있다."
        example: "선진국 제조업 공동화와 러스트벨트 쇠퇴."
      - label: "불완전 경쟁·전략 산업"
        detail: "소수 기업이 지배하는 산업에서는 전략적 무역이론처럼 보조금·보호가 자국에 이득이 될 수 있어 무조건적 자유무역이 최선이 아니다."
      - label: "경제 안보"
        detail: "핵심 물자를 특정국에 의존하면 공급망 무기화 위험이 커져 효율만으로 판단하기 어렵다."
    verdict: "국가 전체 합으로는 이득이 크지만 분배·전략·안보 측면에서 패자와 위험이 생긴다. 재분배와 선택적 보호로 보완해야 하는 조건부 명제다."

  - id: p3
    statement: "정부는 시장에 개입하지 않는 것이 좋다"
    category: 경제이론
    termIds: [laissez-faire, invisible-hand, market-failure, externality, public-goods, keynesian-economics, industrial-policy]
    premise: "개인의 이기심이 가격 메커니즘을 통해 자원을 효율적으로 배분한다는 보이지 않는 손의 논리에 근거한다."
    holds:
      - label: "경쟁적이고 외부효과가 적은 시장"
        detail: "정보가 충분하고 경쟁적인 시장에서는 가격이 수요와 공급을 효율적으로 조정해 개입이 오히려 비효율을 낳는다."
      - label: "지식·정보의 분산"
        detail: "가격은 분산된 정보를 집약하므로 중앙 계획보다 시장이 자원 배분에 유리하다."
    fails:
      - label: "시장 실패"
        detail: "외부효과·공공재·독점·정보 비대칭이 있으면 시장만으로는 효율적 배분에 실패해 정부 개입이 정당화된다."
        example: "환경오염(외부효과)과 국방(공공재)."
      - label: "단기 총수요 부족"
        detail: "가격·임금이 경직적인 단기에는 시장이 스스로 완전고용을 회복하지 못해 케인즈식 수요 관리가 필요할 수 있다."
        example: "1930년대 대공황."
    verdict: "경쟁시장에서는 대체로 옳지만 시장 실패와 단기 침체 영역에서는 개입이 필요하다. 개입 여부는 영역에 따라 갈린다."

  - id: p4
    statement: "통화량이 늘어나면 물가가 오른다"
    category: 통화
    termIds: [money-supply, inflation, velocity-of-money, quantitative-easing, expected-inflation]
    premise: "교환방정식 MV=PY에서 유통속도와 생산이 일정하면 통화량 증가가 물가 상승으로 이어진다는 화폐수량설에 근거한다."
    holds:
      - label: "장기와 고인플레이션 국면"
        detail: "장기적으로, 특히 통화를 과도하게 찍어내는 초인플레이션 국면에서는 통화량과 물가가 강하게 함께 움직인다."
        example: "바이마르 독일·짐바브웨의 초인플레이션."
    fails:
      - label: "유동성 함정과 속도 하락"
        detail: "경기 불안으로 화폐유통속도가 떨어지면 통화가 늘어도 지출과 물가로 이어지지 않는다."
        example: "2010년대 대규모 양적완화에도 낮게 유지된 물가."
      - label: "단기와 기대"
        detail: "단기에는 통화량보다 기대인플레이션과 신용·수요 상황이 물가를 더 좌우한다."
    verdict: "장기에는 성립하는 경향이 있으나 단기와 유통속도·금융중개 상황에 따라 약해진다. 시점에 크게 의존하는 명제다."

  - id: p5
    statement: "관세를 매기면 자국 산업이 보호되고 무역수지가 개선된다"
    category: 국제경제
    termIds: [tariff, protectionism, consumer-welfare, trade-war, trade-deficit]
    premise: "수입품에 세금을 매기면 수입 가격이 올라 수입이 줄고 국내 생산이 보호된다는 보호무역 논리에 근거한다."
    holds:
      - label: "단기 산업 보호"
        detail: "초기 유치산업이나 위기에 빠진 사양 산업을 단기적으로 보호해 시간을 벌어줄 수 있다."
    fails:
      - label: "소비자 후생 감소"
        detail: "관세는 국내 가격을 올려 소비자와 관세 대상 원자재를 쓰는 기업의 비용을 높인다."
      - label: "보복과 무역전쟁"
        detail: "상대국이 보복 관세로 맞대응하면 수출도 줄어 양측 모두 손해를 본다."
      - label: "무역수지 효과의 불확실성"
        detail: "환율 절상과 공급망 비용 상승이 동반되면 무역수지 개선 효과가 상쇄되어 결과가 불확실하다."
    verdict: "단기 보호는 가능하지만 소비자 비용과 보복 위험, 환율 반응 때문에 순효과는 불확실하다. 선택적·한시적으로만 정당화된다."

  - id: p6
    statement: "재정적자가 늘면 국채 금리가 오른다"
    category: 정부
    termIds: [fiscal-policy, government-bond, long-term-interest-rate, tax-cut, bond-market]
    premise: "재정적자가 커지면 국채 발행이 늘고 재정 건전성 우려가 커져 채권이 매도되고 금리가 오른다는 논리에 근거한다."
    holds:
      - label: "재정 신뢰가 흔들릴 때"
        detail: "시장이 재정 지속가능성을 의심하면 국채가 급히 매도되어 금리가 치솟는다."
        example: "2022년 영국 트러스 정부의 감세안 발표 후 국채 급락(트러스 쇼크)."
    fails:
      - label: "안전자산 선호"
        detail: "위기 국면에서 국채로 안전자산 수요가 몰리면 적자 확대에도 금리가 오히려 내려갈 수 있다."
      - label: "중앙은행 매입과 자국통화 부채"
        detail: "중앙은행이 국채를 매입하거나 자국통화 표시 국채 수요가 강하면 적자에도 금리가 낮게 유지될 수 있다."
        example: "장기 저금리를 유지해 온 일본과 평시의 미국."
    verdict: "시장의 재정 신뢰와 통화정책·안전자산 수요 상황에 따라 결과가 갈리는 조건부 명제다."
