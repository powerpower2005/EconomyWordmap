    premise: 발생주의 회계에서 순이익·EPS 성장이 곧 현금 창출력 개선으로 이어진다는 직관에 근거한다. 그러나 매출채권·재고·CAPEX·이자·배당 등으로 영업 CF와 괴릴 수 있다(6.1 흑자도산).
    holds:
