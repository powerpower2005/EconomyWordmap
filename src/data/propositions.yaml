      - label: 금융억압·통화량목표 시대
        detail: 1980년대까지 일부 국가에서 M2 중간목표가 작동했던 구간이 있다.
    fails:
      - label: 내생·대출수요 주도
        detail: 외환위기 이후 한국 등에서 「은행대출↑→M2↑」 인과가 두드러져 본원통화만으로 통제 어렵다.
      - label: QE·지준금 적체
        detail: 본원통화 급증해도 대출·속도·규제 때문에 M2는 완만할 수 있다.
      - label: 금융혁신·그림자금융
        detail: M2 밖 유동성·포트폴리오 이동으로 정의·통제 범위가 흔들린다.
    verdict: 외생·내생·금융환경 조건에서만 판단 가능한 조건부 명제다.
