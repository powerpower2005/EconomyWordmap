      - label: 일회성·회계조정
        detail: 자산매각 이익·감가·충당금 조정은 EPS만 키우고 지속 CF를 보장하지 않는다.
      - label: 레버리지·배당
        detail: 부채 상환·고배당이 CF를 잡아먹으면 이익↑에도 현금 버퍼는 줄 수 있다.
    verdict: 현금흐름표·FCF와 함께 볼 때만 성립하는 조건부 명제다.
