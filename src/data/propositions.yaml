    premise: 임금·소득이 생산성 향상 없이 오르면 단위 노동 비용이 올라 가격·수출 경쟁력이 약해진다는 장기 성장 논리에 근거한다.
    holds:
      - label: 임금이 생산성을 지속적으로 웃돌 때
        detail: 단위 노동 비용 상승이 가격에 전가되면 인플레이션과 경쟁력 약화가 누적된다.
        example: 1970년대 임금–물가 스파이럴과 제조업 경쟁력 약화.
    fails:
      - label: 생산성 동반 상승
        detail: 기술 진보와 함께 임금·소득이 오르면 경쟁력을 유지하거나 강화할 수 있다.
      - label: 단기 수요 부양
        detail: 불황기 일시적 소득 지원은 생산성과 단기적으로 어긋나도 장기 경쟁력을 바로 훼손하지 않을 수 있다.
    verdict: 장기·구조 관점에서는 성립하지만, 단기 경기 정책과는 구분해야 하는 조건부 명제다.
  - id: p157
    statement: 지급준비율만 올려도 유동성과 물가를 잡을 수 있다
