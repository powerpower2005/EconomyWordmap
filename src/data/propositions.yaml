        example: 공산품 최종수요 1단위의 생산유발효과(그림 2-2)처럼 2~3배대 파급.
      - label: 공급망·수출 연쇄
        detail: 수출·제조 충격은 1차 부문을 넘어 부품·에너지·운송 등 다단계로 전파된다.
      - label: 가격·재고 조정
        detail: 단기에는 재고 흡수·수입 대체로 생산 반응이 1:1에서 벗어날 수 있다.
