    premise: 정부 지출·투자가 경제를 키운다는 점에서 케인즈 승수효과와 산업연관표의 생산유발계수를 같은 '파급 배수'로 본다는 혼동에 근거한다.
    holds:
      - label: 거시 부양 서사
        detail: 재정·투자·수요 확대가 GDP를 키운다는 방향성은 둘 다 '수요→더 큰 산출' 스토리를 공유한다.
    fails:
      - label: 메커니즘·분모
        detail: 승수는 소득→소비→총수요의 **소비 연쇄**(边際소비성향) 중심이고, 생산유발은 **중간재 생산 연쇄**(투입계수·Leontief) 중심이다.
      - label: 재정 vs 부문
        detail: 승수는 거시 총량·재정 impetus에, 생산유발은 **부문·산업별** 총생산·고용 파급에 쓰인다.
      - label: 가격·금리·통화
        detail: 승수 분석은 금리·crowding-out·인플레 반응을, IO 분석은 기술·투입구조·요소가격 전가를 별도로 봐야 한다.
    verdict: 방향은 비슷해도 연쇄 메커니즘이 달라 동일 개념이 아닌 조건부 명제다.
  - id: p201
