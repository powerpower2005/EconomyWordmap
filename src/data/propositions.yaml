      - label: 재고·수입 등 일회성·측정 요인
        detail: GDP는 재고 조정·수입 변동 등으로 분기별 변동이 크고 측정 오차도 있어, 아주 미세한 두 분기 역성장만으로 곧바로 공식 침체라고 단정하기 어렵다.
        example: "2022년 미국 1·2분기: 재고 등으로 미세 역성장 후 3·4분기 회복, NBER 침체 미선언."
      - label: 사후 판정 지연
        detail: NBER는 종합 지표로 수개월~수년 뒤에 판정하므로, '두 분기 규칙'과 공식 침체 선언 시점이 어긋날 수 있다.
      - label: 두 분기 역성장 없이도 침체
        detail: NBER는 깊이·확산·지속(depth, diffusion, duration)을 함께 보므로 GDP가 한 분기만 역성장하거나 침체 기간이 짧아도 공식 침체로 판정될 수 있다.
        example: 2020년 COVID-19 침체(약 2개월); 1980·1991·2001년은 GDP가 한 분기만 역성장.
    verdict: rough rule of thumb로는 쓰이지만, 미세 역성장·재고 변동·짧은 침체 앞에서는 성립하지 않는 조건부 명제다.
  - id: p153
    statement: 금리 급등·침체 공포 국면에서도 경기침체 없이 주식시장이 반등할 수 있다
    category: 금융
    termIds:
      - interest-rate
      - policy-rate
      - recession
      - stock-market
      - business-cycle
      - inflation
    relationIds:
      - r810
      - r811
    premise: 금리 인상과 침체 우려는 단기적으로 주가를 누르지만, 실제 경기가 침체로 이어지지 않고 인플레이션이 둔화·정책 기대가 바뀌면 주가는 경기 확인 전에 선행 반등할 수 있다는 자산시장·선행지표 논리에 근거한다.
    holds:
      - label: 연착륙·성장 지속
        detail: 긴축 뒤에도 고용·소비가 버티고 침체가 오지 않으면, 침체 공포가 정점을 지난 뒤 주가가 반등하는 패턴이 나타날 수 있다.
        example: "1966–67년·2022–23년: 침체 우려와 GDP 미세 역성장 뒤 경기 회복·주가 반등."
      - label: 주가의 선행성
        detail: 주가는 경기를 선행하므로 침체가 '확인'되기 전에 이미 저점을 치고 오를 수 있다.
    fails:
      - label: 경착륙 실패·신용 경색
        detail: 긴축이 과도하거나 금융 스트레스가 커지면 실제 침체와 함께 주가가 더 오래·깊게 눌릴 수 있다.
        example: "2008년: 금리·신용 경색과 함께 장기 침체·주가 하락."
      - label: 인플레 재가속
        detail: 물가가 다시 가속하면 추가 긴축 기대로 반등이 끊길 수 있다.
    verdict: 긴축 강도·금융 안정·물가 경로에 따라 갈리는, '침체 공포 ≠ 주가 바닥'을 설명하는 조건부 명제다.
  - id: p154
    statement: 디레버리징에서 소득 증가율이 부채 이자율보다 높아야 부채 부담이 줄어든다
    category: 금융
    termIds:
      - deleveraging
      - debt-burden
      - economic-growth
      - interest-rate
      - quantitative-easing
      - fiscal-policy
    relationIds:
      - r825
      - r826
      - r829
    premise: 부채 부담은 부채 잔액·이자 부담을 소득과 비교해 결정되므로, 명목 소득이 이자율만큼(또는 그 이상) 빠르게 늘어야 상대 부담이 줄어든다는 디레버리징 논리에 근거한다.
    holds:
      - label: 재정·통화 협력 + 완만한 인플레
        detail: 중앙은행이 통화를 보충하고 정부가 소득을 지원해 성장률이 이자율을 넘으면 부채/GDP·부채/소득 비율이 서서히 내려갈 수 있다.
        example: 2008년 이후 QE와 재정 부양이 결합된 미국·유럽의 점진적 부담 완화.
    fails:
      - label: 긴축·디플레이션만
        detail: 지출 삭감과 부채 탕감만으로는 소득이 더 빨리 줄어 부담이 악화될 수 있다.
      - label: 과도한 화폐화
        detail: 통화량 증가가 지나치면 인플레이션이 수용 한도를 넘어 불안정을 키운다.
        example: 1920년대 독일 디레버리징의 초인플레.
    verdict: 디레버리징 성공 여부는 소득·이자율·정책 조합에 달린 조건부 명제다.
  - id: p155
    statement: 부채가 소득보다 빠르게 늘면 결국 상환 부담에 압도된다
    category: 거시경제
    termIds:
      - debt-burden
      - credit-cycle
      - long-term-debt-cycle
      - household-debt
      - economic-growth
    relationIds:
      - r819
      - r829
    premise: 차입은 지출을 앞당기지만 상환기에는 소비를 줄여야 하므로, 부채 증가율이 소득 증가율을 지속적으로 넘기면 차입·지출이 위축되고 사이클이 반전된다는 부채 사이클 논리에 근거한다.
    holds:
      - label: 낙관·자산 버블 국면
        detail: 소득과 자산 가격이 함께 오르면 당분간 버티지만, 상환 부담이 소득을 앞서면 디레버리징으로 전환된다.
        example: 2007년 이전 미국 가계·주택 부채 누적 후 2008년 반전.
    fails:
      - label: 생산적 차입·자국통화
        detail: 부채가 설비·인프라 등 생산성을 높이는 데 쓰이고 소득이 따라오면 부담이 관리 가능하다.
      - label: 금융 억압·인플레이션
        detail: 실질금리를 낮추거나 인플레이션으로 명목 부채 가치를 깎으면 부담이 상대적으로 줄 수 있다.
    verdict: 부채의 용도·금리·통화 환경에 따라 시차는 다르지만, 장기적으로는 성립하는 조건부 명제다.
  - id: p156
    statement: 소득이 생산성보다 빠르게 늘면 경쟁력을 잃는다
