    premise: GDP는 분기·연간 **플로**(생산·지출) 지표이고 국민대차대조표·국부는 **스톡**(자산·부채·순자산)이다. 투자가 자본스톡을 쌓지만 자산가격·토지·환율·분배·부채 변동은 GDP 성장과 다른 속도로 움직일 수 있다는 스톡–플로·부의 분배 논리에 근거한다.
