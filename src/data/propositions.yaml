      - r841
    premise: 지급준비율을 높이면 은행의 대출·신용창출 여력이 줄어 통화승수와 시중 유동성이 위축되어 물가 압력이 완화된다는 전통적 지급준비율 정책 논리에 근거한다.
    holds:
      - label: 지준율이 실질 제약인 체제
        detail: 지급준비율이 대출의 속도 제한장치로 작동하고 그림자금융이 작을 때는 지준율 인상이 신용 창출을 직접 줄인다.
    fails:
      - label: 그림자금융·대출수요 과잉
        detail: 규제 밖 신용과 강한 대출·투기 수요가 있으면 지준율만으로는 유동성을 충분히 틀어막지 못한다.
        example: 2010년 중국, 지급준비율 19%까지 올렸으나 물가·부동산 압력 지속 후 금리 인상으로 선회.
      - label: 지준율 0% · 풍부한 준비금
        detail: 미국처럼 지준율이 0%이면 자본·유동성 규제와 IORB가 신용을 더 직접 좌우한다.
    verdict: 지준율이 실질 제약이고 대체 신용 채널이 약할 때만 성립하는 조건부 명제다.
  - id: p158
    statement: 본원통화가 늘면 M2가 같은 승수만큼 기계적으로 늘어난다
    category: 통화
    termIds:
      - base-money
      - money-multiplier
      - m2
      - money-supply
      - credit-creation
      - quantitative-easing
      - credit-crunch
      - quantitative-tightening
    relationIds:
      - r8
      - r10
      - r837
      - r986
    premise: 교과서식 통화승수(M≈C/r)에 따르면 중앙은행이 본원통화(C)를 늘리면 예금·대출 연쇄를 통해 M2가 고정 배수만큼 확대된다는 논리에 근거한다.
    holds:
      - label: 지준율 제약 + 강한 대출수요
        detail: 지급준비율이 실질 제약이고 은행·차입자가 적극적으로 대출·예금을 늘리면 본원통화 증가가 M2 확대로 이어진다.
    fails:
      - label: QE·지급준비금 적체
        detail: 본원통화가 지급준비금으로 쌓이고 대출수요가 약하면 승수가 낮아져 M2는 기계적으로 따라가지 않는다.
        example: 2008년 이후 QE로 본원통화·지급준비금 급증 대비 M2 증가율은 더 완만.
      - label: 규제·유통속도
        detail: 자본·유동성 규제, 화폐유통속도 하락, 신용 경색이 있으면 같은 본원통화도 다른 M2 경로를 탄다.
      - label: 통화승수 붕괴·긴축
        detail: 본원통화가 줄거나 은행이 대출을 축소하면 예금·대출 연쇄가 끊겨 통화승수가 낮아지고 M2는 기계적으로 따라가지 않는다.
        example: 양적긴축·신용 경색 국면에서 본원통화 대비 M2 증가율 둔화.
    verdict: 교과서 승수 모형은 직관용이며, QE·규제·수요 국면에 따라 깨지는 조건부 명제다.
  - id: p159
    statement: 시장에 초과공급이 있으면 가격 하락으로 수요가 늘어 균형으로 돌아간다
    category: 경제이론
    termIds:
      - says-law
      - neoclassical-economics
      - unemployment
      - full-employment
    relationIds:
      - r260
      - r262
      - r849
    premise: 공급이 스스로 수요를 창출하고 초과공급은 가격 하락을 통해 수요를 끌어올려 시장이 새 균형을 찾는다는 세이의 법칙과 신고전파의 시장 자율 조정 논리에 근거한다.
    holds:
      - label: 유연한 가격·임금
        detail: 가격과 임금이 빠르게 조정되는 경쟁시장에서는 초과공급이 일시적이며 가격 하락이 수요를 회복시킨다.
      - label: 장기·완전고용 관점
        detail: 장기적으로 경제는 완전고용 균형으로 수렴한다는 고전파·신고전파 전제에서는 초과공급이 자동 청산된다.
    fails:
      - label: 가격·임금 경직
        detail: 단기에 임금과 가격이 경직적이면 노동시장의 초과공급이 가격 하락으로 흡수되지 않아 실업이 지속된다.
        example: "1930년대 대공황: 실업률 37%에도 새 균형을 찾지 못함."
      - label: 총수요 부족
        detail: 유효수요가 부족하면 가격이 내려도 지출이 늘지 않아 디플레이션과 실업이 함께 깊어질 수 있다.
    verdict: 가격이 유연하고 총수요가 충분할 때는 성립하지만, 경직과 수요 부족이 겹치면 자동 균형 회복을 기대하기 어렵다.
  - id: p160
    statement: 개인이 자기 이익만 추구하면 사회 전체가 번영한다
