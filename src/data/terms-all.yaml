terms:
  - id: inflation
    name: 인플레이션 (Inflation)
    description: 일반적인 물가 수준이 지속적으로 상승하여 화폐의 실질 구매력이 하락하는 현상
    category: 거시경제

  - id: deflation
    name: 디플레이션 (Deflation)
    description: 일반적인 물가 수준이 지속적으로 하락하여 화폐의 실질 구매력이 상승하는 현상
    category: 거시경제

  - id: interest-rate
    name: 금리 (Interest Rate)
    description: 자금을 빌리거나 빌려줄 때 적용되는 이자의 비율로 소비·투자·환율·자산가격에 영향을 미침
    category: 금융

  - id: policy-rate
    name: 기준금리 (Policy Rate)
    description: 중앙은행이 통화정책을 위해 설정하는 대표 금리로 시중금리의 기준 역할
    category: 통화정책

  - id: real-interest-rate
    name: 실질금리 (Real Interest Rate)
    description: 명목금리에서 기대인플레이션을 차감한 금리로 실제 차입 비용을 반영
    category: 거시경제

  - id: expected-inflation
    name: 기대인플레이션 (Expected Inflation)
    description: 경제주체가 예상하는 미래 물가상승률로 임금·금리·소비 결정에 영향
    category: 거시경제

  - id: gdp
    name: GDP (Gross Domestic Product)
    description: 한 국가에서 일정 기간 동안 생산된 최종 재화와 서비스의 시장 가치 총합
    category: 거시경제

  - id: nominal-gdp
    name: 명목 GDP (Nominal GDP)
    description: 현재 가격 기준으로 측정한 GDP로 인플레이션 효과를 포함
    category: 거시경제

  - id: real-gdp
    name: 실질 GDP (Real GDP)
    description: 기준연도 가격으로 측정한 GDP로 물가 변동을 제거한 실제 생산량
    category: 거시경제

  - id: unemployment
    name: 실업률 (Unemployment Rate)
    description: 경제활동인구 중 일할 의사가 있으나 일자리를 갖지 못한 인구의 비율
    category: 거시경제

  - id: cpi
    name: CPI 소비자 물가 지수 (Consumer Price Index)
    description: 가계가 소비하는 상품과 서비스의 가격 변동을 측정하는 대표 물가지표
    category: 거시경제

  - id: exchange-rate
    name: 환율 (Exchange Rate)
    description: 한 국가 통화를 다른 국가 통화로 교환할 때 적용되는 비율
    category: 국제경제

  - id: money-supply
    name: 통화량 (Money Supply)
    description: 경제 내에서 유통되는 화폐의 총량으로 소비·투자·물가에 영향
    category: 금융

  - id: base-money
    name: 본원통화(M0) (Base Money)
    description: 중앙은행이 직접 공급하는 현금과 은행의 지급준비금
    category: 통화

  - id: m2
    name: 광의통화(M2) (M2 Money Supply)
    description: 본원통화와 예금통화를 포함한 광범위한 유동성 지표
    category: 통화

  - id: reserves
    name: 지급준비금 (Reserves)
    description: 은행이 중앙은행 계좌에 보유하는 예치금으로 결제·유동성·규제 목적
    category: 통화

  - id: required-reserve-ratio
    name: 지급준비율 (Required Reserve Ratio)
    description: 은행이 예금 대비 의무적으로 보유해야 하는 지급준비금의 비율
    category: 통화정책

  - id: excess-reserves
    name: 초과지준금 (Excess Reserves)
    description: 의무 지급준비금 초과분의 지급준비금으로 미국에서는 2020년 이후 지급준비율 0%로 의미 약화
    category: 통화

  - id: money-multiplier
    name: 통화승수 (Money Multiplier)
    description: 본원통화가 시중 통화량으로 확대되는 정도로 현실에서는 지급준비·대출수요·규제에 따라 변동
    category: 통화

  - id: velocity-of-money
    name: 화폐유통속도 (Velocity of Money)
    description: 일정 기간 동안 통화가 재화·서비스 거래에 사용되는 빈도
    category: 거시경제

  - id: quantitative-easing
    name: 양적완화(QE) (Quantitative Easing)
    description: 중앙은행이 국채·MBS 등을 매입하여 장기금리 인하와 유동성 확대를 유도하는 정책
    category: 통화정책

  - id: quantitative-tightening
    name: 양적긴축(QT) (Quantitative Tightening)
    description: 중앙은행이 보유 자산을 축소하여 유동성과 지급준비금을 회수하는 정책
    category: 통화정책

  - id: iorb
    name: IORB (Interest on Reserve Balances)
    description: 중앙은행이 은행의 지급준비금에 지급하는 이자로 단기금리 하단 역할
    category: 금리정책

  - id: lclor
    name: 최소 적정 지급준비금(LCLoR)
    description: 금융시스템이 불안정해지지 않기 위한 최소 지급준비금 수준
    category: 금융안정

  - id: bank
    name: 은행 (Bank)
    description: 예금 수취와 대출을 통해 자금을 중개하고 신용을 창출하는 금융기관
    category: 금융

  - id: credit-creation
    name: 신용창조 (Credit Creation)
    description: 은행이 대출을 통해 예금을 동시에 창출하는 과정
    category: 통화금융

  - id: capital-adequacy-ratio
    name: 자기자본비율 (Capital Adequacy Ratio)
    description: 은행의 자기자본을 위험가중자산으로 나눈 비율로 건전성 규제 핵심 지표
    category: 금융규제

  - id: leverage-ratio
    name: 레버리지비율 (Leverage Ratio)
    description: 은행의 자기자본을 총자산으로 나눈 비율로 과도한 차입을 제한하는 비위험가중 규제
    category: 금융규제

  - id: prudential-regulation
    name: 건전성 규제 (Prudential Regulation)
    description: 금융기관의 자본·유동성·부채를 규제하여 금융시스템 안정성을 확보하는 제도
    category: 금융규제

  - id: fiscal-policy
    name: 재정정책 (Fiscal Policy)
    description: 정부가 지출과 조세를 통해 경기와 경제 구조에 개입하는 정책
    category: 정부
